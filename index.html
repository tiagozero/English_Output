`;

  function resolveTodayTasks(){
    const rm = readRoadmap();
    const today = todayKey();
    const items = [];

    rm.phases.forEach((phase, pi) => {
      if(!phase.startDate) return;
      for(let n = 1; n <= phase.days; n++){
        if(addDays(phase.startDate, n - 1) !== today) continue;
        (phase.dayTasks[String(n)] || []).forEach(t => {
          items.push({ phase, phaseIdx: pi, dayNum: n, task: t });
        });
      }
    });

    if(items.length){
      const done = items.filter(x => x.task.done).length;
      return {
        mode: 'today',
        label: "Today's tasks",
        sublabel: done + ' of ' + items.length + ' done',
        items: items
      };
    }

    const activeIdx = rm.phases.findIndex(p => phaseDoneCount(p) < p.days);
    if(activeIdx >= 0){
      const phase = rm.phases[activeIdx];

      for(let n = 1; n <= phase.days; n++){
        const tasks = phase.dayTasks[String(n)] || [];
        if(tasks.length && !tasks.every(t => t.done)){
          const d2 = tasks.filter(t => t.done).length;
          return {
            mode: 'next',
            label: 'Next up · Day ' + n,
            sublabel: phase.title + ' · ' + d2 + ' of ' + tasks.length + ' done',
            items: tasks.map(t => ({ phase, phaseIdx: activeIdx, dayNum: n, task: t }))
          };
        }
      }

      return {
        mode: 'empty',
        label: "Today's tasks",
        sublabel: phase.title,
        items: [],
        emptyText: 'No tasks scheduled for today. Open the roadmap to plan a day.'
      };
    }

    return {
      mode: 'empty',
      label: 'Roadmap',
      sublabel: '',
      items: [],
      emptyText: 'Every phase is complete. 🎉'
    };
  }

  function renderFabPanel(doc){
    const info = resolveTodayTasks();
    const titleEl = doc.getElementById('hub-fab-title');
    const subEl   = doc.getElementById('hub-fab-sub');
    const listEl  = doc.getElementById('hub-fab-list');
    if(!titleEl || !subEl || !listEl) return;

    titleEl.textContent = info.label;
    subEl.textContent   = info.sublabel || '';

    if(!info.items.length){
      listEl.innerHTML = `<div class="hub-fab-empty">
        <div class="big">🎉</div>
        <div>${esc(info.emptyText || 'No tasks scheduled for today.')}</div>
      </div>`;
      return;
    }

    listEl.innerHTML = info.items.map(x => {
      const mod = RES_MODULES[x.task.module] || { icon:'•', cls:'', name: x.task.module };
      const metaBits = [mod.name, x.task.sub, x.task.meta].filter(Boolean).join(' · ');
      return `<div class="hub-task${x.task.done ? ' done' : ''}">
        <button type="button" class="hub-task-check"
                data-fab-task="${esc(x.task.id)}"
                data-phase="${esc(x.phase.id)}"
                data-day="${x.dayNum}"
                title="${x.task.done ? 'Mark as not done' : 'Mark as done'}">✓</button>
        <span class="hub-task-ico ${esc(mod.cls)}">${mod.icon}</span>
        <span class="hub-task-main">
          <span class="hub-task-label">${esc(x.task.label)}</span>
          ${metaBits ? `<span class="hub-task-meta">${esc(metaBits)}</span>` : ''}
        </span>
      </div>`;
    }).join('');
  }

  function updateFabBadge(doc){
    const badge = doc.getElementById('hub-fab-badge');
    const fab   = doc.getElementById('hub-fab');
    if(!badge || !fab) return;

    const info = resolveTodayTasks();
    const pending = info.items.filter(x => !x.task.done).length;

    if(pending > 0){
      badge.hidden = false;
      badge.textContent = pending > 99 ? '99+' : String(pending);
    }else{
      badge.hidden = true;
    }
    fab.classList.toggle('is-clear', pending === 0 && info.items.length > 0);
  }

  function fabToggleTask(phaseId, dayNum2, taskId){
    const rm = readRoadmap();
    const phase = rm.phases.find(p => p.id === phaseId);
    if(!phase) return;

    const tasks = getDayTasks(phase, dayNum2);
    const t = tasks.find(x => x.id === taskId);
    if(!t) return;

    t.done = !t.done;
    t.doneAt = t.done ? todayKey() : null;
    saveRoadmap(rm);

    refreshAllFabs();
    if(currentRoute === 'roadmap') paintRoadmap(rm);
  }

  function ensureFab(frame){
    let doc;
    try{ doc = frame.contentDocument; }catch(e){ return; }
    if(!doc || !doc.body) return;

    let root = doc.getElementById('hub-fab-root');

    if(!root){
      if(!doc.getElementById('hub-fab-style')){
        const st = doc.createElement('style');
        st.id = 'hub-fab-style';
        st.textContent = FAB_CSS;
        (doc.head || doc.documentElement).appendChild(st);
      }

      root = doc.createElement('div');
      root.id = 'hub-fab-root';
      root.className = 'hub-fab-root';
      root.innerHTML = `
        <div class="hub-fab-panel" id="hub-fab-panel" hidden>
          <div class="hub-fab-head">
            <div>
              <div class="hub-fab-title" id="hub-fab-title">Today's tasks</div>
              <div class="hub-fab-sub" id="hub-fab-sub"></div>
            </div>
            <button class="hub-fab-x" id="hub-fab-x" type="button" aria-label="Close">✕</button>
          </div>
          <div class="hub-fab-list" id="hub-fab-list"></div>
          <div class="hub-fab-foot">
            <button class="hub-fab-openrm" id="hub-fab-openrm" type="button">Open roadmap →</button>
          </div>
        </div>
        <button class="hub-fab" id="hub-fab" type="button" aria-label="Today's tasks">
          <span>✅</span>
          <span class="hub-fab-badge" id="hub-fab-badge" hidden>0</span>
        </button>`;
      doc.body.appendChild(root);

      const fabBtn = doc.getElementById('hub-fab');
      const panel  = doc.getElementById('hub-fab-panel');

      fabBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if(panel.hidden){
          renderFabPanel(doc);
          panel.hidden = false;
        }else{
          panel.hidden = true;
        }
      });

      doc.getElementById('hub-fab-x').addEventListener('click', (e) => {
        e.stopPropagation();
        panel.hidden = true;
      });

      doc.getElementById('hub-fab-openrm').addEventListener('click', (e) => {
        e.stopPropagation();
        panel.hidden = true;
        go('roadmap');
      });

      doc.addEventListener('click', (e) => {
        if(!panel || panel.hidden) return;
        if(e.target.closest && e.target.closest('#hub-fab-root')) return;
        panel.hidden = true;
      });

      doc.getElementById('hub-fab-list').addEventListener('click', (e) => {
        const btn = e.target.closest('[data-fab-task]');
        if(!btn) return;
        e.stopPropagation();
        fabToggleTask(btn.dataset.phase, Number(btn.dataset.day), btn.dataset.fabTask);
        renderFabPanel(doc);
        updateFabBadge(doc);
      });
    }

    root.classList.toggle('dark',
      document.documentElement.getAttribute('data-theme') === 'dark');

    updateFabBadge(doc);

    const panelEl = doc.getElementById('hub-fab-panel');
    if(panelEl && !panelEl.hidden) renderFabPanel(doc);
  }

  function refreshAllFabs(){
    const frame = $('#frame');
    if(!frame) return;
    if($('#moduleView').hidden) return;
    ensureFab(frame);
  }

  function refreshFabTheme(){
    const frame = $('#frame');
    let doc;
    try{ doc = frame.contentDocument; }catch(e){ return; }
    if(!doc) return;
    const root = doc.getElementById('hub-fab-root');
    if(root){
      root.classList.toggle('dark',
        document.documentElement.getAttribute('data-theme') === 'dark');
    }
  }

  /* ============================================================
     THEME
     ============================================================ */
  function applyTheme(t){
    document.documentElement.setAttribute('data-theme', t);
    const btn = $('#themeBtn');
    if(btn){
      btn.textContent = t === 'dark' ? '☀️' : '🌙';
      btn.title = t === 'dark' ? 'Switch to light mode' : 'Switch to dark mode';
    }
    try{ localStorage.setItem(THEME_KEY, t); }catch(e){}
    refreshFabTheme();
  }
  function initialTheme(){
    try{
      const saved = localStorage.getItem(THEME_KEY);
      if(saved === 'dark' || saved === 'light') return saved;
    }catch(e){}
    return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }

  /* ============================================================
     ROUTER + IFRAME
     ============================================================ */
  const ROUTES = ['overview','roadmap','grammar','vocabulary','writepath','pace'];

  let currentRoute = 'overview';
  let iframeLoadedFor = null;
  let pendingTarget = null;
  let pendingModuleMsg = null;

  function go(route, target){
    pendingTarget = (target === undefined) ? null : (target || null);
    if(location.hash === '#' + route){ routeTo(route); return; }
    location.hash = '#' + route;
  }
  function routeFromHash(){
    const h = (location.hash || '').replace(/^#/, '');
    return ROUTES.indexOf(h) >= 0 ? h : 'overview';
  }
  function routeTo(route){
    const target = pendingTarget;
    pendingTarget = null;

    const prev = currentRoute;
    currentRoute = route;

    $$('#nav a').forEach(a => a.classList.toggle('active', a.dataset.route === route));

    const isOverview = route === 'overview';
    const isRoadmap  = route === 'roadmap';

    $('#overview').hidden   = !isOverview;
    $('#roadmap').hidden    = !isRoadmap;
    $('#moduleView').hidden = isOverview || isRoadmap;

    if(isOverview){
      renderOverview();
      if(prev !== 'overview') window.scrollTo(0, 0);
      return;
    }

    if(isRoadmap){
      renderRoadmap();
      if(prev !== 'roadmap') $('#roadmap').scrollTop = 0;
      return;
    }

    const mod = MODULES[route];
    $('#modTitle').textContent = mod.icon + '  ' + mod.name;

    const frame = $('#frame');
    const src = mod.file + (target || '');
    frame.dataset.route = route;

    if(frame.getAttribute('src') !== src){
      pendingModuleMsg = target
        ? { type:'hub:open', module: route, target: target }
        : null;
      frame.setAttribute('src', src);
      iframeLoadedFor = route;
    }else{
      decorateFrame();
      if(target){
        try{
          frame.contentWindow.postMessage({ type:'hub:open', module: route, target: target }, '*');
        }catch(e){}
      }
    }
  }
  function decorateFrame(){
    const frame = $('#frame');
    const route = frame.dataset.route;
    let doc;
    try{ doc = frame.contentDocument; }catch(e){ return; }
    if(!doc) return;
    doc.querySelectorAll('a[href]').forEach(a => {
      const href = a.getAttribute('href') || '';
      if(/^(?:\.\.\/)?(?:Dashboard|index)\.html$/i.test(href)){
        a.setAttribute('href', 'index.html#' + (route || 'overview'));
        a.setAttribute('target', '_top');
      }
    });
    ensureFab(frame);
  }

  /* ============================================================
     EVENTS
     ============================================================ */
  window.addEventListener('hashchange', () => routeTo(routeFromHash()));

  document.addEventListener('click', e => {
    if(e.target.closest('#nav a')) return;
    if(e.target.closest('#backBtn')){ go('overview'); return; }
  });

  $('#overviewContent').addEventListener('click', e => {
    const el = e.target.closest('[data-route]');
    if(el) go(el.dataset.route);
  });

  $('#roadmapContent').addEventListener('click', onRoadmapClick);
  $('#roadmapContent').addEventListener('change', onRoadmapChange);

  /* ---------- phase resource picker ---------- */
  $('#pickerTabs').addEventListener('click', e => {
    const t = e.target.closest('.tab');
    if(!t) return;
    pickerModule = t.dataset.mod;
    $('#pickerSearch').value = '';
    renderPicker();
  });
  $('#pickerList').addEventListener('click', e => {
    const item = e.target.closest('.pitem');
    if(!item || item.disabled) return;
    addPickedResource(item.dataset.ref);
  });
  $('#pickerSearch').addEventListener('input', renderPicker);
  $('#pickerClose').addEventListener('click', closePicker);
  $('#pickerDone').addEventListener('click', closePicker);
  $('#picker').addEventListener('click', e => { if(e.target === $('#picker')) closePicker(); });

  /* ---------- day planner ---------- */
  $('#dayModeTabs').addEventListener('click', e => {
    const t = e.target.closest('.tab');
    if(!t) return;
    dayMode = t.dataset.mode;
    $('#daySearch').value = '';
    renderDayModal();
  });

  $('#dayTabs').addEventListener('click', e => {
    const t = e.target.closest('.tab');
    if(!t) return;
    dayModule = t.dataset.mod;
    $('#daySearch').value = '';
    renderDayModal();
  });

  $('#dayList').addEventListener('click', e => {
    const item = e.target.closest('.pitem');
    if(!item || item.disabled) return;
    if(dayMode === 'tasks') addDayTask(dayModule, item.dataset.ref);
    else addDayResource(dayModule, item.dataset.ref);
  });

  $('#daySection').addEventListener('click', e => {
    const btn = e.target.closest('[data-act]');
    if(!btn) return;
    const act = btn.dataset.act;
    if(act === 'toggle-task') toggleDayTask(btn.dataset.id);
    else if(act === 'remove-task') removeDayTask(btn.dataset.id);
    else if(act === 'toggle-res') toggleDayResource(btn.dataset.id);
    else if(act === 'remove-res') removeDayResource(btn.dataset.id);
  });

  $('#dayPickerToggle').addEventListener('click', () => {
    dayPickerOpen = !dayPickerOpen;
    renderDayModal();
  });

  $('#daySearch').addEventListener('input', renderDayModal);
  $('#dayToggleComplete').addEventListener('click', toggleDayComplete);
  $('#dayClose').addEventListener('click', closeDayModal);
  $('#dayDone').addEventListener('click', closeDayModal);
  $('#dayModal').addEventListener('click', e => { if(e.target === $('#dayModal')) closeDayModal(); });

  document.addEventListener('keydown', e => {
    if(e.key !== 'Escape') return;
    if(!$('#dayModal').hidden){ closeDayModal(); return; }
    if(!$('#picker').hidden) closePicker();
  });

  $('#themeBtn').addEventListener('click', () => {
    const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    applyTheme(next);
  });

  $('#frame').addEventListener('load', () => {
    decorateFrame();
    if(pendingModuleMsg){
      try{ $('#frame').contentWindow.postMessage(pendingModuleMsg, '*'); }catch(e){}
      pendingModuleMsg = null;
    }
  });

  document.addEventListener('visibilitychange', () => {
    if(document.visibilityState !== 'visible') return;
    if(currentRoute === 'overview') renderOverview();
    else if(currentRoute === 'roadmap') renderRoadmap();
    else refreshAllFabs();
  });

  window.addEventListener('focus', () => {
    if(currentRoute === 'overview') renderOverview();
    else if(currentRoute === 'roadmap') renderRoadmap();
    else refreshAllFabs();
  });

  window.addEventListener('message', () => {
    if(currentRoute === 'overview') renderOverview();
    else if(currentRoute === 'roadmap') renderRoadmap();
  });

  /* ============================================================
     BOOT
     ============================================================ */
  applyTheme(initialTheme());
  routeTo(routeFromHash());
})();
</script>
