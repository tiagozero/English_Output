<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>WritePath — Guided English Writing Practice</title>
<style>
  :root{
    --bg:#f5f6f8; --panel:#ffffff; --line:#e4e7ec; --line-strong:#c9cede;
    --text:#12141a; --muted:#6b7280;
    --accent:#4f46e5; --accent-hover:#4338ca; --accent-soft:#eef0ff; --accent-line:#c7c9ff;
    --green:#047857; --green-soft:#e8f7f1; --green-line:#b9e6d5;
    --amber:#b45309; --amber-soft:#fdf2e3; --amber-line:#f3e0c2;
    --red:#b91c1c; --red-soft:#fdeceb; --red-line:#f6d5d3;
    --hover:#f7f8fa; --hover2:#f1f2f6;
    --faint:#fafbfc; --chip-bg:#f3f4f6; --bar:#eceef2;
    --input-bg:#ffffff;
    --shadow:rgba(20,22,40,.05);
    --radius:12px;
  }
  body.dark{
    --bg:#0e1117; --panel:#161a22; --line:#262b36; --line-strong:#39414f;
    --text:#e8eaef; --muted:#8b93a3;
    --accent:#818cf8; --accent-hover:#a5b4fc; --accent-soft:#1e2138; --accent-line:#3730a3;
    --green:#34d399; --green-soft:#12291f; --green-line:#1f4a37;
    --amber:#fbbf24; --amber-soft:#2a2113; --amber-line:#4a3a17;
    --red:#f87171; --red-soft:#2b1a1a; --red-line:#4a2525;
    --hover:#1c212b; --hover2:#1f242f;
    --faint:#12161d; --chip-bg:#1e232d; --bar:#2a2f3a;
    --input-bg:#12161d;
    --shadow:rgba(0,0,0,.4);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text);
    font:15px/1.55 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    transition:background .15s, color .15s;
  }
  button{font:inherit;cursor:pointer}
  input,select,textarea{font:inherit;color:inherit}
  h1,h2,h3,h4{margin:0 0 6px;line-height:1.25;letter-spacing:-.01em}
  h1{font-size:26px} h2{font-size:20px} h3{font-size:16px} h4{font-size:14px}
  p{margin:0 0 8px}
  .muted{color:var(--muted)}
  .small{font-size:13px}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .row.between{justify-content:space-between}
  .wrap{max-width:1080px;margin:0 auto;padding:22px}

  .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 22px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
  .brand{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:-.02em}
  .logo{display:grid;place-items:center;width:26px;height:26px;border-radius:8px;background:var(--accent);color:#fff;font-size:14px}
  nav{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
  .navbtn{background:transparent;border:0;padding:6px 12px;border-radius:999px;color:var(--muted);font-weight:500}
  .navbtn:hover{background:var(--hover2);color:var(--text)}
  .navbtn.active{background:var(--accent-soft);color:var(--accent)}
  a.navbtn{text-decoration:none;display:inline-block;cursor:pointer}
  .iconbtn{background:transparent;border:1px solid transparent;padding:5px 9px;border-radius:9px;font-size:16px;line-height:1;color:var(--muted)}
  .iconbtn:hover{background:var(--hover2);color:var(--text)}

  .btn{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:7px 13px;font-weight:500;color:var(--text);transition:.13s}
  .btn:hover{background:var(--hover);border-color:var(--line-strong)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
  .btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
  .btn.ghost:hover{background:var(--hover2);color:var(--text)}
  .btn.danger{color:var(--red);border-color:var(--red-line)}
  .btn.danger:hover{background:var(--red-soft)}
  .btn.sm{padding:4px 9px;font-size:13px;border-radius:7px}
  .btn:disabled{opacity:.45;cursor:not-allowed}

  .hero{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:26px;margin-bottom:18px}
  .hero p{color:var(--muted);max-width:620px}
  .hero .btn{margin-top:8px}

  .cards{display:grid;gap:12px}
  .scard{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:15px 17px;display:flex;gap:14px;justify-content:space-between;align-items:center;flex-wrap:wrap;cursor:pointer;transition:.13s}
  .scard:hover{border-color:var(--line-strong);box-shadow:0 2px 10px var(--shadow)}
  .scard .eyebrow{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .scard h3{margin:2px 0 4px}

  .eyebrow{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:4px}

  .sessionbar{background:var(--panel);border-bottom:1px solid var(--line);padding:14px 22px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
  .sessionmeta{color:var(--muted);font-size:13.5px}
  .tabs{display:flex;gap:2px;padding:0 22px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;position:sticky;top:47px;z-index:20}
  .tab{background:transparent;border:0;border-bottom:2px solid transparent;padding:10px 13px;color:var(--muted);font-weight:500;white-space:nowrap}
  .tab:hover{color:var(--text)}
  .tab.active{color:var(--accent);border-bottom-color:var(--accent)}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:14px}
  .panel h3,.panel h4{margin-bottom:8px}
  label.field{display:block;margin-bottom:12px}
  label.field > span{display:block;font-size:13px;font-weight:600;color:var(--text);margin-bottom:4px}
  input[type=text],input[type=number],select,textarea{
    width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--input-bg);outline:none;transition:.13s;color:var(--text);
  }
  input::placeholder,textarea::placeholder{color:var(--muted);opacity:.75}
  input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  textarea{resize:vertical;line-height:1.6}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:700px){.grid2{grid-template-columns:1fr}}

  .chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 11px;font-size:13px;color:var(--text)}
  .chip:hover{background:var(--hover)}
  .chip.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent);font-weight:500}
  .minichip{display:inline-block;background:var(--chip-bg);border-radius:6px;padding:2px 8px;font-size:12.5px;color:var(--muted);margin:0 4px 4px 0}
  .badge{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:5px;background:var(--chip-bg);color:var(--muted)}
  .badge.required{background:var(--accent-soft);color:var(--accent)}
  .badge.chooseOne{background:var(--amber-soft);color:var(--amber)}
  .badge.optional{background:var(--chip-bg);color:var(--muted)}
  .badge.used{background:var(--green-soft);color:var(--green)}
  .badge.missing{background:var(--red-soft);color:var(--red)}

  .k-chunk .dot,.k-chunk .kdot{background:#6366f1}
  .k-collocation .dot,.k-collocation .kdot{background:#0ea5e9}
  .k-phrasalVerb .dot,.k-phrasalVerb .kdot{background:#14b8a6}
  .k-vocabulary .dot,.k-vocabulary .kdot{background:#f59e0b}
  .k-grammar .dot,.k-grammar .kdot{background:#ec4899}
  .k-timeExpression .dot,.k-timeExpression .kdot{background:#8b5cf6}

  .trow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--hover2)}
  .trow:last-child{border-bottom:0}
  .kdot{width:8px;height:8px;border-radius:50%;flex:none;background:#9ca3af}
  .trow .ttext{flex:1;min-width:0;font-weight:500}
  .trow select{width:auto;padding:3px 6px;font-size:12.5px;border-radius:7px}

  .tgroup{margin-bottom:14px}
  .tgroup:last-child{margin-bottom:0}
  .tgrouphead{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0 0 6px 2px}
  .tgrouphead .kdot{width:7px;height:7px}
  .tchip{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:7px 10px;margin-bottom:6px;font-size:13.5px;transition:.13s;color:var(--text)}
  .tchip .dot{width:8px;height:8px;border-radius:50%;flex:none;background:#9ca3af}
  .tchip .ttext{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tchip .req{font-size:10px;font-weight:700;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);padding:1px 5px;border-radius:4px}
  .tchip:hover{border-color:var(--line-strong)}
  .tchip.committed{background:var(--green-soft);border-color:var(--green-line);color:var(--green)}
  .tchip.committed .ttext{text-decoration:line-through;opacity:.75}
  .tchip.live{background:var(--accent-soft);border-color:var(--accent-line)}
  .legend{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-top:10px;flex-wrap:wrap}
  .lg{width:11px;height:11px;border-radius:4px;display:inline-block;border:1px solid var(--line)}
  .lg.committed{background:var(--green-soft);border-color:var(--green-line)}
  .lg.live{background:var(--accent-soft);border-color:var(--accent-line)}

  .writewrap{display:grid;grid-template-columns:1fr 306px;gap:16px;align-items:start}
  @media(max-width:900px){.writewrap{grid-template-columns:1fr}}
  .sidebar{position:sticky;top:110px;max-height:calc(100vh - 130px);overflow-y:auto}
  .editor{min-height:110px;font-size:16px}
  .instr{background:linear-gradient(180deg,var(--panel),var(--faint))}
  .instr h3{font-size:17px}

  .sent{border-left:3px solid var(--line);padding:6px 0 6px 13px;margin-bottom:12px}
  .sent .stext{font-size:15.5px}
  .sent .smeta{font-size:12px;color:var(--muted);margin-top:3px}

  .nodecard{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);padding:14px 16px;margin-bottom:12px}
  .nodehead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .nodeidx{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);padding:3px 8px;border-radius:6px}
  .branchrow{display:flex;gap:8px;align-items:center;margin-bottom:6px}
  .branchrow input{flex:1}
  .branchrow select{width:190px;flex:none}

  .statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
  @media(max-width:760px){.statgrid{grid-template-columns:repeat(2,1fr)}}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
  .stat .num{font-size:24px;font-weight:700;letter-spacing:-.02em}
  .stat .lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
  .bar{height:7px;background:var(--bar);border-radius:99px;overflow:hidden;margin-top:8px}
  .bar > i{display:block;height:100%;background:var(--accent);border-radius:99px}

  .fb{padding:10px 12px;border-radius:9px;margin-bottom:8px;font-size:14px;border:1px solid transparent}
  .fb.error{background:var(--red-soft);border-color:var(--red-line)}
  .fb.warn{background:var(--amber-soft);border-color:var(--amber-line)}
  .fb.tip{background:var(--hover2);border-color:var(--line)}
  .fb .lvl{font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase;margin-right:6px}
  .fb.error .lvl{color:var(--red)} .fb.warn .lvl{color:var(--amber)} .fb.tip .lvl{color:var(--muted)}

  .quote{background:var(--faint);border:1px solid var(--line);border-radius:9px;padding:9px 12px;font-size:14.5px;margin:0}
  .quote.rev{background:var(--green-soft);border-color:var(--green-line)}
  .compare{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
  @media(max-width:700px){.compare{grid-template-columns:1fr}}
  .lbl{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
  .history{margin-top:10px;border-top:1px dashed var(--line);padding-top:10px}
  .histrow{font-size:13px;color:var(--muted);margin-bottom:6px;display:flex;gap:8px;flex-wrap:wrap;align-items:baseline}
  .histrow .before{text-decoration:line-through;color:var(--muted);opacity:.7}
  .histrow .arrow{color:var(--muted)}
  .histrow .after{color:var(--green);font-weight:500}

  table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  th,td{text-align:left;padding:9px 13px;border-bottom:1px solid var(--hover2);font-size:14px}
  th{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--faint)}
  tr:last-child td{border-bottom:0}
  .usebar{height:6px;background:var(--bar);border-radius:99px;width:80px;overflow:hidden;display:inline-block;vertical-align:middle}
  .usebar > i{display:block;height:100%;background:var(--accent)}

  pre{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  details summary{cursor:pointer;user-select:none}
  details summary:hover{color:var(--text)}

  #toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:#111827;color:#fff;padding:9px 16px;border-radius:9px;font-size:13.5px;opacity:0;pointer-events:none;transition:.2s;z-index:99}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .empty{padding:30px;text-align:center;color:var(--muted);background:var(--panel);border:1px dashed var(--line);border-radius:var(--radius)}
  .choice{border-color:var(--accent-line);background:linear-gradient(180deg,var(--panel),var(--faint))}
  .branchbtn{text-align:left}

  .resetrow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);flex-wrap:wrap}

  .pickbanner{background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:var(--radius);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
  .selbar{background:var(--panel);border:1px solid var(--accent-line);border-radius:var(--radius);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap;position:sticky;top:100px;z-index:10;box-shadow:0 2px 8px var(--shadow)}
  .librow{display:flex;align-items:center;gap:10px;padding:8px 6px;border-bottom:1px solid var(--hover2);border-radius:6px}
  .librow:last-child{border-bottom:0}
  .librow.sel{background:var(--accent-soft)}
  .librow .libtext{flex:1;min-width:0;font-weight:500;word-break:break-word}
  .librow input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px;flex:none;cursor:pointer}
  .librow .minichip{margin:0}
  .danger-zone{border-color:var(--red-line)}

  /* ===== Sentence Expansion ===== */
  .exstages{display:flex;flex-direction:column;gap:4px}
  .exstage{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:transparent;border:1px solid transparent;border-radius:9px;padding:7px 9px;color:var(--text);font-size:13.5px;transition:.13s}
  .exstage:hover{background:var(--hover)}
  .exstage .exnum{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--chip-bg);color:var(--muted);font-size:11px;font-weight:700;flex:none}
  .exstage.active{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent);font-weight:600}
  .exstage.active .exnum{background:var(--accent);color:#fff}
  .exstage.done .exnum{background:var(--green-soft);color:var(--green);border:1px solid var(--green-line)}
  .exstage.done .exlabel{color:var(--muted)}

  .exgrow{display:flex;flex-direction:column;gap:6px}
  .exgrowrow{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--faint)}
  .exgrowrow.active{border-color:var(--accent-line);background:var(--accent-soft)}
  .exgrowrow.final{background:var(--green-soft);border-color:var(--green-line)}
  .exgrowrow .exglabel{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);flex:none;min-width:94px;padding-top:2px}
  .exgrowrow .exgtext{flex:1;min-width:0;font-size:14.5px;word-break:break-word}

  .exhint{background:linear-gradient(180deg,var(--panel),var(--faint));border:1px solid var(--accent-line)}
  .exprev{background:var(--faint);border:1px solid var(--line);border-radius:9px;padding:9px 12px;font-size:14px;margin-bottom:8px;color:var(--muted)}

  .topiccard{background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:var(--radius);padding:12px 16px;margin-bottom:14px}
  .topiccard .eyebrow{color:var(--accent)}
  .topiccard .topictext{font-size:15.5px;font-weight:500}

  .openings{background:var(--panel);border:1px solid var(--accent-line);border-radius:var(--radius);padding:14px 16px;margin-bottom:14px}
  .openings .openinglist{display:flex;flex-direction:column;gap:6px;margin-top:8px}
  .openingrow{display:flex;align-items:center;gap:10px;padding:8px 11px;border:1px dashed var(--line-strong);border-radius:9px;background:var(--faint);text-align:left;font-size:14px;color:var(--text);transition:.13s;width:100%}
  .openingrow:hover{border-style:solid;border-color:var(--accent-line);background:var(--accent-soft)}
  .openingrow .opnum{font-size:11px;font-weight:700;color:var(--muted);flex:none;min-width:16px}
  .openingrow .optext{flex:1;min-width:0}
  .openingrow .opuse{font-size:11.5px;font-weight:600;color:var(--accent);opacity:0;transition:.13s}
  .openingrow:hover .opuse{opacity:1}

  /* file status rows (selected terms mode) */
  .filerow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:var(--panel);margin-bottom:6px}
  .filerow.ok{border-color:var(--green-line);background:var(--green-soft)}
  .filerow.topicrow{border-color:var(--accent-line);background:var(--accent-soft);margin-bottom:14px}
  .filerow .fl{display:flex;align-items:center;gap:8px;min-width:0}
  .filerow .fl .status{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:2px 7px;border-radius:5px}
  .filerow .fl .status.ok{background:var(--green);color:#fff}
  .filerow .fl .status.missing{background:var(--chip-bg);color:var(--muted)}
  .filerow .fl .fname{font-weight:600;font-size:14px}
  .filerow .fl .fcount{color:var(--muted);font-size:12.5px}
</style>
</head>
<body>
<div id="app"></div>
<input type="file" id="fileImport" accept=".json,.csv,application/json,text/csv" hidden />
<div id="toast"></div>

<script>
/* ============================================================
   WritePath — guided English writing practice
   ============================================================ */

const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $  = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
const wordsIn = t => (String(t).trim().match(/[A-Za-z0-9'’\-]+/g) || []).length;
const norm = t => String(t).toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').replace(/\s+/g, ' ').trim();
const escRe = t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

const KINDS = {
  chunk:          'Chunk',
  collocation:    'Collocation',
  phrasalVerb:    'Phrasal verb',
  vocabulary:     'Vocabulary',
  grammar:        'Grammar point',
  timeExpression: 'Time expression'
};
const KIND_ORDER = ['chunk','collocation','phrasalVerb','vocabulary','grammar','timeExpression'];
const REQS = { required:'Required', chooseOne:'Choose one', optional:'Optional' };
const TEXT_TYPES = ['Journal','Mini-essay','Story','Reddit post','Free writing','Sentence Expansion'];
const KEY = 'writepath.v1';
const THEME_KEY = 'writepath.theme';
const BACKUP_APP = 'WritePath';
const BACKUP_VERSION = 1;
const EXPANSION_TYPE = 'Sentence Expansion';
const EXPANSION_MODE_FULL = 'full';
const EXPANSION_MODE_SELECTED = 'selected';

const EXPANSION_STAGES = [
  { key:'basic',          label:'Basic',                hint:'Create a simple sentence.',                                                kind:null,             minWords:3,  example:"I've been studying." },
  { key:'chunk',          label:'Add a Chunk',          hint:'Expand the sentence using a target chunk.',                                kind:'chunk',          minWords:0,  example:"I've been studying English." },
  { key:'collocation',    label:'Add a Collocation',    hint:'Add a natural collocation.',                                               kind:'collocation',    minWords:0,  example:"I've been studying English and making steady progress." },
  { key:'phrasalVerb',    label:'Add a Phrasal Verb',   hint:'Add a target phrasal verb.',                                               kind:'phrasalVerb',    minWords:0,  example:"…and trying to keep up with my classes." },
  { key:'timeExpression', label:'Add a Time Expression',hint:'Add a natural time expression.',                                           kind:'timeExpression', minWords:0,  example:"I've been studying English more consistently lately." },
  { key:'detail',         label:'Add Detail',           hint:'Add specific information — who, what, where, how, or why.',                kind:null,             minWords:0,  example:"…with two online tutors and a weekly study group." },
  { key:'connection',     label:'Add Connection',       hint:'Add a reason, contrast, result, condition, or similar relationship.',      kind:null,             minWords:0,  example:"…because I want to pass the IELTS exam next spring." },
  { key:'final',          label:'Final Version',        hint:'Produce a natural B2–C1 sentence with at least 20 words.',                 kind:null,             minWords:20, example:'A polished, natural sentence of 20+ words preserving the original meaning.' }
];

let state = { sessions: [], library: [] };
let ui = {
  view:'home', sessionId:null, step:'setup', reviseDraft:{},
  librarySearch:'', libraryFilter:'all', librarySelected:[],
  libraryPickForSession:null
};
let theme = 'light';
let pendingImportMode = 'targets';

function newExpansionState(){
  return {
    currentStage: 0,
    stages: { basic:'', chunk:'', collocation:'', phrasalVerb:'', timeExpression:'', detail:'', connection:'', final:'' },
    picked: { chunk:[], collocation:[], phrasalVerb:[], timeExpression:[] },
    startedAt: Date.now(),
    completedAt: null
  };
}
function ensureExpansion(s){
  if(!s) return null;
  if(!s.expansion){
    s.expansion = newExpansionState();
  } else {
    const def = newExpansionState();
    s.expansion.stages = Object.assign({}, def.stages, s.expansion.stages || {});
    s.expansion.picked = Object.assign({}, def.picked, s.expansion.picked || {});
    if(typeof s.expansion.currentStage !== 'number') s.expansion.currentStage = 0;
  }
  return s.expansion;
}
function textIncludes(text, phrase){
  const needle = norm(phrase);
  if(!needle) return false;
  const n = ' ' + norm(text) + ' ';
  return new RegExp('(^|[^a-z0-9])' + escRe(needle) + '([^a-z0-9]|$)').test(n);
}
function expansionPickedIds(s){
  const out = new Set();
  if(s && s.expansion && s.expansion.picked){
    Object.values(s.expansion.picked).forEach(arr => (arr || []).forEach(id => out.add(id)));
  }
  return out;
}
function isExpansionSession(s){ return !!(s && s.textType === EXPANSION_TYPE); }
function expansionMode(s){
  return (s && s.expansionMode) === EXPANSION_MODE_SELECTED ? EXPANSION_MODE_SELECTED : EXPANSION_MODE_FULL;
}

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      state = parsed.state || { sessions: [] };
      const u = parsed.ui || {};
      ui.view = u.view || 'home';
      ui.sessionId = u.sessionId || null;
      ui.step = u.step || 'setup';
    }
  }catch(e){ console.warn('load failed', e); }
  if(!Array.isArray(state.sessions)) state.sessions = [];
  if(!Array.isArray(state.library)) state.library = [];
  state.sessions.forEach(hydrate);
  state.library.forEach(hydrateLibraryItem);
  theme = localStorage.getItem(THEME_KEY) || 'light';
}
function hydrate(s){
  s.targets = s.targets || [];
  s.nodes = s.nodes || [];
  s.sentences = s.sentences || [];
  s.revisions = s.revisions || [];
  s.manualUsed = s.manualUsed || [];
  s.draft = s.draft || '';
  s.draftManual = s.draftManual || [];
  s.currentNodeId = s.currentNodeId || null;
  s.textType = s.textType || 'Journal';
  s.targetWords = s.targetWords ?? 120;
  s.openings = Array.isArray(s.openings) ? s.openings : [];
  if(s.expansionMode !== EXPANSION_MODE_SELECTED) s.expansionMode = EXPANSION_MODE_FULL;
  s.nodes.forEach(n => { n.branches = n.branches || []; n.targetIds = n.targetIds || []; n.instruction = n.instruction || ''; });
  s.sentences.forEach(x => { x.usedTargetIds = x.usedTargetIds || []; x.manualUsedIds = x.manualUsedIds || []; x.original = x.original ?? x.text; });
  if(isExpansionSession(s)) ensureExpansion(s);
  return s;
}
function hydrateLibraryItem(it){
  it.tags = Array.isArray(it.tags) ? it.tags : [];
  it.kind = it.kind || 'vocabulary';
  it.requirement = it.requirement || 'optional';
  it.group = it.group || '';
  it.text = it.text || '';
  return it;
}
function save(){
  try{
    localStorage.setItem(KEY, JSON.stringify({
      state,
      ui: { view: ui.view, sessionId: ui.sessionId, step: ui.step }
    }));
  }catch(e){ console.warn('save failed', e); }
}
function touch(s){ s.updatedAt = Date.now(); save(); updateMeta(); }

let toastTimer;

  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}

  document.body.classList.toggle('dark', theme === 'dark');
}

function newSession(){
  const now = Date.now();
  return {
    id: uid(), title:'', topic:'', textType:'Journal', targetWords:120,
    createdAt: now, updatedAt: now,
    targets: [], nodes: [], sentences: [], revisions: [], manualUsed: [],
    currentNodeId: null, pathComplete: false, awaitingChoice: false,
    draft: '', draftManual: [], expansion: null, openings: [],
    expansionMode: EXPANSION_MODE_FULL
  };
}
function currentSession(){ return state.sessions.find(s => s.id === ui.sessionId) || null; }
function countWords(s){ return s.sentences.reduce((a, x) => a + wordsIn(x.text), 0); }
function committedUsed(s){
  const set = new Set();
  s.sentences.forEach(x => (x.usedTargetIds || []).forEach(id => set.add(id)));
  (s.manualUsed || []).forEach(id => set.add(id));
  if(isExpansionSession(s) && s.expansion){ expansionPickedIds(s).forEach(id => set.add(id)); }
  return set;
}
function autoMatch(text, targets){
  const n = ' ' + norm(text) + ' ';
  const out = new Set();
  if(!n.trim()) return out;
  for(const t of targets){
    if(t.kind === 'grammar') continue;
    const needle = norm(t.text);
    if(!needle) continue;
    const re = new RegExp('(^|[^a-z0-9])' + escRe(needle) + '([^a-z0-9]|$)');
    if(re.test(n)) out.add(t.id);
  }
  return out;
}
function ensureCursor(s){
  if(!s.nodes.length || s.pathComplete) return;
  if(!s.currentNodeId || !s.nodes.some(n => n.id === s.currentNodeId)){ s.currentNodeId = s.nodes[0].id; }
}
function advanceSequential(s){
  const i = s.nodes.findIndex(n => n.id === s.currentNodeId);
  if(i >= 0 && i + 1 < s.nodes.length) s.currentNodeId = s.nodes[i + 1].id;
  else { s.currentNodeId = null; s.pathComplete = true; }
}
function nodeLabel(s, id){
  const i = s.nodes.findIndex(n => n.id === id);
  if(i < 0) return '—';
  const n = s.nodes[i];
  return 'Step ' + (i + 1) + (n.instruction ? ': ' + n.instruction.slice(0, 28) : '');
}
function kindName(k){ return KINDS[k] || k; }

function addLibraryItemsToSession(libIds, session){
  let added = 0;
  const existing = new Set(session.targets.map(t => t.kind + '::' + norm(t.text)));
  libIds.forEach(id => {
    const it = state.library.find(x => x.id === id);
    if(!it) return;
    const key = it.kind + '::' + norm(it.text);
    if(existing.has(key)) return;
    session.targets.push({ id: uid(), kind: it.kind, text: it.text, requirement: it.requirement, group: it.group || '' });
    existing.add(key); added++;
  });
  if(added) session.updatedAt = Date.now();
  return added;
}
function saveTargetsToLibrary(targets){
  let added = 0;
  const existing = new Set(state.library.map(it => it.kind + '::' + norm(it.text)));
  targets.forEach(t => {
    const key = t.kind + '::' + norm(t.text);
    if(existing.has(key)) return;
    state.library.push({ id: uid(), kind: t.kind, text: t.text, requirement: t.requirement, group: t.group || '', tags: [], addedAt: Date.now() });
    existing.add(key); added++;
  });
  return added;
}

function download(filename, content, type){
  const blob = new Blob([content], { type: type || 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 500);
}
function csvCell(v){
  const s = String(v ?? '');
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function splitCSVLine(line){
  const out = []; let cur = ''; let q = false;
  for(let i = 0; i < line.length; i++){
    const c = line[i];
    if(q){
      if(c === '"'){ if(line[i+1] === '"'){ cur += '"'; i++; } else q = false; }
      else cur += c;
    } else {
      if(c === '"') q = true;
      else if(c === ','){ out.push(cur); cur = ''; }
      else cur += c;
    }
  }
  out.push(cur);
  return out.map(s => s.trim());
}
function normalizeKind(v){
  const k = String(v || '').trim().toLowerCase().replace(/[\s_-]/g, '');
  if(k === 'chunk' || k === 'chunks') return 'chunk';
  if(k === 'collocation' || k === 'collocations') return 'collocation';
  if(k === 'phrasalverb' || k === 'phrasal' || k === 'phrasalverbs') return 'phrasalVerb';
  if(k === 'vocabulary' || k === 'vocab' || k === 'word') return 'vocabulary';
  if(k === 'grammar' || k === 'grammarpoint' || k === 'grammarpoints') return 'grammar';
  if(k === 'timeexpression' || k === 'time' || k === 'timephrase' || k === 'timephrases' || k === 'expressionoftime' || k === 'adverbial') return 'timeExpression';
  return 'vocabulary';
}
function normalizeReq(v){
  const r = String(v || '').trim().toLowerCase().replace(/[\s_-]/g, '');
  if(r === 'required' || r === 'req' || r === 'must') return 'required';
  if(r === 'chooseone' || r === 'choice' || r === 'oneof') return 'chooseOne';
  return 'optional';
}
function normalizeItem(obj){
  const text = String(obj.text ?? obj.term ?? obj.item ?? obj.value ?? obj.phrase ?? '').trim();
  if(!text) return null;
  const kind = normalizeKind(obj.kind ?? obj.type ?? obj.category);
  const requirement = normalizeReq(obj.requirement ?? obj.req ?? obj.priority);
  const group = String(obj.group ?? obj.groupName ?? obj.category_group ?? '').trim();
  const tagsRaw = obj.tags ?? '';
  const tags = Array.isArray(tagsRaw)
    ? tagsRaw.map(x => String(x).trim()).filter(Boolean)
    : String(tagsRaw).split(/[|,]/).map(t => t.trim()).filter(Boolean);
  return { kind, text, requirement, group: requirement === 'chooseOne' ? (group || 'Group 1') : '', tags };
}

function readOpenings(raw){
  if(Array.isArray(raw)) return raw.map(x => String(x).trim()).filter(Boolean);
  if(typeof raw === 'string') return raw.split(/[\n|;]+/).map(x => x.trim()).filter(Boolean);
  return [];
}

function parseJSONTargetsFull(text){
  let data = JSON.parse(text);
  let topic = '';
  let openings = [];
  if(data && !Array.isArray(data)){
    if(typeof data.topic === 'string') topic = data.topic.trim();
    else if(typeof data.Topic === 'string') topic = data.Topic.trim();
    openings = readOpenings(data.openings ?? data.Openings ?? data.opening ?? data.Opening);
    if(Array.isArray(data.targets)) data = data.targets;
    else if(Array.isArray(data.items)) data = data.items;
    else if(Array.isArray(data.library)) data = data.library;
    else throw new Error('Expected an array of items, or an object with "topic" and "items"/"targets".');
  }
  if(!Array.isArray(data)) throw new Error('Expected an array of items');
  const items = data.map(item => typeof item === 'string'
    ? { kind:'vocabulary', text:item.trim(), requirement:'optional', group:'', tags:[] }
    : normalizeItem(item)
  ).filter(Boolean);
  return { items, topic, openings };
}
function parseCSVTargetsFull(text){
  const lines = text.split(/\r?\n/).filter(l => l.trim().length);
  if(!lines.length) return { items: [], topic: '', openings: [] };
  const first = lines[0].toLowerCase();
  const hasHeader = /\b(text|term|item|kind|type|requirement|group|tags)\b/.test(first);
  const header = hasHeader ? splitCSVLine(lines[0]).map(h => h.toLowerCase().trim()) : ['text','kind','requirement','group','tags'];
  const rows = hasHeader ? lines.slice(1) : lines;
  const items = rows.map(line => {
    const cells = splitCSVLine(line);
    const obj = {};
    header.forEach((h, i) => obj[h] = cells[i] || '');
    return normalizeItem(obj);
  }).filter(Boolean);
  return { items, topic: '', openings: [] };
}
function parseTargetsFile(name, text){
  const lower = name.toLowerCase();
  const trimmed = text.trim();
  if(lower.endsWith('.json') || trimmed.startsWith('[') || trimmed.startsWith('{')){
    return parseJSONTargetsFull(text);
  }
  return parseCSVTargetsFull(text);
}
/* Tolerant item extractor for per-kind files (array or wrapped object) */
function extractItemsFromJSON(text){
  let data = JSON.parse(text);
  if(Array.isArray(data)) return data;
  if(data && typeof data === 'object'){
    if(Array.isArray(data.items)) return data.items;
    if(Array.isArray(data.targets)) return data.targets;
    if(Array.isArray(data.library)) return data.library;
  }
  throw new Error('No items array found.');
}

function exportTargetsCSV(s){
  const header = 'text,kind,requirement,group';
  const rows = s.targets.map(t => [csvCell(t.text), t.kind, t.requirement, csvCell(t.group || '')].join(','));
  return [header, ...rows].join('\n') + '\n';
}
function exportLibraryCSV(){
  const header = 'text,kind,requirement,group,tags';
  const rows = state.library.map(it => [csvCell(it.text), it.kind, it.requirement, csvCell(it.group || ''), csvCell((it.tags || []).join('|'))].join(','));
  return [header, ...rows].join('\n') + '\n';
}

function buildBackup(){
  return {
    app: BACKUP_APP, version: BACKUP_VERSION, exportedAt: new Date().toISOString(),
    counts: { sessions: state.sessions.length, library: state.library.length,
      sentences: state.sessions.reduce((a, s) => a + s.sentences.length, 0),
      targets: state.sessions.reduce((a, s) => a + s.targets.length, 0) },
    library: state.library, sessions: state.sessions
  };
}
function downloadBackup(){
  const backup = buildBackup();
  if(!backup.sessions.length && !backup.library.length){ toast('Nothing to export yet.'); return; }
  const stamp = new Date().toISOString().slice(0,10);
  download(`writepath-backup-${stamp}.json`, JSON.stringify(backup, null, 2), 'application/json');
  toast(`Exported ${backup.sessions.length} session${backup.sessions.length===1?'':'s'} + ${backup.library.length} library item${backup.library.length===1?'':'s'}`);
}
function applyBackup(data, mode){
  const lib = Array.isArray(data.library) ? data.library : [];
  const sess = Array.isArray(data.sessions) ? data.sessions : [];
  if(mode === 'replace'){
    state.library = lib.map(it => hydrateLibraryItem({ ...it, id: uid() }));
    state.sessions = sess.map(s => hydrate({ ...s, id: uid() }));
    ui.view = 'home'; ui.sessionId = null; ui.step = 'setup';
    ui.librarySelected = []; ui.libraryPickForSession = null;
    return { libAdded: state.library.length, sessAdded: state.sessions.length, replaced: true };
  }
  const existingLib = new Set(state.library.map(it => it.kind + '::' + norm(it.text)));
  let libAdded = 0;
  lib.forEach(it => {
    const t = String(it.text || '').trim();
    if(!t) return;
    const k = (it.kind || 'vocabulary') + '::' + norm(t);
    if(existingLib.has(k)) return;
    state.library.push(hydrateLibraryItem({ ...it, id: uid(), addedAt: Date.now() }));
    existingLib.add(k); libAdded++;
  });
  let sessAdded = 0;
  sess.forEach(s => { state.sessions.push(hydrate({ ...s, id: uid() })); sessAdded++; });
  return { libAdded, sessAdded, replaced: false };
}

function sessionSteps(s){
  if(isExpansionSession(s)) return [['setup','Setup'],['targets','Target language'],['expand','Expand'],['review','Review']];
  return [['setup','Setup'],['targets','Target language'],['path','Sentence path'],['write','Write'],['review','Review'],['revise','Revise']];
}

function render(){
  applyTheme();
  const app = $('#app');
  if(ui.view === 'progress'){ app.innerHTML = renderProgress(); }
  else if(ui.view === 'library'){ app.innerHTML = renderLibrary(); }
  else if(ui.view === 'session' && currentSession()){
    const s = currentSession();
    const valid = sessionSteps(s).map(x => x[0]);
    if(!valid.includes(ui.step)) ui.step = 'setup';
    app.innerHTML = renderSession();
  } else {
    ui.view = 'home'; ui.sessionId = null;
    app.innerHTML = renderHome();
  }
  updateMeta();
}

function sessionCard(s){
  const used = committedUsed(s);
  const req = s.targets.filter(t => t.requirement === 'required');
  const reqUsed = req.filter(t => used.has(t.id)).length;
  const words = isExpansionSession(s) ? wordsIn(s.expansion?.stages?.final || '') : countWords(s);
  const sentenceCount = isExpansionSession(s) ? (s.expansion && s.expansion.completedAt ? 1 : 0) : s.sentences.length;
  const status = isExpansionSession(s)
    ? (s.expansion && s.expansion.completedAt ? 'Expansion complete' : (s.expansion && (s.expansion.stages.basic || '').trim() ? 'Expanding' : 'Not started'))
    : (s.sentences.length === 0 ? 'Not started' : (s.reviewedAt ? 'Reviewed' : 'In progress'));
  return `<div class="scard" data-act="open-session" data-id="${s.id}">
    <div>
      <div class="eyebrow">${esc(s.textType)} · ${status}</div>
      <h3>${esc(s.title || s.topic || 'Untitled session')}</h3>
      <div class="muted small">${words} / ${s.targetWords || 0} words · ${sentenceCount} sentence${sentenceCount===1?'':'s'} · ${used.size}/${s.targets.length} targets used${req.length ? ` · ${reqUsed}/${req.length} required` : ''}</div>
    </div>
    <div class="row">
      <button class="btn primary sm" data-act="open-session" data-id="${s.id}">Open</button>
      <button class="btn danger sm" data-act="del-session" data-id="${s.id}">Delete</button>
    </div>
  </div>`;
}

      <button class="btn primary" data-act="add-library-item">+ Add to library</button>
    </div>
    <div class="panel">
      <div class="row between" style="margin-bottom:10px">
        <input type="text" id="libSearch" value="${esc(ui.librarySearch)}" placeholder="Search library…" style="max-width:320px" />
        <span class="muted small">${filtered.length} of ${lib.length} item${lib.length===1?'':'s'}</span>
      </div>
      <div class="row" style="gap:6px">
        <button class="chip ${ui.libraryFilter==='all'?'on':''}" data-act="filter-library" data-kind="all">All (${lib.length})</button>
        ${KIND_ORDER.map(k => `<button class="chip ${ui.libraryFilter===k?'on':''}" data-act="filter-library" data-kind="${k}">${KINDS[k]} (${counts[k]})</button>`).join('')}
      </div>
    </div>
    ${selected.size ? `
      <div class="selbar">
        <span><strong>${selected.size}</strong> selected</span>
        <div class="row">
          ${pickFor ? `<button class="btn primary" data-act="confirm-library-picker">Add selected to session</button>` : `
            <select id="bulkSessionSelect" style="width:auto; padding:6px 10px" ${sessions.length ? '' : 'disabled'}>
              ${sessions.length ? sessions.map(s => `<option value="${s.id}" ${defaultSession===s.id?'selected':''}>${esc(s.title || s.topic || 'Untitled session')}</option>`).join('') : '<option>— no sessions —</option>'}
            </select>
            <button class="btn primary" data-act="bulk-add-to-session" ${sessions.length ? '' : 'disabled'}>Add to session</button>
            <button class="btn danger" data-act="bulk-delete-library">Delete</button>
          `}
          <button class="btn ghost" data-act="clear-library-selection">Clear</button>
        </div>
      </div>` : ''}
    ${lib.length === 0 ? `<div class="empty">Your library is empty. Add items above, or save target language from a session.</div>`
      : filtered.length === 0 ? `<div class="empty">No items match your search or filter.</div>`
      : KIND_ORDER.filter(k => byKind[k] && byKind[k].length).map(kind => `
        <div class="panel">
          <div class="eyebrow" style="display:flex;align-items:center;gap:6px"><span class="kdot k-${kind}"></span>${KINDS[kind]} (${byKind[kind].length})</div>
          ${byKind[kind].map(it => {
            const isSel = selected.has(it.id);
            return `<label class="librow ${isSel?'sel':''}">
              <input type="checkbox" ${isSel?'checked':''} data-act="toggle-library-select" data-id="${it.id}" />
              <span class="kdot k-${it.kind}"></span>
              <span class="libtext">${esc(it.text)}</span>
              ${it.requirement === 'chooseOne' && it.group ? `<span class="badge chooseOne">${esc(it.group)}</span>` : it.requirement !== 'optional' ? `<span class="badge ${it.requirement}">${REQS[it.requirement]}</span>` : ''}
              ${(it.tags||[]).map(tg => `<span class="minichip">${esc(tg)}</span>`).join('')}
              <button class="btn ghost sm" data-act="del-library-item" data-id="${it.id}" title="Delete from library" type="button">✕</button>
            </label>`;
          }).join('')}
        </div>`).join('')}
  </main>`;
}

function renderSession(){
  const s = currentSession();
  const steps = sessionSteps(s);
  return `
  ${topbar('home')}
  <div class="sessionbar">
    <div><div class="eyebrow">${esc(s.textType)}</div><h2>${esc(s.title || s.topic || 'Untitled session')}</h2></div>
    <div class="sessionmeta" id="sessionmeta"></div>
  </div>
  <div class="tabs">${steps.map(([k,l]) => `<button class="tab ${ui.step===k?'active':''}" data-act="step" data-step="${k}">${l}</button>`).join('')}</div>
  <main class="wrap">${stepContent(s)}</main>`;
}
function updateMeta(){
  const el = $('#sessionmeta');
  const s = currentSession();
  if(!el || !s) return;
  if(isExpansionSession(s)){
    const ex = s.expansion || newExpansionState();
    const wc = wordsIn(ex.stages.final || ex.stages[EXPANSION_STAGES[ex.currentStage]?.key] || '');
    el.textContent = `Stage ${(ex.currentStage||0)+1} / ${EXPANSION_STAGES.length} · ${wc} word${wc===1?'':'s'}`;
  } else {
    el.textContent = `${countWords(s)} / ${s.targetWords || 0} words · ${s.sentences.length} sentence${s.sentences.length===1?'':'s'}`;
  }
}
function stepContent(s){
  switch(ui.step){
    case 'targets': return targetsStep(s);
    case 'path':    return pathStep(s);
    case 'write':   return writeStep(s);
    case 'expand':  return expandStep(s);
    case 'review':  return reviewStep(s);
    case 'revise':  return reviseStep(s);
    default:        return setupStep(s);
  }
}

/* ---------- STEP: SETUP ---------- */
function setupStep(s){
  const isExp = isExpansionSession(s);
  const mode = expansionMode(s);
  return `
  <div class="panel">
    <h3>Session setup</h3>
    <p class="muted small">Decide what you are writing before you plan the language.</p>
    <label class="field">
      <span>Topic / prompt</span>
      <textarea rows="2" data-sfield="topic" placeholder="e.g. A decision that changed my routine">${esc(s.topic)}</textarea>
      <span class="muted small" style="font-weight:400">${isExp ? 'Filled automatically from the <code>topic</code> field of your exercise file.' : 'Tip: this can also come from the <code>topic</code> field in your uploaded JSON.'}</span>
    </label>
    <label class="field">
      <span>Title (optional)</span>
      <input type="text" data-sfield="title" value="${esc(s.title)}" placeholder="Give this session a name" />
    </label>
    <div class="grid2">
      <label class="field">
        <span>Text type</span>
        <select data-sfield="textType">${TEXT_TYPES.map(t => `<option ${s.textType===t?'selected':''}>${t}</option>`).join('')}</select>
      </label>
      <label class="field">
        <span>Target word count <span class="muted">(${isExp ? 'final sentence minimum' : 'whole text'})</span></span>
        <input type="number" min="0" step="10" data-sfield="targetWords" value="${s.targetWords}" />
      </label>
    </div>
    <button class="btn primary" data-act="step" data-step="targets">Next: target language →</button>
  </div>

  ${isExp ? `
    <div class="panel exhint">
      <div class="eyebrow">Sentence Expansion mode</div>
      <h3 style="margin-top:2px">Build one sentence through eight guided stages</h3>
      <p class="small" style="margin-bottom:8px">
        ${mode === EXPANSION_MODE_FULL
          ? 'Upload a single JSON file containing the <strong>topic</strong>, <strong>openings</strong>, and every target-language item.'
          : 'Upload one JSON for the <strong>topic</strong> first, then a separate JSON for each stage you want (Chunks, Collocations, Phrasal verbs, Vocabulary, Grammar, Time expressions). Only the topic file is required up front.'}
      </p>
      <ol class="small" style="margin:0 0 0 18px; padding:0; color:var(--muted)">
        ${EXPANSION_STAGES.map(st => `<li>${esc(st.label)} — ${esc(st.hint)}</li>`).join('')}
      </ol>
    </div>` : ''}`;
}

/* ---------- STEP: TARGETS ---------- */
function targetsStep(s){
  const byKind = {};
  s.targets.forEach(t => (byKind[t.kind] = byKind[t.kind] || []).push(t));
  const reqCount = s.targets.filter(t => t.requirement === 'required').length;
  const isExp = isExpansionSession(s);
  const mode = expansionMode(s);
  const nextStep = isExp ? 'expand' : 'path';
  const nextLabel = isExp ? 'Next: start expansion' : 'Next: build sentence path';
  const hasTopic = !!(s.topic || '').trim();
  const openingsCount = (s.openings || []).length;

  return `
  <div class="panel">
    <h3>Add target language</h3>
    ${isExp ? `
      <p class="muted small">Choose how to bring your exercise files in. You can switch at any time.</p>
      <div class="row" style="margin-bottom:14px; gap:6px">
        <button class="chip ${mode===EXPANSION_MODE_FULL?'on':''}" data-act="set-expansion-mode" data-mode="${EXPANSION_MODE_FULL}">Full terms — one JSON</button>
        <button class="chip ${mode===EXPANSION_MODE_SELECTED?'on':''}" data-act="set-expansion-mode" data-mode="${EXPANSION_MODE_SELECTED}">Selected terms — one JSON per stage</button>
      </div>
    ` : `<p class="muted small">Add the chunks, collocations, phrasal verbs, vocabulary and grammar points you want to force yourself to use.</p>`}

    ${!isExp ? `
      <div class="row" style="margin-bottom:12px">
        <button class="btn primary" data-act="import-targets">📥 Upload target language (JSON / CSV)</button>
      </div>
    ` : mode === EXPANSION_MODE_FULL ? `
      <p class="muted small">Upload one JSON file containing <code>topic</code>, <code>openings</code>, and an <code>items</code> array. The topic and openings are required.</p>
      <div class="row" style="margin-bottom:4px">
        <button class="btn primary" data-act="import-targets">📥 Upload full exercise (JSON)</button>
      </div>
    ` : `
      <p class="muted small">Upload the topic file first — it is required. Then upload a separate JSON for each stage you want. You can do this in any order, at any time.</p>

      <div class="filerow topicrow">
        <div class="fl">
          <span class="status ${hasTopic?'ok':'missing'}">${hasTopic?'✓ Set':'Required'}</span>
          <div>
            <div class="fname">Topic file</div>
            <div class="fcount">${hasTopic ? esc(s.topic) + (openingsCount ? ` · ${openingsCount} opening${openingsCount===1?'':'s'}` : '') : 'No topic set yet.'}</div>
          </div>
        </div>
        <button class="btn ${hasTopic?'':'primary'}" data-act="import-topic">${hasTopic ? '↻ Replace topic' : '📥 Upload topic JSON'}</button>
      </div>

      <div class="eyebrow" style="margin:6px 0 6px 2px">Stage files <span class="muted" style="font-weight:400;text-transform:none;letter-spacing:0">(optional — upload one per stage)</span></div>
      ${KIND_ORDER.map(k => {
        const cnt = (byKind[k] || []).length;
        return `<div class="filerow ${cnt?'ok':''}">
          <div class="fl">
            <span class="status ${cnt?'ok':'missing'}">${cnt?'✓ Loaded':'Empty'}</span>
            <span class="kdot k-${k}"></span>
            <div>
              <div class="fname">${kindName(k)}</div>
              <div class="fcount">${cnt} item${cnt===1?'':'s'}</div>
            </div>
          </div>
          <button class="btn sm" data-act="import-kind" data-kind="${k}">${cnt ? '↻ Add more' : '📥 Upload'}</button>
        </div>`;
      }).join('')}
    `}
  </div>

  <div class="panel">
    <h3>Add item manually</h3>
    <div class="grid2">
      <label class="field"><span>Type</span>
        <select id="ntKind">${Object.entries(KINDS).map(([k,v]) => `<option value="${k}">${v}</option>`).join('')}</select>
      </label>
      <label class="field"><span>Requirement</span>
        <select id="ntReq">
          <option value="required">Required — must appear</option>
          <option value="chooseOne">Choose one — pick from a group</option>
          <option value="optional" selected>Optional — nice to have</option>
        </select>
      </label>
    </div>
    <label class="field"><span>Item</span>
      <input type="text" id="ntText" placeholder="e.g. take into account / as far as I'm concerned / used to + verb" />
    </label>
    <label class="field"><span>Group name <span class="muted">(only for “choose one”)</span></span>
      <input type="text" id="ntGroup" placeholder="e.g. Linking words" />
    </label>
    <button class="btn primary" data-act="add-target">+ Add target</button>
  </div>

  <div class="panel">
    <h3>Library</h3>
    <p class="muted small">Save the targets below to your library for reuse, or pull in items you've saved before.</p>
    <div class="row">
      <button class="btn" data-act="save-targets-to-library" ${s.targets.length ? '' : 'disabled'}>💾 Save all to library</button>
      <button class="btn" data-act="open-library-picker">📚 Load from library</button>
    </div>
  </div>

  <div class="panel">
    <div class="row between">
      <h3 style="margin:0">Your target language</h3>
      <span class="muted small">${s.targets.length} item${s.targets.length===1?'':'s'} · ${reqCount} required</span>
    </div>
    ${s.targets.length ? KIND_ORDER.filter(k => byKind[k] && byKind[k].length).map(kind => `
      <div style="margin-top:14px">
        <div class="eyebrow" style="display:flex;align-items:center;gap:6px"><span class="kdot k-${kind}"></span>${kindName(kind)}</div>
        ${byKind[kind].map(t => `
          <div class="trow">
            <span class="kdot k-${kind}"></span>
            <span class="ttext">${esc(t.text)}</span>
            ${t.requirement === 'chooseOne' && t.group ? `<span class="badge chooseOne">${esc(t.group)}</span>` : `<span class="badge ${t.requirement}">${REQS[t.requirement]}</span>`}
            <select data-target-id="${t.id}" data-tfield="requirement">
              ${Object.entries(REQS).map(([k,v]) => `<option value="${k}" ${t.requirement===k?'selected':''}>${v}</option>`).join('')}
            </select>
            <button class="btn ghost sm" data-act="save-one-to-library" data-id="${t.id}" title="Save this item to library">📚</button>
            <button class="btn ghost sm" data-act="del-target" data-id="${t.id}">✕</button>
          </div>`).join('')}
      </div>`).join('') : `<p class="muted small" style="margin-top:10px">Nothing added yet.</p>`}
  </div>

  <div class="panel">
    <h3>Import &amp; export</h3>
    <p class="muted small">Back up and restore everything — all sessions and all library items — as one file.</p>
    <div class="row">
      <button class="btn" data-act="export-targets-csv">📤 Export this session's targets (CSV)</button>
      <button class="btn primary" data-act="export-all-json">📤 Export all data</button>
      <button class="btn" data-act="import-all-data">📥 Import backup</button>
    </div>
    ${isExp ? `
    <details style="margin-top:12px">
      <summary class="muted small">Exercise file formats</summary>
      <div class="small" style="margin-top:10px">
        <div class="eyebrow">Full terms (one JSON)</div>
        <pre style="background:var(--faint);padding:10px;border-radius:8px;overflow:auto;font-size:12px;margin:4px 0 10px;border:1px solid var(--line)">{
  "topic": "Building better study habits",
  "openings": [
    "I've been studying English...",
    "Lately I've been trying to..."
  ],
  "items": [
    {"text": "at the end of the day", "kind": "chunk", "requirement": "required"},
    {"text": "keep up with", "kind": "phrasalVerb", "requirement": "required"},
    {"text": "these days", "kind": "timeExpression", "requirement": "optional"}
  ]
}</pre>
        <div class="eyebrow">Topic file (selected terms mode)</div>
        <pre style="background:var(--faint);padding:10px;border-radius:8px;overflow:auto;font-size:12px;margin:4px 0 10px;border:1px solid var(--line)">{
  "topic": "Building better study habits",
  "openings": [
    "I've been studying English...",
    "Lately I've been trying to..."
  ]
}</pre>
        <p class="muted" style="margin-top:0">Only <strong>topic</strong> is required in the topic file; <strong>openings</strong> are optional. If included, they become clickable starting points on the Basic stage.</p>
        <div class="eyebrow">Stage file (one per kind)</div>
        <pre style="background:var(--faint);padding:10px;border-radius:8px;overflow:auto;font-size:12px;margin:4px 0 10px;border:1px solid var(--line)">[
  {"text": "keep up with", "requirement": "required"},
  {"text": "stick to", "requirement": "chooseOne", "group": "commitment verbs"},
  {"text": "get through", "requirement": "chooseOne", "group": "commitment verbs"}
]</pre>
        <p class="muted" style="margin-top:0">A plain array (or an object with <code>items</code> / <code>targets</code> / <code>library</code>) works. The <code>kind</code> field is optional — each file's kind is set by which button you clicked (Chunks.json → chunk, Collocations.json → collocation, etc.).</p>
        <p class="muted">The <strong>Export all data</strong> file is a full backup (sessions + library) and can be restored with <strong>Import backup</strong>.</p>
      </div>
    </details>` : `
    <details style="margin-top:12px">
      <summary class="muted small">File format examples</summary>
      <div class="small" style="margin-top:10px">
        <div class="eyebrow">Terms — JSON</div>
        <pre style="background:var(--faint);padding:10px;border-radius:8px;overflow:auto;font-size:12px;margin:4px 0 10px;border:1px solid var(--line)">[
  {"text": "at the end of the day", "kind": "chunk", "requirement": "required"},
  {"text": "make a decision", "kind": "collocation", "requirement": "chooseOne", "group": "decisions"}
]</pre>
      </div>
    </details>`}
  </div>

  <button class="btn primary" data-act="step" data-step="${nextStep}">${nextLabel} →</button>`;
}

function pathStep(s){
  return `
  <div class="panel">
    <h3>Sentence path</h3>
    <p class="muted small">Each node is one sentence you will write. Give it an instruction, assign target language, and optionally add branches so you can choose where the text goes next.</p>
    <button class="btn primary" data-act="add-node">+ Add sentence node</button>
  </div>
  ${s.nodes.length ? s.nodes.map((n, i) => nodeCard(s, n, i)).join('') : `<div class="empty">No nodes yet. Add your first sentence node above — or skip this and write freely.</div>`}
  ${s.nodes.length ? `<button class="btn primary" data-act="step" data-step="write">Start writing →</button>` : ''}`;
}
function nodeCard(s, n, i){
  const byKind = {};
  s.targets.forEach(t => (byKind[t.kind] = byKind[t.kind] || []).push(t));
  return `
  <div class="nodecard">
    <div class="nodehead">
      <span class="nodeidx">Step ${i + 1}</span>
      <button class="btn ghost sm" data-act="del-node" data-id="${n.id}">Delete</button>
    </div>
    <label class="field">
      <span>Instruction</span>
      <textarea rows="2" data-node-id="${n.id}" data-nfield="instruction" placeholder="e.g. Open with a hook about the topic.">${esc(n.instruction)}</textarea>
    </label>
    <div class="field" style="margin-bottom:12px">
      <span style="display:block;font-size:13px;font-weight:600;margin-bottom:8px">Assign target language</span>
      ${s.targets.length ? `
        <div style="display:flex; flex-direction:column; gap:12px;">
          ${KIND_ORDER.filter(k => byKind[k] && byKind[k].length).map(kind => `
            <div>
              <div class="eyebrow" style="display:flex; align-items:center; gap:6px; margin-bottom:6px; font-size:11px;"><span class="kdot k-${kind}"></span>${kindName(kind)}</div>
              <div class="row">${byKind[kind].map(t => `<button class="chip ${n.targetIds.includes(t.id)?'on':''}" data-act="toggle-node-target" data-id="${n.id}" data-tid="${t.id}">${esc(t.text)}</button>`).join('')}</div>
            </div>`).join('')}
        </div>` : `<span class="muted small">Add target language first.</span>`}
    </div>
    <div class="field" style="margin-bottom:0">
      <span style="display:block;font-size:13px;font-weight:600;margin-bottom:5px">Branches <span class="muted">(optional — if empty, the path continues to the next node)</span></span>
      ${n.branches.map(b => `
        <div class="branchrow">
          <input type="text" value="${esc(b.label)}" data-branch-id="${b.id}" data-bfield="label" placeholder="Branch label e.g. Agree" />
          <select data-branch-id="${b.id}" data-bfield="targetNodeId">
            <option value="">— choose node —</option>
            ${s.nodes.filter(x => x.id !== n.id).map(x => `<option value="${x.id}" ${b.targetNodeId===x.id?'selected':''}>${esc(nodeLabel(s, x.id))}</option>`).join('')}
          </select>
          <button class="btn ghost sm" data-act="del-branch" data-nid="${n.id}" data-id="${b.id}">✕</button>
        </div>`).join('')}
      <button class="btn sm" data-act="add-branch" data-id="${n.id}" style="margin-top:6px">+ Add branch</button>
    </div>
  </div>`;
}

function sidebarTargetsHTML(s, committed, auto, manual){
  if(!s.targets.length) return '<p class="muted small">No target language added.</p>';
  const groups = {};
  s.targets.forEach(t => (groups[t.kind] = groups[t.kind] || []).push(t));
  return KIND_ORDER.filter(k => groups[k] && groups[k].length).map(k => `
    <div class="tgroup">
      <div class="tgrouphead"><span class="kdot k-${k}"></span>${KINDS[k]}</div>
      ${groups[k].map(t => {
        const isC = committed.has(t.id);
        const isL = !isC && (auto.has(t.id) || manual.has(t.id));
        return `<button class="tchip k-${t.kind} ${isC?'committed':''} ${isL?'live':''}" data-act="toggle-draft-target" data-tid="${t.id}">
          <span class="dot k-${t.kind}"></span>
          <span class="ttext">${esc(t.text)}</span>
          ${t.requirement === 'required' ? '<span class="req">req</span>' : ''}
        </button>`;
      }).join('')}
    </div>`).join('');
}

function writeStep(s){
  ensureCursor(s);
  const node = s.nodes.find(n => n.id === s.currentNodeId) || null;
  const committed = committedUsed(s);
  const auto = autoMatch(s.draft || '', s.targets);
  const manual = new Set(s.draftManual || []);
  const awaiting = s.awaitingChoice && node && node.branches.length;
  let instruction;
  if(node) instruction = node.instruction || 'Write the next sentence.';
  else if(s.nodes.length) instruction = 'Free writing — the path is complete. Keep going or finish.';
  else instruction = 'Free writing — write any sentence that fits your topic.';
  const nodeTargets = node ? s.targets.filter(t => node.targetIds.includes(t.id)) : [];
  const hasAnyProgress = s.sentences.length > 0 || (s.draft || '').trim().length > 0 || (s.draftManual || []).length > 0;
  const hasDraft = (s.draft || '').trim().length > 0 || (s.draftManual || []).length > 0;

  return `
  <div class="writewrap">
    <div class="writeMain">
      <div class="panel instr">
        <div class="eyebrow">Sentence ${s.sentences.length + 1}${node ? ' · step ' + (s.nodes.indexOf(node) + 1) : ' · free'}</div>
        <h3>${esc(instruction)}</h3>
        ${nodeTargets.length ? `<div style="margin-top:8px">${nodeTargets.map(t => `<span class="minichip k-${t.kind}">${esc(t.text)}</span>`).join('')}</div>` : ''}
      </div>
      ${awaiting ? `
        <div class="panel choice">
          <h4>Where next?</h4>
          <p class="muted small">Sentence added. Choose the branch your text takes now.</p>
          <div class="row">${node.branches.map(b => `<button class="btn branchbtn" data-act="choose-branch" data-id="${b.id}">${esc(b.label || 'Continue')} <span class="muted small">→ ${esc(nodeLabel(s, b.targetNodeId))}</span></button>`).join('')}</div>
          <div class="resetrow"><span class="muted small">Added the wrong sentence?</span><button class="btn danger sm" data-act="undo-last-sentence">↶ Undo last sentence</button></div>
        </div>` : `
        <div class="panel">
          <textarea class="editor" data-draft rows="4" placeholder="Write one sentence…">${esc(s.draft || '')}</textarea>
          <div class="row between" style="margin-top:10px">
            <span class="muted small">${wordsIn(s.draft || '')} word${wordsIn(s.draft||'')===1?'':'s'} in this sentence</span>
            <div class="row">
              <button class="btn ${hasDraft ? '' : 'ghost'}" data-act="reset-draft" ${hasDraft ? '' : 'disabled title="Nothing to reset"'}>↺ Reset draft</button>
              <button class="btn" data-act="finish">Finish &amp; review</button>
              <button class="btn primary" data-act="add-sentence">Add sentence →</button>
            </div>
          </div>
          ${hasAnyProgress ? `<div class="resetrow"><span class="muted small">Start this writing session over from the first node.</span><button class="btn danger sm" data-act="reset-writing">↺ Reset all writing</button></div>` : ''}
        </div>`}
      ${transcriptHTML(s)}
    </div>
    <aside class="sidebar">
      <div class="panel">
        <h4>Target language</h4>
        <p class="muted small">Matched items light up as you type. Click any item to mark it used in this sentence (grammar points aren’t auto-detected).</p>
        ${sidebarTargetsHTML(s, committed, auto, manual)}
        <div class="legend"><span class="lg committed"></span> used <span class="lg live"></span> in this sentence</div>
      </div>
    </aside>
  </div>`;
}
function transcriptHTML(s){
  if(!s.sentences.length) return '';
  return `<div class="panel">
    <h4>Your text so far</h4>
    ${s.sentences.map((x, i) => {
      const node = s.nodes.find(n => n.id === x.nodeId);
      const usedTargets = s.targets.filter(t => (x.usedTargetIds||[]).includes(t.id));
      return `<div class="sent"><div class="stext">${esc(x.text)}</div><div class="smeta">#${i + 1}${node ? ' · ' + esc(node.instruction || 'step') : ''}${usedTargets.length ? ' · ' + usedTargets.map(t => esc(t.text)).join(', ') : ''}</div></div>`;
    }).join('')}
  </div>`;
}

/* ---------- STEP: EXPAND ---------- */
function expandStep(s){
  const ex = ensureExpansion(s);
  const idx = Math.max(0, Math.min(EXPANSION_STAGES.length - 1, ex.currentStage));
  const stage = EXPANSION_STAGES[idx];
  const curText = ex.stages[stage.key] || '';
  const wc = wordsIn(curText);
  const minWords = stage.minWords || 0;
  const isFinal = stage.key === 'final';
  const isLast = idx === EXPANSION_STAGES.length - 1;
  const picked = new Set(ex.picked[stage.key] || []);
  const stageTargets = stage.kind ? s.targets.filter(t => t.kind === stage.kind) : [];
  const prevKey = idx > 0 ? EXPANSION_STAGES[idx-1].key : null;
  const prevText = prevKey ? (ex.stages[prevKey] || '') : '';
  const missing = Array.from(picked).filter(id => {
    const t = s.targets.find(x => x.id === id);
    return t ? !textIncludes(curText, t.text) : false;
  });

  const stageList = EXPANSION_STAGES.map((st, i) => {
    const filled = !!(ex.stages[st.key] || '').trim();
    const active = i === idx;
    return `<button class="exstage ${active?'active':''} ${filled && !active?'done':''}" data-act="expand-jump" data-idx="${i}">
      <span class="exnum">${i+1}</span><span class="exlabel">${esc(st.label)}</span>
    </button>`;
  }).join('');

  const growthRows = EXPANSION_STAGES.map((st, i) => {
    const txt = (ex.stages[st.key] || '').trim();
    if(!txt && i !== idx) return '';
    const w = wordsIn(txt);
    return `<div class="exgrowrow ${st.key==='final'?'final':''} ${i===idx?'active':''}">
      <span class="exglabel">${esc(st.label)}</span>
      <span class="exgtext">${esc(txt || '—')} <span class="muted small">· ${w}w</span></span>
    </div>`;
  }).join('');

  const counterHtml = `${wc} word${wc===1?'':'s'}${minWords?` · minimum ${minWords}`:''}${missing.length?` · <span style="color:var(--amber)">${missing.length} picked item${missing.length===1?'':'s'} not yet in the sentence</span>`:''}`;
  const showExtras = (stage.key === 'detail' || stage.key === 'connection');
  const extras = showExtras ? s.targets.filter(t => ['vocabulary','grammar','chunk','collocation','phrasalVerb','timeExpression'].includes(t.kind)) : [];
  const sessionTopic = (s.topic || '').trim();
  const openings = Array.isArray(s.openings) ? s.openings : [];
  const missingKind = stage.kind && stageTargets.length === 0;

  return `
  <div class="writewrap">
    <div>
      <div class="panel instr exhint">
        <div class="row between" style="align-items:flex-start; gap:12px">
          <div>
            <div class="eyebrow">Stage ${idx+1} of ${EXPANSION_STAGES.length}</div>
            <h3>${esc(stage.label)}</h3>
            <p class="muted small" style="margin:0">${esc(stage.hint)}</p>
          </div>
          <button class="btn ghost sm" data-act="expand-restart">↺ Start over</button>
        </div>
        ${stage.example ? `<div class="muted small" style="margin-top:8px">Example: <em>${esc(stage.example)}</em></div>` : ''}
      </div>

      ${idx === 0 && sessionTopic ? `
        <div class="topiccard"><div class="eyebrow">Topic</div><div class="topictext">${esc(sessionTopic)}</div></div>` : ''}

      ${idx === 0 && openings.length ? `
        <div class="openings">
          <div class="eyebrow">Suggested openings</div>
          <p class="muted small" style="margin:0 0 4px">Click one to use it as your starting point. You can then edit it freely.</p>
          <div class="openinglist">
            ${openings.map((op, i) => `
              <button class="openingrow" data-act="expand-use-opening" data-idx="${i}">
                <span class="opnum">${i+1}</span>
                <span class="optext">${esc(op)}</span>
                <span class="opuse">Use →</span>
              </button>`).join('')}
          </div>
        </div>` : ''}

      ${stage.kind ? `
        <div class="panel">
          <div class="row between" style="margin-bottom:6px">
            <h4 style="margin:0">Pick your ${esc(kindName(stage.kind).toLowerCase())}${stageTargets.length>1?'s':''}</h4>
            ${stageTargets.length ? `<span class="muted small">${picked.size} picked</span>` : ''}
          </div>
          ${stageTargets.length ? `
            <p class="muted small">Click to mark the one(s) you’re going to use in this stage — they stay highlighted while you rewrite the sentence below.</p>
            <div class="row">${stageTargets.map(t => `<button class="chip ${picked.has(t.id)?'on':''}" data-act="expand-pick" data-id="${t.id}">${esc(t.text)}</button>`).join('')}</div>
          ` : `
            <p class="muted small" style="margin:0 0 8px">No ${esc(kindName(stage.kind).toLowerCase())} items loaded yet.</p>
            <button class="btn sm" data-act="import-kind" data-kind="${stage.kind}">📥 Upload ${kindName(stage.kind)} JSON</button>
          `}
        </div>` : ''}

      ${showExtras && extras.length ? `
        <div class="panel">
          <h4 style="margin:0 0 6px">Optional target language</h4>
          <p class="muted small">You can weave any of these in to make the sentence richer.</p>
          <div class="row">${extras.map(t => `<button class="chip ${picked.has(t.id)?'on':''}" data-act="expand-pick" data-id="${t.id}"><span class="kdot k-${t.kind}" style="margin-right:2px"></span>${esc(t.text)}</button>`).join('')}</div>
        </div>` : ''}

      <div class="panel">
        <div class="row between" style="margin-bottom:8px">
          <h4 style="margin:0">${idx === 0 ? 'Write your basic sentence' : (isFinal ? 'Your final version' : 'Expand your sentence')}</h4>
          ${idx > 0 && prevText ? `<span class="muted small">from: “${esc(prevText.length > 60 ? prevText.slice(0, 60) + '…' : prevText)}”</span>` : ''}
        </div>
        ${idx > 0 && prevText ? `<div class="exprev">Previous stage: <em>${esc(prevText)}</em></div>` : ''}
        <textarea class="editor" rows="${isFinal ? 4 : 3}" data-expand-field="${stage.key}" placeholder="${idx === 0 ? 'Write one simple sentence — or click an opening above…' : (isFinal ? 'Polish into a natural B2–C1 sentence of 20+ words…' : 'Edit and expand the sentence…')}">${esc(curText)}</textarea>
        <div class="row between" style="margin-top:10px">
          <span class="muted small" id="expandCounter">${counterHtml}</span>
          <div class="row">
            ${idx > 0 ? `<button class="btn" data-act="expand-prev">← Back</button>` : ''}
            ${!isLast ? `<button class="btn primary" data-act="expand-next" ${!curText.trim() ? 'disabled' : ''}>Save &amp; continue →</button>` : ''}
            ${isLast ? `<button class="btn primary" data-act="expand-finish" ${wc < minWords ? 'disabled title="Needs at least '+minWords+' words"' : ''}>✓ Finish expansion</button>` : ''}
          </div>
        </div>
      </div>

      ${isFinal && s.sentences.some(x => x.fromExpansion) ? `
        <div class="panel">
          <h4 style="margin:0 0 6px">Currently saved final version</h4>
          <p class="quote rev">${esc(s.sentences.find(x => x.fromExpansion).text)}</p>
        </div>` : ''}
    </div>

    <aside class="sidebar">
      <div class="panel"><h4>Stages</h4><div class="exstages">${stageList}</div></div>
      <div class="panel"><h4>Growth</h4><div class="exgrow">${growthRows || '<p class="muted small">Nothing written yet.</p>'}</div></div>
      ${s.targets.length ? `
        <div class="panel">
          <h4>All target language</h4>
          <div class="row">${s.targets.map(t => `<span class="minichip k-${t.kind}">${esc(t.text)}</span>`).join('')}</div>
        </div>` : ''}
    </aside>
  </div>`;
}

/* ---------- REVIEW ---------- */
function reviewStep(s){
  if(isExpansionSession(s)) return expansionReviewStep(s);
  const used = committedUsed(s);
  const total = countWords(s);
  const target = s.targetWords || 0;
  const pct = target ? Math.min(100, Math.round(total / target * 100)) : 0;
  const required = s.targets.filter(t => t.requirement === 'required');
  const missingRequired = required.filter(t => !used.has(t.id));
  const groups = {};
  s.targets.filter(t => t.requirement === 'chooseOne').forEach(t => {
    const g = (t.group || 'Group').trim() || 'Group';
    (groups[g] = groups[g] || []).push(t);
  });
  const unmetGroups = Object.entries(groups).filter(([, items]) => !items.some(t => used.has(t.id)));
  const analysis = analyzeSession(s);

  return `
  <div class="statgrid">
    <div class="stat"><div class="lbl">Words</div><div class="num">${total}</div><div class="bar"><i style="width:${pct}%"></i></div><div class="muted small" style="margin-top:5px">target ${target || '—'}</div></div>
    <div class="stat"><div class="lbl">Sentences</div><div class="num">${s.sentences.length}</div><div class="muted small" style="margin-top:5px">avg ${s.sentences.length ? Math.round(total / s.sentences.length) : 0} words</div></div>
    <div class="stat"><div class="lbl">Targets used</div><div class="num">${used.size}<span class="muted" style="font-size:16px">/${s.targets.length}</span></div><div class="bar"><i style="width:${s.targets.length ? Math.round(used.size / s.targets.length * 100) : 0}%"></i></div></div>
    <div class="stat"><div class="lbl">Grammar points</div><div class="num">${s.targets.filter(t => t.kind === 'grammar' && used.has(t.id)).length}<span class="muted" style="font-size:16px">/${s.targets.filter(t => t.kind === 'grammar').length}</span></div><div class="muted small" style="margin-top:5px">used in your text</div></div>
  </div>
  <div class="panel">
    <h3>Missing requirements</h3>
    ${(missingRequired.length || unmetGroups.length) ? `
      ${missingRequired.map(t => `<div class="fb error"><span class="lvl">Required</span>“${esc(t.text)}” (${kindName(t.kind)}) was never used.</div>`).join('')}
      ${unmetGroups.map(([g, items]) => `<div class="fb error"><span class="lvl">Choose one</span>Group “${esc(g)}” — none of these were used: ${items.map(t => esc(t.text)).join(', ')}.</div>`).join('')}
    ` : `<div class="fb tip"><span class="lvl">All clear</span> Every required item and every “choose one” group is covered. 🎉</div>`}
  </div>
  <div class="panel">
    <h3>Target language</h3>
    <div class="grid2">
      <div>
        <div class="eyebrow">Used (${used.size})</div>
        ${s.targets.filter(t => used.has(t.id)).map(t => `<div class="trow"><span class="kdot k-${t.kind}"></span><span class="ttext">${esc(t.text)}</span><span class="badge used">${kindName(t.kind)}</span><button class="btn ghost sm" data-act="mark-used" data-id="${t.id}">unmark</button></div>`).join('') || '<p class="muted small">Nothing used yet.</p>'}
      </div>
      <div>
        <div class="eyebrow">Unused (${s.targets.length - used.size})</div>
        ${s.targets.filter(t => !used.has(t.id)).map(t => `<div class="trow"><span class="kdot k-${t.kind}"></span><span class="ttext">${esc(t.text)}</span><span class="badge ${t.requirement}">${t.requirement === 'chooseOne' ? esc(t.group || 'Choose one') : REQS[t.requirement]}</span><button class="btn sm" data-act="mark-used" data-id="${t.id}">mark used</button></div>`).join('') || '<p class="muted small">Everything was used. Nice.</p>'}
      </div>
    </div>
  </div>
  <div class="panel">
    <h3>Grammar &amp; naturalness feedback</h3>
    ${analysis.sessionFeedback.length ? analysis.sessionFeedback.map(f => `<div class="fb ${f.level}"><span class="lvl">${f.level === 'tip' ? 'Style' : f.level}</span>${esc(f.msg)}</div>`).join('') : '<p class="muted small">No session-level issues spotted.</p>'}
  </div>
  <div class="panel">
    <h3>Sentence-by-sentence check</h3>
    ${s.sentences.length ? s.sentences.map((x, i) => {
      const issues = analysis.perSentence[i];
      if(!issues.length) return `<div class="fb tip" style="background:var(--green-soft);border-color:var(--green-line)"><span class="lvl" style="color:var(--green)">#${i+1} OK</span>${esc(x.text)}</div>`;
      return `<div style="margin-bottom:12px"><div class="quote">#${i + 1} ${esc(x.text)}</div>${issues.map(f => `<div class="fb ${f.level}" style="margin-top:6px"><span class="lvl">${f.level}</span>${esc(f.msg)}</div>`).join('')}</div>`;
    }).join('') : '<p class="muted small">No sentences written yet.</p>'}
  </div>
  <div class="panel">
    <h3>Sentences worth rewriting</h3>
    ${analysis.suggestions.length ? analysis.suggestions.map(sg => `<div class="trow"><span class="ttext">#${sg.index + 1} ${esc(sg.text)}</span><span class="muted small">${esc(sg.reason)}</span><button class="btn sm" data-act="revise-jump" data-id="${sg.sentenceId}">Revise</button></div>`).join('') : '<p class="muted small">Nothing flagged. Your sentences read cleanly.</p>'}
  </div>
  <div class="row between" style="margin-top:14px">
    <button class="btn danger" data-act="reset-writing">↺ Reset all writing</button>
    <button class="btn primary" data-act="step" data-step="revise">Go to revision →</button>
  </div>`;
}

function expansionReviewStep(s){

  const missingRequired = required.filter(t => !used.has(t.id));
  const groups = {};
  s.targets.filter(t => t.requirement === 'chooseOne').forEach(t => {
    const g = (t.group || 'Group').trim() || 'Group';
    (groups[g] = groups[g] || []).push(t);
  });
  const unmetGroups = Object.entries(groups).filter(([, items]) => !items.some(t => used.has(t.id)));

  return `

    <div class="stat"><div class="lbl">Stages completed</div><div class="num">${EXPANSION_STAGES.filter(st => (ex.stages[st.key] || '').trim()).length}<span class="muted" style="font-size:16px">/${EXPANSION_STAGES.length}</span></div><div class="muted small" style="margin-top:5px">${ex.completedAt ? 'finished' : 'in progress'}</div></div>
    <div class="stat"><div class="lbl">Targets used</div><div class="num">${used.size}<span class="muted" style="font-size:16px">/${s.targets.length}</span></div><div class="bar"><i style="width:${s.targets.length ? Math.round(used.size / s.targets.length * 100) : 0}%"></i></div></div>
    <div class="stat"><div class="lbl">Time expressions</div><div class="num">${s.targets.filter(t => t.kind === 'timeExpression' && used.has(t.id)).length}<span class="muted" style="font-size:16px">/${s.targets.filter(t => t.kind === 'timeExpression').length}</span></div><div class="muted small" style="margin-top:5px">used in your sentence</div></div>
  </div>
  <div class="panel">
    <h3>Expansion stages</h3>

      ${EXPANSION_STAGES.map(st => {

        if(!txt) return '';
        return `<div class="exgrowrow ${st.key==='final'?'final':''}"><span class="exglabel">${esc(st.label)}</span><span class="exgtext">${esc(txt)} <span class="muted small">· ${wordsIn(txt)}w</span></span></div>`;

  <div class="panel">
    <h3>Missing requirements</h3>
    ${(missingRequired.length || unmetGroups.length) ? `
      ${missingRequired.map(t => `<div class="fb error"><span class="lvl">Required</span>“${esc(t.text)}” (${kindName(t.kind)}) was never used.</div>`).join('')}
      ${unmetGroups.map(([g, items]) => `<div class="fb error"><span class="lvl">Choose one</span>Group “${esc(g)}” — none of these were used: ${items.map(t => esc(t.text)).join(', ')}.</div>`).join('')}
    ` : `<div class="fb tip"><span class="lvl">All clear</span> Every required item and every “choose one” group is covered. 🎉</div>`}
  </div>
  <div class="panel">
    <h3>Grammar &amp; naturalness feedback</h3>
    ${analysis.sessionFeedback.length ? analysis.sessionFeedback.map(f => `<div class="fb ${f.level}"><span class="lvl">${f.level === 'tip' ? 'Style' : f.level}</span>${esc(f.msg)}</div>`).join('') : '<p class="muted small">No issues spotted.</p>'}
  </div>
  <div class="row between" style="margin-top:14px">
    <button class="btn" data-act="step" data-step="expand">← Back to expansion</button>
