            ${t.requirement === 'chooseOne' && t.group ? `<span class="badge chooseOne">${esc(t.group)}</span>` : `<span class="badge ${t.requirement}">${REQS[t.requirement]}</span>`}
            <select data-target-id="${t.id}" data-tfield="requirement">
              ${Object.entries(REQS).map(([k,v]) => `<option value="${k}" ${t.requirement===k?'selected':''}>${v}</option>`).join('')}
            </select>
            <button class="btn ghost sm" data-act="save-one-to-library" data-id="${t.id}" title="Save this item to library">📚</button>
            <button class="btn ghost sm" data-act="del-target" data-id="${t.id}">✕</button>
          </div>`).join('')}
      </div>`).join('') : `<p class="muted small" style="margin-top:10px">Nothing added yet.</p>`}
  </div>

  <div class="panel">
    <h3>Import &amp; export</h3>
    <p class="muted small">Import individual terms from JSON/CSV, or back up and restore everything — all sessions and all library items — as one file.</p>
    <div class="row">
      <button class="btn" data-act="import-targets">📥 Import terms (JSON / CSV)</button>
      <button class="btn" data-act="export-targets-csv">📤 Export this session's targets (CSV)</button>
      <button class="btn primary" data-act="export-all-json">📤 Export all data</button>
      <button class="btn" data-act="import-all-data">📥 Import backup</button>
    </div>
    <details style="margin-top:12px">
      <summary class="muted small">File format examples</summary>
      <div class="small" style="margin-top:10px">
        <div class="eyebrow">Terms — JSON</div>
        <pre style="background:var(--faint);padding:10px;border-radius:8px;overflow:auto;font-size:12px;margin:4px 0 10px;border:1px solid var(--line)">[
  {"text": "at the end of the day", "kind": "chunk", "requirement": "required"},
  {"text": "make a decision", "kind": "collocation", "requirement": "chooseOne", "group": "decisions"},
  {"text": "used to + verb", "kind": "grammar", "requirement": "optional"}
]</pre>
        <div class="eyebrow">Terms — CSV</div>
        <pre style="background:var(--faint);padding:10px;border-radius:8px;overflow:auto;font-size:12px;margin:4px 0 10px;border:1px solid var(--line)">text,kind,requirement,group,tags
at the end of the day,chunk,required,,
make a decision,collocation,chooseOne,decisions,
used to + verb,grammar,optional,,</pre>
        <p class="muted">Valid kinds: <code>chunk</code>, <code>collocation</code>, <code>phrasalVerb</code>, <code>vocabulary</code>, <code>grammar</code>. Valid requirements: <code>required</code>, <code>chooseOne</code>, <code>optional</code>.</p>
        <p class="muted">The <strong>Export all data</strong> file is a full backup (sessions + library) and can be restored with <strong>Import backup</strong>.</p>
      </div>
    </details>
  </div>

  <button class="btn primary" data-act="step" data-step="path">Next: build sentence path →</button>`;
}

/* ---------- STEP: PATH ---------- */
function pathStep(s){
  return `
  <div class="panel">
    <h3>Sentence path</h3>
    <p class="muted small">Each node is one sentence you will write. Give it an instruction, assign target language, and optionally add branches so you can choose where the text goes next.</p>
    <button class="btn primary" data-act="add-node">+ Add sentence node</button>
  </div>
  ${s.nodes.length ? s.nodes.map((n, i) => nodeCard(s, n, i)).join('') :
    `<div class="empty">No nodes yet. Add your first sentence node above — or skip this and write freely.</div>`}
  ${s.nodes.length ? `<button class="btn primary" data-act="step" data-step="write">Start writing →</button>` : ''}`;
}

function nodeCard(s, n, i){
  const byKind = {};
  s.targets.forEach(t => (byKind[t.kind] = byKind[t.kind] || []).push(t));

  return `
  <div class="nodecard">
    <div class="nodehead">
      <span class="nodeidx">Step ${i + 1}</span>
      <button class="btn ghost sm" data-act="del-node" data-id="${n.id}">Delete</button>
    </div>
    <label class="field">
      <span>Instruction</span>
      <textarea rows="2" data-node-id="${n.id}" data-nfield="instruction" placeholder="e.g. Open with a hook about the topic.">${esc(n.instruction)}</textarea>
    </label>
    <div class="field" style="margin-bottom:12px">
      <span style="display:block;font-size:13px;font-weight:600;margin-bottom:8px">Assign target language</span>
      ${s.targets.length ? `
        <div style="display:flex; flex-direction:column; gap:12px;">
          ${KIND_ORDER.filter(k => byKind[k] && byKind[k].length).map(kind => `
            <div>
              <div class="eyebrow" style="display:flex; align-items:center; gap:6px; margin-bottom:6px; font-size:11px;">
                <span class="kdot k-${kind}"></span>${kindName(kind)}
              </div>
              <div class="row">
                ${byKind[kind].map(t => `<button class="chip ${n.targetIds.includes(t.id)?'on':''}" data-act="toggle-node-target" data-id="${n.id}" data-tid="${t.id}">${esc(t.text)}</button>`).join('')}
              </div>
            </div>
          `).join('')}
        </div>
      ` : `<span class="muted small">Add target language first.</span>`}
    </div>
    <div class="field" style="margin-bottom:0">
      <span style="display:block;font-size:13px;font-weight:600;margin-bottom:5px">Branches <span class="muted">(optional — if empty, the path continues to the next node)</span></span>
      ${n.branches.map(b => `
        <div class="branchrow">
          <input type="text" value="${esc(b.label)}" data-branch-id="${b.id}" data-bfield="label" placeholder="Branch label e.g. Agree" />
          <select data-branch-id="${b.id}" data-bfield="targetNodeId">
            <option value="">— choose node —</option>
            ${s.nodes.filter(x => x.id !== n.id).map(x => `<option value="${x.id}" ${b.targetNodeId===x.id?'selected':''}>${esc(nodeLabel(s, x.id))}</option>`).join('')}
          </select>
          <button class="btn ghost sm" data-act="del-branch" data-nid="${n.id}" data-id="${b.id}">✕</button>
        </div>`).join('')}
      <button class="btn sm" data-act="add-branch" data-id="${n.id}" style="margin-top:6px">+ Add branch</button>
    </div>
  </div>`;
}

/* ---------- sidebar grouping ---------- */
function sidebarTargetsHTML(s, committed, auto, manual){
  if(!s.targets.length) return '<p class="muted small">No target language added.</p>';
  const groups = {};
  s.targets.forEach(t => (groups[t.kind] = groups[t.kind] || []).push(t));

  return KIND_ORDER.filter(k => groups[k] && groups[k].length).map(k => `
    <div class="tgroup">
      <div class="tgrouphead"><span class="kdot k-${k}"></span>${KINDS[k]}</div>
      ${groups[k].map(t => {
        const isC = committed.has(t.id);
        const isL = !isC && (auto.has(t.id) || manual.has(t.id));
        return `<button class="tchip k-${t.kind} ${isC?'committed':''} ${isL?'live':''}" data-act="toggle-draft-target" data-tid="${t.id}">
          <span class="dot k-${t.kind}"></span>
          <span class="ttext">${esc(t.text)}</span>
          ${t.requirement === 'required' ? '<span class="req">req</span>' : ''}
        </button>`;
      }).join('')}
    </div>`).join('');
}

/* ---------- STEP: WRITE ---------- */
function writeStep(s){
  ensureCursor(s);
  const node = s.nodes.find(n => n.id === s.currentNodeId) || null;
  const committed = committedUsed(s);
  const auto = autoMatch(s.draft || '', s.targets);
  const manual = new Set(s.draftManual || []);
  const awaiting = s.awaitingChoice && node && node.branches.length;

  let instruction;
  if(node) instruction = node.instruction || 'Write the next sentence.';
  else if(s.nodes.length) instruction = 'Free writing — the path is complete. Keep going or finish.';
  else instruction = 'Free writing — write any sentence that fits your topic.';

  const nodeTargets = node ? s.targets.filter(t => node.targetIds.includes(t.id)) : [];
  const hasAnyProgress = s.sentences.length > 0 || (s.draft || '').trim().length > 0 || (s.draftManual || []).length > 0;
  const hasDraft = (s.draft || '').trim().length > 0 || (s.draftManual || []).length > 0;

  return `
  <div class="writewrap">
    <div class="writeMain">
      <div class="panel instr">
        <div class="eyebrow">Sentence ${s.sentences.length + 1}${node ? ' · step ' + (s.nodes.indexOf(node) + 1) : ' · free'}</div>
        <h3>${esc(instruction)}</h3>
        ${nodeTargets.length ? `<div style="margin-top:8px">${nodeTargets.map(t => `<span class="minichip k-${t.kind}">${esc(t.text)}</span>`).join('')}</div>` : ''}
      </div>

      ${awaiting ? `
        <div class="panel choice">
          <h4>Where next?</h4>
          <p class="muted small">Sentence added. Choose the branch your text takes now.</p>
          <div class="row">
            ${node.branches.map(b => `<button class="btn branchbtn" data-act="choose-branch" data-id="${b.id}">
              ${esc(b.label || 'Continue')} <span class="muted small">→ ${esc(nodeLabel(s, b.targetNodeId))}</span>
            </button>`).join('')}
          </div>
          <div class="resetrow">
            <span class="muted small">Added the wrong sentence?</span>
            <button class="btn danger sm" data-act="undo-last-sentence">↶ Undo last sentence</button>
          </div>
        </div>` : `
        <div class="panel">
          <textarea class="editor" data-draft rows="4" placeholder="Write one sentence…">${esc(s.draft || '')}</textarea>
          <div class="row between" style="margin-top:10px">
            <span class="muted small">${wordsIn(s.draft || '')} word${wordsIn(s.draft||'')===1?'':'s'} in this sentence</span>
            <div class="row">
              <button class="btn ${hasDraft ? '' : 'ghost'}" data-act="reset-draft" ${hasDraft ? '' : 'disabled title="Nothing to reset"'}>↺ Reset draft</button>
              <button class="btn" data-act="finish">Finish &amp; review</button>
              <button class="btn primary" data-act="add-sentence">Add sentence →</button>
            </div>
          </div>
          ${hasAnyProgress ? `
            <div class="resetrow">
              <span class="muted small">Start this writing session over from the first node.</span>
              <button class="btn danger sm" data-act="reset-writing">↺ Reset all writing</button>
            </div>` : ''}
        </div>`}

      ${transcriptHTML(s)}
    </div>

    <aside class="sidebar">
      <div class="panel">
        <h4>Target language</h4>
        <p class="muted small">Matched items light up as you type. Click any item to mark it used in this sentence (grammar points aren’t auto-detected).</p>
        ${sidebarTargetsHTML(s, committed, auto, manual)}
        <div class="legend">
          <span class="lg committed"></span> used
          <span class="lg live"></span> in this sentence
        </div>
      </div>
    </aside>
  </div>`;
}

function transcriptHTML(s){
  if(!s.sentences.length) return '';
  return `<div class="panel">
    <h4>Your text so far</h4>
    ${s.sentences.map((x, i) => {
      const node = s.nodes.find(n => n.id === x.nodeId);
      const usedTargets = s.targets.filter(t => (x.usedTargetIds||[]).includes(t.id));
      return `<div class="sent">
        <div class="stext">${esc(x.text)}</div>
        <div class="smeta">
          #${i + 1}${node ? ' · ' + esc(node.instruction || 'step') : ''}
          ${usedTargets.length ? ' · ' + usedTargets.map(t => esc(t.text)).join(', ') : ''}
        </div>
      </div>`;
    }).join('')}
  </div>`;
}

/* ---------- STEP: REVIEW ---------- */
function reviewStep(s){
  const used = committedUsed(s);
  const total = countWords(s);
  const target = s.targetWords || 0;
  const pct = target ? Math.min(100, Math.round(total / target * 100)) : 0;

  const required = s.targets.filter(t => t.requirement === 'required');
  const missingRequired = required.filter(t => !used.has(t.id));

  const groups = {};
  s.targets.filter(t => t.requirement === 'chooseOne').forEach(t => {
    const g = (t.group || 'Group').trim() || 'Group';
    (groups[g] = groups[g] || []).push(t);
  });
  const unmetGroups = Object.entries(groups).filter(([, items]) => !items.some(t => used.has(t.id)));

  const analysis = analyzeSession(s);

  return `
  <div class="statgrid">
    <div class="stat"><div class="lbl">Words</div><div class="num">${total}</div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="muted small" style="margin-top:5px">target ${target || '—'}</div>
    </div>
    <div class="stat"><div class="lbl">Sentences</div><div class="num">${s.sentences.length}</div>
      <div class="muted small" style="margin-top:5px">avg ${s.sentences.length ? Math.round(total / s.sentences.length) : 0} words</div>
    </div>
    <div class="stat"><div class="lbl">Targets used</div><div class="num">${used.size}<span class="muted" style="font-size:16px">/${s.targets.length}</span></div>
      <div class="bar"><i style="width:${s.targets.length ? Math.round(used.size / s.targets.length * 100) : 0}%"></i></div>
    </div>
    <div class="stat"><div class="lbl">Grammar points</div><div class="num">${s.targets.filter(t => t.kind === 'grammar' && used.has(t.id)).length}<span class="muted" style="font-size:16px">/${s.targets.filter(t => t.kind === 'grammar').length}</span></div>
      <div class="muted small" style="margin-top:5px">used in your text</div>
    </div>
  </div>

  <div class="panel">
    <h3>Missing requirements</h3>
    ${(missingRequired.length || unmetGroups.length) ? `
      ${missingRequired.map(t => `<div class="fb error"><span class="lvl">Required</span>“${esc(t.text)}” (${kindName(t.kind)}) was never used.</div>`).join('')}
      ${unmetGroups.map(([g, items]) => `<div class="fb error"><span class="lvl">Choose one</span>Group “${esc(g)}” — none of these were used: ${items.map(t => esc(t.text)).join(', ')}.</div>`).join('')}
    ` : `<div class="fb tip"><span class="lvl">All clear</span> Every required item and every “choose one” group is covered. 🎉</div>`}
  </div>

  <div class="panel">
    <h3>Target language</h3>
    <div class="grid2">
      <div>
        <div class="eyebrow">Used (${used.size})</div>
        ${s.targets.filter(t => used.has(t.id)).map(t => `
          <div class="trow">
            <span class="kdot k-${t.kind}"></span>
            <span class="ttext">${esc(t.text)}</span>
            <span class="badge used">${kindName(t.kind)}</span>
            <button class="btn ghost sm" data-act="mark-used" data-id="${t.id}">unmark</button>
          </div>`).join('') || '<p class="muted small">Nothing used yet.</p>'}
      </div>
      <div>
        <div class="eyebrow">Unused (${s.targets.length - used.size})</div>
        ${s.targets.filter(t => !used.has(t.id)).map(t => `
          <div class="trow">
            <span class="kdot k-${t.kind}"></span>
            <span class="ttext">${esc(t.text)}</span>
            <span class="badge ${t.requirement}">${t.requirement === 'chooseOne' ? esc(t.group || 'Choose one') : REQS[t.requirement]}</span>
            <button class="btn sm" data-act="mark-used" data-id="${t.id}">mark used</button>
          </div>`).join('') || '<p class="muted small">Everything was used. Nice.</p>'}
      </div>
    </div>
  </div>

  <div class="panel">
    <h3>Grammar &amp; naturalness feedback</h3>
    ${analysis.sessionFeedback.length ? analysis.sessionFeedback.map(f => `
      <div class="fb ${f.level}"><span class="lvl">${f.level === 'tip' ? 'Style' : f.level}</span>${esc(f.msg)}</div>`).join('')
      : '<p class="muted small">No session-level issues spotted.</p>'}
  </div>

  <div class="panel">
    <h3>Sentence-by-sentence check</h3>
    ${s.sentences.length ? s.sentences.map((x, i) => {
      const issues = analysis.perSentence[i];
      if(!issues.length) return `<div class="fb tip" style="background:var(--green-soft);border-color:var(--green-line)">
        <span class="lvl" style="color:var(--green)">#${i+1} OK</span>${esc(x.text)}</div>`;
      return `<div style="margin-bottom:12px">
        <div class="quote">#${i + 1} ${esc(x.text)}</div>
        ${issues.map(f => `<div class="fb ${f.level}" style="margin-top:6px"><span class="lvl">${f.level}</span>${esc(f.msg)}</div>`).join('')}
      </div>`;
    }).join('') : '<p class="muted small">No sentences written yet.</p>'}
  </div>

  <div class="panel">
    <h3>Sentences worth rewriting</h3>
    ${analysis.suggestions.length ? analysis.suggestions.map(sg => `
      <div class="trow">
        <span class="ttext">#${sg.index + 1} ${esc(sg.text)}</span>
        <span class="muted small">${esc(sg.reason)}</span>
        <button class="btn sm" data-act="revise-jump" data-id="${sg.sentenceId}">Revise</button>
      </div>`).join('') : '<p class="muted small">Nothing flagged. Your sentences read cleanly.</p>'}
  </div>

  <div class="row between" style="margin-top:14px">
    <button class="btn danger" data-act="reset-writing">↺ Reset all writing</button>
    <button class="btn primary" data-act="step" data-step="revise">Go to revision →</button>
  </div>`;
}

/* ---------- STEP: REVISE ---------- */
function reviseStep(s){
  if(!s.sentences.length){
    return `<div class="empty">Write some sentences first — then you can revise them here.</div>`;
  }
  return `
  <div class="panel">
    <h3>Revise your sentences</h3>
    <p class="muted small">Rewrite any sentence and keep the original for comparison. Target-language matches update automatically.</p>
  </div>
  ${s.sentences.map((x, i) => {
    const revs = (s.revisions || []).filter(r => r.sentenceId === x.id);
    const changed = x.text !== x.original;
    const draft = (x.id in ui.reviseDraft) ? ui.reviseDraft[x.id] : x.text;
    return `<div class="panel" id="rev-${x.id}">
      <div class="row between" style="margin-bottom:8px">
        <h4 style="margin:0">Sentence ${i + 1}</h4>
        <span class="muted small">${esc(s.nodes.find(n => n.id === x.nodeId)?.instruction || 'free writing')}</span>
      </div>
      ${changed ? `<div class="compare">
        <div><div class="lbl">Original</div><p class="quote">${esc(x.original)}</p></div>
        <div><div class="lbl">Current</div><p class="quote rev">${esc(x.text)}</p></div>
      </div>` : `<p class="quote">${esc(x.text)}</p>`}
      <div style="margin-top:10px">
        <textarea rows="3" data-revise="${x.id}" placeholder="Rewrite this sentence…">${esc(draft)}</textarea>
      </div>
      <div class="row" style="margin-top:9px">
        <button class="btn primary" data-act="save-revision" data-id="${x.id}">Save revision</button>
        ${changed ? `<button class="btn ghost" data-act="revert-revision" data-id="${x.id}">Revert to original</button>` : ''}
      </div>
      ${revs.length ? `<div class="history">
        <div class="lbl">Revision history</div>
        ${revs.map(r => `<div class="histrow">
          <span class="before">${esc(r.before)}</span>
          <span class="arrow">→</span>
          <span class="after">${esc(r.after)}</span>
        </div>`).join('')}
      </div>` : ''}
    </div>`;
  }).join('')}`;
}

/* ---------- PROGRESS ---------- */
function renderProgress(){
  const rows = computeProgress();
  const totalSessions = state.sessions.length;
  const totalSentences = state.sessions.reduce((a, s) => a + s.sentences.length, 0);
  const totalWords = state.sessions.reduce((a, s) => a + countWords(s), 0);
  const maxTimes = rows.reduce((a, r) => Math.max(a, r.times), 1);
  const totalLibrary = state.library.length;

  return `
  ${topbar('progress')}
  <main class="wrap">
    <div class="row between" style="align-items:flex-start">
      <div>
        <h1 style="margin-bottom:4px">Progress</h1>
        <p class="muted" style="margin-bottom:18px">How often you have actually used each piece of target language across all sessions.</p>
      </div>
    </div>

    <div class="statgrid" style="grid-template-columns:repeat(4,1fr)">
      <div class="stat"><div class="lbl">Sessions</div><div class="num">${totalSessions}</div></div>
      <div class="stat"><div class="lbl">Sentences</div><div class="num">${totalSentences}</div></div>
      <div class="stat"><div class="lbl">Words written</div><div class="num">${totalWords}</div></div>
      <div class="stat"><div class="lbl">Library items</div><div class="num">${totalLibrary}</div></div>
    </div>

    <div class="panel">
      <div class="row between" style="align-items:flex-start; flex-wrap:wrap; gap:10px">
        <div>
          <h3 style="margin-bottom:2px">Backup &amp; restore</h3>
          <p class="muted small" style="margin:0">Export a single file containing every session, every library item, and all settings.</p>
        </div>
        <div class="row">
          <button class="btn primary" data-act="export-all-json">📤 Export all data</button>
          <button class="btn" data-act="import-all-data">📥 Import backup</button>
        </div>
      </div>
    </div>

    ${rows.length ? `
      <table>
        <thead><tr><th>Item</th><th>Type</th><th>Sessions</th><th>Times used</th><th></th></tr></thead>
        <tbody>
          ${rows.map(r => `<tr>
            <td>${esc(r.text)}</td>
            <td class="muted">${kindName(r.kind)}</td>
            <td>${r.sessions}</td>
            <td>${r.times}</td>
            <td><span class="usebar"><i style="width:${Math.round(r.times / maxTimes * 100)}%"></i></span></td>
          </tr>`).join('')}
        </tbody>
      </table>` : `<div class="empty">No target language tracked yet. Create a session and add some targets.</div>`}
  </main>`;
}

function computeProgress(){
  const map = new Map();
  for(const s of state.sessions){
    const usedInSession = committedUsed(s);
    const counts = {};
    for(const sen of s.sentences){
      (sen.usedTargetIds || []).forEach(id => counts[id] = (counts[id] || 0) + 1);
    }
    for(const t of s.targets){
      const key = t.kind + '::' + norm(t.text);
      if(!map.has(key)) map.set(key, { text: t.text, kind: t.kind, sessions: 0, times: 0 });
      const rec = map.get(key);
      if(usedInSession.has(t.id)) rec.sessions++;
      rec.times += counts[t.id] || 0;
    }
  }
  return Array.from(map.values()).sort((a, b) => b.times - a.times || b.sessions - a.sessions);
}

/* ============================================================
   FEEDBACK ENGINE
   ============================================================ */
const SPELLING = [
  [/\balot\b/gi, '"alot" is two words: "a lot".'],
  [/\bteh\b/gi, 'Typo: "teh" → "the".'],
  [/\brecieve\w*/gi, 'Spelling: "receive" (i before e except after c).'],
  [/\bseperate\w*/gi, 'Spelling: "separate".'],
  [/\bdefinately\b/gi, 'Spelling: "definitely".'],
  [/\bbecuase\b/gi, 'Spelling: "because".'],
  [/\bthier\b/gi, 'Spelling: "their".'],
  [/\bwich\b/gi, 'Spelling: "which".'],
  [/\boccured\b/gi, 'Spelling: "occurred".'],
  [/\buntill\b/gi, 'Spelling: "until".'],
  [/\bgoverment\b/gi, 'Spelling: "government".'],
  [/\b(could|would|should|must|might)\s+of\b/gi, 'Use "have", not "of": could have / would have.']
];
const APOSTROPHE = {
  dont:"don't", cant:"can't", wont:"won't", isnt:"isn't", didnt:"didn't",
  doesnt:"doesn't", wasnt:"wasn't", werent:"weren't", im:"I'm", ive:"I've",
  youre:"you're", theyre:"they're", thats:"that's", wouldnt:"wouldn't",
  couldnt:"couldn't", shouldnt:"shouldn't", hasnt:"hasn't", havent:"haven't"
};
const FILLERS = ['very','really','just','actually','basically','quite','totally','stuff','things','nice','good','a lot'];

function analyzeSentence(text){
  const issues = [];
  const t = String(text).trim();
  if(!t) return issues;
  const add = (level, msg) => issues.push({ level, msg });

  if(/^[a-z]/.test(t)) add('error', 'This sentence starts with a lowercase letter.');
  if(!/[.!?…"')\]]\s*$/.test(t)) add('error', 'This sentence has no ending punctuation.');

  if(/\s{2,}/.test(t)) add('warn', 'Double space detected.');
  if(/\s+[,.;:!?]/.test(t)) add('warn', 'There is a space before a punctuation mark.');
  if(/[,;:][^\s\d]/.test(t)) add('warn', 'Missing space after a punctuation mark.');

  if(/(^|\s)i(\s|$)/.test(t)) add('error', 'The pronoun "I" is always capitalized.');

  const rep = t.match(/\b(\w+)\s+\1\b/i);
  if(rep) add('error', `Repeated word: “${rep[1]} ${rep[1]}”.`);

  const aVowel = t.match(/\ba\s+([A-Za-z]\w*)/);
  if(aVowel && /^[aeiou]/i.test(aVowel[1]) && !/^(uni|use|usu|eu|one|ubiq)/i.test(aVowel[1])){
    add('warn', `Use “an” before “${aVowel[1]}”.`);
  }
  const anCons = t.match(/\ban\s+([A-Za-z]\w*)/);
  if(anCons && /^[bcdfgjklmnpqrstvwxyz]/i.test(anCons[1]) && !/^(hour|honest|honor|heir|herb)/i.test(anCons[1])){
    add('warn', `Use “a” before “${anCons[1]}”.`);
  }

  for(const [re, msg] of SPELLING){
    if(re.test(t)) add('error', msg);
  }
  const lower = t.toLowerCase();
  for(const bad in APOSTROPHE){
    const re = new RegExp('\\b' + bad + '\\b');
    if(re.test(lower)) add('warn', `Missing apostrophe: “${bad}” → “${APOSTROPHE[bad]}”.`);
  }

  const wc = wordsIn(t);
  if(wc > 34) add('tip', `This sentence is ${wc} words long — consider splitting it into two.`);
  if(wc < 4) add('tip', 'This sentence is very short. Is it doing enough work?');

  const filler = FILLERS.find(f => new RegExp('\\b' + escRe(f) + '\\b', 'i').test(t));
  if(filler) add('tip', `“${filler}” is a weak filler word — a more specific word usually reads better.`);

  if(/\b(is|are|was|were|be|been|being)\s+\w+(ed|en)\b/i.test(t)){
    add('tip', 'Possible passive voice — an active version is usually clearer and more direct.');
  }
  if(/^(there\s+(is|are|was|were))\b/i.test(t)){
    add('tip', 'Starting with “there is/are” is flat. Try leading with the real subject.');
  }
  if(/^(and|but|so)\b/i.test(t)){
    add('tip', 'Starting a sentence with a conjunction is fine in informal writing — just be aware of it.');
  }
  return issues;
}

function analyzeSession(s){
  const perSentence = s.sentences.map(x => analyzeSentence(x.text));

  const sessionFeedback = [];
  if(!s.sentences.length){
    return { perSentence, sessionFeedback, suggestions: [] };
  }

  const total = countWords(s);
  if(s.targetWords && total < s.targetWords * 0.75){
    sessionFeedback.push({ level:'warn', msg:`You are under your target: ${total} of ${s.targetWords} words.` });
  }
  if(s.targetWords && total > s.targetWords * 1.4){
    sessionFeedback.push({ level:'tip', msg:`You went well past your target (${total} vs ${s.targetWords} words). Cutting usually strengthens a text.` });
  }

  const openers = {};
  s.sentences.forEach(x => {
    const w = (x.text.trim().split(/\s+/)[0] || '').toLowerCase().replace(/[^a-z']/g, '');
    if(w) openers[w] = (openers[w] || 0) + 1;
  });
  Object.entries(openers).filter(([, c]) => c >= 3).forEach(([w, c]) => {
    sessionFeedback.push({ level:'tip', msg:`${c} sentences begin with “${w}”. Varying your openers makes the writing flow better.` });
  });

  const allWords = s.sentences.flatMap(x => (x.text.toLowerCase().match(/[a-z']+/g) || []));
  const unique = new Set(allWords);
  if(allWords.length > 40){
    const ttr = unique.size / allWords.length;
    if(ttr < 0.45){
      sessionFeedback.push({ level:'tip', msg:`Your vocabulary repeats a lot (type–token ratio ${ttr.toFixed(2)}). Try swapping in more precise words.` });
    }
  }

  const lens = s.sentences.map(x => wordsIn(x.text));
  if(lens.length >= 4){
    const avg = lens.reduce((a, b) => a + b, 0) / lens.length;
    const variance = lens.reduce((a, b) => a + Math.pow(b - avg, 2), 0) / lens.length;
    if(Math.sqrt(variance) < 2.5){
      sessionFeedback.push({ level:'tip', msg:'All your sentences are a similar length. Mix short punchy sentences with longer ones for rhythm.' });
    }
  }

  const errCount = perSentence.flat().filter(f => f.level === 'error').length;
  if(errCount === 0){
    sessionFeedback.push({ level:'tip', msg:'No basic grammar or punctuation errors detected. Solid control.' });
  } else {
    sessionFeedback.push({ level:'warn', msg:`${errCount} basic error${errCount === 1 ? '' : 's'} detected across your sentences — see the list below.` });
  }

  const suggestions = [];
  perSentence.forEach((issues, i) => {
    const x = s.sentences[i];
    const serious = issues.filter(f => f.level === 'error' || f.level === 'warn');
    if(serious.length){
      suggestions.push({ index:i, sentenceId:x.id, text:x.text, reason: serious[0].msg });
    } else if(issues.length >= 2){
      suggestions.push({ index:i, sentenceId:x.id, text:x.text, reason: issues[0].msg });
    } else if(wordsIn(x.text) > 30){
      suggestions.push({ index:i, sentenceId:x.id, text:x.text, reason:'Very long — could be split or tightened.' });
    }
  });

  return { perSentence, sessionFeedback, suggestions };
}

/* ============================================================
   EVENT HANDLING
   ============================================================ */
document.addEventListener('click', e => {
  const btn = e.target.closest('[data-act]');
  if(!btn) return;
  const act = btn.dataset.act;
  const s = currentSession();

  switch(act){

    case 'nav': {
      ui.view = btn.dataset.view;
      if(ui.view === 'home') ui.sessionId = null;
      if(ui.view !== 'library') { ui.libraryPickForSession = null; ui.librarySelected = []; }
      save(); render();
      break;
    }

    case 'toggle-theme': {
      theme = theme === 'dark' ? 'light' : 'dark';
      localStorage.setItem(THEME_KEY, theme);
      applyTheme();
      btn.textContent = theme === 'dark' ? '☀️' : '🌙';
      break;
    }

    case 'new-session': {
      const ns = newSession();
      state.sessions.push(ns);
      ui.view = 'session'; ui.sessionId = ns.id; ui.step = 'setup';
      save(); render();
      break;
    }

    case 'open-session': {
      ui.view = 'session'; ui.sessionId = btn.dataset.id; ui.step = 'setup';
      save(); render();
      break;
    }

    case 'del-session': {
      const id = btn.dataset.id;
      if(confirm('Delete this session? This cannot be undone.')){
        state.sessions = state.sessions.filter(x => x.id !== id);
        if(ui.sessionId === id){ ui.view = 'home'; ui.sessionId = null; }
        save(); render();
      }
      break;
    }

    case 'step': {
      if(!s) break;
      ui.step = btn.dataset.step;
      if(ui.step === 'write') ensureCursor(s);
      if(ui.step === 'review'){ s.reviewedAt = Date.now(); }
      save(); render();
      window.scrollTo({ top:0, behavior:'smooth' });
      break;
    }

    /* ---- targets ---- */
    case 'add-target': {
      if(!s) break;
      const kind = $('#ntKind').value;
      const text = $('#ntText').value.trim();
      const requirement = $('#ntReq').value;
      const group = $('#ntGroup').value.trim();
      if(!text){ toast('Type the target language first.'); break; }
      s.targets.push({ id: uid(), kind, text, requirement, group: requirement === 'chooseOne' ? (group || 'Group 1') : '' });
      $('#ntText').value = ''; $('#ntGroup').value = '';
      touch(s); render();
      toast('Target added');
      break;
    }

    case 'del-target': {
      if(!s) break;
      const id = btn.dataset.id;
      s.targets = s.targets.filter(t => t.id !== id);
      s.nodes.forEach(n => n.targetIds = n.targetIds.filter(x => x !== id));
      s.sentences.forEach(x => {
        x.usedTargetIds = (x.usedTargetIds || []).filter(x2 => x2 !== id);
        x.manualUsedIds = (x.manualUsedIds || []).filter(x2 => x2 !== id);
      });
      s.manualUsed = (s.manualUsed || []).filter(x => x !== id);
      s.draftManual = (s.draftManual || []).filter(x => x !== id);
      touch(s); render();
      break;
    }

    /* ---- library: save from session ---- */
    case 'save-targets-to-library': {
      if(!s) break;
      if(!s.targets.length){ toast('No targets to save.'); break; }
      const added = saveTargetsToLibrary(s.targets);
      save(); render();
      toast(added ? `Saved ${added} new item${added===1?'':'s'} to library` : 'All items already in library.');
      break;
    }

    case 'save-one-to-library': {
      if(!s) break;
      const t = s.targets.find(x => x.id === btn.dataset.id);
      if(!t) break;
      const added = saveTargetsToLibrary([t]);
      save(); render();
      toast(added ? 'Saved to library' : 'Already in library.');
      break;
    }

    case 'open-library-picker': {
      if(!s) break;
      ui.libraryPickForSession = s.id;
      ui.librarySelected = [];
      ui.view = 'library';
      save(); render();
      window.scrollTo({ top:0, behavior:'smooth' });
      break;
    }

    case 'cancel-library-picker': {
      const sid = ui.libraryPickForSession;
      ui.libraryPickForSession = null;
      ui.librarySelected = [];
      if(sid){ ui.view = 'session'; ui.sessionId = sid; ui.step = 'targets'; }
      save(); render();
      break;
    }

    case 'confirm-library-picker': {
      const sid = ui.libraryPickForSession;
      const ts = state.sessions.find(x => x.id === sid);
      if(!ts){ toast('Session not found.'); ui.libraryPickForSession = null; ui.librarySelected = []; save(); render(); break; }
      if(!ui.librarySelected.length){ toast('Nothing selected.'); break; }
      const added = addLibraryItemsToSession(ui.librarySelected, ts);
      ui.libraryPickForSession = null;
      ui.librarySelected = [];
      ui.view = 'session'; ui.sessionId = sid; ui.step = 'targets';
      save(); render();
      toast(added ? `Added ${added} item${added===1?'':'s'} to session` : 'All selected items were already in the session.');
      break;
    }

    /* ---- library: main view ---- */
    case 'add-library-item': {
      const kind = $('#libKind').value;
      const text = $('#libText').value.trim();
      const requirement = $('#libReq').value;
      const group = $('#libGroup').value.trim();
      const tags = $('#libTags').value.split(',').map(t => t.trim()).filter(Boolean);
      if(!text){ toast('Type the item first.'); break; }
      const dup = state.library.some(it => it.kind === kind && norm(it.text) === norm(text));
      if(dup){ toast('That item is already in your library.'); break; }
      state.library.push({
        id: uid(), kind, text, requirement,
        group: requirement === 'chooseOne' ? (group || 'Group 1') : '',
        tags, addedAt: Date.now()
      });
      $('#libText').value = ''; $('#libGroup').value = ''; $('#libTags').value = '';
      save(); render();
      toast('Added to library');
      break;
    }

    case 'del-library-item': {
      e.preventDefault();
      e.stopPropagation();
      if(!confirm('Remove this item from your library?')) break;
      state.library = state.library.filter(it => it.id !== btn.dataset.id);
      ui.librarySelected = ui.librarySelected.filter(id => id !== btn.dataset.id);
      save(); render();
      break;
    }

    case 'toggle-library-select': {
      const id = btn.dataset.id;
      const set = new Set(ui.librarySelected);
      if(set.has(id)) set.delete(id); else set.add(id);
      ui.librarySelected = Array.from(set);
      render();
      break;
    }

    case 'clear-library-selection': {
      ui.librarySelected = [];
      render();
      break;
    }

    case 'filter-library': {
      ui.libraryFilter = btn.dataset.kind;
      ui.librarySelected = [];
      render();
      break;
    }

    case 'bulk-delete-library': {
      const ids = ui.librarySelected.slice();
      if(!ids.length) break;
      if(!confirm(`Delete ${ids.length} item${ids.length===1?'':'s'} from your library?`)) break;
      state.library = state.library.filter(it => !ids.includes(it.id));
      ui.librarySelected = [];
      save(); render();
      toast('Deleted');
      break;
    }

    case 'bulk-add-to-session': {
      const targetSid = $('#bulkSessionSelect') ? $('#bulkSessionSelect').value : '';
      if(!targetSid){ toast('Choose a session.'); break; }
      const ts = state.sessions.find(x => x.id === targetSid);
      if(!ts){ toast('Session not found.'); break; }
      if(!ui.librarySelected.length){ toast('Nothing selected.'); break; }
      const added = addLibraryItemsToSession(ui.librarySelected, ts);
      const count = ui.librarySelected.length;
      ui.librarySelected = [];
      save(); render();
      toast(added ? `Added ${added} item${added===1?'':'s'} to session` : `${count} item${count===1?'':'s'} already in that session.`);
      break;
    }

    case 'import-library': {
      pendingImportMode = 'library';
      $('#fileImport').click();
      break;
    }

    case 'export-library-csv': {
      if(!state.library.length){ toast('Library is empty.'); break; }
      download(`writepath-library-${new Date().toISOString().slice(0,10)}.csv`, exportLibraryCSV(), 'text/csv;charset=utf-8');
      toast('Library exported as CSV');
      break;
    }

    /* ---- full backup ---- */
    case 'export-all-json': {
      downloadBackup();
      break;
    }
    case 'import-all-data': {
      pendingImportMode = 'backup';
      $('#fileImport').click();
      break;
    }

    /* ---- session-level imports/exports ---- */
    case 'import-targets': {
      if(!s) break;
      pendingImportMode = 'targets';
      $('#fileImport').click();
      break;
    }
    case 'export-targets-csv': {
      if(!s) break;
      if(!s.targets.length){ toast('No targets to export.'); break; }
      download(`writepath-targets-${s.id}.csv`, exportTargetsCSV(s), 'text/csv;charset=utf-8');
      toast('Targets exported as CSV');
      break;
    }

    /* ---- path ---- */
    case 'add-node': {
      if(!s) break;
      s.nodes.push({ id: uid(), instruction:'', targetIds: [], branches: [] });
      touch(s); render();
      break;
    }

    case 'del-node': {
      if(!s) break;
      const id = btn.dataset.id;
      s.nodes = s.nodes.filter(n => n.id !== id);
      s.nodes.forEach(n => { n.branches = n.branches.filter(b => b.targetNodeId !== id); });
      if(s.currentNodeId === id) s.currentNodeId = s.nodes[0]?.id || null;
      touch(s); render();
      break;
    }

    case 'toggle-node-target': {
      if(!s) break;
      const n = s.nodes.find(x => x.id === btn.dataset.id);
      if(!n) break;
      const tid = btn.dataset.tid;
      n.targetIds = n.targetIds.includes(tid) ? n.targetIds.filter(x => x !== tid) : n.targetIds.concat(tid);
      touch(s); render();
      break;
    }

    case 'add-branch': {
      if(!s) break;
      const n = s.nodes.find(x => x.id === btn.dataset.id);
      if(!n) break;
      n.branches.push({ id: uid(), label:'', targetNodeId:'' });
      touch(s); render();
      break;
    }

    case 'del-branch': {
      if(!s) break;
      const n = s.nodes.find(x => x.id === btn.dataset.nid);
      if(!n) break;
      n.branches = n.branches.filter(b => b.id !== btn.dataset.id);
      touch(s); render();
      break;
    }

    /* ---- writing ---- */
    case 'add-sentence': {
      if(!s) break;
      const text = (s.draft || '').trim();
      if(!text){ toast('Write a sentence first.'); break; }
      const auto = autoMatch(text, s.targets);
      const manual = new Set(s.draftManual || []);
      const usedIds = Array.from(new Set([...auto, ...manual]));
      s.sentences.push({
        id: uid(), nodeId: s.currentNodeId, text,
        original: text,
        usedTargetIds: usedIds,
        manualUsedIds: Array.from(manual),
        at: Date.now()
      });
      s.draft = ''; s.draftManual = [];

      const node = s.nodes.find(n => n.id === s.currentNodeId);
      if(node && node.branches.length){
        s.awaitingChoice = true;
      } else if(node){
        advanceSequential(s);
      }
      touch(s); render();
      break;
    }

    case 'choose-branch': {
      if(!s) break;
      const node = s.nodes.find(n => n.id === s.currentNodeId);
      const b = node && node.branches.find(x => x.id === btn.dataset.id);
      s.awaitingChoice = false;
      if(b && b.targetNodeId && s.nodes.some(n => n.id === b.targetNodeId)){
        s.currentNodeId = b.targetNodeId;
      } else {
        advanceSequential(s);
      }
      touch(s); render();
      break;
    }

    case 'toggle-draft-target': {
      if(!s) break;
      const tid = btn.dataset.tid;
      const committed = committedUsed(s);
      if(committed.has(tid)) break;
      const set = new Set(s.draftManual || []);
      if(set.has(tid)) set.delete(tid); else set.add(tid);
      s.draftManual = Array.from(set);
      save();
      updateSidebarLive();
      break;
    }

    case 'finish': {
      if(!s) break;
      ui.step = 'review';
      s.reviewedAt = Date.now();
      touch(s); render();
      break;
    }

    /* ---- reset writing ---- */
    case 'reset-draft': {
      if(!s) break;
      const hasText = (s.draft || '').trim().length > 0;
      const hasManual = (s.draftManual || []).length > 0;
      if(!hasText && !hasManual){ toast('Nothing to reset.'); break; }
      if(hasText && !confirm('Clear the sentence you are currently writing?')) break;
      s.draft = '';
      s.draftManual = [];
      save(); render();
      toast('Draft cleared');
      break;
    }

    case 'reset-writing': {
      if(!s) break;
      const hasAnything = s.sentences.length > 0 || (s.draft || '').trim().length > 0 || (s.draftManual || []).length > 0;
      if(!hasAnything){ toast('Nothing to reset.'); break; }
      const msg = s.sentences.length
        ? `Reset all writing in this session?\n\nThis will delete ${s.sentences.length} sentence${s.sentences.length===1?'':'s'} and any revisions, and move you back to the first node. Your target language and sentence path will be kept.`
        : 'Reset all writing in this session?\n\nThis will clear the current draft and move you back to the first node.';
      if(!confirm(msg)) break;
      s.sentences = [];
      s.revisions = [];
      s.manualUsed = [];
      s.draft = '';
      s.draftManual = [];
      s.awaitingChoice = false;
      s.pathComplete = false;
      s.currentNodeId = s.nodes[0]?.id || null;
      s.reviewedAt = null;
      touch(s); render();
      toast('Writing reset — back to the first node');
      break;
    }

    case 'undo-last-sentence': {
      if(!s) break;
      if(!s.sentences.length){ toast('No sentence to undo.'); break; }
      const last = s.sentences[s.sentences.length - 1];
      if(!confirm(`Undo the last sentence?\n\n"${last.text.slice(0, 80)}${last.text.length > 80 ? '…' : ''}"`)) break;
      s.sentences.pop();
      s.awaitingChoice = false;
      s.pathComplete = false;
      if(last.nodeId && s.nodes.some(n => n.id === last.nodeId)){
        s.currentNodeId = last.nodeId;
      } else {
        s.currentNodeId = s.nodes[0]?.id || null;
      }
      touch(s); render();
      toast('Last sentence removed');
      break;
    }

    /* ---- review ---- */
    case 'mark-used': {
      if(!s) break;
      const id = btn.dataset.id;
      const used = committedUsed(s);
      if(used.has(id)){
        s.manualUsed = (s.manualUsed || []).filter(x => x !== id);
        s.sentences.forEach(x => {
          x.usedTargetIds = (x.usedTargetIds || []).filter(x2 => x2 !== id);
          x.manualUsedIds = (x.manualUsedIds || []).filter(x2 => x2 !== id);
        });
      } else {
        s.manualUsed = Array.from(new Set([...(s.manualUsed || []), id]));
      }
      touch(s); render();
      break;
    }

    case 'revise-jump': {
      ui.step = 'revise';
      save(); render();
      const el = document.getElementById('rev-' + btn.dataset.id);
      if(el){ el.scrollIntoView({ behavior:'smooth', block:'center' }); el.querySelector('textarea')?.focus(); }
      break;
    }

    /* ---- revision ---- */
    case 'save-revision': {
      if(!s) break;
      const id = btn.dataset.id;
      const sen = s.sentences.find(x => x.id === id);
      if(!sen) break;
      const next = (ui.reviseDraft[id] ?? sen.text).trim();
      if(!next){ toast('The revision is empty.'); break; }
      if(next === sen.text){ toast('Nothing changed.'); break; }
      s.revisions.push({ id: uid(), sentenceId: id, before: sen.text, after: next, at: Date.now() });
      sen.text = next;
      const auto = autoMatch(next, s.targets);
      sen.usedTargetIds = Array.from(new Set([...auto, ...(sen.manualUsedIds || [])]));
      delete ui.reviseDraft[id];
      touch(s); render();
      toast('Revision saved');
      break;
    }

    case 'revert-revision': {
      if(!s) break;
      const id = btn.dataset.id;
      const sen = s.sentences.find(x => x.id === id);
      if(!sen) break;
      if(!confirm('Revert this sentence to its original version?')) break;
      s.revisions.push({ id: uid(), sentenceId: id, before: sen.text, after: sen.original, at: Date.now() });
      sen.text = sen.original;
      const auto = autoMatch(sen.text, s.targets);
      sen.usedTargetIds = Array.from(new Set([...auto, ...(sen.manualUsedIds || [])]));
      delete ui.reviseDraft[id];
      touch(s); render();
      break;
    }
  }
});

/* ---------- live field updates (no re-render, keeps focus) ---------- */
function onField(e){
  const t = e.target;

  if(t.id === 'libSearch'){
    ui.librarySearch = t.value;
    const pos = t.selectionStart;
    render();
    const el = $('#libSearch');
    if(el){ el.focus(); el.setSelectionRange(pos, pos); }
    return;
  }

  if(!t.dataset) return;
  const s = currentSession();

  if('sfield' in t.dataset && s){
    let v = t.value;
    if(t.type === 'number') v = Math.max(0, Number(v) || 0);
    s[t.dataset.sfield] = v;
    s.updatedAt = Date.now();
    save();
    if(t.dataset.sfield === 'targetWords') updateMeta();
    return;
  }
  if(!s) return;

  if('tfield' in t.dataset){
    const tg = s.targets.find(x => x.id === t.dataset.targetId);
    if(tg){ tg[t.dataset.tfield] = t.value; touch(s); }
    return;
  }
  if('nfield' in t.dataset){
    const n = s.nodes.find(x => x.id === t.dataset.nodeId);
    if(n){ n[t.dataset.nfield] = t.value; touch(s); }
    return;
  }
  if('bfield' in t.dataset){
    for(const n of s.nodes){
      const b = n.branches.find(x => x.id === t.dataset.branchId);
      if(b){ b[t.dataset.bfield] = t.value; touch(s); break; }
    }
    return;
  }
  if('draft' in t.dataset){
    s.draft = t.value;
    s.updatedAt = Date.now();
    save();
    updateSidebarLive();
    return;
  }
  if('revise' in t.dataset){
    ui.reviseDraft[t.dataset.revise] = t.value;
    return;
  }
}
document.addEventListener('input', onField);
document.addEventListener('change', onField);

/* ---------- live sidebar highlighting while typing ---------- */
function updateSidebarLive(){
  const s = currentSession();
  if(!s) return;
  const chips = $$('.tchip');
  if(!chips.length) return;
  const committed = committedUsed(s);
  const auto = autoMatch(s.draft || '', s.targets);
  const manual = new Set(s.draftManual || []);
  chips.forEach(chip => {
    const id = chip.dataset.tid;
    const isC = committed.has(id);
    const isL = !isC && (auto.has(id) || manual.has(id));
    chip.classList.toggle('committed', isC);
    chip.classList.toggle('live', isL);
  });
  const counter = $('.editor')?.closest('.panel')?.querySelector('.muted.small');
  if(counter) counter.textContent = `${wordsIn(s.draft || '')} word${wordsIn(s.draft||'')===1?'':'s'} in this sentence`;
}

/* ---------- file import (targets OR library OR full backup) ---------- */
$('#fileImport').addEventListener('change', async e => {
  const file = e.target.files && e.target.files[0];
  if(!file){ pendingImportMode = 'targets'; return; }

  let text = '';
  try { text = await file.text(); }
  catch(err){
    toast('Could not read file.');
    e.target.value = ''; pendingImportMode = 'targets';
    return;
  }

  /* ----- FULL BACKUP ----- */
  if(pendingImportMode === 'backup'){
    let data;
    try { data = JSON.parse(text); }
    catch(err){
      toast('Invalid backup file (not JSON).');
      e.target.value = ''; pendingImportMode = 'targets';
      return;
    }
    const lib = Array.isArray(data.library) ? data.library : [];
    const sess = Array.isArray(data.sessions) ? data.sessions : [];
    if(!lib.length && !sess.length){
      toast('Backup contains no sessions or library items.');
      e.target.value = ''; pendingImportMode = 'targets';
      return;
    }
    const replace = confirm(
      `Import backup?\n\n` +
      `• ${sess.length} session${sess.length === 1 ? '' : 's'}\n` +
      `• ${lib.length} library item${lib.length === 1 ? '' : 's'}\n\n` +
      `OK = Replace all current data\n` +
      `Cancel = Merge into current data`
    );
    const result = applyBackup(data, replace ? 'replace' : 'merge');
    save(); render();
    if(result.replaced){
      toast(`Backup restored — ${result.sessAdded} session(s), ${result.libAdded} library item(s)`);
    } else {
      toast(`Merged — added ${result.sessAdded} session(s), ${result.libAdded} library item(s)`);
    }
    e.target.value = ''; pendingImportMode = 'targets';
    return;
  }

  /* ----- TARGETS / LIBRARY ----- */
  let items = [];
  try { items = parseTargetsFile(file.name, text); }
  catch(err){
    toast('Could not parse file: ' + err.message);
    e.target.value = ''; pendingImportMode = 'targets';
    return;
  }
  if(!items.length){
    toast('No terms found in the file.');
    e.target.value = ''; pendingImportMode = 'targets';
    return;
  }

  if(pendingImportMode === 'library'){
    const existing = new Set(state.library.map(it => it.kind + '::' + norm(it.text)));
    let added = 0;
    items.forEach(it => {
      const key = it.kind + '::' + norm(it.text);
      if(existing.has(key)) return;
      state.library.push({
        id: uid(), kind: it.kind, text: it.text,
        requirement: it.requirement, group: it.group || '',
        tags: it.tags || [], addedAt: Date.now()
      });
      existing.add(key);
      added++;
    });
    save(); render();
    toast(added ? `Imported ${added} item${added === 1 ? '' : 's'} to library` : 'All items already in library.');
  } else {
    const s = currentSession();
    if(!s){
      toast('Open a session first.');
      e.target.value = ''; pendingImportMode = 'targets';
      return;
    }
    items.forEach(it => {
      s.targets.push({
        id: uid(), kind: it.kind, text: it.text,
        requirement: it.requirement,
        group: it.requirement === 'chooseOne' ? (it.group || 'Group 1') : ''
      });
    });
    touch(s); render();
    toast(`Imported ${items.length} item${items.length === 1 ? '' : 's'}`);
  }

  e.target.value = '';
  pendingImportMode = 'targets';
});

/* ---------- keyboard shortcut: Ctrl/Cmd + Enter adds a sentence ---------- */
document.addEventListener('keydown', e => {
  if((e.metaKey || e.ctrlKey) && e.key === 'Enter'){
    if(ui.step === 'write' && ui.view === 'session' && !currentSession()?.awaitingChoice){
      e.preventDefault();
      document.querySelector('[data-act="add-sentence"]')?.click();
    }
  }
});

/* ============================================================
   BOOT
   ============================================================ */
load();
applyTheme();
if(ui.view === 'session' && !currentSession()){ ui.view = 'home'; ui.sessionId = null; }
render();
</script>
