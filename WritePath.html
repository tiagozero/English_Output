<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>WritePath — Guided English Writing Practice</title>
<style>
  :root{
    --bg:#f5f6f8; --panel:#ffffff; --line:#e4e7ec; --line-strong:#c9cede;
    --text:#12141a; --muted:#6b7280;
    --accent:#4f46e5; --accent-hover:#4338ca; --accent-soft:#eef0ff; --accent-line:#c7c9ff;
    --green:#047857; --green-soft:#e8f7f1; --green-line:#b9e6d5;
    --amber:#b45309; --amber-soft:#fdf2e3; --amber-line:#f3e0c2;
    --red:#b91c1c; --red-soft:#fdeceb; --red-line:#f6d5d3;
    --hover:#f7f8fa; --hover2:#f1f2f6;
    --faint:#fafbfc; --chip-bg:#f3f4f6; --bar:#eceef2;
    --input-bg:#ffffff;
    --shadow:rgba(20,22,40,.05);
    --radius:12px;
  }
  body.dark{
    --bg:#0e1117; --panel:#161a22; --line:#262b36; --line-strong:#39414f;
    --text:#e8eaef; --muted:#8b93a3;
    --accent:#818cf8; --accent-hover:#a5b4fc; --accent-soft:#1e2138; --accent-line:#3730a3;
    --green:#34d399; --green-soft:#12291f; --green-line:#1f4a37;
    --amber:#fbbf24; --amber-soft:#2a2113; --amber-line:#4a3a17;
    --red:#f87171; --red-soft:#2b1a1a; --red-line:#4a2525;
    --hover:#1c212b; --hover2:#1f242f;
    --faint:#12161d; --chip-bg:#1e232d; --bar:#2a2f3a;
    --input-bg:#12161d;
    --shadow:rgba(0,0,0,.4);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text);
    font:15px/1.55 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    transition:background .15s, color .15s;
  }
  button{font:inherit;cursor:pointer}
  input,select,textarea{font:inherit;color:inherit}
  h1,h2,h3,h4{margin:0 0 6px;line-height:1.25;letter-spacing:-.01em}
  h1{font-size:26px} h2{font-size:20px} h3{font-size:16px} h4{font-size:14px}
  p{margin:0 0 8px}
  .muted{color:var(--muted)}
  .small{font-size:13px}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .row.between{justify-content:space-between}
  .wrap{max-width:1080px;margin:0 auto;padding:22px}

  /* top bar */
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 22px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
  .brand{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:-.02em}
  .logo{display:grid;place-items:center;width:26px;height:26px;border-radius:8px;background:var(--accent);color:#fff;font-size:14px}
  nav{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
  .navbtn{background:transparent;border:0;padding:6px 12px;border-radius:999px;color:var(--muted);font-weight:500}
  .navbtn:hover{background:var(--hover2);color:var(--text)}
  .navbtn.active{background:var(--accent-soft);color:var(--accent)}
  a.navbtn{text-decoration:none;display:inline-block;cursor:pointer}
  .iconbtn{background:transparent;border:1px solid transparent;padding:5px 9px;border-radius:9px;font-size:16px;line-height:1;color:var(--muted)}
  .iconbtn:hover{background:var(--hover2);color:var(--text)}

  /* buttons */
  .btn{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:7px 13px;font-weight:500;color:var(--text);transition:.13s}
  .btn:hover{background:var(--hover);border-color:var(--line-strong)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
  .btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
  .btn.ghost:hover{background:var(--hover2);color:var(--text)}
  .btn.danger{color:var(--red);border-color:var(--red-line)}
  .btn.danger:hover{background:var(--red-soft)}
  .btn.sm{padding:4px 9px;font-size:13px;border-radius:7px}
  .btn:disabled{opacity:.45;cursor:not-allowed}

  /* hero */
  .hero{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:26px;margin-bottom:18px}
  .hero p{color:var(--muted);max-width:620px}
  .hero .btn{margin-top:8px}

  /* cards */
  .cards{display:grid;gap:12px}
  .scard{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:15px 17px;display:flex;gap:14px;justify-content:space-between;align-items:center;flex-wrap:wrap;cursor:pointer;transition:.13s}
  .scard:hover{border-color:var(--line-strong);box-shadow:0 2px 10px var(--shadow)}
  .scard .eyebrow{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .scard h3{margin:2px 0 4px}

  .eyebrow{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:4px}

  /* session header */
  .sessionbar{background:var(--panel);border-bottom:1px solid var(--line);padding:14px 22px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
  .sessionmeta{color:var(--muted);font-size:13.5px}
  .tabs{display:flex;gap:2px;padding:0 22px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;position:sticky;top:47px;z-index:20}
  .tab{background:transparent;border:0;border-bottom:2px solid transparent;padding:10px 13px;color:var(--muted);font-weight:500;white-space:nowrap}
  .tab:hover{color:var(--text)}
  .tab.active{color:var(--accent);border-bottom-color:var(--accent)}

  /* panels */
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:14px}
  .panel h3,.panel h4{margin-bottom:8px}
  label.field{display:block;margin-bottom:12px}
  label.field > span{display:block;font-size:13px;font-weight:600;color:var(--text);margin-bottom:4px}
  input[type=text],input[type=number],select,textarea{
    width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--input-bg);outline:none;transition:.13s;color:var(--text);
  }
  input::placeholder,textarea::placeholder{color:var(--muted);opacity:.75}
  input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  textarea{resize:vertical;line-height:1.6}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:700px){.grid2{grid-template-columns:1fr}}

  /* chips */
  .chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 11px;font-size:13px;color:var(--text)}
  .chip:hover{background:var(--hover)}
  .chip.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent);font-weight:500}
  .minichip{display:inline-block;background:var(--chip-bg);border-radius:6px;padding:2px 8px;font-size:12.5px;color:var(--muted);margin:0 4px 4px 0}
  .badge{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:5px;background:var(--chip-bg);color:var(--muted)}
  .badge.required{background:var(--accent-soft);color:var(--accent)}
  .badge.chooseOne{background:var(--amber-soft);color:var(--amber)}
  .badge.optional{background:var(--chip-bg);color:var(--muted)}
  .badge.used{background:var(--green-soft);color:var(--green)}
  .badge.missing{background:var(--red-soft);color:var(--red)}

  /* kind colors */
  .k-chunk .dot,.k-chunk .kdot{background:#6366f1}
  .k-collocation .dot,.k-collocation .kdot{background:#0ea5e9}
  .k-phrasalVerb .dot,.k-phrasalVerb .kdot{background:#14b8a6}
  .k-vocabulary .dot,.k-vocabulary .kdot{background:#f59e0b}
  .k-grammar .dot,.k-grammar .kdot{background:#ec4899}

  /* target list */
  .trow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--hover2)}
  .trow:last-child{border-bottom:0}
  .kdot{width:8px;height:8px;border-radius:50%;flex:none;background:#9ca3af}
  .trow .ttext{flex:1;min-width:0;font-weight:500}
  .trow select{width:auto;padding:3px 6px;font-size:12.5px;border-radius:7px}

  /* sidebar chips */
  .tgroup{margin-bottom:14px}
  .tgroup:last-child{margin-bottom:0}
  .tgrouphead{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0 0 6px 2px}
  .tgrouphead .kdot{width:7px;height:7px}
  .tchip{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:7px 10px;margin-bottom:6px;font-size:13.5px;transition:.13s;color:var(--text)}
  .tchip .dot{width:8px;height:8px;border-radius:50%;flex:none;background:#9ca3af}
  .tchip .ttext{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tchip .req{font-size:10px;font-weight:700;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);padding:1px 5px;border-radius:4px}
  .tchip:hover{border-color:var(--line-strong)}
  .tchip.committed{background:var(--green-soft);border-color:var(--green-line);color:var(--green)}
  .tchip.committed .ttext{text-decoration:line-through;opacity:.75}
  .tchip.live{background:var(--accent-soft);border-color:var(--accent-line)}
  .legend{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-top:10px;flex-wrap:wrap}
  .lg{width:11px;height:11px;border-radius:4px;display:inline-block;border:1px solid var(--line)}
  .lg.committed{background:var(--green-soft);border-color:var(--green-line)}
  .lg.live{background:var(--accent-soft);border-color:var(--accent-line)}

  /* write layout */
  .writewrap{display:grid;grid-template-columns:1fr 306px;gap:16px;align-items:start}
  @media(max-width:900px){.writewrap{grid-template-columns:1fr}}
  .sidebar{position:sticky;top:110px;max-height:calc(100vh - 130px);overflow-y:auto}
  .editor{min-height:110px;font-size:16px}
  .instr{background:linear-gradient(180deg,var(--panel),var(--faint))}
  .instr h3{font-size:17px}

  /* transcript */
  .sent{border-left:3px solid var(--line);padding:6px 0 6px 13px;margin-bottom:12px}
  .sent .stext{font-size:15.5px}
  .sent .smeta{font-size:12px;color:var(--muted);margin-top:3px}

  /* node cards */
  .nodecard{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);padding:14px 16px;margin-bottom:12px}
  .nodehead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .nodeidx{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);padding:3px 8px;border-radius:6px}
  .branchrow{display:flex;gap:8px;align-items:center;margin-bottom:6px}
  .branchrow input{flex:1}
  .branchrow select{width:190px;flex:none}

  /* review */
  .statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
  @media(max-width:760px){.statgrid{grid-template-columns:repeat(2,1fr)}}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
  .stat .num{font-size:24px;font-weight:700;letter-spacing:-.02em}
  .stat .lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
  .bar{height:7px;background:var(--bar);border-radius:99px;overflow:hidden;margin-top:8px}
  .bar > i{display:block;height:100%;background:var(--accent);border-radius:99px}

  .fb{padding:10px 12px;border-radius:9px;margin-bottom:8px;font-size:14px;border:1px solid transparent}
  .fb.error{background:var(--red-soft);border-color:var(--red-line)}
  .fb.warn{background:var(--amber-soft);border-color:var(--amber-line)}
  .fb.tip{background:var(--hover2);border-color:var(--line)}
  .fb .lvl{font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase;margin-right:6px}
  .fb.error .lvl{color:var(--red)} .fb.warn .lvl{color:var(--amber)} .fb.tip .lvl{color:var(--muted)}

  .quote{background:var(--faint);border:1px solid var(--line);border-radius:9px;padding:9px 12px;font-size:14.5px;margin:0}
  .quote.rev{background:var(--green-soft);border-color:var(--green-line)}
  .compare{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
  @media(max-width:700px){.compare{grid-template-columns:1fr}}
  .lbl{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
  .history{margin-top:10px;border-top:1px dashed var(--line);padding-top:10px}
  .histrow{font-size:13px;color:var(--muted);margin-bottom:6px;display:flex;gap:8px;flex-wrap:wrap;align-items:baseline}
  .histrow .before{text-decoration:line-through;color:var(--muted);opacity:.7}
  .histrow .arrow{color:var(--muted)}
  .histrow .after{color:var(--green);font-weight:500}

  /* progress table */
  table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  th,td{text-align:left;padding:9px 13px;border-bottom:1px solid var(--hover2);font-size:14px}
  th{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--faint)}
  tr:last-child td{border-bottom:0}
  .usebar{height:6px;background:var(--bar);border-radius:99px;width:80px;overflow:hidden;display:inline-block;vertical-align:middle}
  .usebar > i{display:block;height:100%;background:var(--accent)}

  /* import/export */
  pre{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  details summary{cursor:pointer;user-select:none}
  details summary:hover{color:var(--text)}

  /* toast */
  #toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:#111827;color:#fff;padding:9px 16px;border-radius:9px;font-size:13.5px;opacity:0;pointer-events:none;transition:.2s;z-index:99}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .empty{padding:30px;text-align:center;color:var(--muted);background:var(--panel);border:1px dashed var(--line);border-radius:var(--radius)}
  .choice{border-color:var(--accent-line);background:linear-gradient(180deg,var(--panel),var(--faint))}
  .branchbtn{text-align:left}

  /* reset row */
  .resetrow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);flex-wrap:wrap}

  /* library */
  .pickbanner{background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:var(--radius);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
  .selbar{background:var(--panel);border:1px solid var(--accent-line);border-radius:var(--radius);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap;position:sticky;top:100px;z-index:10;box-shadow:0 2px 8px var(--shadow)}
  .librow{display:flex;align-items:center;gap:10px;padding:8px 6px;border-bottom:1px solid var(--hover2);border-radius:6px}
  .librow:last-child{border-bottom:0}
  .librow.sel{background:var(--accent-soft)}
  .librow .libtext{flex:1;min-width:0;font-weight:500;word-break:break-word}
  .librow input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px;flex:none;cursor:pointer}
  .librow .minichip{margin:0}
  .danger-zone{border-color:var(--red-line)}
</style>
</head>
<body>
<div id="app"></div>
<input type="file" id="fileImport" accept=".json,.csv,application/json,text/csv" hidden />
<div id="toast"></div>

<script>
/* ============================================================
   WritePath — guided English writing practice
   ============================================================ */

/* ---------- tiny helpers ---------- */
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $  = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
const wordsIn = t => (String(t).trim().match(/[A-Za-z0-9'’\-]+/g) || []).length;
const norm = t => String(t).toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').replace(/\s+/g, ' ').trim();
const escRe = t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

/* ---------- constants ---------- */
const KINDS = {
  chunk:       'Chunk',
  collocation: 'Collocation',
  phrasalVerb: 'Phrasal verb',
  vocabulary:  'Vocabulary',
  grammar:     'Grammar point'
};
const KIND_ORDER = ['chunk','collocation','phrasalVerb','vocabulary','grammar'];
const REQS = { required:'Required', chooseOne:'Choose one', optional:'Optional' };
const TEXT_TYPES = ['Journal','Mini-essay','Story','Reddit post','Free writing'];
const KEY = 'writepath.v1';
const THEME_KEY = 'writepath.theme';
const BACKUP_APP = 'WritePath';
const BACKUP_VERSION = 1;

/* ---------- state ---------- */
let state = { sessions: [], library: [] };
let ui = {
  view:'home', sessionId:null, step:'setup', reviseDraft:{},
  librarySearch:'', libraryFilter:'all', librarySelected:[],
  libraryPickForSession:null
};
let theme = 'light';
let pendingImportMode = 'targets'; // 'targets' | 'library' | 'backup'

/* ---------- persistence ---------- */
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      state = parsed.state || { sessions: [] };
      const u = parsed.ui || {};
      ui.view = u.view || 'home';
      ui.sessionId = u.sessionId || null;
      ui.step = u.step || 'setup';
    }
  }catch(e){ console.warn('load failed', e); }
  if(!Array.isArray(state.sessions)) state.sessions = [];
  if(!Array.isArray(state.library)) state.library = [];
  state.sessions.forEach(hydrate);
  state.library.forEach(hydrateLibraryItem);
  theme = localStorage.getItem(THEME_KEY) || 'light';
}
function hydrate(s){
  s.targets = s.targets || [];
  s.nodes = s.nodes || [];
  s.sentences = s.sentences || [];
  s.revisions = s.revisions || [];
  s.manualUsed = s.manualUsed || [];
  s.draft = s.draft || '';
  s.draftManual = s.draftManual || [];
  s.currentNodeId = s.currentNodeId || null;
  s.textType = s.textType || 'Journal';
  s.targetWords = s.targetWords ?? 120;
  s.nodes.forEach(n => { n.branches = n.branches || []; n.targetIds = n.targetIds || []; n.instruction = n.instruction || ''; });
  s.sentences.forEach(x => { x.usedTargetIds = x.usedTargetIds || []; x.manualUsedIds = x.manualUsedIds || []; x.original = x.original ?? x.text; });
  return s;
}
function hydrateLibraryItem(it){
  it.tags = Array.isArray(it.tags) ? it.tags : [];
  it.kind = it.kind || 'vocabulary';
  it.requirement = it.requirement || 'optional';
  it.group = it.group || '';
  it.text = it.text || '';
  return it;
}
function save(){
  try{
    localStorage.setItem(KEY, JSON.stringify({
      state,
      ui: { view: ui.view, sessionId: ui.sessionId, step: ui.step }
    }));
  }catch(e){ console.warn('save failed', e); }
}
function touch(s){ s.updatedAt = Date.now(); save(); updateMeta(); }

let toastTimer;
function toast(msg){
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2100);
}

/* ---------- theme ---------- */
function applyTheme(){
  document.body.classList.toggle('dark', theme === 'dark');
}

/* ---------- session helpers ---------- */
function newSession(){
  const now = Date.now();
  return {
    id: uid(), title:'', topic:'', textType:'Journal', targetWords:120,
    createdAt: now, updatedAt: now,
    targets: [], nodes: [], sentences: [], revisions: [], manualUsed: [],
    currentNodeId: null, pathComplete: false, awaitingChoice: false,
    draft: '', draftManual: []
  };
}
function currentSession(){
  return state.sessions.find(s => s.id === ui.sessionId) || null;
}
function countWords(s){ return s.sentences.reduce((a, x) => a + wordsIn(x.text), 0); }
function committedUsed(s){
  const set = new Set();
  s.sentences.forEach(x => (x.usedTargetIds || []).forEach(id => set.add(id)));
  (s.manualUsed || []).forEach(id => set.add(id));
  return set;
}
function autoMatch(text, targets){
  const n = ' ' + norm(text) + ' ';
  const out = new Set();
  if(!n.trim()) return out;
  for(const t of targets){
    if(t.kind === 'grammar') continue;
    const needle = norm(t.text);
    if(!needle) continue;
    const re = new RegExp('(^|[^a-z0-9])' + escRe(needle) + '([^a-z0-9]|$)');
    if(re.test(n)) out.add(t.id);
  }
  return out;
}
function ensureCursor(s){
  if(!s.nodes.length || s.pathComplete) return;
  if(!s.currentNodeId || !s.nodes.some(n => n.id === s.currentNodeId)){
    s.currentNodeId = s.nodes[0].id;
  }
}
function advanceSequential(s){
  const i = s.nodes.findIndex(n => n.id === s.currentNodeId);
  if(i >= 0 && i + 1 < s.nodes.length) s.currentNodeId = s.nodes[i + 1].id;
  else { s.currentNodeId = null; s.pathComplete = true; }
}
function nodeLabel(s, id){
  const i = s.nodes.findIndex(n => n.id === id);
  if(i < 0) return '—';
  const n = s.nodes[i];
  return 'Step ' + (i + 1) + (n.instruction ? ': ' + n.instruction.slice(0, 28) : '');
}
function kindName(k){ return KINDS[k] || k; }

/* ============================================================
   LIBRARY HELPERS
   ============================================================ */
function addLibraryItemsToSession(libIds, session){
  let added = 0;
  const existing = new Set(session.targets.map(t => t.kind + '::' + norm(t.text)));
  libIds.forEach(id => {
    const it = state.library.find(x => x.id === id);
    if(!it) return;
    const key = it.kind + '::' + norm(it.text);
    if(existing.has(key)) return;
    session.targets.push({
      id: uid(), kind: it.kind, text: it.text,
      requirement: it.requirement, group: it.group || ''
    });
    existing.add(key);
    added++;
  });
  if(added) session.updatedAt = Date.now();
  return added;
}
function saveTargetsToLibrary(targets){
  let added = 0;
  const existing = new Set(state.library.map(it => it.kind + '::' + norm(it.text)));
  targets.forEach(t => {
    const key = t.kind + '::' + norm(t.text);
    if(existing.has(key)) return;
    state.library.push({
      id: uid(), kind: t.kind, text: t.text,
      requirement: t.requirement, group: t.group || '',
      tags: [], addedAt: Date.now()
    });
    existing.add(key);
    added++;
  });
  return added;
}

/* ============================================================
   IMPORT / EXPORT
   ============================================================ */
function download(filename, content, type){
  const blob = new Blob([content], { type: type || 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 500);
}
function csvCell(v){
  const s = String(v ?? '');
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function splitCSVLine(line){
  const out = []; let cur = ''; let q = false;
  for(let i = 0; i < line.length; i++){
    const c = line[i];
    if(q){
      if(c === '"'){ if(line[i+1] === '"'){ cur += '"'; i++; } else q = false; }
      else cur += c;
    } else {
      if(c === '"') q = true;
      else if(c === ','){ out.push(cur); cur = ''; }
      else cur += c;
    }
  }
  out.push(cur);
  return out.map(s => s.trim());
}
function normalizeKind(v){
  const k = String(v || '').trim().toLowerCase().replace(/[\s_-]/g, '');
  if(k === 'chunk' || k === 'chunks') return 'chunk';
  if(k === 'collocation' || k === 'collocations') return 'collocation';
  if(k === 'phrasalverb' || k === 'phrasal' || k === 'phrasalverbs') return 'phrasalVerb';
  if(k === 'vocabulary' || k === 'vocab' || k === 'word') return 'vocabulary';
  if(k === 'grammar' || k === 'grammarpoint' || k === 'grammarpoints') return 'grammar';
  return 'vocabulary';
}
function normalizeReq(v){
  const r = String(v || '').trim().toLowerCase().replace(/[\s_-]/g, '');
  if(r === 'required' || r === 'req' || r === 'must') return 'required';
  if(r === 'chooseone' || r === 'choice' || r === 'oneof') return 'chooseOne';
  return 'optional';
}
function normalizeItem(obj){
  const text = String(obj.text ?? obj.term ?? obj.item ?? obj.value ?? obj.phrase ?? '').trim();
  if(!text) return null;
  const kind = normalizeKind(obj.kind ?? obj.type ?? obj.category);
  const requirement = normalizeReq(obj.requirement ?? obj.req ?? obj.priority);
  const group = String(obj.group ?? obj.groupName ?? obj.category_group ?? '').trim();
  const tagsRaw = obj.tags ?? '';
  const tags = Array.isArray(tagsRaw)
    ? tagsRaw.map(x => String(x).trim()).filter(Boolean)
    : String(tagsRaw).split(/[|,]/).map(t => t.trim()).filter(Boolean);
  return { kind, text, requirement, group: requirement === 'chooseOne' ? (group || 'Group 1') : '', tags };
}
function parseJSONTargets(text){
  let data = JSON.parse(text);
  if(data && !Array.isArray(data)){
    if(Array.isArray(data.targets)) data = data.targets;
    else if(Array.isArray(data.items)) data = data.items;
    else if(Array.isArray(data.library)) data = data.library;
    else throw new Error('Expected an array of items');
  }
  if(!Array.isArray(data)) throw new Error('Expected an array of items');
  return data.map(item => typeof item === 'string'
    ? { kind:'vocabulary', text:item.trim(), requirement:'optional', group:'', tags:[] }
    : normalizeItem(item)
  ).filter(Boolean);
}
function parseCSVTargets(text){
  const lines = text.split(/\r?\n/).filter(l => l.trim().length);
  if(!lines.length) return [];
  const first = lines[0].toLowerCase();
  const hasHeader = /\b(text|term|item|kind|type|requirement|group|tags)\b/.test(first);
  const header = hasHeader
    ? splitCSVLine(lines[0]).map(h => h.toLowerCase().trim())
    : ['text','kind','requirement','group','tags'];
  const rows = hasHeader ? lines.slice(1) : lines;
  return rows.map(line => {
    const cells = splitCSVLine(line);
    const obj = {};
    header.forEach((h, i) => obj[h] = cells[i] || '');
    return normalizeItem(obj);
  }).filter(Boolean);
}
function parseTargetsFile(name, text){
  const lower = name.toLowerCase();
  const trimmed = text.trim();
  if(lower.endsWith('.json') || trimmed.startsWith('[') || trimmed.startsWith('{')){
    return parseJSONTargets(text);
  }
  return parseCSVTargets(text);
}
function exportTargetsCSV(s){
  const header = 'text,kind,requirement,group';
  const rows = s.targets.map(t => [
    csvCell(t.text), t.kind, t.requirement, csvCell(t.group || '')
  ].join(','));
  return [header, ...rows].join('\n') + '\n';
}
function exportLibraryCSV(){
  const header = 'text,kind,requirement,group,tags';
  const rows = state.library.map(it => [
    csvCell(it.text), it.kind, it.requirement, csvCell(it.group || ''),
    csvCell((it.tags || []).join('|'))
  ].join(','));
  return [header, ...rows].join('\n') + '\n';
}

/* ---------- FULL BACKUP (everything: library + sessions) ---------- */
function buildBackup(){
  return {
    app: BACKUP_APP,
    version: BACKUP_VERSION,
    exportedAt: new Date().toISOString(),
    counts: {
      sessions: state.sessions.length,
      library: state.library.length,
      sentences: state.sessions.reduce((a, s) => a + s.sentences.length, 0),
      targets: state.sessions.reduce((a, s) => a + s.targets.length, 0)
    },
    library: state.library,
    sessions: state.sessions
  };
}
function downloadBackup(){
  const backup = buildBackup();
  if(!backup.sessions.length && !backup.library.length){
    toast('Nothing to export yet.');
    return;
  }
  const stamp = new Date().toISOString().slice(0,10);
  download(`writepath-backup-${stamp}.json`, JSON.stringify(backup, null, 2), 'application/json');
  toast(`Exported ${backup.sessions.length} session${backup.sessions.length===1?'':'s'} + ${backup.library.length} library item${backup.library.length===1?'':'s'}`);
}

/* ---------- FULL RESTORE ---------- */
function applyBackup(data, mode /* 'replace' | 'merge' */){
  const lib = Array.isArray(data.library) ? data.library : [];
  const sess = Array.isArray(data.sessions) ? data.sessions : [];
  if(mode === 'replace'){
    state.library = lib.map(it => hydrateLibraryItem({ ...it, id: uid() }));
    state.sessions = sess.map(s => hydrate({ ...s, id: uid() }));
    ui.view = 'home'; ui.sessionId = null; ui.step = 'setup';
    ui.librarySelected = []; ui.libraryPickForSession = null;
    return { libAdded: state.library.length, sessAdded: state.sessions.length, replaced: true };
  }
  // merge
  const existingLib = new Set(state.library.map(it => it.kind + '::' + norm(it.text)));
  let libAdded = 0;
  lib.forEach(it => {
    const t = String(it.text || '').trim();
    if(!t) return;
    const k = (it.kind || 'vocabulary') + '::' + norm(t);
    if(existingLib.has(k)) return;
    state.library.push(hydrateLibraryItem({ ...it, id: uid(), addedAt: Date.now() }));
    existingLib.add(k); libAdded++;
  });
  let sessAdded = 0;
  sess.forEach(s => {
    state.sessions.push(hydrate({ ...s, id: uid() }));
    sessAdded++;
  });
  return { libAdded, sessAdded, replaced: false };
}
