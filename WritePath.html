function reviseStep(s){
  if(!s.sentences.length) return `<div class="empty">Write some sentences first — then you can revise them here.</div>`;
  return `
  <div class="panel"><h3>Revise your sentences</h3><p class="muted small">Rewrite any sentence and keep the original for comparison. Target-language matches update automatically.</p></div>

    const revs = (s.revisions || []).filter(r => r.sentenceId === x.id);
    const changed = x.text !== x.original;
    const draft = (x.id in ui.reviseDraft) ? ui.reviseDraft[x.id] : x.text;
    return `<div class="panel" id="rev-${x.id}">
      <div class="row between" style="margin-bottom:8px"><h4 style="margin:0">Sentence ${i + 1}</h4><span class="muted small">${esc(s.nodes.find(n => n.id === x.nodeId)?.instruction || 'free writing')}</span></div>
      ${changed ? `<div class="compare"><div><div class="lbl">Original</div><p class="quote">${esc(x.original)}</p></div><div><div class="lbl">Current</div><p class="quote rev">${esc(x.text)}</p></div></div>` : `<p class="quote">${esc(x.text)}</p>`}
      <div style="margin-top:10px"><textarea rows="3" data-revise="${x.id}" placeholder="Rewrite this sentence…">${esc(draft)}</textarea></div>
      <div class="row" style="margin-top:9px"><button class="btn primary" data-act="save-revision" data-id="${x.id}">Save revision</button>${changed ? `<button class="btn ghost" data-act="revert-revision" data-id="${x.id}">Revert to original</button>` : ''}</div>
      ${revs.length ? `<div class="history"><div class="lbl">Revision history</div>${revs.map(r => `<div class="histrow"><span class="before">${esc(r.before)}</span><span class="arrow">→</span><span class="after">${esc(r.after)}</span></div>`).join('')}</div>` : ''}
    </div>`;
  }).join('')}`;
}

function renderProgress(){
  const rows = computeProgress();
  const totalSessions = state.sessions.length;
  const totalSentences = state.sessions.reduce((a, s) => a + s.sentences.length, 0);
  const totalWords = state.sessions.reduce((a, s) => a + countWords(s), 0);
  const maxTimes = rows.reduce((a, r) => Math.max(a, r.times), 1);
  const totalLibrary = state.library.length;
  return `
  ${topbar('progress')}
  <main class="wrap">
    <div class="row between" style="align-items:flex-start">
      <div><h1 style="margin-bottom:4px">Progress</h1><p class="muted" style="margin-bottom:18px">How often you have actually used each piece of target language across all sessions.</p></div>
    </div>
    <div class="statgrid" style="grid-template-columns:repeat(4,1fr)">
      <div class="stat"><div class="lbl">Sessions</div><div class="num">${totalSessions}</div></div>
      <div class="stat"><div class="lbl">Sentences</div><div class="num">${totalSentences}</div></div>
      <div class="stat"><div class="lbl">Words written</div><div class="num">${totalWords}</div></div>
      <div class="stat"><div class="lbl">Library items</div><div class="num">${totalLibrary}</div></div>
    </div>
    <div class="panel">
      <div class="row between" style="align-items:flex-start; flex-wrap:wrap; gap:10px">
        <div><h3 style="margin-bottom:2px">Backup &amp; restore</h3><p class="muted small" style="margin:0">Export a single file containing every session, every library item, and all settings.</p></div>
        <div class="row"><button class="btn primary" data-act="export-all-json">📤 Export all data</button><button class="btn" data-act="import-all-data">📥 Import backup</button></div>
      </div>
    </div>
    ${rows.length ? `
      <table>
        <thead><tr><th>Item</th><th>Type</th><th>Sessions</th><th>Times used</th><th></th></tr></thead>
        <tbody>${rows.map(r => `<tr><td>${esc(r.text)}</td><td class="muted">${kindName(r.kind)}</td><td>${r.sessions}</td><td>${r.times}</td><td><span class="usebar"><i style="width:${Math.round(r.times / maxTimes * 100)}%"></i></span></td></tr>`).join('')}</tbody>
      </table>` : `<div class="empty">No target language tracked yet. Create a session and add some targets.</div>`}
  </main>`;
}
function computeProgress(){
  const map = new Map();
  for(const s of state.sessions){
    const usedInSession = committedUsed(s);
    const counts = {};
    for(const sen of s.sentences){ (sen.usedTargetIds || []).forEach(id => counts[id] = (counts[id] || 0) + 1); }
    for(const t of s.targets){
      const key = t.kind + '::' + norm(t.text);
      if(!map.has(key)) map.set(key, { text: t.text, kind: t.kind, sessions: 0, times: 0 });
      const rec = map.get(key);
      if(usedInSession.has(t.id)) rec.sessions++;
      rec.times += counts[t.id] || 0;
    }
  }
  return Array.from(map.values()).sort((a, b) => b.times - a.times || b.sessions - a.sessions);
}

const SPELLING = [
  [/\balot\b/gi, '"alot" is two words: "a lot".'],
  [/\bteh\b/gi, 'Typo: "teh" → "the".'],
  [/\brecieve\w*/gi, 'Spelling: "receive".'],
  [/\bseperate\w*/gi, 'Spelling: "separate".'],
  [/\bdefinately\b/gi, 'Spelling: "definitely".'],
  [/\bbecuase\b/gi, 'Spelling: "because".'],
  [/\bthier\b/gi, 'Spelling: "their".'],
  [/\bwich\b/gi, 'Spelling: "which".'],
  [/\boccured\b/gi, 'Spelling: "occurred".'],
  [/\buntill\b/gi, 'Spelling: "until".'],
  [/\bgoverment\b/gi, 'Spelling: "government".'],
  [/\b(could|would|should|must|might)\s+of\b/gi, 'Use "have", not "of": could have / would have.']
];
const APOSTROPHE = { dont:"don't", cant:"can't", wont:"won't", isnt:"isn't", didnt:"didn't", doesnt:"doesn't", wasnt:"wasn't", werent:"weren't", im:"I'm", ive:"I've", youre:"you're", theyre:"they're", thats:"that's", wouldnt:"wouldn't", couldnt:"couldn't", shouldnt:"shouldn't", hasnt:"hasn't", havent:"haven't" };
const FILLERS = ['very','really','just','actually','basically','quite','totally','stuff','things','nice','good','a lot'];

function analyzeSentence(text){
  const issues = [];
  const t = String(text).trim();
  if(!t) return issues;
  const add = (level, msg) => issues.push({ level, msg });
  if(/^[a-z]/.test(t)) add('error', 'This sentence starts with a lowercase letter.');
  if(!/[.!?…"')\]]\s*$/.test(t)) add('error', 'This sentence has no ending punctuation.');
  if(/\s{2,}/.test(t)) add('warn', 'Double space detected.');
  if(/\s+[,.;:!?]/.test(t)) add('warn', 'There is a space before a punctuation mark.');
  if(/[,;:][^\s\d]/.test(t)) add('warn', 'Missing space after a punctuation mark.');
  if(/(^|\s)i(\s|$)/.test(t)) add('error', 'The pronoun "I" is always capitalized.');
  const rep = t.match(/\b(\w+)\s+\1\b/i);
  if(rep) add('error', `Repeated word: “${rep[1]} ${rep[1]}”.`);
  const aVowel = t.match(/\ba\s+([A-Za-z]\w*)/);
  if(aVowel && /^[aeiou]/i.test(aVowel[1]) && !/^(uni|use|usu|eu|one|ubiq)/i.test(aVowel[1])) add('warn', `Use “an” before “${aVowel[1]}”.`);
  const anCons = t.match(/\ban\s+([A-Za-z]\w*)/);
  if(anCons && /^[bcdfgjklmnpqrstvwxyz]/i.test(anCons[1]) && !/^(hour|honest|honor|heir|herb)/i.test(anCons[1])) add('warn', `Use “a” before “${anCons[1]}”.`);
  for(const [re, msg] of SPELLING){ if(re.test(t)) add('error', msg); }
  const lower = t.toLowerCase();
  for(const bad in APOSTROPHE){ if(new RegExp('\\b' + bad + '\\b').test(lower)) add('warn', `Missing apostrophe: “${bad}” → “${APOSTROPHE[bad]}”.`); }
  const wc = wordsIn(t);
  if(wc > 34) add('tip', `This sentence is ${wc} words long — consider splitting it into two.`);
  if(wc < 4) add('tip', 'This sentence is very short. Is it doing enough work?');
  const filler = FILLERS.find(f => new RegExp('\\b' + escRe(f) + '\\b', 'i').test(t));
  if(filler) add('tip', `“${filler}” is a weak filler word — a more specific word usually reads better.`);
  if(/\b(is|are|was|were|be|been|being)\s+\w+(ed|en)\b/i.test(t)) add('tip', 'Possible passive voice — an active version is usually clearer and more direct.');
  if(/^(there\s+(is|are|was|were))\b/i.test(t)) add('tip', 'Starting with “there is/are” is flat. Try leading with the real subject.');
  if(/^(and|but|so)\b/i.test(t)) add('tip', 'Starting a sentence with a conjunction is fine in informal writing — just be aware of it.');
  return issues;
}
function analyzeSession(s){
  const perSentence = s.sentences.map(x => analyzeSentence(x.text));
  const sessionFeedback = [];
  if(!s.sentences.length) return { perSentence, sessionFeedback, suggestions: [] };
  const total = countWords(s);
  if(!isExpansionSession(s) && s.targetWords && total < s.targetWords * 0.75){
    sessionFeedback.push({ level:'warn', msg:`You are under your target: ${total} of ${s.targetWords} words.` });
  }
  if(!isExpansionSession(s) && s.targetWords && total > s.targetWords * 1.4){
    sessionFeedback.push({ level:'tip', msg:`You went well past your target (${total} vs ${s.targetWords} words). Cutting usually strengthens a text.` });
  }
  const openers = {};
  s.sentences.forEach(x => {
    const w = (x.text.trim().split(/\s+/)[0] || '').toLowerCase().replace(/[^a-z']/g, '');
    if(w) openers[w] = (openers[w] || 0) + 1;
  });
  Object.entries(openers).filter(([, c]) => c >= 3).forEach(([w, c]) => {
    sessionFeedback.push({ level:'tip', msg:`${c} sentences begin with “${w}”. Varying your openers makes the writing flow better.` });
  });
  const allWords = s.sentences.flatMap(x => (x.text.toLowerCase().match(/[a-z']+/g) || []));
  const unique = new Set(allWords);
  if(allWords.length > 40){
    const ttr = unique.size / allWords.length;
    if(ttr < 0.45) sessionFeedback.push({ level:'tip', msg:`Your vocabulary repeats a lot (type–token ratio ${ttr.toFixed(2)}). Try swapping in more precise words.` });
  }
  const lens = s.sentences.map(x => wordsIn(x.text));
  if(lens.length >= 4){
    const avg = lens.reduce((a, b) => a + b, 0) / lens.length;
    const variance = lens.reduce((a, b) => a + Math.pow(b - avg, 2), 0) / lens.length;
    if(Math.sqrt(variance) < 2.5) sessionFeedback.push({ level:'tip', msg:'All your sentences are a similar length. Mix short punchy sentences with longer ones for rhythm.' });
  }
  const errCount = perSentence.flat().filter(f => f.level === 'error').length;
  if(errCount === 0) sessionFeedback.push({ level:'tip', msg:'No basic grammar or punctuation errors detected. Solid control.' });
  else sessionFeedback.push({ level:'warn', msg:`${errCount} basic error${errCount === 1 ? '' : 's'} detected across your sentences — see the list below.` });
  const suggestions = [];
  perSentence.forEach((issues, i) => {
    const x = s.sentences[i];
    const serious = issues.filter(f => f.level === 'error' || f.level === 'warn');
    if(serious.length) suggestions.push({ index:i, sentenceId:x.id, text:x.text, reason: serious[0].msg });
    else if(issues.length >= 2) suggestions.push({ index:i, sentenceId:x.id, text:x.text, reason: issues[0].msg });
    else if(wordsIn(x.text) > 30) suggestions.push({ index:i, sentenceId:x.id, text:x.text, reason:'Very long — could be split or tightened.' });
  });
  return { perSentence, sessionFeedback, suggestions };
}

document.addEventListener('click', e => {
  const btn = e.target.closest('[data-act]');
  if(!btn) return;
  const act = btn.dataset.act;
  const s = currentSession();

  switch(act){

    case 'nav': {
      ui.view = btn.dataset.view;
      if(ui.view === 'home') ui.sessionId = null;
      if(ui.view !== 'library') { ui.libraryPickForSession = null; ui.librarySelected = []; }
      save(); render(); break;
    }

    case 'toggle-theme': {
      theme = theme === 'dark' ? 'light' : 'dark';
      localStorage.setItem(THEME_KEY, theme);
      applyTheme(); btn.textContent = theme === 'dark' ? '☀️' : '🌙';
      break;
    }

    case 'new-session': {
      const ns = newSession();
      state.sessions.push(ns);
      ui.view = 'session'; ui.sessionId = ns.id; ui.step = 'setup';
      save(); render(); break;
    }

    case 'open-session': {
      ui.view = 'session'; ui.sessionId = btn.dataset.id; ui.step = 'setup';
      save(); render(); break;
    }

    case 'del-session': {
      const id = btn.dataset.id;
      if(confirm('Delete this session? This cannot be undone.')){
        state.sessions = state.sessions.filter(x => x.id !== id);
        if(ui.sessionId === id){ ui.view = 'home'; ui.sessionId = null; }
        save(); render();
      }
      break;
    }

    case 'step': {
      if(!s) break;
      const target = btn.dataset.step;
      if(target === 'expand' && isExpansionSession(s)) ensureExpansion(s);
      ui.step = target;
      if(ui.step === 'write') ensureCursor(s);
      if(ui.step === 'review'){ s.reviewedAt = Date.now(); }
      save(); render();
      window.scrollTo({ top:0, behavior:'smooth' });
      break;
    }

    /* ---- Sentence Expansion: mode toggle ---- */
    case 'set-expansion-mode': {
      if(!s || !isExpansionSession(s)) break;
      const mode = btn.dataset.mode === EXPANSION_MODE_SELECTED ? EXPANSION_MODE_SELECTED : EXPANSION_MODE_FULL;
      if(mode === expansionMode(s)) break;
      s.expansionMode = mode;
      touch(s); render();
      toast(mode === EXPANSION_MODE_FULL ? 'Switched to Full terms' : 'Switched to Selected terms');
      break;
    }

    case 'import-topic': {
      if(!s || !isExpansionSession(s)) break;
      pendingImportMode = 'topic';
      $('#fileImport').click();
      break;
    }

    case 'import-kind': {
      if(!s || !isExpansionSession(s)) break;
      const kind = btn.dataset.kind;
      if(!KINDS[kind]){ toast('Unknown kind.'); break; }
      pendingImportMode = 'kind:' + kind;
      $('#fileImport').click();
      break;
    }

    /* ---- targets ---- */
    case 'add-target': {
      if(!s) break;
      const kind = $('#ntKind').value;
      const text = $('#ntText').value.trim();
      const requirement = $('#ntReq').value;
      const group = $('#ntGroup').value.trim();
      if(!text){ toast('Type the target language first.'); break; }
      s.targets.push({ id: uid(), kind, text, requirement, group: requirement === 'chooseOne' ? (group || 'Group 1') : '' });
      $('#ntText').value = ''; $('#ntGroup').value = '';
      touch(s); render(); toast('Target added');
      break;
    }

    case 'del-target': {
      if(!s) break;
      const id = btn.dataset.id;
      s.targets = s.targets.filter(t => t.id !== id);
      s.nodes.forEach(n => n.targetIds = n.targetIds.filter(x => x !== id));
      s.sentences.forEach(x => {
        x.usedTargetIds = (x.usedTargetIds || []).filter(x2 => x2 !== id);
        x.manualUsedIds = (x.manualUsedIds || []).filter(x2 => x2 !== id);
      });
      s.manualUsed = (s.manualUsed || []).filter(x => x !== id);
      s.draftManual = (s.draftManual || []).filter(x => x !== id);
      if(s.expansion && s.expansion.picked){
        Object.keys(s.expansion.picked).forEach(k => {
          s.expansion.picked[k] = (s.expansion.picked[k] || []).filter(x => x !== id);
        });
      }
      touch(s); render(); break;
    }

    /* ---- library ---- */
    case 'save-targets-to-library': {
      if(!s) break;
      if(!s.targets.length){ toast('No targets to save.'); break; }
      const added = saveTargetsToLibrary(s.targets);
      save(); render();
      toast(added ? `Saved ${added} new item${added===1?'':'s'} to library` : 'All items already in library.');
      break;
    }
    case 'save-one-to-library': {
      if(!s) break;
      const t = s.targets.find(x => x.id === btn.dataset.id);

      const added = saveTargetsToLibrary([t]);
      save(); render();
      toast(added ? 'Saved to library' : 'Already in library.');
      break;
    }
    case 'open-library-picker': {

      ui.libraryPickForSession = s.id;
      ui.librarySelected = [];

      window.scrollTo({ top:0, behavior:'smooth' }); break;
    }
    case 'cancel-library-picker': {

      ui.libraryPickForSession = null; ui.librarySelected = [];
      if(sid){ ui.view = 'session'; ui.sessionId = sid; ui.step = 'targets'; }
      save(); render(); break;
    }
    case 'confirm-library-picker': {
      const sid = ui.libraryPickForSession;
      const ts = state.sessions.find(x => x.id === sid);
      if(!ts){ toast('Session not found.'); ui.libraryPickForSession = null; ui.librarySelected = []; save(); render(); break; }
      if(!ui.librarySelected.length){ toast('Nothing selected.'); break; }
      const added = addLibraryItemsToSession(ui.librarySelected, ts);
      ui.libraryPickForSession = null; ui.librarySelected = [];
      ui.view = 'session'; ui.sessionId = sid; ui.step = 'targets';
      save(); render();
      toast(added ? `Added ${added} item${added===1?'':'s'} to session` : 'All selected items were already in the session.');
      break;
    }
    case 'add-library-item': {
      const kind = $('#libKind').value;
      const text = $('#libText').value.trim();
      const requirement = $('#libReq').value;
      const group = $('#libGroup').value.trim();
      const tags = $('#libTags').value.split(',').map(t => t.trim()).filter(Boolean);
      if(!text){ toast('Type the item first.'); break; }
      const dup = state.library.some(it => it.kind === kind && norm(it.text) === norm(text));
      if(dup){ toast('That item is already in your library.'); break; }
      state.library.push({ id: uid(), kind, text, requirement, group: requirement === 'chooseOne' ? (group || 'Group 1') : '', tags, addedAt: Date.now() });
      $('#libText').value = ''; $('#libGroup').value = ''; $('#libTags').value = '';
      save(); render(); toast('Added to library');
      break;
    }
    case 'del-library-item': {
      e.preventDefault(); e.stopPropagation();
      if(!confirm('Remove this item from your library?')) break;
      state.library = state.library.filter(it => it.id !== btn.dataset.id);
      ui.librarySelected = ui.librarySelected.filter(id => id !== btn.dataset.id);
      save(); render(); break;
    }
    case 'toggle-library-select': {
      const id = btn.dataset.id;
      const set = new Set(ui.librarySelected);
      if(set.has(id)) set.delete(id); else set.add(id);
      ui.librarySelected = Array.from(set); render(); break;
    }
    case 'clear-library-selection': { ui.librarySelected = []; render(); break; }
    case 'filter-library': { ui.libraryFilter = btn.dataset.kind; ui.librarySelected = []; render(); break; }
    case 'bulk-delete-library': {
      const ids = ui.librarySelected.slice();
      if(!ids.length) break;
      if(!confirm(`Delete ${ids.length} item${ids.length===1?'':'s'} from your library?`)) break;
      state.library = state.library.filter(it => !ids.includes(it.id));
      ui.librarySelected = [];
      save(); render(); toast('Deleted'); break;
    }
    case 'bulk-add-to-session': {
      const targetSid = $('#bulkSessionSelect') ? $('#bulkSessionSelect').value : '';
      if(!targetSid){ toast('Choose a session.'); break; }
      const ts = state.sessions.find(x => x.id === targetSid);
      if(!ts){ toast('Session not found.'); break; }
      if(!ui.librarySelected.length){ toast('Nothing selected.'); break; }
      const added = addLibraryItemsToSession(ui.librarySelected, ts);
      const count = ui.librarySelected.length;
      ui.librarySelected = [];
      save(); render();
      toast(added ? `Added ${added} item${added===1?'':'s'} to session` : `${count} item${count===1?'':'s'} already in that session.`);
      break;
    }
    case 'import-library': { pendingImportMode = 'library'; $('#fileImport').click(); break; }
    case 'export-library-csv': {
      if(!state.library.length){ toast('Library is empty.'); break; }
      download(`writepath-library-${new Date().toISOString().slice(0,10)}.csv`, exportLibraryCSV(), 'text/csv;charset=utf-8');
      toast('Library exported as CSV'); break;
    }
    case 'export-all-json': { downloadBackup(); break; }
    case 'import-all-data': { pendingImportMode = 'backup'; $('#fileImport').click(); break; }
    case 'import-targets': {
      if(!s) break;
      pendingImportMode = 'targets';
      $('#fileImport').click(); break;
    }
    case 'export-targets-csv': {
      if(!s) break;
      if(!s.targets.length){ toast('No targets to export.'); break; }
      download(`writepath-targets-${s.id}.csv`, exportTargetsCSV(s), 'text/csv;charset=utf-8');
      toast('Targets exported as CSV'); break;
    }

    /* ---- path ---- */
    case 'add-node': {
      if(!s) break;
      s.nodes.push({ id: uid(), instruction:'', targetIds: [], branches: [] });
      touch(s); render(); break;
    }
    case 'del-node': {
      if(!s) break;
      const id = btn.dataset.id;
      s.nodes = s.nodes.filter(n => n.id !== id);
      s.nodes.forEach(n => { n.branches = n.branches.filter(b => b.targetNodeId !== id); });
      if(s.currentNodeId === id) s.currentNodeId = s.nodes[0]?.id || null;
      touch(s); render(); break;
    }
    case 'toggle-node-target': {
      if(!s) break;
      const n = s.nodes.find(x => x.id === btn.dataset.id);
      if(!n) break;
      const tid = btn.dataset.tid;
      n.targetIds = n.targetIds.includes(tid) ? n.targetIds.filter(x => x !== tid) : n.targetIds.concat(tid);
      touch(s); render(); break;
    }
    case 'add-branch': {
      if(!s) break;
      const n = s.nodes.find(x => x.id === btn.dataset.id);
      if(!n) break;
      n.branches.push({ id: uid(), label:'', targetNodeId:'' });
      touch(s); render(); break;
    }
    case 'del-branch': {
      if(!s) break;
      const n = s.nodes.find(x => x.id === btn.dataset.nid);
      if(!n) break;
      n.branches = n.branches.filter(b => b.id !== btn.dataset.id);
      touch(s); render(); break;
    }

    /* ---- writing ---- */
    case 'add-sentence': {
      if(!s) break;
      const text = (s.draft || '').trim();
      if(!text){ toast('Write a sentence first.'); break; }
      const auto = autoMatch(text, s.targets);
      const manual = new Set(s.draftManual || []);
      const usedIds = Array.from(new Set([...auto, ...manual]));
      s.sentences.push({ id: uid(), nodeId: s.currentNodeId, text, original: text, usedTargetIds: usedIds, manualUsedIds: Array.from(manual), at: Date.now() });
      s.draft = ''; s.draftManual = [];
      const node = s.nodes.find(n => n.id === s.currentNodeId);
      if(node && node.branches.length) s.awaitingChoice = true;
      else if(node) advanceSequential(s);
      touch(s); render(); break;
    }
    case 'choose-branch': {
      if(!s) break;
      const node = s.nodes.find(n => n.id === s.currentNodeId);
      const b = node && node.branches.find(x => x.id === btn.dataset.id);
      s.awaitingChoice = false;
      if(b && b.targetNodeId && s.nodes.some(n => n.id === b.targetNodeId)) s.currentNodeId = b.targetNodeId;
      else advanceSequential(s);
      touch(s); render(); break;
    }
    case 'toggle-draft-target': {
      if(!s) break;
      const tid = btn.dataset.tid;
      const committed = committedUsed(s);
      if(committed.has(tid)) break;
      const set = new Set(s.draftManual || []);
      if(set.has(tid)) set.delete(tid); else set.add(tid);
      s.draftManual = Array.from(set);
      save(); updateSidebarLive(); break;
    }
    case 'finish': {
      if(!s) break;
      ui.step = 'review'; s.reviewedAt = Date.now();
      touch(s); render(); break;
    }
    case 'reset-draft': {
      if(!s) break;
      const hasText = (s.draft || '').trim().length > 0;
      const hasManual = (s.draftManual || []).length > 0;
      if(!hasText && !hasManual){ toast('Nothing to reset.'); break; }
      if(hasText && !confirm('Clear the sentence you are currently writing?')) break;
      s.draft = ''; s.draftManual = [];
      save(); render(); toast('Draft cleared'); break;
    }
    case 'reset-writing': {
      if(!s) break;
      if(isExpansionSession(s)){
        if(!confirm('Reset this expansion? This clears all eight stages and the final sentence. Your topic, openings and target language will be kept.')) break;
        s.expansion = newExpansionState();
        s.sentences = s.sentences.filter(x => !x.fromExpansion);
        s.reviewedAt = null;
        ui.step = 'expand';
        touch(s); render(); toast('Expansion reset'); break;
      }
      const hasAnything = s.sentences.length > 0 || (s.draft || '').trim().length > 0 || (s.draftManual || []).length > 0;
      if(!hasAnything){ toast('Nothing to reset.'); break; }
      const msg = s.sentences.length
        ? `Reset all writing in this session?\n\nThis will delete ${s.sentences.length} sentence${s.sentences.length===1?'':'s'} and any revisions, and move you back to the first node. Your target language and sentence path will be kept.`
        : 'Reset all writing in this session?\n\nThis will clear the current draft and move you back to the first node.';
      if(!confirm(msg)) break;
      s.sentences = []; s.revisions = []; s.manualUsed = [];
      s.draft = ''; s.draftManual = [];
      s.awaitingChoice = false; s.pathComplete = false;
      s.currentNodeId = s.nodes[0]?.id || null;
      s.reviewedAt = null;
      touch(s); render(); toast('Writing reset — back to the first node'); break;
    }
    case 'undo-last-sentence': {
      if(!s) break;
      if(!s.sentences.length){ toast('No sentence to undo.'); break; }
      const last = s.sentences[s.sentences.length - 1];
      if(!confirm(`Undo the last sentence?\n\n"${last.text.slice(0, 80)}${last.text.length > 80 ? '…' : ''}"`)) break;
      s.sentences.pop();
      s.awaitingChoice = false; s.pathComplete = false;
      if(last.nodeId && s.nodes.some(n => n.id === last.nodeId)) s.currentNodeId = last.nodeId;
      else s.currentNodeId = s.nodes[0]?.id || null;
      touch(s); render(); toast('Last sentence removed'); break;
    }

    /* ---- review ---- */
    case 'mark-used': {
      if(!s) break;
      const id = btn.dataset.id;
      const used = committedUsed(s);
      if(used.has(id)){
        s.manualUsed = (s.manualUsed || []).filter(x => x !== id);
        s.sentences.forEach(x => {
          x.usedTargetIds = (x.usedTargetIds || []).filter(x2 => x2 !== id);
          x.manualUsedIds = (x.manualUsedIds || []).filter(x2 => x2 !== id);
        });
        if(s.expansion && s.expansion.picked){
          Object.keys(s.expansion.picked).forEach(k => {
            s.expansion.picked[k] = (s.expansion.picked[k] || []).filter(x => x !== id);
          });
        }
      } else {
        s.manualUsed = Array.from(new Set([...(s.manualUsed || []), id]));
      }
      touch(s); render(); break;
    }
    case 'revise-jump': {
      ui.step = 'revise'; save(); render();
      const el = document.getElementById('rev-' + btn.dataset.id);
      if(el){ el.scrollIntoView({ behavior:'smooth', block:'center' }); el.querySelector('textarea')?.focus(); }
      break;
    }
    case 'save-revision': {
      if(!s) break;
      const id = btn.dataset.id;
      const sen = s.sentences.find(x => x.id === id);
      if(!sen) break;
      const next = (ui.reviseDraft[id] ?? sen.text).trim();
      if(!next){ toast('The revision is empty.'); break; }
      if(next === sen.text){ toast('Nothing changed.'); break; }
      s.revisions.push({ id: uid(), sentenceId: id, before: sen.text, after: next, at: Date.now() });
      sen.text = next;
      const auto = autoMatch(next, s.targets);
      sen.usedTargetIds = Array.from(new Set([...auto, ...(sen.manualUsedIds || [])]));
      delete ui.reviseDraft[id];
      touch(s); render(); toast('Revision saved'); break;
    }
    case 'revert-revision': {
      if(!s) break;
      const id = btn.dataset.id;
      const sen = s.sentences.find(x => x.id === id);
      if(!sen) break;
      if(!confirm('Revert this sentence to its original version?')) break;
      s.revisions.push({ id: uid(), sentenceId: id, before: sen.text, after: sen.original, at: Date.now() });
      sen.text = sen.original;
      const auto = autoMatch(sen.text, s.targets);
      sen.usedTargetIds = Array.from(new Set([...auto, ...(sen.manualUsedIds || [])]));
      delete ui.reviseDraft[id];
      touch(s); render(); break;
    }

    /* ---- expansion ---- */
    case 'expand-jump': {
      if(!s || !isExpansionSession(s)) break;
      const ex = ensureExpansion(s);
      const i = Number(btn.dataset.idx);
      if(Number.isFinite(i)) ex.currentStage = Math.max(0, Math.min(EXPANSION_STAGES.length - 1, i));
      touch(s); render();
      window.scrollTo({ top:0, behavior:'smooth' }); break;
    }
    case 'expand-pick': {
      if(!s || !isExpansionSession(s)) break;
      const ex = ensureExpansion(s);
      const stage = EXPANSION_STAGES[ex.currentStage];
      const id = btn.dataset.id;
      const bucketKey = stage.key;
      if(!ex.picked[bucketKey]) ex.picked[bucketKey] = [];
      const arr = ex.picked[bucketKey];
      const idx = arr.indexOf(id);
      if(idx >= 0) arr.splice(idx, 1); else arr.push(id);
      touch(s); render(); break;
    }
    case 'expand-use-opening': {
      if(!s || !isExpansionSession(s)) break;
      const ex = ensureExpansion(s);
      const i = Number(btn.dataset.idx);
      const opening = (s.openings || [])[i];
      if(!opening){ toast('Opening not found.'); break; }
      const cur = (ex.stages.basic || '').trim();
      if(cur && cur !== opening.trim()){
        if(!confirm('Replace your current basic sentence with this opening?')) break;
      }
      ex.stages.basic = opening;
      ex.currentStage = 0;
      touch(s); render();
      setTimeout(() => {
        const ta = document.querySelector('[data-expand-field="basic"]');
        if(ta){ ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
      }, 40);
      break;
    }
    case 'expand-next': {
      if(!s || !isExpansionSession(s)) break;
      const ex = ensureExpansion(s);
      const idx = ex.currentStage;
      const stage = EXPANSION_STAGES[idx];
      const txt = (ex.stages[stage.key] || '').trim();
      if(!txt){ toast('Write something first.'); break; }
      ex.stages[stage.key] = txt;
      const nextIdx = Math.min(idx + 1, EXPANSION_STAGES.length - 1);
      const nextStage = EXPANSION_STAGES[nextIdx];
      if(!(ex.stages[nextStage.key] || '').trim()) ex.stages[nextStage.key] = txt;
      ex.currentStage = nextIdx;
      touch(s); render();
      window.scrollTo({ top:0, behavior:'smooth' }); break;
    }
    case 'expand-prev': {
      if(!s || !isExpansionSession(s)) break;
      const ex = ensureExpansion(s);
      if(ex.currentStage > 0) ex.currentStage--;
      touch(s); render();
      window.scrollTo({ top:0, behavior:'smooth' }); break;
    }
    case 'expand-restart': {
      if(!s || !isExpansionSession(s)) break;
      if(!confirm('Start this expansion over? All eight stages will be cleared. Your topic and openings will be kept.')) break;
      s.expansion = newExpansionState();
      s.sentences = s.sentences.filter(x => !x.fromExpansion);
      s.reviewedAt = null;
      touch(s); render(); toast('Expansion cleared'); break;
    }
    case 'expand-finish': {
      if(!s || !isExpansionSession(s)) break;
      const ex = ensureExpansion(s);
      const finalText = (ex.stages.final || '').trim();
      const min = EXPANSION_STAGES[EXPANSION_STAGES.length - 1].minWords || 20;
      if(wordsIn(finalText) < min){ toast(`Final version needs at least ${min} words.`); break; }
      ex.completedAt = Date.now();
      s.sentences = s.sentences.filter(x => !x.fromExpansion);
      const auto = autoMatch(finalText, s.targets);
      const manual = expansionPickedIds(s);
      s.sentences.push({ id: uid(), nodeId: null, text: finalText, original: finalText,
        usedTargetIds: Array.from(new Set([...auto, ...manual])),
        manualUsedIds: Array.from(manual),
        fromExpansion: true, at: Date.now() });
      s.reviewedAt = Date.now();
      ui.step = 'review';
      touch(s); render(); toast('Expansion complete 🎉'); break;
    }
  }
});

/* ---------- live field updates ---------- */
function onField(e){
  const t = e.target;
  if(t.id === 'libSearch'){
    ui.librarySearch = t.value;
    const pos = t.selectionStart;
    render();
    const el = $('#libSearch');
    if(el){ el.focus(); el.setSelectionRange(pos, pos); }
    return;
  }
  if(!t.dataset) return;
  const s = currentSession();
  if('sfield' in t.dataset && s){
    let v = t.value;
    if(t.type === 'number') v = Math.max(0, Number(v) || 0);
    s[t.dataset.sfield] = v;
    s.updatedAt = Date.now();
    if(t.dataset.sfield === 'textType'){
      if(v === EXPANSION_TYPE){ ensureExpansion(s); if(!s.expansionMode) s.expansionMode = EXPANSION_MODE_FULL; }
    }
    save();
    if(t.dataset.sfield === 'targetWords') updateMeta();
    if(t.dataset.sfield === 'textType'){ render(); }
    return;
  }
  if(!s) return;
  if('tfield' in t.dataset){
    const tg = s.targets.find(x => x.id === t.dataset.targetId);
    if(tg){ tg[t.dataset.tfield] = t.value; touch(s); }
    return;
  }
  if('nfield' in t.dataset){
    const n = s.nodes.find(x => x.id === t.dataset.nodeId);
    if(n){ n[n.dataset.nfield] = t.value; touch(s); }
    return;
  }
  if('bfield' in t.dataset){
    for(const n of s.nodes){
      const b = n.branches.find(x => x.id === t.dataset.branchId);
      if(b){ b[t.dataset.bfield] = t.value; touch(s); break; }
    }
    return;
  }
  if('draft' in t.dataset){
    s.draft = t.value; s.updatedAt = Date.now();
    save(); updateSidebarLive(); return;
  }
  if('revise' in t.dataset){ ui.reviseDraft[t.dataset.revise] = t.value; return; }
  if('expandField' in t.dataset){
    if(!isExpansionSession(s)) return;
    const ex = ensureExpansion(s);
    ex.stages[t.dataset.expandField] = t.value;
    s.updatedAt = Date.now();
    save(); updateExpandCounterLive(s); return;
  }
}
document.addEventListener('input', onField);
document.addEventListener('change', onField);

function updateSidebarLive(){
  const s = currentSession();
  if(!s) return;
  const chips = $$('.tchip');
  if(!chips.length) return;
  const committed = committedUsed(s);
  const auto = autoMatch(s.draft || '', s.targets);
  const manual = new Set(s.draftManual || []);
  chips.forEach(chip => {
    const id = chip.dataset.tid;
    const isC = committed.has(id);
    const isL = !isC && (auto.has(id) || manual.has(id));
    chip.classList.toggle('committed', isC);
    chip.classList.toggle('live', isL);
  });
  const counter = $('.editor')?.closest('.panel')?.querySelector('.muted.small');
  if(counter) counter.textContent = `${wordsIn(s.draft || '')} word${wordsIn(s.draft||'')===1?'':'s'} in this sentence`;
}
function updateExpandCounterLive(s){
  const el = document.getElementById('expandCounter');
  if(!el) return;
  const ex = s.expansion;
  if(!ex) return;
  const idx = ex.currentStage;
  const stage = EXPANSION_STAGES[idx];
  const txt = ex.stages[stage.key] || '';
  const wc = wordsIn(txt);
  const min = stage.minWords || 0;
  const picked = new Set(ex.picked[stage.key] || []);
  const missing = Array.from(picked).filter(id => {
    const t = s.targets.find(x => x.id === id);
    return t ? !textIncludes(txt, t.text) : false;
  });
  let html = `${wc} word${wc===1?'':'s'}`;
  if(min) html += ` · minimum ${min}`;
  if(missing.length) html += ` · <span style="color:var(--amber)">${missing.length} picked item${missing.length===1?'':'s'} not yet in the sentence</span>`;
  el.innerHTML = html;
  const fin = document.querySelector('[data-act="expand-finish"]');
  if(fin) fin.disabled = wc < min;
  const next = document.querySelector('[data-act="expand-next"]');
  if(next) next.disabled = !txt.trim();
}

/* ---------- file import ---------- */
$('#fileImport').addEventListener('change', async e => {
  const file = e.target.files && e.target.files[0];
  if(!file){ pendingImportMode = 'targets'; return; }

  let text = '';
  try { text = await file.text(); }
  catch(err){
    toast('Could not read file.');
    e.target.value = ''; pendingImportMode = 'targets'; return;
  }

  /* ----- FULL BACKUP ----- */
  if(pendingImportMode === 'backup'){
    let data;
    try { data = JSON.parse(text); }
    catch(err){
      toast('Invalid backup file (not JSON).');
      e.target.value = ''; pendingImportMode = 'targets'; return;
    }
    const lib = Array.isArray(data.library) ? data.library : [];
    const sess = Array.isArray(data.sessions) ? data.sessions : [];
    if(!lib.length && !sess.length){
      toast('Backup contains no sessions or library items.');
      e.target.value = ''; pendingImportMode = 'targets'; return;
    }
    const replace = confirm(
      `Import backup?\n\n` +
      `• ${sess.length} session${sess.length === 1 ? '' : 's'}\n` +
      `• ${lib.length} library item${lib.length === 1 ? '' : 's'}\n\n` +
      `OK = Replace all current data\n` +
      `Cancel = Merge into current data`
    );
    const result = applyBackup(data, replace ? 'replace' : 'merge');
    save(); render();
    toast(result.replaced
      ? `Backup restored — ${result.sessAdded} session(s), ${result.libAdded} library item(s)`
      : `Merged — added ${result.sessAdded} session(s), ${result.libAdded} library item(s)`);
    e.target.value = ''; pendingImportMode = 'targets'; return;
  }

  const s = currentSession();

  /* ----- TOPIC FILE (selected terms mode) ----- */
  if(pendingImportMode === 'topic'){
    if(!s){ toast('Open a session first.'); e.target.value=''; pendingImportMode='targets'; return; }
    let data;
    try { data = JSON.parse(text); }
    catch(err){ toast('The topic file must be a JSON file.'); e.target.value=''; pendingImportMode='targets'; return; }
    if(Array.isArray(data)){
      toast('The topic file must be a JSON object with a "topic" field, not an array.'); e.target.value=''; pendingImportMode='targets'; return;
    }
    const topic = String(data.topic ?? data.Topic ?? '').trim();
    if(!topic){
      toast('The topic file must contain a non-empty "topic" field.');
      e.target.value=''; pendingImportMode='targets'; return;
    }
    const openings = readOpenings(data.openings ?? data.Openings ?? data.opening ?? data.Opening);
    s.topic = topic;
    if(openings.length) s.openings = openings;

    // Also accept items if present
    let added = 0;
    const itemsSrc = data.items ?? data.targets ?? data.library;
    if(Array.isArray(itemsSrc)){
      const existing = new Set(s.targets.map(t => t.kind + '::' + norm(t.text)));
      itemsSrc.forEach(it => {
        const obj = typeof it === 'string' ? { text: it } : it;
        const normed = normalizeItem(obj);
        if(!normed) return;
        const key = normed.kind + '::' + norm(normed.text);
        if(existing.has(key)) return;
        s.targets.push({ id: uid(), kind: normed.kind, text: normed.text, requirement: normed.requirement,
          group: normed.requirement === 'chooseOne' ? (normed.group || 'Group 1') : '' });
        existing.add(key); added++;
      });
    }
    touch(s); render();
    toast(`Topic set: "${topic}"${openings.length?` · ${openings.length} opening(s)`:''}${added?` · ${added} item(s) added`:''}`);
    e.target.value=''; pendingImportMode='targets'; return;
  }

  /* ----- KIND FILE (selected terms mode) ----- */
  if(pendingImportMode.startsWith('kind:')){
    if(!s){ toast('Open a session first.'); e.target.value=''; pendingImportMode='targets'; return; }
    const forcedKind = pendingImportMode.slice(5);
    if(!KINDS[forcedKind]){ toast('Unknown kind: ' + forcedKind); e.target.value=''; pendingImportMode='targets'; return; }

    let arr;
    try { arr = extractItemsFromJSON(text); }
    catch(err){
      toast('Could not read the file. Expected a JSON array of items.');
      e.target.value=''; pendingImportMode='targets'; return;
    }
    const existing = new Set(s.targets.map(t => t.kind + '::' + norm(t.text)));
    let added = 0;
    arr.forEach(it => {
      const obj = typeof it === 'string' ? { text: it } : it;
      const normed = normalizeItem(obj);
      if(!normed) return;
      // Force the kind based on which file was uploaded
      const key = forcedKind + '::' + norm(normed.text);
      if(existing.has(key)) return;
      s.targets.push({
        id: uid(), kind: forcedKind, text: normed.text,
        requirement: normed.requirement,
        group: normed.requirement === 'chooseOne' ? (normed.group || 'Group 1') : ''
      });
      existing.add(key); added++;
    });
    touch(s); render();
    toast(added ? `Added ${added} ${kindName(forcedKind).toLowerCase()} item${added===1?'':'s'}`
                : `No new ${kindName(forcedKind).toLowerCase()} items to add.`);
    e.target.value=''; pendingImportMode='targets'; return;
  }

  /* ----- TARGETS / LIBRARY (full mode or non-expansion) ----- */
  let items = [];
  let topic = '';
  let openings = [];
  try {
    const parsed = parseTargetsFile(file.name, text);
    items = parsed.items;
    topic = parsed.topic || '';
    openings = Array.isArray(parsed.openings) ? parsed.openings : [];
  }
  catch(err){
    toast('Could not parse file: ' + err.message);
    e.target.value = ''; pendingImportMode = 'targets'; return;
  }
  if(!items.length){
    toast('No terms found in the file.');
    e.target.value = ''; pendingImportMode = 'targets'; return;
  }

  if(pendingImportMode === 'library'){
    const existing = new Set(state.library.map(it => it.kind + '::' + norm(it.text)));
    let added = 0;
    items.forEach(it => {
      const key = it.kind + '::' + norm(it.text);
      if(existing.has(key)) return;
      state.library.push({ id: uid(), kind: it.kind, text: it.text, requirement: it.requirement, group: it.group || '', tags: it.tags || [], addedAt: Date.now() });
      existing.add(key); added++;
    });
    save(); render();
    toast(added ? `Imported ${added} item${added === 1 ? '' : 's'} to library` : 'All items already in library.');
  } else {
    if(!s){ toast('Open a session first.'); e.target.value = ''; pendingImportMode = 'targets'; return; }

    if(isExpansionSession(s) && expansionMode(s) === EXPANSION_MODE_FULL){
      const lower = file.name.toLowerCase();
      const isJSON = lower.endsWith('.json') || text.trim().startsWith('{') || text.trim().startsWith('[');
      if(!isJSON){
        toast('Full mode requires a JSON file with "topic" and "openings".');
        e.target.value = ''; pendingImportMode = 'targets'; return;
      }
      if(!topic){
        toast('JSON is missing the required "topic" field.');
        e.target.value = ''; pendingImportMode = 'targets'; return;
      }
      if(!openings.length){
        toast('JSON is missing the required "openings" array (or it is empty).');
        e.target.value = ''; pendingImportMode = 'targets'; return;
      }
    }

    const existing = new Set(s.targets.map(t => t.kind + '::' + norm(t.text)));
    let added = 0;
    items.forEach(it => {
      const key = it.kind + '::' + norm(it.text);
      if(existing.has(key)) return;
      s.targets.push({
        id: uid(), kind: it.kind, text: it.text,
        requirement: it.requirement,
        group: it.requirement === 'chooseOne' ? (it.group || 'Group 1') : ''
      });
      existing.add(key); added++;
    });

    let metaMsg = '';
    if(topic){
      const hadTopic = (s.topic || '').trim();
      if(!hadTopic){ s.topic = topic; metaMsg = ' · topic set'; }
      else if(hadTopic !== topic){
        const useNew = confirm(`The file has a topic:\n\n"${topic}"\n\nYour session already has:\n\n"${hadTopic}"\n\nOK = replace with the file's topic\nCancel = keep the existing one`);
        if(useNew){ s.topic = topic; metaMsg = ' · topic replaced'; }
      }
    }
    if(openings.length){
      s.openings = openings.slice();
      metaMsg += (metaMsg ? ' ' : ' · ') + `${openings.length} opening${openings.length===1?'':'s'} set`;
    }
    touch(s); render();
    toast(added ? `Imported ${added} item${added === 1 ? '' : 's'}${metaMsg}` : `All items already in this session${metaMsg}`);
  }

  e.target.value = '';
  pendingImportMode = 'targets';
});

/* ---------- keyboard shortcut: Ctrl/Cmd + Enter advances a sentence or stage ---------- */
document.addEventListener('keydown', e => {
  if((e.metaKey || e.ctrlKey) && e.key === 'Enter'){
    if(ui.step === 'write' && ui.view === 'session' && !currentSession()?.awaitingChoice){
      e.preventDefault();
      document.querySelector('[data-act="add-sentence"]')?.click();
    }
    if(ui.step === 'expand' && ui.view === 'session'){
      const s = currentSession();
      if(s && s.expansion && s.expansion.currentStage < EXPANSION_STAGES.length - 1){
        e.preventDefault();
        document.querySelector('[data-act="expand-next"]')?.click();
      } else if(s && s.expansion && s.expansion.currentStage === EXPANSION_STAGES.length - 1){
        e.preventDefault();
        document.querySelector('[data-act="expand-finish"]')?.click();
      }
    }
  }
});

load();
applyTheme();
if(ui.view === 'session' && !currentSession()){ ui.view = 'home'; ui.sessionId = null; }
render();
</script>
