<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>30 Words a Day</title>
<style>
  *,*::before,*::after{box-sizing:border-box}
  :root{
    color-scheme:light;
    --bg:#f4f5f7; --surface:#fff; --line:#e6e8ec;
    --ink:#14161c; --muted:#6b7280; --soft:#9aa0ad;
    --accent:#4f46e5; --accent-soft:#eef2ff;
    --good:#10b981; --warn:#f59e0b; --bad:#ef4444;
    --radius:12px;
  }
  [data-theme="dark"]{
    color-scheme:dark;
    --bg:#0f1115; --surface:#181b21; --line:#2a2e37;
    --ink:#e8eaee; --muted:#9aa1ad; --soft:#6b7280;
    --accent:#818cf8; --accent-soft:#232842;
    --good:#34d399; --warn:#fbbf24; --bad:#f87171;
  }
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
    background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;
    -webkit-font-smoothing:antialiased;
  }
  .shell{max-width:1120px;margin:0 auto;padding:14px}
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
  .brand{font-weight:800;letter-spacing:-.02em;font-size:16px}
  .brand em{font-style:normal;color:var(--soft);font-weight:500}
  .meta{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted)}
  .streak{background:#fff7ed;color:#c2410c;font-weight:700;padding:4px 10px;border-radius:999px}
  .home{
    display:inline-flex;align-items:center;gap:5px;
    border:1px solid var(--line);background:#fff;color:var(--muted);
    padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;
    text-decoration:none;transition:.15s;white-space:nowrap;line-height:1.4
  }
  .home:hover{background:#f3f4f7;color:var(--ink)}
  .gear{border:1px solid var(--line);background:#fff;width:30px;height:30px;border-radius:9px;
        display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;
        color:var(--muted);transition:.15s;padding:0}
  .gear:hover{background:#f3f4f7;color:var(--ink);transform:rotate(30deg)}
  .nav{display:flex;gap:4px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav button{
    border:0;background:transparent;color:var(--muted);font:inherit;font-size:13px;font-weight:600;
    padding:6px 12px;border-radius:8px;cursor:pointer;white-space:nowrap;
    display:flex;gap:6px;align-items:center;transition:.15s
  }
  .nav button:hover{background:#e9eaee;color:var(--ink)}
  .nav button.on{background:var(--ink);color:#fff}
  .nav .badge{background:var(--accent);color:#fff;border-radius:999px;font-size:10.5px;
              padding:0 6px;min-width:16px;text-align:center;line-height:16px;font-weight:700}
  .nav button.on .badge{background:#fff;color:var(--ink)}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
  .card h2{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--soft);font-weight:700}
  .grid{display:grid;gap:10px}
  .g-2{grid-template-columns:repeat(2,1fr)}
  .g-3{grid-template-columns:repeat(3,1fr)}
  .g-4{grid-template-columns:repeat(4,1fr)}
  .g-dash{grid-template-columns:1.4fr 1fr;grid-template-areas:
    "hero side"
    "items items"}
  @media(max-width:780px){
    .g-4{grid-template-columns:repeat(2,1fr)}
    .g-3{grid-template-columns:repeat(2,1fr)}
    .g-dash{grid-template-columns:1fr;grid-template-areas:"hero" "side" "items"}
  }
  @media(max-width:480px){
    .g-2{grid-template-columns:1fr}
  }
  .hero{grid-area:hero}
  .side{grid-area:side;display:grid;gap:10px;align-content:start}
  .items{grid-area:items}
  .items-cols{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(320px, 1fr));
    column-gap:28px;
    row-gap:0;
  }
  @media(max-width:740px){ .items-cols{grid-template-columns:1fr; column-gap:0} }
  .muted{color:var(--muted)}
  .tiny{font-size:11.5px}
  .row{display:flex;align-items:center;gap:8px}
  .between{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .wrap{display:flex;flex-wrap:wrap;gap:6px}
  .num{font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1}
  .num small{font-size:15px;color:#c8ccd4;font-weight:700}
  .bar{height:7px;background:#eef0f3;border-radius:999px;overflow:hidden}
  .bar>i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .3s}
  .bar.good>i{background:var(--good)}
  .stat{background:#fafbfc;border:1px solid #eff1f4;border-radius:10px;padding:9px 11px}
  .stat .v{font-size:19px;font-weight:800;letter-spacing:-.02em}
  .stat .k{font-size:10.5px;color:var(--soft);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
  .btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:7px 12px;border-radius:8px;
       font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;transition:.15s;white-space:nowrap}
  .btn:hover{background:#f3f4f7}
  .btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.pri:hover{background:#4338ca}
  .btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
  .btn.ghost:hover{background:#eceef2;color:var(--ink)}
  .btn.danger{color:#b91c1c;border-color:#fecaca}
  .btn.danger:hover{background:#fef2f2}
  .btn.sm{padding:4px 9px;font-size:11.5px;border-radius:7px}
  .btn:disabled{opacity:.4;cursor:default}
  .btn.wide{width:100%;justify-content:center;text-align:center}
  .btn.rate-again{color:#b91c1c}
  .btn.rate-hard{color:#b45309}
  .btn.rate-easy{color:#047857}
  .btn.danger-ghost{color:#b91c1c;border-color:transparent;background:transparent}
  .btn.danger-ghost:hover{background:#fef2f2}
  .done-check{color:#047857;font-weight:700}
  .selbar-count{font-weight:700;color:var(--accent)}
  .wcheck{color:#9aa0ad}
  .wcheck.ok{color:#047857}
  .pill{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:999px;
        font-size:10.5px;font-weight:700;background:#f1f2f5;color:#5b6270;letter-spacing:.01em}
  .pill.collocation{background:#eef2ff;color:#4338ca}
  .pill.phrasal{background:#e0f2fe;color:#0369a1}
  .pill.chunk{background:#fef3c7;color:#b45309}
  .pill.vocab{background:#d1fae5;color:#047857}
  .pill.new{background:#f1f2f5;color:#6b7280}
  .pill.studied{background:#e0e7ff;color:#3730a3}
  .pill.practicing{background:#fef3c7;color:#b45309}
  .pill.active{background:#d1fae5;color:#047857}
  .pill.mastered{background:#ede9fe;color:#6d28d9}
  .item{display:flex;align-items:center;gap:8px;padding:5px 2px;border-bottom:1px solid #f2f3f6;cursor:pointer}
  .item:last-child{border-bottom:0}
  .item:hover{background:#fafbfc}
  .item.sel{background:var(--accent-soft)}
  .item .t{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
  .item .t small{display:block;font-weight:400;color:var(--soft);font-size:11px;line-height:1.25;
                 overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
  .cbx{width:18px;height:18px;border:1.5px solid #d1d5db;border-radius:5px;display:flex;align-items:center;
       justify-content:center;font-size:11px;font-weight:800;color:#fff;background:#fff;flex-shrink:0;cursor:pointer}
  .cbx.on{background:var(--accent);border-color:var(--accent)}
  .inp{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;font-size:13px;
       background:#fff;color:var(--ink);outline:none;transition:.15s;resize:vertical}
  .inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,70,229,.12)}
  select.inp{
    appearance:none;-webkit-appearance:none;
    background-image:linear-gradient(45deg,transparent 50%,#9aa0ad 50%),linear-gradient(135deg,#9aa0ad 50%,transparent 50%);
    background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;
    background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:28px;cursor:pointer
  }
  .lbl{display:block;font-size:10.5px;font-weight:700;color:var(--soft);letter-spacing:.05em;
       text-transform:uppercase;margin:0 0 4px}
  .field{margin-bottom:10px}
  .chip{border:1px solid var(--line);background:#fff;padding:5px 11px;border-radius:999px;font:inherit;
        font-size:12px;font-weight:600;cursor:pointer;color:#4b5563;transition:.15s}
  .chip:hover{background:#f3f4f7}
  .chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .chip.on[data-rcat="collocation"]{background:#4338ca;border-color:#4338ca}
  .chip.on[data-rcat="phrasal"]{background:#0369a1;border-color:#0369a1}
  .chip.on[data-rcat="chunk"]{background:#b45309;border-color:#b45309}
  .chip.on[data-rcat="vocab"]{background:#047857;border-color:#047857}
  .modal{position:fixed;inset:0;display:none;z-index:100}
  .modal.on{display:block}
  .modal .bg{position:absolute;inset:0;background:rgba(15,17,22,.45);backdrop-filter:blur(2px)}
  .modal .panel{position:relative;background:#fff;max-width:600px;margin:30px auto;border-radius:14px;
                max-height:calc(100vh - 60px);overflow-y:auto;padding:18px;
                box-shadow:0 24px 60px rgba(0,0,0,.25)}
  @media(max-width:600px){.modal .panel{margin:0;border-radius:0;max-height:100vh;height:100vh}}
  .bigq{font-size:24px;font-weight:800;letter-spacing:-.02em;margin:6px 0 4px}
  .opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;
       padding:11px 13px;border-radius:9px;font:inherit;font-size:13.5px;cursor:pointer;margin-bottom:6px;
       transition:.15s;font-weight:500}
  .opt:hover{background:#f7f8fa;border-color:#c9ced8}
  .fb{padding:10px 13px;border-radius:9px;font-size:13.5px;margin-top:8px}
  .fb.ok{background:#ecfdf5;color:#047857}
  .fb.no{background:#fef2f2;color:#b91c1c}
  .mem{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
  @media(max-width:520px){.mem{grid-template-columns:repeat(3,1fr);gap:5px}}
  .mem .c{aspect-ratio:1;border-radius:10px;display:flex;align-items:center;justify-content:center;
          padding:6px;text-align:center;font-size:12px;font-weight:600;cursor:pointer;
          background:var(--ink);color:#fff;border:2px solid transparent;transition:.18s;
          word-break:break-word;overflow:hidden;user-select:none;-webkit-tap-highlight-color:transparent}
  .mem .c:hover{transform:translateY(-1px)}
  .mem .c.up{background:var(--accent-soft);color:#3730a3;border-color:#c7d2fe;transform:none;cursor:default}
  .mem .c.ok{background:#ecfdf5;color:#047857;border-color:var(--good);opacity:.7;transform:none;cursor:default}
  .mem .c .f{font-size:20.5px;line-height:1.2;max-height:100%;overflow:hidden;
             display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical}
  .mem .c .q{font-size:20px;opacity:.45;font-weight:800}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .cal .dow{font-size:10.5px;font-weight:700;color:var(--soft);text-align:center;padding:3px 0}
  .cal .d{aspect-ratio:1;border-radius:7px;display:flex;flex-direction:column;align-items:center;
          justify-content:center;font-size:11.5px;font-weight:600;color:var(--muted);background:#f4f5f8}
  .cal .d.today{outline:2px solid var(--ink);outline-offset:1px}
  .cal .d.l1{background:#e0e7ff;color:#3730a3}
  .cal .d.l2{background:#c7d2fe;color:#312e81}
  .cal .d.l3{background:#818cf8;color:#fff}
  .cal .d.l4{background:var(--accent);color:#fff}
  .cal .d.x{background:transparent}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--soft);
     padding:6px 5px;border-bottom:1px solid var(--line);font-weight:700}
  td{padding:7px 5px;border-bottom:1px solid #f2f3f6}
  th.n,td.n{text-align:right;font-variant-numeric:tabular-nums}
  .empty{padding:22px 0;text-align:center;color:var(--soft);font-size:12.5px}
  .sep{height:1px;background:#f2f3f6;margin:10px 0}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;
         padding:9px 16px;border-radius:9px;font-size:12.5px;font-weight:600;z-index:200;opacity:0;
         transition:.22s;pointer-events:none}
  .toast.on{opacity:1;bottom:30px}
  mark{background:#fde68a;border-radius:3px;padding:0 2px;color:#78350f;font-weight:600}
  .selbar{background:var(--accent-soft);border:1px solid #c7d2fe;border-radius:9px;padding:8px 12px;margin-top:10px}
  .csv-pv{max-height:180px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;padding:6px;background:#fafbfc}
  .csv-pv table{font-size:11.5px}
  .csv-pv th,.csv-pv td{padding:4px 6px}
  .res-head{cursor:pointer;user-select:none}
  .res-head:hover b{color:var(--accent)}
  .chapter-list .item{cursor:default}
  .chapter-list .item .t{white-space:normal}
  .chapter-list .item .t small{white-space:normal}
  .chal-pick{max-height:320px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;
             padding:4px 8px;background:#fafbfc;margin-top:8px}
  .chal-pick .item{cursor:pointer}
  .chal-pick .item.sel{background:var(--accent-soft)}
  .chal-pick .item:hover{background:#f2f4f8}
  .set-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  @media(max-width:520px){.set-grid{grid-template-columns:repeat(2,1fr)}}

  /* ============================================================
     DARK THEME COMPONENT OVERRIDES
     ============================================================ */
  [data-theme="dark"] .streak{background:#3a2716;color:#fb923c}
  [data-theme="dark"] .home{background:#181b21;color:var(--muted)}
  [data-theme="dark"] .home:hover{background:#22262e;color:var(--ink)}
  [data-theme="dark"] .gear{background:#181b21;color:var(--muted)}
  [data-theme="dark"] .gear:hover{background:#22262e;color:var(--ink)}
  [data-theme="dark"] .nav button:hover{background:#22262e}
  [data-theme="dark"] .nav button.on{background:#2f3540;color:#fff}
  [data-theme="dark"] .nav button.on .badge{background:#e8eaee;color:#0f1115}
  [data-theme="dark"] .stat{background:#1e222a;border-color:#2a2e37}
  [data-theme="dark"] .btn{background:#22262e;border-color:#2f3540}
  [data-theme="dark"] .btn:hover{background:#2a2e37}
  [data-theme="dark"] .btn.pri{background:var(--accent);border-color:var(--accent);color:#0f1115}
  [data-theme="dark"] .btn.pri:hover{background:#6f7cf0}
  [data-theme="dark"] .btn.ghost:hover{background:#22262e}
  [data-theme="dark"] .btn.danger{color:#f87171;border-color:#7f1d1d}
  [data-theme="dark"] .btn.danger:hover{background:#3b1a1a}
  [data-theme="dark"] .btn.rate-again{color:#f87171}
  [data-theme="dark"] .btn.rate-hard{color:#fbbf24}
  [data-theme="dark"] .btn.rate-easy{color:#34d399}
  [data-theme="dark"] .btn.danger-ghost{color:#f87171}
  [data-theme="dark"] .btn.danger-ghost:hover{background:#3b1a1a}
  [data-theme="dark"] .done-check{color:#34d399}
  [data-theme="dark"] .selbar-count{color:var(--accent)}
  [data-theme="dark"] .wcheck{color:#6b7280}
  [data-theme="dark"] .wcheck.ok{color:#34d399}
  [data-theme="dark"] .item{border-bottom-color:#22262e}
  [data-theme="dark"] .item:hover{background:#1e222a}
  [data-theme="dark"] .item.sel{background:var(--accent-soft)}
  [data-theme="dark"] .cbx{border-color:#3a4049;background:#181b21}
  [data-theme="dark"] .cbx.on{color:#0f1115}
  [data-theme="dark"] .inp{background:#1e222a}
  [data-theme="dark"] .chip{background:#1e222a;border-color:#2f3540;color:var(--muted)}
  [data-theme="dark"] .chip:hover{background:#2a2e37}
  [data-theme="dark"] .chip.on{background:var(--accent);border-color:var(--accent);color:#0f1115}
  [data-theme="dark"] .chip.on[data-rcat="collocation"]{background:#4338ca;border-color:#4338ca;color:#fff}
  [data-theme="dark"] .chip.on[data-rcat="phrasal"]{background:#0369a1;border-color:#0369a1;color:#fff}
  [data-theme="dark"] .chip.on[data-rcat="chunk"]{background:#b45309;border-color:#b45309;color:#fff}
  [data-theme="dark"] .chip.on[data-rcat="vocab"]{background:#047857;border-color:#047857;color:#fff}
  [data-theme="dark"] .pill{background:#252a33;color:#9aa1ad}
  [data-theme="dark"] .pill.collocation{background:#2a2f52;color:#a5b4fc}
  [data-theme="dark"] .pill.phrasal{background:#0c2d43;color:#7dd3fc}
  [data-theme="dark"] .pill.chunk{background:#3a2716;color:#fcd34d}
  [data-theme="dark"] .pill.vocab{background:#0f2e22;color:#6ee7b7}
  [data-theme="dark"] .pill.new{background:#252a33;color:#9aa1ad}
  [data-theme="dark"] .pill.studied{background:#252a52;color:#a5b4fc}
  [data-theme="dark"] .pill.practicing{background:#3a2716;color:#fcd34d}
  [data-theme="dark"] .pill.active{background:#0f2e22;color:#6ee7b7}
  [data-theme="dark"] .pill.mastered{background:#2c1f52;color:#c4b5fd}
  [data-theme="dark"] .bar{background:#22262e}
  [data-theme="dark"] .num small{color:#4a5058}
  [data-theme="dark"] .modal .panel{background:#181b21}
  [data-theme="dark"] .opt{background:#1e222a}
  [data-theme="dark"] .opt:hover{background:#252a33;border-color:#3a4049}
  [data-theme="dark"] .fb.ok{background:#0f2e22;color:#6ee7b7}
  [data-theme="dark"] .fb.no{background:#3b1a1a;color:#fca5a5}
  [data-theme="dark"] .mem .c{background:#2a2e37;color:var(--ink)}
  [data-theme="dark"] .mem .c.up{background:var(--accent-soft);color:#c7d2fe;border-color:#4338ca}
  [data-theme="dark"] .mem .c.ok{background:#0f2e22;color:#6ee7b7;border-color:var(--good)}
  [data-theme="dark"] .cal .d{background:#22262e;color:var(--muted)}
  [data-theme="dark"] .cal .d.l1{background:#232842;color:#c7d2fe}
  [data-theme="dark"] .cal .d.l2{background:#312e81;color:#e0e7ff}
  [data-theme="dark"] .cal .d.l3{background:#6366f1;color:#fff}
  [data-theme="dark"] .cal .d.l4{background:var(--accent);color:#0f1115}
  [data-theme="dark"] td{border-bottom-color:#22262e}
  [data-theme="dark"] mark{background:#78350f;color:#fde68a}
  [data-theme="dark"] .selbar{background:var(--accent-soft);border-color:#4338ca}
  [data-theme="dark"] .csv-pv{background:#1e222a}
  [data-theme="dark"] .sep{background:#22262e}
  [data-theme="dark"] .toast{background:#e8eaee;color:#0f1115}
  [data-theme="dark"] .chal-pick{background:#1e222a}
  [data-theme="dark"] .chal-pick .item:hover{background:#252a33}
  [data-theme="dark"] .chal-pick .item.sel{background:var(--accent-soft)}
</style>
</head>
<body>

<div class="shell">
  <div class="top">
    <div class="brand">30 words <em>a day</em></div>
    <div class="meta">
      <a class="home" href="../index.html" title="Back to Home">🏠 Home</a>
      <span id="todayLabel"></span>
      <span class="streak">🔥 <b id="streakNum">0</b></span>
      <button class="gear" data-act="openSettings" title="Settings" aria-label="Settings">⚙</button>
    </div>
  </div>
  <nav class="nav" id="nav"></nav>
  <main id="app"></main>
</div>

<div class="modal" id="modal"></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   CONSTANTS
   ============================================================ */
const CATS = ['collocation','phrasal','chunk','vocab'];
const CAT_LABEL = {collocation:'Collocation',phrasal:'Phrasal Verb',chunk:'Chunk',vocab:'Vocabulary'};
const CAT_SHORT = {collocation:'Colloc',phrasal:'Phrasal',chunk:'Chunk',vocab:'Vocab'};
const STATUS_LABEL = {new:'New',studied:'Studying',practicing:'Practicing',active:'Active',mastered:'Mastered'};
const INTERVALS = [0,1,3,7,14,30,60];
const SCHEDULE  = ['Day 0','Day 1','Day 3','Day 7','Day 14','Day 30','Mastered'];
const WRITE_REQ = {collocation:2,phrasal:1,chunk:1,vocab:2};
const LS_KEY = 'words30.v2';
const MEM_PAIRS = 6;

/* --- Resources --- */
const RES_TYPES = ['book','podcast','course','article','video','other'];

const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const uid = ()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const escRe = s => String(s).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const norm = s => String(s||'').toLowerCase().replace(/[^a-z0-9' ]/g,'').replace(/\s+/g,' ').trim();
const shuffle = a => { for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; };

function iso(d=new Date()){ const t=new Date(d.getTime()-d.getTimezoneOffset()*6e4); return t.toISOString().slice(0,10); }
function parseISO(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function addDays(s,n){ const d=parseISO(s); d.setDate(d.getDate()+n); return iso(d); }
function fmtDate(s){ return parseISO(s).toLocaleDateString(undefined,{month:'short',day:'numeric'}); }
function fmtLong(s){ return parseISO(s).toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'}); }

function toast(msg){
  const t=$('#toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'),1800);
}

function downloadFile(filename, text, mime){
  const blob = new Blob([text], {type: mime || 'text/plain;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

function mapCategory(raw){
  const s = String(raw||'').trim().toLowerCase().replace(/[_-]+/g,' ');
  if(!s) return '';
  if(['collocation','collocations','colloc','col'].includes(s)) return 'collocation';
  if(['phrasal verb','phrasal verbs','phrasal','pv','phrasalverb'].includes(s)) return 'phrasal';
  if(['chunk','chunks'].includes(s)) return 'chunk';
  if(['vocabulary','vocab','word','words'].includes(s)) return 'vocab';
  return '';
}

/* ============================================================
   THEME
   ============================================================ */
function applyTheme(){
  const pref = (S && S.settings && S.settings.theme) || 'system';
  let resolved = pref;
  if(pref === 'system'){
    resolved = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  document.documentElement.dataset.theme = resolved;
}
function bindSystemTheme(){
  if(!window.matchMedia) return;
  const q = window.matchMedia('(prefers-color-scheme: dark)');
  const handler = ()=>{ if(((S && S.settings && S.settings.theme) || 'system') === 'system') applyTheme(); };
  if(q.addEventListener) q.addEventListener('change', handler);
  else if(q.addListener) q.addListener(handler);
}

/* ============================================================
   CSV
   ============================================================ */
function parseCSV(text){
  if(text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const rows=[]; let row=[], f='', q=false, i=0;
  while(i<text.length){
    const c=text[i];
    if(q){
      if(c === '"'){ if(text[i+1]==='"'){f+='"';i+=2;continue;} q=false;i++;continue; }
      f+=c;i++;continue;
    }
    if(c === '"'){q=true;i++;continue;}
    if(c === ','){row.push(f);f='';i++;continue;}
    if(c === '\r'){i++;continue;}
    if(c === '\n'){row.push(f);rows.push(row);row=[];f='';i++;continue;}
    f+=c;i++;
  }
  if(f.length||row.length){row.push(f);rows.push(row);}
  return rows.filter(r => r.some(cell => String(cell).trim().length));
}

function csvToItems(rows){
  if(!rows.length) return { items:[], skipped:0, headerUsed:false, uncategorized:0 };
  const header = rows[0].map(h=>String(h||'').trim().toLowerCase());
  const aliases = {
    term:['term','word','expression','phrase','item','vocabulary','entry'],
    meaning:['meaning','definition','translation','explanation','sense','gloss'],
    example:['example sentence','example','sentence','sample sentence','sample','usage','context'],
    category:['category','type','kind','class','group','cat']
  };
  const find = k => header.findIndex(h => aliases[k].includes(h));
  let ti=find('term'), mi=find('meaning'), ei=find('example'), ci=find('category');
  const headerUsed = ti!==-1 || mi!==-1 || ei!==-1 || ci!==-1;
  if(!headerUsed){ti=0;mi=1;ei=2;ci=3;}
  if(ti===-1)ti=0; if(mi===-1)mi=1; if(ei===-1)ei=2;
  const body = headerUsed ? rows.slice(1) : rows;
  const items=[]; let skipped=0, uncategorized=0;
  for(const r of body){
    const term = String(r[ti]||'').trim();
    if(!term){skipped++;continue;}
    const rawCat = ci>=0 ? String(r[ci]||'').trim() : '';
    const category = mapCategory(rawCat);
    if(!category) uncategorized++;
    items.push({
      term,
      meaning: mi>=0 ? String(r[mi]||'').trim() : '',
      example: ei>=0 ? String(r[ei]||'').trim() : '',
      category,
      rawCategory: rawCat
    });
  }
  return { items, skipped, headerUsed, uncategorized };
}

function csvEscape(v){
  const s = String(v==null?'':v);
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
}

function defaultSettings(){
  return { target:30, dist:{collocation:10,phrasal:5,chunk:5,vocab:10}, theme:'system' };
}
function mk(term,category,meaning,example,source,extra){
  return Object.assign({
    id:uid(), term, category, meaning, example,
    personal:'', source:source||'', difficulty:2, notes:'', pronunciation:'', related:'',
    resourceId:'', chapterId:'',
    inbox:false, dateAdded:iso(), challengeDate:null,
    studiedAt:null, practicedAt:null, activeAt:null, masteredAt:null,
    reviews:[], stage:0, nextReview:iso()
  }, extra||{});
}
function emptyState(){ return { settings:defaultSettings(), items:[], days:{}, resources:[], challenges:[] }; }
function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){
      const p=JSON.parse(raw);
      if(p && Array.isArray(p.items)){
        if(!Array.isArray(p.resources)) p.resources = [];
        if(!Array.isArray(p.challenges)) p.challenges = [];
        if(!p.settings || typeof p.settings!=='object') p.settings = defaultSettings();
        if(!p.settings.theme) p.settings.theme = 'system';
        p.resources.forEach(r=>{
          if(!Array.isArray(r.chapters)) r.chapters = [];
          if(!Array.isArray(r.categories)) r.categories = [];
        });
        p.challenges.forEach(c=>{ if(!Array.isArray(c.itemIds)) c.itemIds = []; });
        return p;
      }
    }
  }catch(e){}
  return emptyState();
}

  const ch = r.chapters || [];
  const total = ch.length;
  const done = ch.filter(c=>c.done).length;
  const pct = total ? Math.round(done/total*100) : 0;
  const idx = ch.findIndex(c=>c.id === r.currentChapterId);
  return { total, done, pct, idx };

/* ============================================================
   DERIVED
   ============================================================ */
function dayOf(d){ return S.days[d] || {target:S.settings.target, dist:{...S.settings.dist}, writing:'', writeSel:[]}; }
function ensureDay(d){
  if(!S.days[d]) S.days[d] = {target:S.settings.target, dist:{...S.settings.dist}, writing:'', writeSel:[]};
  return S.days[d];
}
function statusOf(it){
  if(it.masteredAt || it.stage>=6) return 'mastered';
  if(it.stage>=3 || it.activeAt)  return 'active';
  if(it.practicedAt)              return 'practicing';
  if(it.studiedAt)                return 'studied';
  return 'new';
}
function dueItems(){ const T=iso(); return S.items.filter(i=>!i.inbox && i.nextReview<=T); }
function inboxItems(){ return S.items.filter(i=>i.inbox); }
function todayChallenge(){ const T=iso(); return S.items.filter(i=>i.challengeDate===T); }
function activeCount(){ return S.items.filter(i=>['active','mastered'].includes(statusOf(i))).length; }
function masteredCount(){ return S.items.filter(i=>statusOf(i)==='mastered').length; }

function dayStats(d){
  const I=S.items;
  return {
    collected: I.filter(i=>i.dateAdded===d).length,
    studied:   I.filter(i=>i.studiedAt===d).length,
    practiced: I.filter(i=>i.practicedAt===d).length,
    active:    I.filter(i=>i.activeAt===d).length,
    mastered:  I.filter(i=>i.masteredAt===d).length,
    target:    dayOf(d).target
  };
}
function dayActive(d){
  return S.items.some(i=>i.dateAdded===d||i.studiedAt===d||i.practicedAt===d||i.activeAt===d);
}
function streak(){
  let n=0, d=iso();
  if(!dayActive(d)) d=addDays(d,-1);
  let g=0;
  while(dayActive(d) && g++<400){ n++; d=addDays(d,-1); }
  return n;
}

function clearSelection(){ ui.selectMode=false; ui.selected=new Set(); }
function filteredLibrary(){
  ui.lib = ui.lib || {cat:'all',status:'all',q:'',res:'all'};
  let list = S.items.filter(i=>!i.inbox);
  if(ui.lib.cat!=='all')    list = list.filter(i=>i.category===ui.lib.cat);
  if(ui.lib.status!=='all') list = list.filter(i=>statusOf(i)===ui.lib.status);
  if(ui.lib.res && ui.lib.res!=='all') list = list.filter(i=>i.resourceId===ui.lib.res);
  if(ui.lib.q){
    const q = ui.lib.q.toLowerCase();
    list = list.filter(i=>(i.term+' '+i.meaning+' '+i.example).toLowerCase().includes(q));
  }
  return list.slice().sort((a,b)=> b.dateAdded.localeCompare(a.dateAdded) || a.term.localeCompare(b.term));
}
function deleteSelected(){
  const ids=[...ui.selected];
  if(!ids.length){ toast('Nothing selected'); return; }
  if(!confirm(`Delete ${ids.length} item${ids.length===1?'':'s'}? This cannot be undone.`)) return;
  const set = new Set(ids);
  S.items = S.items.filter(i=>!set.has(i.id));
  Object.values(S.days).forEach(d=>{
    if(Array.isArray(d.writeSel)) d.writeSel = d.writeSel.filter(id=>!set.has(id));
  });
  removeItemsFromChallenges(set);
  if(modalId && set.has(modalId)) modalId=null;
  clearSelection(); save(); render();
  toast(`Deleted ${ids.length} item${ids.length===1?'':'s'}`);
}

/* ============================================================
   MUTATIONS
   ============================================================ */
function markStudied(it){
  const T=iso();
  if(!it.studiedAt) it.studiedAt = T;
  if(it.inbox) it.inbox = false;
  save();
}
function markPracticed(it){
  const T=iso();
  if(!it.practicedAt) it.practicedAt = T;
  if(!it.studiedAt)   it.studiedAt   = T;
  save();
}
function rate(it, rating){
  const T = iso();
  let s = it.stage;
  if(rating==='again')      s = 0;
  else if(rating==='hard')  s = Math.max(0, s);
  else if(rating==='good')  s = s + 1;
  else if(rating==='easy')  s = s + 2;
  s = Math.min(s, 6);
  it.stage = s;
  it.nextReview = addDays(T, INTERVALS[s]);
  it.reviews.push({date:T, rating});
  if(!it.studiedAt) it.studiedAt = T;
  if(!it.practicedAt) it.practicedAt = T;
  if(s>=3 && !it.activeAt) it.activeAt = T;
  if(s>=6 && !it.masteredAt) it.masteredAt = T;
  save();
}

function buildFromInbox(){
  const T = iso();
  const day = ensureDay(T);
  const cur = todayChallenge();
  const have={}; CATS.forEach(c=>have[c]=0);
  cur.forEach(i=>{ if(have[i.category]!==undefined) have[i.category]++; });
  let added=0;
  CATS.forEach(c=>{
    let need = day.dist[c] - have[c];
    if(need<=0) return;
    let pool = S.items.filter(i=>i.inbox && i.category===c);
    if(pool.length<need) pool = pool.concat(S.items.filter(i=>i.inbox && !i.category));
    for(const it of pool){
      if(need<=0) break;
      it.inbox = false;
      it.category = c;
      it.challengeDate = T;
      it.dateAdded = T;
      it.nextReview = T;
      need--; added++;
    }
  });
  save();
  toast(added ? `Added ${added} item${added>1?'s':''} to today` : 'No matching items in inbox');
  render();
}

function exportCSV(){
  const head = ['Term','Meaning','Example','Category','Source','Personal','Status','Stage','Next Review','Date Added','Challenges'];
  const rows = S.items.map(i=>[
    i.term, i.meaning, i.example, i.category, i.source, i.personal,
    statusOf(i), i.stage, i.nextReview, i.dateAdded,
    challengesForItem(i.id).join(' | ')
  ]);
  const csv = [head, ...rows].map(r=>r.map(csvEscape).join(',')).join('\r\n');
  downloadFile('words30-items-'+iso()+'.csv', '\uFEFF'+csv, 'text/csv;charset=utf-8');
  toast(`Exported ${S.items.length} item${S.items.length===1?'':'s'} as CSV`);
}

function exportChallengesCSV(){
  const head = ['Challenge','Description','Target Date','Created','Words','Studied','Practiced','Active','Mastered','Items'];
  const rows = challengesList().map(ch=>{
    const st = challengeStats(ch);
    return [
      ch.title, ch.desc||'', ch.due||'', ch.createdAt||'',
      st.total, st.studied, st.practiced, st.active, st.mastered,
      challengeItems(ch).map(i=>i.term).join(' | ')
    ];
  });
  if(!rows.length){ toast('No challenges to export'); return; }
  const csv = [head, ...rows].map(r=>r.map(csvEscape).join(',')).join('\r\n');
  downloadFile('words30-challenges-'+iso()+'.csv', '\uFEFF'+csv, 'text/csv;charset=utf-8');
  toast('Exported challenges CSV');
}

function importData(){
  const inp = document.createElement('input');
  inp.type='file'; inp.accept='.json,application/json'; inp.style.display='none';
  document.body.appendChild(inp);
  inp.addEventListener('change', ev=>{
    const file = ev.target.files && ev.target.files[0];
    document.body.removeChild(inp);
    if(!file) return;
    const rd = new FileReader();
    rd.onload = re=>{
      try{
        const p = JSON.parse(re.target.result);
        if(!p || !Array.isArray(p.items)) throw new Error('bad');
        const items = p.items.map(raw=>mk(
          String(raw.term||'').trim(),
          CATS.includes(raw.category) ? raw.category : (raw.category||''),
          raw.meaning||'', raw.example||'', raw.source||'',
          {
            id: raw.id||uid(),
            personal: raw.personal||'', difficulty: Number(raw.difficulty)||2,
            notes: raw.notes||'', pronunciation: raw.pronunciation||'', related: raw.related||'',
            resourceId: raw.resourceId||'', chapterId: raw.chapterId||'',
            inbox: !!raw.inbox, dateAdded: raw.dateAdded||iso(),
            challengeDate: raw.challengeDate||null,
            studiedAt: raw.studiedAt||null, practicedAt: raw.practicedAt||null,
            activeAt: raw.activeAt||null, masteredAt: raw.masteredAt||null,
            reviews: Array.isArray(raw.reviews)?raw.reviews:[],
            stage: Number(raw.stage)||0, nextReview: raw.nextReview||iso()
          }
        ));
        const resources = Array.isArray(p.resources) ? p.resources.map(raw=>({
          id: raw.id||uid(),
          title: String(raw.title||'').trim(),
          type: RES_TYPES.includes(raw.type) ? raw.type : 'other',
          author: raw.author||'',
          notes: raw.notes||'',
          categories: Array.isArray(raw.categories) ? raw.categories.filter(c=>CATS.includes(c)) : [],
          dateAdded: raw.dateAdded||iso(),
          currentChapterId: raw.currentChapterId||null,
          chapters: Array.isArray(raw.chapters) ? raw.chapters.map(c=>({
            id: c.id||uid(),
            title: String(c.title||'').trim(),
            done: !!c.done,
            completedAt: c.completedAt||null
          })).filter(c=>c.title) : []
        })).filter(r=>r.title) : [];
        const itemIds = new Set(items.map(i=>i.id));
        const challenges = Array.isArray(p.challenges) ? p.challenges.map(raw=>({
          id: raw.id||uid(),
          title: String(raw.title||'').trim(),
          desc: raw.desc||'',
          due: raw.due||null,
          createdAt: raw.createdAt||iso(),
          itemIds: Array.isArray(raw.itemIds) ? raw.itemIds.filter(id=>itemIds.has(id)) : []
        })).filter(c=>c.title) : [];
        const settings = (p.settings && typeof p.settings==='object')
          ? {
              target:Number(p.settings.target)||30,
              theme: (p.settings.theme==='dark'||p.settings.theme==='light'||p.settings.theme==='system')
                     ? p.settings.theme : 'system',
              dist:Object.assign({collocation:10,phrasal:5,chunk:5,vocab:10},
                    (p.settings.dist && typeof p.settings.dist==='object') ? p.settings.dist : {})
            }
          : defaultSettings();
        const days = (p.days && typeof p.days==='object') ? p.days : {};
        const apply = ()=>{
          S = { settings, items, days, resources, challenges };
          save();
          ui = freshUi();
          modalId = null; modalView = null;
          applyTheme();
          nav('today');
          toast(`Imported ${items.length} item${items.length===1?'':'s'}`);
        };
        if(S.items.length){
          if(confirm(`Importing will replace your current ${S.items.length} item(s). Continue?`)) apply();
        } else apply();
      }catch(err){ console.error(err); toast('Import failed'); }
    };
    rd.readAsText(file);
  });
  inp.click();
}

/* ============================================================
   CSV UPLOAD (import)
   ============================================================ */
function openCSVUpload(){
  const inp = document.createElement('input');
  inp.type='file'; inp.accept='.csv,text/csv'; inp.style.display='none';
  document.body.appendChild(inp);
  inp.addEventListener('change', ev=>{
    const file = ev.target.files && ev.target.files[0];
    document.body.removeChild(inp);
    if(!file) return;
    const rd = new FileReader();
    rd.onload = re=>{
      try{
        const rows = parseCSV(re.target.result);
        const parsed = csvToItems(rows);
        if(!parsed.items.length){ toast('No usable rows in CSV'); return; }
        closeModal();
        ui.csvDraft = {
          fileName: file.name,
          items: parsed.items,
          skipped: parsed.skipped,
          headerUsed: parsed.headerUsed,
          uncategorized: parsed.uncategorized
        };
        nav('inbox');
      }catch(err){ console.error(err); toast('Could not parse CSV'); }
    };
    rd.readAsText(file);
  });
  inp.click();
}
function commitCSVImport(){
  const d = ui.csvDraft;
  if(!d || !d.items.length){ toast('Nothing to import'); return; }
  const T = iso();
  let added=0, unc=0;
  for(const it of d.items){
    S.items.push(mk(it.term, it.category||'', it.meaning, it.example, '', {
      inbox:true, dateAdded:T, nextReview:T
    }));
    if(!it.category) unc++;
    added++;
  }
  save();
  ui.csvDraft = null;
  toast(unc
    ? `Added ${added} item${added>1?'s':''} · ${unc} without category`
    : `Added ${added} item${added>1?'s':''} to inbox`);
  nav('inbox');
}

function viewToday(){
  const T = iso();
  const day = dayOf(T);
  const items = todayChallenge();
  const target = day.target;

  const collected = items.length;
  const studied   = items.filter(i=>i.studiedAt).length;
  const practiced = items.filter(i=>i.practicedAt).length;
  const active    = items.filter(i=>['active','mastered'].includes(statusOf(i))).length;
  const pct  = Math.min(100, Math.round(collected/target*100));
  const pctP = Math.min(100, Math.round(practiced/target*100));

  const byCat={}; CATS.forEach(c=>byCat[c]=0);
  items.forEach(i=>{ if(byCat[i.category]!==undefined) byCat[i.category]++; });
  const missing = CATS.filter(c=>byCat[c] < day.dist[c])
                      .map(c=>`${day.dist[c]-byCat[c]} ${CAT_SHORT[c]}`);

  const due = dueItems().length;
  const inboxN = inboxItems().length;
  const writingDone = !!(day.writing && day.writing.trim().length>40);

  const sorted = items.slice().sort((a,b)=>a.term.localeCompare(b.term));
  const list = sorted.length
    ? `<div class="items-cols">${sorted.map(rowItem).join('')}</div>`
    : `<div class="empty">No items yet. Add one or build from your inbox.</div>`;

  return `
  <div class="grid g-dash">
    <div class="card hero">
      <div class="between">
        <h2 style="margin:0">Today · ${fmtLong(T)}</h2>
        <button class="btn sm ghost" data-act="editDist">Distribution</button>
      </div>
      <div class="row" style="align-items:flex-end;margin-top:6px;gap:14px">
        <div class="num">${collected}<small>/${target}</small></div>
        <div class="muted tiny" style="padding-bottom:4px">collected today</div>
      </div>
      <div class="bar" style="margin-top:8px"><i style="width:${pct}%"></i></div>

      <div class="grid g-4" style="margin-top:12px">
        ${stat('Studied', studied)}
        ${stat('Practiced', practiced)}
        ${stat('Active', active)}
        ${stat('Review', due)}
      </div>

      <div class="bar good" style="margin-top:12px"><i style="width:${pctP}%"></i></div>
      <div class="tiny muted" style="margin-top:4px">Practice · ${practiced}/${target}</div>

      ${missing.length ? `
        <div class="sep"></div>
        <div class="tiny muted" style="margin-bottom:5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase">Still missing</div>
        <div class="wrap">${missing.map(m=>`<span class="pill">${esc(m)}</span>`).join('')}</div>
      ` : (collected>0 ? `
        <div class="sep"></div>
        <div class="tiny done-check">✓ Challenge complete</div>
      ` : '')}

      <div class="wrap" style="margin-top:12px">
        <button class="btn pri" data-act="smartBuild" ${inboxN?'':'disabled'}>⚡ Build from Inbox (${inboxN})</button>
        <button class="btn" data-nav="review">Review (${due})</button>
        <button class="btn" data-nav="practice">Practice</button>
        <button class="btn" data-nav="challenges">Challenges</button>
      </div>
    </div>

    <div class="side">
      <div class="card">
        <h2>Quick capture</h2>
        <div class="row">
          <input class="inp" id="quickTerm" placeholder="New word or expression…" autocomplete="off">
          <button class="btn pri" data-act="quickAdd">Save</button>
        </div>
        <div class="tiny muted" style="margin-top:6px">Goes straight to Inbox.</div>
      </div>

      <div class="card">
        <div class="between">
          <h2 style="margin:0">Writing</h2>
          <span class="pill ${writingDone?'active':''}">${writingDone?'Done':'Pending'}</span>
        </div>
        <div class="tiny muted" style="margin-top:4px">2 colloc · 1 phrasal · 1 chunk · 2 vocab</div>
        <button class="btn ${writingDone?'':'pri'} wide" style="margin-top:10px" data-nav="write">
          ${writingDone?'Edit paragraph':'Start writing'}

      </div>

      <div class="card">

          <h2 style="margin:0">Current chapter</h2>

        </div>

      </div>` : ''}

      <div class="between" style="margin-bottom:8px">

      </div>

function currentChapterLine(){
  const list = resourcesList();
  const act = list.filter(r=>currentChapter(r));
  if(!act.length) return `<span class="tiny muted">No current chapter set.</span>`;
  return act.map(r=>{
    const c = currentChapter(r);
    const p = resProgress(r);
    return `<div class="between" style="gap:10px;padding:3px 0">
      <span class="tiny" style="min-width:0">
        <b>${esc(r.title)}</b>
        <span class="muted"> · ${esc(c.title)}</span>
      </span>
      <span class="tiny muted">${p.idx+1}/${p.total}</span>
    </div>`;
  }).join('');
}

function stat(k,v){ return `<div class="stat"><div class="v">${v}</div><div class="k">${k}</div></div>`; }

function rowItem(it){
  const st = statusOf(it);
  const selView = (view==='library'||view==='inbox');
  if(selView && ui.selectMode){
    const on = ui.selected.has(it.id);
    return `<div class="item ${on?'sel':''}" data-toggle="${it.id}">
      <span class="cbx ${on?'on':''}">${on?'✓':''}</span>

      <span class="pill ${st}">${STATUS_LABEL[st]}</span>

  return `<div class="item" data-open="${it.id}">
    <span class="pill ${it.category}">${esc(CAT_SHORT[it.category]||'—')}</span>

function readAdd(){
  const g = id => ($('#'+id) ? $('#'+id).value.trim() : '');
  return {
    term: g('f_term'), category: ui.addCat||'',
    meaning: g('f_meaning'), example: g('f_example'), source: g('f_source'),
    personal: g('f_personal'), pronunciation: g('f_pronunciation'),
    related: g('f_related'), notes: g('f_notes'),
    resourceId: g('f_resource'), chapterId: g('f_chapter'),
    difficulty: Number(g('f_difficulty'))||2
  };
}
function clearAdd(){
  ['f_term','f_meaning','f_example','f_source','f_personal','f_pronunciation','f_related','f_notes']
    .forEach(id=>{ const e=$('#'+id); if(e) e.value=''; });
  const r = $('#f_resource'); if(r) r.value='';
  const c = $('#f_chapter'); if(c) c.innerHTML = chapterOptions(null,'');
}
function doAdd(openIt){
  const d = readAdd();
  if(!d.term){ toast('Enter a term'); return; }
  const T = iso();
  const it = mk(d.term, d.category, d.meaning, d.example, d.source, {
    personal:d.personal, pronunciation:d.pronunciation, related:d.related,
    notes:d.notes, difficulty:d.difficulty,
    resourceId:d.resourceId, chapterId:d.chapterId,
    dateAdded:T, nextReview:T, challengeDate:T
  });
  S.items.push(it);
  save();
  if(openIt) openItem(it.id);
  else { clearAdd(); toast('Added · '+it.term); render(); }
}

function challengePickerHtml(){
  const c = ui.chal;
  const d = c.draft || {itemIds:new Set()};
  const cat = c.pickCat || 'all';
  const q = (c.pickQ||'').toLowerCase();

  let list = S.items.filter(i=>!i.inbox);
  if(cat !== 'all') list = list.filter(i=>i.category===cat);
  if(q) list = list.filter(i=>(i.term+' '+i.meaning).toLowerCase().includes(q));
  list = list.slice().sort((a,b)=>a.term.localeCompare(b.term));

  if(!list.length){
    return `<div class="chal-pick"><div class="empty">No matching items in your library.</div></div>`;
  }
  const shown = list.slice(0,200);
  const rows = shown.map(it=>{
    const on = d.itemIds.has(it.id);
    return `<div class="item ${on?'sel':''}" data-chalpick="${it.id}">

  return `<div class="chal-pick">
    ${rows}
    ${list.length>200?`<div class="tiny muted" style="padding:6px">… ${list.length-200} more — refine your search</div>`:''}
  </div>`;
}

/* ---------- Memory game ---------- */
function viewMemory(){
  const p = ui.practice;
  if(p.pairsFound === p.totalPairs){
    return `<div class="card" style="text-align:center;padding:32px 14px">
      <div style="font-size:30px">🎉</div>
      <h2 style="margin-top:6px;text-transform:none;letter-spacing:0;color:var(--ink);font-size:16px">All matched!</h2>
      <div class="muted tiny">${p.moves} move${p.moves===1?'':'s'} · ${p.totalPairs} pair${p.totalPairs===1?'':'s'}</div>
      <div class="wrap" style="margin-top:12px;justify-content:center">
        <button class="btn pri" data-act="pracAgain">New game</button>
        <button class="btn" data-act="pracStop">Back to modes</button>
      </div>
    </div>`;
  }
  const grid = p.cards.map((c,i)=>{
    const up = c.flipped || c.matched;
    const cls = c.matched ? 'ok' : (c.flipped ? 'up' : '');
    const face = up ? `<span class="f">${esc(c.text)}</span>` : `<span class="q">?</span>`;
    return `<div class="c ${cls}" data-act="memFlip" data-idx="${i}">${face}</div>`;
  }).join('');
  return `<div class="card">
    <div class="between" style="margin-bottom:10px">
      <div class="tiny muted">Moves <b>${p.moves}</b> · Pairs <b>${p.pairsFound}/${p.totalPairs}</b></div>
      <button class="btn ghost sm" data-act="pracStop">End</button>
    </div>
    <div class="mem">${grid}</div>
    <div class="tiny muted" style="margin-top:10px;text-align:center">Match each term with its meaning.</div>
  </div>`;
}

function startMemoryGame(ids){
  const T = iso();
  const rank = i => (i.challengeDate===T?0:2) + (i.nextReview<=T?0:1);
  let pool = S.items.filter(i=>!i.inbox && i.meaning);
  if(Array.isArray(ids)){
    const set = new Set(ids);
    pool = pool.filter(i=>set.has(i.id));
  }
  pool.sort((a,b)=> rank(a)-rank(b) || a.stage-b.stage);
  pool = pool.slice(0, MEM_PAIRS);
  if(pool.length < 2){ toast('Need at least 2 items with meanings'); return; }
  const cards = [];
  pool.forEach(it=>{
    cards.push({itemId: it.id, type:'term',    text: it.term,    flipped:false, matched:false});
    cards.push({itemId: it.id, type:'meaning', text: it.meaning, flipped:false, matched:false});
  });
  shuffle(cards);
  ui.practice = {mode:'memory', cards, flipped:[], locked:false, moves:0,
                 pairsFound:0, totalPairs:pool.length, poolIds: Array.isArray(ids)?ids.slice():null};
  render();
}

function startPractice(mode, ids){
  if(mode==='memory'){ startMemoryGame(ids); return; }
  const T = iso();
  const rank = i => (i.challengeDate===T?0:2) + (i.nextReview<=T?0:1);
  let pool = S.items.filter(i=>!i.inbox && i.meaning);
  if(Array.isArray(ids)){
    const set = new Set(ids);
    pool = pool.filter(i=>set.has(i.id));
  }
  pool.sort((a,b)=> rank(a)-rank(b) || a.stage-b.stage);
  pool = pool.slice(0,10);
  if(!pool.length){ toast('No items with meanings to practice'); return; }
  ui.practice = {mode, q:pool.map(i=>i.id), idx:0, correct:0, fb:null, opts:null,
                 poolIds: Array.isArray(ids)?ids.slice():null};
  makeQ();
  render();
}
function makeQ(){
  const p = ui.practice; if(!p) return;
  const it = S.items.find(x=>x.id===p.q[p.idx]);
  p.fb=null;
  if(!it) return;
  if(p.mode==='recognition'){
    const others = shuffle(S.items.filter(x=>x.id!==it.id && x.meaning && x.meaning!==it.meaning).map(x=>x.meaning));
    p.opts = shuffle([it.meaning, ...others.slice(0,3)]);
  } else p.opts = null;
}
function pracAnswer(given){
  const p = ui.practice;
  const it = S.items.find(x=>x.id===p.q[p.idx]);
  const ok = norm(given) === norm(it.term);
  if(ok) p.correct++;
  markPracticed(it);
  p.fb = {ok, msg: ok ? `✓ Correct — <b>${esc(it.term)}</b>` : `✗ Answer: <b>${esc(it.term)}</b>`};
  render();
}

function updateWritePreview(){
  const T = iso();
  const day = dayOf(T);
  const text = day.writing || '';
  const sel = (day.writeSel||[]).map(id=>S.items.find(i=>i.id===id)).filter(Boolean);

  const counts = {}; CATS.forEach(c=>counts[c]=0);
  sel.forEach(it=>{
    if(text.toLowerCase().includes(it.term.toLowerCase()) && counts[it.category]!==undefined) counts[it.category]++;
  });
  const el = $('#wcheck');
  if(el){
    el.innerHTML = Object.entries(WRITE_REQ).map(([c,n])=>{
      const have = counts[c], ok = have>=n;
      return `<div class="between" style="padding:3px 0;font-size:12.5px">
        <span><span class="pill ${c}">${CAT_LABEL[c]}</span></span>
        <b class="wcheck ${ok?'ok':''}">${ok?'✓':'·'} ${have}/${n}</b>
      </div>`;
    }).join('');
  }
  const pv = $('#wpreview');
  if(pv){
    if(!text.trim()){ pv.innerHTML = '<span class="muted">Highlighted preview appears here.</span>'; return; }
    let out = esc(text);
    sel.forEach(it=>{
      const re = new RegExp('('+escRe(esc(it.term))+')','gi');
      out = out.replace(re,'<mark>$1</mark>');
    });
    pv.innerHTML = out;
  }
}

function viewReview(){
  const T = iso();
  const due = dueItems().sort((a,b)=> a.nextReview.localeCompare(b.nextReview) || a.stage-b.stage);

  if(!ui.reviewCard){
    if(!due.length){
      return `<div class="card" style="text-align:center;padding:34px 14px">
        <div style="font-size:30px">🌿</div>
        <h2 style="margin-top:6px;text-transform:none;letter-spacing:0;color:var(--ink);font-size:16px">Nothing due today</h2>
        <div class="tiny muted">Review queue is clear.</div>
        <div class="wrap" style="margin-top:10px;justify-content:center">
          <button class="btn" data-nav="practice">Practice anyway</button>
        </div>
      </div>`;
    }
    const preview = due.slice(0,10).map(it=>`
      <div class="item" data-open="${it.id}">
        <span class="pill ${it.category}">${esc(CAT_SHORT[it.category]||'—')}</span>
        <span class="t">${esc(it.term)}<small>${SCHEDULE[it.stage]||''} · next ${fmtDate(it.nextReview)}</small></span>

    return `<div class="card" style="text-align:center;padding:34px 14px">

      <span class="pill ${it.category}">${esc(CAT_LABEL[it.category]||'—')}</span>
      <span class="pill ${statusOf(it)}">${STATUS_LABEL[statusOf(it)]}</span>

    <div class="bigq">${esc(it.term)}</div>
    ${it.pronunciation?`<div class="tiny muted">${esc(it.pronunciation)}</div>`:''}
    <div style="margin-top:8px"><b>Meaning.</b> ${esc(it.meaning||'—')}</div>

    ${it.personal?`<div class="tiny" style="margin-top:6px"><b>You wrote:</b> ${esc(it.personal)}</div>`:''}
    ${res?`<div class="tiny muted" style="margin-top:6px">${RES_TYPE_ICON[res.type]||'🔖'} ${esc(res.title)}${chp?' · '+esc(chp.title):''}</div>`:''}

/* ============================================================
   STATS
   ============================================================ */
function viewStats(){
  const T = iso();
  const weekStart = addDays(T,-6);
  const monthStart = T.slice(0,8)+'01';
  const all = S.items.filter(i=>!i.inbox);

  const total = all.length;
  const thisWeek = all.filter(i=>i.dateAdded>=weekStart).length;
  const thisMonth = all.filter(i=>i.dateAdded>=monthStart).length;
  const activeV = activeCount();
  const masteredV = masteredCount();
  const due = dueItems().length;
  const inboxN = inboxItems().length;

  let done=0;
  for(let i=0;i<14;i++){
    const d = addDays(T,-i);
    if(dayStats(d).collected >= dayOf(d).target) done++;
  }
  const rate = Math.round(done/14*100);

  const byCat={}; CATS.forEach(c=>byCat[c]=0);
  all.forEach(i=>{ if(byCat[i.category]!==undefined) byCat[i.category]++; });
  const maxCat = Math.max(1, ...Object.values(byCat));

  const now = parseISO(T);
  const y = now.getFullYear(), m = now.getMonth();
  const lead = (new Date(y,m,1).getDay()+6)%7;
  const dim = new Date(y,m+1,0).getDate();
  let cal = ['M','T','W','T','F','S','S'].map(d=>`<div class="dow">${d}</div>`).join('');
  for(let i=0;i<lead;i++) cal += `<div class="d x"></div>`;
  for(let d=1;d<=dim;d++){
    const ds = iso(new Date(y,m,d));
    const s = dayStats(ds);
    const ratio = s.collected/(s.target||30);
    const lvl = ratio>=1?4 : ratio>=.66?3 : ratio>=.33?2 : ratio>0?1 : 0;
    cal += `<div class="d ${lvl?'l'+lvl:''} ${ds===T?'today':''}" title="${fmtDate(ds)} · ${s.collected}/${s.target}">
      ${d}${s.collected?`<span style="font-size:9px;opacity:.8">${s.collected}</span>`:''}
    </div>`;
  }

  const rows = [];
  for(let i=0;i<14;i++){
    const d = addDays(T,-i);
    const s = dayStats(d);
    rows.push(`<tr>
      <td>${fmtDate(d)}${i===0?' <span class="tiny muted">today</span>':''}</td>
      <td class="n">${s.target}</td>
      <td class="n">${s.collected}</td>
      <td class="n">${s.studied}</td>
      <td class="n">${s.practiced}</td>
      <td class="n">${s.active}</td>
      <td class="n">${s.mastered}</td>
    </tr>`);
  }

  const resList = resourcesList();
  const chList = challengesList();

  return `
  <div class="grid g-2" style="margin-bottom:10px">
    <div class="card">
      <h2>Overview</h2>
      <div class="grid g-4">
        ${stat('Total', total)}
        ${stat('Week', thisWeek)}
        ${stat('Month', thisMonth)}
        ${stat('Streak', streak())}
      </div>
      <div class="grid g-4" style="margin-top:8px">
        ${stat('Active', activeV)}
        ${stat('Mastered', masteredV)}
        ${stat('Due', due)}
        ${stat('Inbox', inboxN)}
      </div>
      <div style="margin-top:10px">
        <div class="between tiny"><span class="muted">Completion rate (14 days)</span><b>${rate}%</b></div>
        <div class="bar" style="margin-top:4px"><i style="width:${rate}%"></i></div>
      </div>
    </div>

    <div class="card">
      <h2>${now.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</h2>
      <div class="cal">${cal}</div>
    </div>

    <div class="card">
      <h2>By category</h2>
      ${CATS.map(c=>`
        <div style="margin-bottom:8px">
          <div class="between tiny"><span><span class="pill ${c}">${CAT_LABEL[c]}</span></span><b>${byCat[c]}</b></div>
          <div class="bar" style="margin-top:4px;height:5px"><i style="width:${Math.round(byCat[c]/maxCat*100)}%"></i></div>
        </div>`).join('')}
    </div>

    ${chList.length?`
    <div class="card">
      <h2>Challenges</h2>
      ${chList.map(ch=>{
        const s = challengeStats(ch);
        const pct = s.total ? Math.round(s.mastered/s.total*100) : 0;
        return `<div style="margin-bottom:9px">
          <div class="between tiny">
            <span style="min-width:0"><b>${esc(ch.title)}</b></span>
            <span class="muted">${s.mastered}/${s.total}</span>
          </div>
          <div class="bar" style="margin-top:4px;height:5px"><i style="width:${pct}%"></i></div>
          <div class="tiny muted" style="margin-top:3px">
            ${s.studied} studied · ${s.practiced} practiced · ${s.active} active
          </div>
        </div>`;
      }).join('')}
    </div>`:''}

    ${resList.length?`
    <div class="card">
      <h2>Resources</h2>
      ${resList.map(r=>{
        const p = resProgress(r);
        const cur = currentChapter(r);
        const cats = resCats(r);
        return `<div style="margin-bottom:9px">
          <div class="between tiny">
            <span style="min-width:0">${RES_TYPE_ICON[r.type]||'🔖'} <b>${esc(r.title)}</b>
              ${cats.map(c=>`<span class="pill ${c}">${CAT_LABEL[c]}</span>`).join(' ')}
            </span>
            <span class="muted">${p.done}/${p.total}</span>
          </div>
          <div class="bar" style="margin-top:4px;height:5px"><i style="width:${p.pct}%"></i></div>
          <div class="tiny muted" style="margin-top:3px">
            ${cur?`Current: ${esc(cur.title)}`:'No current chapter'} · ${linkedCount(r.id)} words
          </div>
        </div>`;
      }).join('')}
    </div>`:''}

    <div class="card">
      <h2>Data</h2>
      <div class="tiny muted">Stored locally · ${S.items.length} item${S.items.length===1?'':'s'} · ${resList.length} resource${resList.length===1?'':'s'} · ${chList.length} challenge${chList.length===1?'':'s'}</div>
      <div class="wrap" style="margin-top:10px">
        <button class="btn" data-act="exportData">⭳ Export JSON</button>
        <button class="btn" data-act="importData">⭱ Import JSON</button>
        <button class="btn" data-act="exportCSV">⭳ Export CSV</button>
        <button class="btn" data-act="csvUpload">⭱ Import CSV</button>
        <button class="btn" data-act="openSettings">⚙ Settings</button>
        <button class="btn danger" data-act="resetData">Reset</button>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>Last 14 days</h2>
    <table>
      <thead><tr>
        <th>Date</th><th class="n">Target</th><th class="n">Collected</th><th class="n">Studied</th>
        <th class="n">Practiced</th><th class="n">Active</th><th class="n">Mastered</th>
      </tr></thead>
      <tbody>${rows.join('')}</tbody>
    </table>
  </div>`;
}

function openSettings(){ modalId=null; modalView='settings'; renderModal(); }
function closeModal(){ modalId=null; modalView=null; renderModal(); }

function renderModal(){
  if(modalView === 'settings'){
    modal.classList.add('on');
    modal.innerHTML = settingsPanel();
    return;
  }
  if(!modalId){ modal.innerHTML=''; modal.classList.remove('on'); return; }
  const it = S.items.find(i=>i.id===modalId);
  if(!it){ modalId=null; modal.innerHTML=''; modal.classList.remove('on'); return; }
  modal.classList.add('on');
  modal.innerHTML = itemPanel(it);
}
