/* ============================================================
   EVENTS
   ============================================================ */
document.addEventListener('click', e=>{
  const navEl = e.target.closest('[data-nav]');
  if(navEl){ e.preventDefault(); nav(navEl.dataset.nav); return; }

  const toggle = e.target.closest('[data-toggle]');
  if(toggle){
    const id = toggle.dataset.toggle;
    ui.selected.has(id) ? ui.selected.delete(id) : ui.selected.add(id);
    render(); return;
  }

  const chalpick = e.target.closest('[data-chalpick]');
  if(chalpick){
    const id = chalpick.dataset.chalpick;
    const d = ui.chal && ui.chal.draft;
    if(!d) return;
    const on = !d.itemIds.has(id);
    on ? d.itemIds.add(id) : d.itemIds.delete(id);
    chalpick.classList.toggle('sel', on);
    const cbx = chalpick.querySelector('.cbx');
    if(cbx){ cbx.classList.toggle('on', on); cbx.textContent = on ? '✓' : ''; }
    const cnt = $('#chalPickCount');
    if(cnt) cnt.textContent = d.itemIds.size + ' selected';
    return;
  }

  const openEl = e.target.closest('[data-open]');
  if(openEl){ openItem(openEl.dataset.open); return; }

  const act = e.target.closest('[data-act]');
  if(act){ handleAct(act); return; }

  const incat = e.target.closest('[data-incat]');
  if(incat){
    const [id,c] = incat.dataset.incat.split('|');
    const it = S.items.find(i=>i.id===id);
    if(it){ it.category = it.category===c ? '' : c; save(); render(); }
    return;
  }
  const mcat = e.target.closest('[data-mcat]');
  if(mcat){
    const it = S.items.find(i=>i.id===modalId);
    if(it){ it.category = mcat.dataset.mcat; save(); renderModal(); render(); }
    return;
  }
  const itemchal = e.target.closest('[data-itemchal]');
  if(itemchal){
    const it = S.items.find(i=>i.id===modalId);
    const ch = challengeById(itemchal.dataset.itemchal);
    if(it && ch){
      const set = new Set(ch.itemIds||[]);
      set.has(it.id) ? set.delete(it.id) : set.add(it.id);
      ch.itemIds = [...set];
      save(); renderModal(); render();
    }
    return;
  }
  const libcat = e.target.closest('[data-libcat]');
  if(libcat){ ui.lib.cat = libcat.dataset.libcat; render(); return; }
  const libst = e.target.closest('[data-libst]');
  if(libst){ ui.lib.status = libst.dataset.libst; render(); return; }
  const libres = e.target.closest('[data-libres]');
  if(libres){ ui.lib.res = libres.dataset.libres; render(); return; }
  const rescat = e.target.closest('[data-rescat]');
  if(rescat){ ui.resFilter = rescat.dataset.rescat; render(); return; }
  const chalcat = e.target.closest('[data-chalcat]');
  if(chalcat){ ui.chal.pickCat = chalcat.dataset.chalcat; render(); return; }

  const rcat = e.target.closest('[data-rcat]');
  if(rcat){
    const c = rcat.dataset.rcat;
    if(!(ui.resCats instanceof Set)) ui.resCats = new Set();
    if(ui.resCats.has(c)) ui.resCats.delete(c); else ui.resCats.add(c);
    rcat.classList.toggle('on', ui.resCats.has(c));
    return;
  }

  const wsel = e.target.closest('[data-wsel]');
  if(wsel){
    const day = ensureDay(iso());
    const id = wsel.dataset.wsel;
    const set = new Set(day.writeSel||[]);
    set.has(id) ? set.delete(id) : set.add(id);
    day.writeSel = [...set];
    save(); render(); return;
  }
  const catBtn = e.target.closest('[data-cat]');
  if(catBtn){
    ui.addCat = catBtn.dataset.cat;
    $$('#catPick .chip').forEach(c=>c.classList.toggle('on', c.dataset.cat===ui.addCat));
    return;
  }
  const pick = e.target.closest('[data-pick]');
  if(pick){
    const p = ui.practice;
    const it = S.items.find(x=>x.id===p.q[p.idx]);
    const ok = pick.dataset.pick === it.meaning;
    if(ok) p.correct++;
    markPracticed(it);
    p.fb = {ok, msg: ok ? `✓ Correct — <b>${esc(it.term)}</b> means "${esc(it.meaning)}"`
                        : `✗ <b>${esc(it.term)}</b> means "${esc(it.meaning)}"`};
    render(); return;
  }
});

function handleAct(el){
  const a = el.dataset.act;
  const T = iso();
  switch(a){
    case 'closeModal': closeModal(); break;
    case 'openSettings': openSettings(); break;

    case 'saveAdd':      doAdd(false); break;
    case 'saveAddOpen':  doAdd(true);  break;

    case 'quickAdd': {
      const inp = $('#quickTerm');
      const v = inp ? inp.value.trim() : '';
      if(!v){ toast('Type something'); return; }
      S.items.push(mk(v, '', '', '', '', {inbox:true, dateAdded:T, nextReview:T}));
      save();
      if(inp) inp.value='';
      toast('Saved · '+v);
      render();
      const again = $('#quickTerm'); if(again) again.focus();
      break;
    }

    case 'smartBuild': buildFromInbox(); break;

    case 'editDist': {
      const day = ensureDay(T);
      const html = prompt(
        'Distribution — 4 numbers, comma separated\n(collocations, phrasal, chunks, vocab)',
        CATS.map(c=>day.dist[c]).join(', ')
      );
      if(!html) return;
      const nums = html.split(',').map(s=>parseInt(s.trim(),10));
      if(nums.length!==4 || nums.some(n=>isNaN(n)||n<0)){ toast('Enter 4 numbers'); return; }
      CATS.forEach((c,i)=> day.dist[c]=nums[i]);
      day.target = nums.reduce((x,y)=>x+y,0);
      S.settings.dist = {...day.dist};
      S.settings.target = day.target;
      save(); render();
      toast('Target: '+day.target);
      break;
    }

    case 'saveDist': {
      const dist = {};
      CATS.forEach(c=>{
        const inp = document.querySelector(`[data-dist="${c}"]`);
        dist[c] = inp ? Math.max(0, Number(inp.value)||0) : (Number(S.settings.dist[c])||0);
      });
      S.settings.dist = dist;
      S.settings.target = CATS.reduce((n,c)=>n+dist[c],0);
      const day = ensureDay(T);
      day.dist = {...dist};
      day.target = S.settings.target;
      save(); render();
      toast('Daily target: ' + S.settings.target);
      break;
    }

    case 'setTheme': {
      const t = el.dataset.themePick;
      if(t!=='light' && t!=='dark' && t!=='system') break;
      S.settings.theme = t;
      save();
      applyTheme();
      renderModal();
      toast(t==='dark' ? 'Dark mode' : t==='light' ? 'Light mode' : 'System theme');
      break;
    }

    case 'markStudied': {
      const it = S.items.find(i=>i.id===modalId);
      if(it){ markStudied(it); renderModal(); render(); toast('Studying'); }
      break;
    }

    case 'processInbox': {
      const it = S.items.find(i=>i.id===modalId);
      if(it){
        if(!it.category){ toast('Pick a category'); return; }
        it.inbox = false;
        it.challengeDate = T;
        it.dateAdded = T;
        it.nextReview = T;
        save(); closeModal(); render();
        toast('Added to today');
      }
      break;
    }

    case 'openPrac': {
      closeModal();
      view = 'practice';
      startPractice('recognition');
      break;
    }

    case 'deleteItem': {
      const it = S.items.find(i=>i.id===modalId);
      if(it && confirm('Delete "'+it.term+'"?')){
        const id = it.id;
        S.items = S.items.filter(x=>x.id!==id);
        Object.values(S.days).forEach(d=>{
          if(Array.isArray(d.writeSel)) d.writeSel = d.writeSel.filter(x=>x!==id);
        });
        removeItemsFromChallenges(new Set([id]));
        save(); closeModal(); render();
      }
      break;
    }

    case 'enterSelect':
      ui.selectMode = true; ui.selected = new Set(); render();
      break;
    case 'exitSelect':
      clearSelection(); render();
      break;
    case 'selectAll': {
      const visible = (view==='library') ? filteredLibrary() : inboxItems();
      ui.selected = new Set(visible.map(i=>i.id));
      render();
      break;
    }
    case 'deselectAll': ui.selected = new Set(); render(); break;
    case 'deleteSelected': deleteSelected(); break;

    /* ---------- Challenges ---------- */
    case 'chalNew': {
      ui.chal = {
        creating:true, editingId:null, openId:null,
        draft:{title:'', desc:'', due:'', itemIds:new Set()},
        pickCat:'all', pickQ:''
      };
      render();
      break;
    }
    case 'chalCancel': {
      ui.chal = freshChal();
      render();
      break;
    }
    case 'chalBack': {
      ui.chal = freshChal();
      render();
      break;
    }
    case 'chalOpen': {
      ui.chal.creating = false;
      ui.chal.editingId = null;
      ui.chal.openId = el.dataset.id;
      render();
      break;
    }
    case 'chalEditItems': {
      const ch = challengeById(el.dataset.id);
      if(!ch) break;
      ui.chal = {
        creating:false, editingId:ch.id, openId:ch.id,
        draft:{title:ch.title, desc:ch.desc||'', due:ch.due||'', itemIds:new Set(ch.itemIds||[])},
        pickCat:'all', pickQ:''
      };
      render();
      break;
    }
    case 'chalSave': {
      const c = ui.chal;
      const d = c.draft;
      if(!d) break;
      const title = String(d.title||'').trim();
      if(!title){ toast('Enter a title'); break; }
      const ids = [...d.itemIds];
      if(c.editingId){
        const ch = challengeById(c.editingId);
        if(ch){
          ch.title = title;
          ch.desc = String(d.desc||'').trim();
          ch.due = d.due || null;
          ch.itemIds = ids;
        }
        toast('Challenge saved');
      } else {
        challengesList().push({
          id:uid(), title,
          desc:String(d.desc||'').trim(),
          due:d.due||null,
          createdAt:iso(),
          itemIds:ids
        });
        toast(`Challenge created · ${ids.length} word${ids.length===1?'':'s'}`);
      }
      const openId = c.editingId || null;
      ui.chal = freshChal();
      if(openId) ui.chal.openId = openId;
      save(); render();
      break;
    }
    case 'chalDelete': {
      const ch = challengeById(el.dataset.id);
      if(!ch) break;
      if(!confirm(`Delete challenge "${ch.title}"? The words stay in your library.`)) break;
      S.challenges = challengesList().filter(x=>x.id!==ch.id);
      ui.chal = freshChal();
      save(); render();
      toast('Challenge deleted');
      break;
    }
    case 'chalPractice': {
      const ch = challengeById(el.dataset.id);
      if(!ch) break;
      const ids = challengeItems(ch).map(i=>i.id);
      if(!ids.length){ toast('No items in this challenge'); break; }
      view = 'practice';
      ui.chal = freshChal();
      startPractice('recognition', ids);
      break;
    }
    case 'chalMemGame': {
      const ch = challengeById(el.dataset.id);
      if(!ch) break;
      const ids = challengeItems(ch).map(i=>i.id);
      if(ids.length < 2){ toast('Need at least 2 items'); break; }
      view = 'practice';
      ui.chal = freshChal();
      startMemoryGame(ids);
      break;
    }
    case 'chalAddToday': {
      const ch = challengeById(el.dataset.id);
      if(!ch) break;
      let n = 0;
      challengeItems(ch).forEach(it=>{
        if(it.challengeDate !== T){ it.challengeDate = T; n++; }
        it.nextReview = T;
        if(it.inbox) it.inbox = false;
      });
      save(); render();
      toast(n ? `Added ${n} word${n===1?'':'s'} to today` : 'All already in today');
      break;
    }
    case 'chalExport': exportChallengesCSV(); break;

    /* ---------- Resources ---------- */
    case 'newResource':
      ui.editRes = 'new'; ui.openRes = null; ui.resCats = new Set(); render();
      break;
    case 'editResource': {
      const r = resourceById(el.dataset.id);
      ui.resCats = new Set(r ? resCats(r) : []);
      ui.editRes = el.dataset.id;
      render();
      break;
    }
    case 'cancelResource':
      ui.editRes = null; ui.resCats = null; render();
      break;
    case 'saveResource': {
      const id = el.dataset.id;
      const titleEl = $('#r_title');
      const title = titleEl ? titleEl.value.trim() : '';
      if(!title){ toast('Enter a title'); return; }
      const type = ($('#r_type') && $('#r_type').value) || 'other';
      const author = ($('#r_author') && $('#r_author').value.trim()) || '';
      const notes = ($('#r_notes') && $('#r_notes').value.trim()) || '';
      const categories = [...((ui.resCats instanceof Set) ? ui.resCats : new Set())];
      if(id){
        const r = resourceById(id);
        if(r){ r.title=title; r.type=type; r.author=author; r.notes=notes; r.categories=categories; }
        toast('Resource updated');
      } else {
        const r = {id:uid(), title, type, author, notes, categories, dateAdded:iso(), chapters:[], currentChapterId:null};
        resourcesList().push(r);
        ui.openRes = r.id;
        toast('Resource added');
      }
      ui.editRes = null; ui.resCats = null;
      save(); render();
      break;
    }
    case 'toggleResource':
      ui.openRes = (ui.openRes === el.dataset.id) ? null : el.dataset.id;
      render();
      break;
    case 'deleteResource': {
      const r = resourceById(el.dataset.id);
      if(!r) break;
      const n = linkedCount(r.id);
      if(!confirm(`Delete "${r.title}"?${n?` ${n} word${n===1?'':'s'} will be unlinked.`:''}`)) break;
      S.resources = resourcesList().filter(x=>x.id!==r.id);
      S.items.forEach(i=>{ if(i.resourceId===r.id){ i.resourceId=''; i.chapterId=''; } });
      if(ui.openRes===r.id) ui.openRes = null;
      if(ui.editRes===r.id) ui.editRes = null;
      save(); render();
      toast('Resource deleted');
      break;
    }
    case 'addChapter': {
      const r = resourceById(el.dataset.rid);
      if(!r) break;
      const inp = $('#ch_'+r.id);
      const t = inp ? inp.value.trim() : '';
      if(!t){ toast('Type a chapter title'); break; }
      const c = {id:uid(), title:t, done:false, completedAt:null};
      r.chapters.push(c);
      if(!r.currentChapterId) r.currentChapterId = c.id;
      save(); render();
      const again = $('#ch_'+r.id); if(again) again.focus();
      break;
    }
    case 'addChapters': {
      const r = resourceById(el.dataset.rid);
      if(!r) break;
      const txt = prompt('One chapter per line:');
      if(!txt) break;
      const lines = txt.split('\n').map(s=>s.trim()).filter(Boolean);
      if(!lines.length) break;
      lines.forEach(t=> r.chapters.push({id:uid(), title:t, done:false, completedAt:null}));
      if(!r.currentChapterId) r.currentChapterId = r.chapters[0].id;
      save(); render();
      toast(`Added ${lines.length} chapter${lines.length===1?'':'s'}`);
      break;
    }
    case 'delChapter': {
      const r = resourceById(el.dataset.rid);
      if(!r) break;
      const cid = el.dataset.cid;
      const c = chapterOf(r, cid);
      if(!c) break;
      if(!confirm(`Delete chapter "${c.title}"?`)) break;
      r.chapters = r.chapters.filter(x=>x.id!==cid);
      S.items.forEach(i=>{ if(i.chapterId===cid) i.chapterId=''; });
      if(r.currentChapterId===cid){
        const next = r.chapters.find(x=>!x.done) || r.chapters[0] || null;
        r.currentChapterId = next ? next.id : null;
      }
      save(); render();
      break;
    }
    case 'toggleChapter': {
      const r = resourceById(el.dataset.rid);
      if(!r) break;
      const cid = el.dataset.cid;
      const c = chapterOf(r, cid);
      if(!c) break;
      c.done = !c.done;
      c.completedAt = c.done ? iso() : null;
      if(c.done && r.currentChapterId === cid){
        const idx = r.chapters.indexOf(c);
        const next = r.chapters.slice(idx+1).find(x=>!x.done) || r.chapters.find(x=>!x.done);
        r.currentChapterId = next ? next.id : cid;
      }
      save(); render();
      break;
    }
    case 'setCurrentChapter': {
      const r = resourceById(el.dataset.rid);
      if(!r) break;
      r.currentChapterId = el.dataset.cid;
      save(); render();
      const c = chapterOf(r, r.currentChapterId);
      toast('Current: ' + (c ? c.title : '—'));
      break;
    }
    case 'resWords': {
      ui.lib = ui.lib || {cat:'all',status:'all',q:'',res:'all'};
      ui.lib.res = el.dataset.id;
      nav('library');
      break;
    }

    /* ---------- Practice ---------- */
    case 'startPrac': startPractice(el.dataset.mode); break;
    case 'pracAgain': {
      const p = ui.practice;
      if(p) startPractice(p.mode, p.poolIds);
      break;
    }
    case 'pracStop':  ui.practice = null; render(); break;
    case 'pracNext': {
      const p = ui.practice;
      p.idx++;
      if(p.idx < p.q.length) makeQ();
      render();
      break;
    }
    case 'pracCheck': {
      const inp = $('#pracInput');
      pracAnswer(inp ? inp.value : '');
      break;
    }
    case 'pracReveal': {
      const p = ui.practice;
      const it = S.items.find(x=>x.id===p.q[p.idx]);
      markPracticed(it);
      p.fb = {ok:false, msg:`Answer: <b>${esc(it.term)}</b> — ${esc(it.meaning)}`};
      render();
      break;
    }
    case 'pracProduce': {
      const p = ui.practice;
      const it = S.items.find(x=>x.id===p.q[p.idx]);
      const inp = $('#pracInput');
      const txt = inp ? inp.value.trim() : '';
      if(!txt){ toast('Write something'); return; }
      it.personal = txt;
      markPracticed(it);
      p.correct++;
      p.fb = {ok:true, msg:'✓ Saved as personal example.'};
      save(); render();
      break;
    }

    case 'memFlip': {
      const p = ui.practice;
      if(!p || p.mode !== 'memory' || p.locked) break;
      const idx = Number(el.dataset.idx);
      const card = p.cards[idx];
      if(!card || card.flipped || card.matched) break;

      card.flipped = true;
      p.flipped.push(idx);

      if(p.flipped.length === 2){
        p.moves++;
        const [a,b] = p.flipped;
        const ca = p.cards[a], cb = p.cards[b];
        if(ca.itemId === cb.itemId && ca.type !== cb.type){
          ca.matched = true; cb.matched = true;
          p.pairsFound++; p.flipped = [];
          const it = S.items.find(x=>x.id===ca.itemId);
          if(it) markPracticed(it);
          render();
        } else {
          p.locked = true;
          render();
          setTimeout(()=>{
            if(!ui.practice || ui.practice !== p) return;
            ca.flipped = false; cb.flipped = false;
            p.flipped = []; p.locked = false;
            render();
          }, 800);
        }
        break;
      }
      render();
      break;
    }

    /* ---------- Review ---------- */
    case 'reviewStart': {
      const due = dueItems();
      if(!due.length){ toast('Nothing due'); return; }
      ui.reviewCard = due[0].id;
      ui.reviewReveal = false;
      render();
      break;
    }
    case 'reviewReveal': ui.reviewReveal = true; render(); break;
    case 'rate': {
      const it = S.items.find(x=>x.id===ui.reviewCard);
      if(!it){ ui.reviewCard = null; render(); return; }
      rate(it, el.dataset.r);
      ui.reviewCard = null;
      ui.reviewReveal = false;
      const next = dueItems();
      if(next.length) ui.reviewCard = next[0].id;
      render();
      break;
    }

    /* ---------- Writing ---------- */
    case 'saveWriting': {
      const day = ensureDay(T);
      const ta = $('#wtext');
      day.writing = ta ? ta.value : '';
      (day.writeSel||[]).forEach(id=>{
        const it = S.items.find(i=>i.id===id);
        if(it && day.writing.toLowerCase().includes(it.term.toLowerCase())) markPracticed(it);
      });
      save(); toast('Saved'); render();
      break;
    }
    case 'clearWriting': {
      ensureDay(T).writing = '';
      save(); render();
      break;
    }

    /* ---------- Data ---------- */
    case 'csvUpload':  openCSVUpload(); break;
    case 'csvConfirm': commitCSVImport(); break;
    case 'csvCancel':  ui.csvDraft = null; render(); break;

    case 'exportData': exportData(); break;
    case 'exportCSV':  exportCSV();  break;
    case 'importData': importData(); break;
    case 'resetData': {
      if(confirm('Delete all data and start fresh?')){
        localStorage.removeItem(LS_KEY);
        S = emptyState();
        ui = freshUi();
        modalId = null; modalView = null;
        save(); applyTheme(); nav('today');
        toast('Cleared');
      }
      break;
    }
  }
}

document.addEventListener('input', e=>{
  if(e.target.id === 'libSearch'){
    ui.lib = ui.lib || {cat:'all',status:'all',q:'',res:'all'};
    ui.lib.q = e.target.value;
    const pos = e.target.selectionStart;
    render();
    const el = $('#libSearch');
    if(el){ el.focus(); el.setSelectionRange(pos,pos); }
    return;
  }
  if(e.target.id === 'chalPickSearch'){
    if(!ui.chal) ui.chal = freshChal();
    ui.chal.pickQ = e.target.value;
    const pos = e.target.selectionStart;
    render();
    const el = $('#chalPickSearch');
    if(el){ el.focus(); el.setSelectionRange(pos,pos); }
    return;
  }
  if(e.target.dataset && e.target.dataset.chalfield){
    if(ui.chal && ui.chal.draft){
      ui.chal.draft[e.target.dataset.chalfield] = e.target.value;
    }
    return;
  }
  if(e.target.dataset && e.target.dataset.dist){
    let total = 0;
    CATS.forEach(c=>{
      const inp = document.querySelector(`[data-dist="${c}"]`);
      total += inp ? (Number(inp.value)||0) : 0;
    });
    const t = $('#distTotal');
    if(t) t.textContent = total;
    return;
  }

  if(e.target.tagName === 'SELECT') return;
  const f = e.target.dataset.field;
  if(f && modalId){
    const it = S.items.find(i=>i.id===modalId);
    if(it){
      it[f] = (f==='difficulty') ? Number(e.target.value)||1 : e.target.value;
      save();
    }
  }
});

document.addEventListener('change', e=>{
  const f = e.target.dataset.field;
  if(f && modalId){
    const it = S.items.find(i=>i.id===modalId);
    if(!it) return;
    if(f === 'resourceId'){
      it.resourceId = e.target.value || '';
      it.chapterId = '';
      const r = resourceById(it.resourceId);
      const rc = resCats(r);
      if(!it.category && rc.length === 1) it.category = rc[0];
      save(); renderModal(); render();
      return;
    }
    if(f === 'chapterId'){
      it.chapterId = e.target.value || '';
      save(); return;
    }
  }
  if(e.target.id === 'f_resource'){
    const r = resourceById(e.target.value);
    const sel = $('#f_chapter');
    if(sel) sel.innerHTML = chapterOptions(r, null);
    const rc = resCats(r);
    if(rc.length === 1 && !ui.addCat){
      ui.addCat = rc[0];
      $$('#catPick .chip').forEach(c=>c.classList.toggle('on', c.dataset.cat===ui.addCat));
    }
    return;
  }
});

document.addEventListener('keydown', e=>{
  if(e.key === 'Escape'){
    if(ui.selectMode){ clearSelection(); render(); return; }
    if(ui.editRes){ ui.editRes = null; ui.resCats = null; render(); return; }
    if(ui.chal && (ui.chal.creating || ui.chal.editingId)){ ui.chal = freshChal(); render(); return; }
    closeModal();
    return;
  }
  if(e.key === 'Enter'){
    if(e.target.id === 'quickTerm'){
      e.preventDefault();
      const card = e.target.closest('.card');
      const btn = card && card.querySelector('[data-act="quickAdd"]');
      if(btn) handleAct(btn);
      return;
    }
    if(e.target.id === 'f_term' || e.target.id === 'f_meaning'){ e.preventDefault(); doAdd(false); return; }
    if(e.target.id && e.target.id.indexOf('ch_') === 0){
      e.preventDefault();
      handleAct({dataset:{act:'addChapter', rid: e.target.id.slice(3)}});
      return;
    }
    if(e.target.id === 'pracInput' && ui.practice){
      const p = ui.practice;
      if(p.mode === 'production') handleAct({dataset:{act:'pracProduce'}});
      else handleAct({dataset:{act:'pracCheck'}});
      return;
    }
  }
});

/* ============================================================
   BOOT
   ============================================================ */
S = load();
ui = freshUi();
applyTheme();
bindSystemTheme();
render();
</script>
</body>
