/* =========================================================
   11. PRACTICE
   ========================================================= */
function currentEx(){ return session ? findEx(session.ids[session.idx]) : null; }
function startSession(ids, title){
  ids = ids.filter(id=>findEx(id));
  if(!ids.length){ alert("No exercises to practice."); return; }
  session = {ids, title: title||"Practice", idx:0, correct:0, total:0, done:false, startTs: Date.now()};
  initUI();
  go("practice");
}
function initUI(){
  ui = {selected:null, bank:[], answerWords:[], matches:{}, submitted:false, lastCorrect:null, userAnswer:"", revealed:false, saved:""};
  const ex = currentEx();
  if(!ex) return;
  if(ex.type === "word_order"){
    const words = ex.words && ex.words.length ? ex.words : String(ex.answer).split(" ");
    ui.bank = shuffle(words);
  }
  if(ex.type === "matching"){
    (ex.pairs||[]).forEach((p,i)=>{ ui.matches[i] = ""; });
  }
}
function viewPractice(){
  if(!session) return `<div class="empty">No practice session.</div>`;
  if(session.done){
    const acc = pct(session.correct, session.total);
    return `<h1>Session complete</h1>
    <div class="sub">${esc(session.title)}</div>
    <div class="stat-grid">
      <div class="stat"><div class="n">${session.correct}/${session.total}</div><div class="l">Correct</div></div>
      <div class="stat"><div class="n">${acc}%</div><div class="l">Accuracy</div></div>
      <div class="stat"><div class="n">${fmtTime((Date.now()-session.startTs)/1000)}</div><div class="l">Duration</div></div>
    </div>
    <div class="btn-row" style="margin-top:20px">
      <button class="btn primary" data-action="go" data-route="exercises">Back to exercises</button>
      <button class="btn" data-action="go" data-route="mistakes">Practice mistakes</button>
      <button class="btn" data-action="go" data-route="dashboard">Dashboard</button>
    </div>`;
  }
  const ex = currentEx();
  if(!ex) { session.done = true; return viewPractice(); }
  const t = findTopic(ex.topic_id);
  const m = findMaterial(ex.material_id);
  const progressPct = pct(session.idx, session.ids.length);
  let feedback = "";
  if(ui.submitted){
    const ok = ui.lastCorrect;
    feedback = `<div class="feedback ${ok?"ok":"bad"}">
      <div class="head">${ok?"✓ Correct":"✕ Not quite"}</div>
      ${!ok ? `<div style="margin-bottom:6px"><strong>Your answer:</strong> ${esc(ui.userAnswer||"—")}<br><strong>Correct answer:</strong> ${esc(Array.isArray(ex.answer)?ex.answer[0]:ex.answer)}</div>` : ""}
      <div class="exp">${esc(ex.explanation||"")}</div>
    </div>`;
  }
  const isLast = session.idx >= session.ids.length - 1;
  return `
  <div class="practice-head">
    <div>
      <button class="btn sm" data-action="go" data-route="exercises">← Exit</button>
      <span class="small muted" style="margin-left:10px">${esc(session.title)}</span>
    </div>
    <div class="small muted">Question ${session.idx+1} / ${session.ids.length} · Score ${session.correct}/${session.total}</div>
  </div>
  <div class="bar" style="margin-bottom:20px"><i style="width:${progressPct}%"></i></div>
  <div class="card">
    <div class="row wrap" style="margin-bottom:10px">
      <span class="badge">${esc(typeLabel(ex.type))}</span>
      <span class="badge lvl">${esc(ex.level)}</span>
      ${t?`<span class="badge grey">${esc(t.title)}</span>`:""}
      ${m?`<span class="badge grey">${esc(m.title)}</span>`:""}
    </div>
    <div class="question-text">${esc(ex.question)}</div>
    ${questionHTML(ex)}
    ${feedback}
  </div>
  <div class="btn-row" style="margin-top:18px">
    ${!ui.submitted
      ? (needsSelfGrade(ex) && !ui.revealed
          ? `<button class="btn primary" data-action="reveal">Show model answer</button>`
          : (needsSelfGrade(ex)
              ? `<button class="btn primary" data-action="self" data-ok="1">I was right</button>
                 <button class="btn danger" data-action="self" data-ok="0">I was wrong</button>`
              : `<button class="btn primary" data-action="check">Check answer</button>`))
      : `<button class="btn primary" data-action="next">${isLast?"Finish session":"Next question →"}</button>`}
  </div>`;
}
function needsSelfGrade(ex){ return ex.type === "production" || ex.type === "completion"; }
function questionHTML(ex){
  const dis = ui.submitted ? "disabled" : "";
  if(ex.type === "multiple_choice"){
    return `<div class="options">${(ex.options||[]).map(o=>{
      let cls = "opt";
      if(!ui.submitted && ui.selected === o) cls += " sel";
      if(ui.submitted){
        if(norm(o) === norm(Array.isArray(ex.answer)?ex.answer[0]:ex.answer)) cls += " ok";
        else if(ui.selected === o) cls += " bad";
      }
      return `<button class="${cls}" data-action="option" data-value="${esc(o)}" ${dis}>${esc(o)}</button>`;
    }).join("")}</div>`;
  }
  if(ex.type === "matching"){
    const rights = shuffle([...new Set((ex.pairs||[]).map(p=>p[1]))]);
    return (ex.pairs||[]).map((p,i)=>{
      const sel = ui.matches[i] || "";
      let cls = "";
      if(ui.submitted) cls = norm(sel)===norm(p[1]) ? "ok" : "bad";
      return `<div class="match-row">
        <div class="left">${esc(p[0])}</div>
        <select data-action="match" data-i="${i}" ${dis} class="${cls}">
          <option value="">— choose —</option>
          ${rights.map(r=>`<option value="${esc(r)}" ${sel===r?"selected":""}>${esc(r)}</option>`).join("")}
        </select>
      </div>`;
    }).join("");
  }
  if(ex.type === "word_order"){
    return `
      <div class="chips">${ui.answerWords.map((w,i)=>`<button class="chip ans" data-action="unword" data-i="${i}" ${dis}>${esc(w)}</button>`).join("")}</div>
      <div class="chips">${ui.bank.map((w,i)=>`<button class="chip" data-action="word" data-i="${i}" ${dis}>${esc(w)}</button>`).join("")}</div>`;
  }
  if(needsSelfGrade(ex)){
    let html = `<textarea id="answer-input" class="input" rows="3" ${dis} placeholder="Write your answer…">${esc(ui.saved)}</textarea>`;
    if(ui.revealed){
      html += `<div class="feedback ok" style="margin-top:14px">
        <div class="head">Model answer</div>
        <div class="exp">${esc(Array.isArray(ex.answer)?ex.answer[0]:ex.answer)}</div>
        <div class="exp" style="margin-top:8px">${esc(ex.explanation||"")}</div>
      </div>`;
    }
    return html;
  }
  return `<input id="answer-input" class="input" placeholder="Type your answer…" value="${esc(ui.submitted ? ui.userAnswer : "")}" ${dis}>`;
}
function revealAnswer(){
  const el = document.getElementById("answer-input");
  ui.saved = el ? el.value : "";
  ui.revealed = true;
  render();
}
function submitAnswer(){
  const ex = currentEx();
  if(!ex) return;
  let userAnswer = "", correct = false;
  if(ex.type === "multiple_choice"){
    userAnswer = ui.selected || "";
    if(!userAnswer) return;
    correct = norm(userAnswer) === norm(Array.isArray(ex.answer)?ex.answer[0]:ex.answer);
  } else if(ex.type === "matching"){
    const pairs = ex.pairs || [];
    if(pairs.some((p,i)=>!ui.matches[i])) return;
    correct = pairs.every((p,i)=> norm(ui.matches[i]) === norm(p[1]));
    userAnswer = pairs.map((p,i)=>`${p[0]} → ${ui.matches[i]}`).join("; ");
  } else if(ex.type === "word_order"){
    userAnswer = ui.answerWords.join(" ");
    if(!userAnswer) return;
    correct = norm(userAnswer) === norm(ex.answer);
  } else {
    const el = document.getElementById("answer-input");
    userAnswer = el ? el.value : "";
    if(!String(userAnswer).trim()) return;
    correct = accepts(ex.answer).some(a=> norm(a) === norm(userAnswer));
  }
  finishAnswer(userAnswer, correct);
}
function finishAnswer(userAnswer, correct){
  const ex = currentEx();
  DB.attempts.push({
    id: uid(), exerciseId: ex.id, topicId: ex.topic_id, materialId: ex.material_id || null,
    correct: !!correct, userAnswer: String(userAnswer).slice(0,600), ts: Date.now()
  });
  save();
  ui.submitted = true; ui.lastCorrect = !!correct; ui.userAnswer = userAnswer;
  session.total++; if(correct) session.correct++;
  render();
}
function nextQuestion(){
  if(session.idx >= session.ids.length - 1){ session.done = true; } else { session.idx++; }
  initUI(); render();
  window.scrollTo({top:0, behavior:"instant"});
}

          <span class="badge lvl">${esc(ex.level)}</span>
          ${t?`<span class="badge grey">${esc(t.title)}</span>`:`<span class="badge red">unknown topic</span>`}
          <span class="small muted">${s.correct}/${s.total} correct · mastery ${Math.round(s.mastery*100)}%</span>
        </div>
      </div>
      <div class="row">${statusBadge(st)}<button class="btn sm" data-action="practice" data-ids="${esc(ex.id)}">Practice</button></div>

  <div class="btn-row" style="margin-bottom:18px">
    <button class="btn primary" data-action="practice" data-ids="${esc(ids)}" data-title="Review session" ${queue.length?"":"disabled"}>Start review (${queue.length})</button>
    ${newOnes.length?`<button class="btn" data-action="practice" data-ids="${esc(newOnes.map(e=>e.id).join(","))}" data-title="New exercises">Try ${newOnes.length} new exercises</button>`:""}
    <button class="btn" data-action="new-exercise">+ Add exercise</button>
  </div>
  <div class="list">${items}</div>`;
}
function viewMistakes(){
  const mistakes = mistakeList();
  const items = mistakes.length ? mistakes.map(m=>{
    const ex = m.ex;
    const t = findTopic(ex.topic_id);
    const mat = findMaterial(ex.material_id);
    const s = exStats(ex.id);
    return `<div class="card" style="margin-bottom:12px">
      <div class="row wrap" style="margin-bottom:9px">
        <span class="badge">${esc(typeLabel(ex.type))}</span>
        <span class="badge lvl">${esc(ex.level)}</span>
        ${t?`<span class="badge grey">${esc(t.title)}</span>`:""}
        ${mat?`<span class="badge grey">${esc(mat.title)}</span>`:""}
        <span class="small muted" style="margin-left:auto">${fmtDate(m.ts)}</span>
      </div>
      <div style="font-size:14.5px;margin-bottom:11px;white-space:pre-wrap">${esc(ex.question)}</div>
      <div class="small" style="margin-bottom:5px"><span class="muted">Your answer:</span> <span style="color:var(--red);font-weight:600">${esc(m.userAnswer||"—")}</span></div>
      <div class="small" style="margin-bottom:9px"><span class="muted">Correct answer:</span> <span style="color:var(--green);font-weight:600">${esc(Array.isArray(ex.answer)?ex.answer[0]:ex.answer)}</span></div>
      <div class="explain small" style="background:var(--panel-3);padding:9px 12px;border-radius:8px">${esc(ex.explanation||"")}</div>
      <div class="btn-row" style="margin-top:12px">
        <button class="btn sm primary" data-action="practice" data-ids="${esc(ex.id)}">Practice again</button>
        <button class="btn sm" data-action="edit-exercise" data-id="${esc(ex.id)}">Edit</button>
        <span class="small muted">${s.correct}/${s.total} correct overall</span>
      </div>
    </div>`;
  }).join("") : `<div class="empty">No unresolved mistakes. Nice work!</div>`;
  const ids = mistakes.map(m=>m.exerciseId).join(",");
  return `<h1>Mistakes</h1>

  </div>
  ${items}`;
}

function toCSV(rows, headers){
  const cell = v => {
    const s = Array.isArray(v) ? v.join("|") : (v === null || v === undefined ? "" : String(v));
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
  };
  return [headers.join(",")].concat(rows.map(r=>headers.map(h=>cell(r[h])).join(","))).join("\n");
}
function download(filename, text, mime){
  const blob = new Blob([text], {type: mime || "application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}

   13. PARSING + VALIDATION HELPERS
   ========================================================= */
function parseCSV(text){
  const rows = []; let row = [], field = "", inQ = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQ){
      if(c === '"'){ if(text[i+1] === '"'){ field += '"'; i++; } else inQ = false; }
      else field += c;
    } else {
      if(c === '"') inQ = true;
      else if(c === ","){ row.push(field); field = ""; }
      else if(c === "\n"){ row.push(field); rows.push(row); row = []; field = ""; }
      else if(c === "\r"){ /* skip */ }
      else field += c;
    }
  }
  if(field !== "" || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r=>r.some(x=>String(x).trim() !== ""));
}
function csvToObjects(text){
  const rows = parseCSV(text);
  if(rows.length < 2) return [];
  const headers = rows[0].map(h=>h.trim());
  return rows.slice(1).map(r=>{
    const o = {};
    headers.forEach((h,i)=>{ o[h] = (r[i]||"").trim(); });
    return o;
  });
}
function coerceExercise(o){
  const ex = {
    id:o.id, topic_id:o.topic_id, material_id:o.material_id||null,
    level:o.level, type:o.type, question:o.question,
    answer:o.answer, explanation:o.explanation||""
  };
  if(o.options){ ex.options = Array.isArray(o.options) ? o.options : String(o.options).split("|").map(s=>s.trim()).filter(Boolean); }
  if(o.words){ ex.words = Array.isArray(o.words) ? o.words : String(o.words).split("|").map(s=>s.trim()).filter(Boolean); }
  if(o.pairs){
    if(typeof o.pairs === "string"){ try{ ex.pairs = JSON.parse(o.pairs); }catch(e){ ex.pairs = []; } }
    else ex.pairs = o.pairs;
  }
  return ex;
}
function coerceTopic(o){
  return {
    id: String(o.id||"").trim(),
    level: String(o.level||"").trim(),
    title: String(o.title||"").trim(),
    explanation: o.explanation || "",
    examples: Array.isArray(o.examples)
      ? o.examples.map(String)
      : (o.examples ? String(o.examples).split("|").map(s=>s.trim()).filter(Boolean) : []),
    explanationFormat: o.explanationFormat || "text",
    examplesFormat: o.examplesFormat || "text",
    explanationHtml: o.explanationHtml || "",
    examplesHtml: o.examplesHtml || ""
  };
}

function validateMaterialTopics(text, format, materialId, overwrite){
  const material = findMaterial(materialId);
  const report = { total:0, validCount:0, invalid:[], duplicates:[], warnings:[], notes:[] };
  const newTopics = [], updates = [], linkIds = [];
  let items = [];
  try {
    const t = String(text||"").trim();
    if(!t) throw new Error("Input is empty.");
    if(format === "auto") format = (t.startsWith("{") || t.startsWith("[")) ? "json" : "csv";
    if(format === "json"){
      const obj = JSON.parse(t);
      if(Array.isArray(obj)) items = obj;
      else if(obj && Array.isArray(obj.topics)) items = obj.topics;
      else if(obj && typeof obj === "object") items = [obj];
      else throw new Error("Unsupported JSON structure. Expected an array, or an object with a 'topics' array.");
    } else {
      items = csvToObjects(t);
      if(!items.length) throw new Error("No data rows found in the CSV.");
    }
  } catch(err){
    report.invalid.push("Parse error: " + esc(err.message));
    return {report, newTopics, updates, linkIds};
  }
  report.total = items.length;
  const seen = new Set();
  const fallback = materialFallbackLevel(material);
  const existingIds = new Set(DB.topics.map(x=>x.id));
  const linkedNow = new Set(material ? (material.topics||[]) : []);
  items.forEach((item, i) => {
    const label = `topic #${i+1}${item && item.id ? ` (${item.id})` : ""}`;
    const errors = [];
    if(!item.id || !String(item.id).trim()) errors.push("missing required field 'id'");
    if(!item.title || !String(item.title).trim()) errors.push("missing required field 'title'");
    const itemLevel = String(item.level||"").trim();
    if(!itemLevel){
      if(fallback){ item.level = fallback; report.warnings.push(`${esc(label)}: missing 'level' — defaulted to ${fallback} from the material`); }
      else { errors.push("missing required field 'level'"); }
    } else if(!LEVELS.includes(itemLevel)){
      report.warnings.push(`${esc(label)}: level '${esc(itemLevel)}' is not one of A1–C2`);
    }
    if(!item.explanation) report.warnings.push(`${esc(label)}: missing 'explanation'`);
    if(!item.examples)     report.warnings.push(`${esc(label)}: no 'examples'`);
    if(errors.length){ report.invalid.push(`${esc(label)}: ${errors.join(", ")}`); return; }
    const id = String(item.id).trim();
    if(seen.has(id)){ report.duplicates.push(`${esc(label)}: duplicated within the file`); return; }
    seen.add(id);
    const topic = coerceTopic({...item, id});
    if(existingIds.has(id)){
      if(overwrite){ updates.push(topic); report.notes.push(`${esc(label)}: already exists — will be overwritten`); }
      else if(linkedNow.has(id)){ report.notes.push(`${esc(label)}: already exists and is already linked — skipped`); }
      else { linkIds.push(id); report.notes.push(`${esc(label)}: already exists — will be linked, content left unchanged`); }
    } else {
      newTopics.push(topic);
    }
  });
  report.validCount = newTopics.length + updates.length + linkIds.length;
  return {report, newTopics, updates, linkIds};
}

document.addEventListener("click", (e)=>{
  const el = e.target.closest("[data-action]");
  if(!el) return;
  const action = el.dataset.action;

  switch(action){
    case "toggle-theme":
      THEME = THEME === "dark" ? "light" : "dark";
      try{ localStorage.setItem(THEME_KEY, THEME); }catch(e){}
      applyTheme();
      break;

    case "go": go(el.dataset.route); break;
    case "topic": go("topic", el.dataset.id); break;
    case "material": go("material", el.dataset.id); break;
    case "new-topic": go("topic-form", "new"); break;
    case "edit-topic": go("topic-form", el.dataset.id); break;
    case "new-material": go("material-form", "new"); break;
    case "edit-material": go("material-form", el.dataset.id); break;

    /* ---------- EXERCISE FORM NAVIGATION ---------- */
    case "new-exercise": {
      const r = el.dataset.returnRoute;
      exForm = {
        topicId:    el.dataset.topic || null,
        materialId: el.dataset.material || null,
        returnTo:   r ? { name: r, id: el.dataset.returnId || null } : null
      };
      go("exercise-form", "new");
      break;
    }
    case "edit-exercise": {
      const r = el.dataset.returnRoute;
      exForm = {
        topicId: null, materialId: null,
        returnTo: r ? { name: r, id: el.dataset.returnId || null } : null
      };
      go("exercise-form", el.dataset.id);
      break;
    }
    case "go-return": {
      const r = exForm.returnTo;
      exForm.returnTo = null;
      if(r && r.id) go(r.name, r.id);
      else if(r) go(r.name);
      else go("exercises");
      break;
    }
    case "save-exercise": {
      const form = document.getElementById("exercise-form");
      if(!form) break;
      const editing = el.dataset.editing === "1";

      const type     = form.querySelector('[name="type"]').value;
      const level    = form.querySelector('[name="level"]').value;
      const question = form.querySelector('[name="question"]').value.trim();
      const explanation = form.querySelector('[name="explanation"]').value.trim();
      const answerRaw = form.querySelector('[name="answer"]').value.trim();
      const materialSel = form.querySelector('[name="material_id"]');
      const material_id = materialSel ? (materialSel.value || null) : null;

      if(!question){ alert("The question is required."); break; }

      let topic_id = "";
      const newToggle = document.getElementById("ex-new-topic-toggle");
      if(newToggle && newToggle.checked){
        const idIn    = form.querySelector('[name="new_topic_id"]').value.trim();
        const titleIn = form.querySelector('[name="new_topic_title"]').value.trim();
        const lvIn    = form.querySelector('[name="new_topic_level"]').value;
        if(!idIn && !titleIn){ alert("Give the new topic a title (or an ID)."); break; }
        let newId = idIn ? slugify(idIn) : "";
        if(!newId) newId = uniqueTopicId(titleIn);
        if(findTopic(newId)){ alert(`A topic with ID "${newId}" already exists. Pick it from the list instead.`); break; }
        DB.topics.push({
          id: newId,
          title: titleIn || titleFromId(newId),
          level: lvIn || level,
          explanation: "",
          examples: [],
          explanationFormat: "text",
          examplesFormat: "text"
        });
        topic_id = newId;
      } else {
        const sel = form.querySelector('[name="topic_id"]');
        topic_id = sel ? sel.value : "";
      }
      if(!topic_id){ alert("Please choose a grammar topic, or tick “Create a new topic instead”."); break; }

      const ex = { id:"", topic_id, material_id, level, type, question, answer:"", explanation };

      if(type === "multiple_choice"){
        const opts = form.querySelector('[name="options"]').value.split("\n").map(s=>s.trim()).filter(Boolean);
        if(opts.length < 2){ alert("Add at least two options, one per line."); break; }
        if(!answerRaw){ alert("The answer is required."); break; }
        if(!opts.some(o=> norm(o) === norm(answerRaw))){
          alert("The answer must match one of the options, exactly.");
          break;
        }
        ex.options = opts;
        ex.answer = answerRaw;
      } else if(type === "word_order"){
        if(!answerRaw){ alert("The answer is required."); break; }
        const words = form.querySelector('[name="words"]').value.split("\n").map(s=>s.trim()).filter(Boolean);
        ex.answer = answerRaw;
        ex.words = words.length ? words : shuffle(answerRaw.split(/\s+/));
      } else if(type === "matching"){
        const lines = form.querySelector('[name="pairs"]').value.split("\n").map(s=>s.trim()).filter(Boolean);
        const pairs = [];
        for(const line of lines){
          const parts = line.split("=");
          if(parts.length < 2){ alert(`Each pair must look like "left = right". Problem line:\n${line}`); pairs.length = 0; break; }
          const left = parts[0].trim();
          const right = parts.slice(1).join("=").trim();
          if(!left || !right){ alert(`Both sides of a pair are required:\n${line}`); pairs.length = 0; break; }
          pairs.push([left, right]);
        }
        if(!pairs.length){ if(!lines.length) alert("Add at least one pair."); break; }
        ex.pairs = pairs;
        ex.answer = pairs.map(p=>`${p[0]} → ${p[1]}`).join(" | ");
      } else {
        if(!answerRaw){ alert("The answer is required."); break; }
        ex.answer = answerRaw;
      }

      if(editing){
        const cur = findEx(el.dataset.id);
        if(!cur) break;
        ex.id = cur.id;
        Object.assign(cur, ex);
        save();
      } else {
        ex.id = uniqueExerciseId(topic_id + "-" + (DB.exercises.filter(x=>x.topic_id===topic_id).length + 1));
        DB.exercises.push(ex);
        save();
      }

      const back = exForm.returnTo;
      exForm.returnTo = null;
      if(back && back.id) go(back.name, back.id);
      else if(back) go(back.name);
      else go("exercises");
      break;
    }
    case "delete-exercise": {
      const ex = findEx(el.dataset.id);
      if(!ex) break;
      const preview = ex.question.split("\n")[0].slice(0,80);
      if(!confirm(`Delete this exercise?\n\n"${preview}"\n\nIts attempt history will be removed as well. This cannot be undone.`)) break;
      DB.exercises = DB.exercises.filter(x=>x.id !== ex.id);
      DB.attempts  = DB.attempts.filter(a=>a.exerciseId !== ex.id);
      save();
      if(view.name === "exercise-form"){
        const r = exForm.returnTo;
        exForm.returnTo = null;
        if(r && r.id) go(r.name, r.id);
        else if(r) go(r.name);
        else go("exercises");
      } else {
        render();
      }
      break;
    }

    /* ---------- ROADMAP ---------- */

        answer: "have seen",
        explanation: "Use the Present Perfect when talking about experience without specifying a finished past time."
      }]};
      impState.text = JSON.stringify(sample, null, 2);
      impState.format = "json";
      impState.report = null; impState.valid = null;
      render();
      break;
    }
    case "sample-materials-json": {
      const sample = { materials: [
        { id: "giu-intermediate", title: "English Grammar in Use", author: "Raymond Murphy",
          type: "book", level: "B1-B2", cover: "", unitLabel: "Unit",
          description: "Intermediate English grammar reference and practice book.",
          topics: ["present-perfect","past-simple"], total: 145, current: 42 },
        { id: "bbc-english", title: "BBC Learning English", author: "BBC",
          type: "website", level: "B1-C1", cover: "", unitLabel: "Lesson",
          description: "Free online lessons, videos and quizzes.",
          topics: [], total: 60, current: 14 }
      ]};
      impState.text = JSON.stringify(sample, null, 2);
      impState.format = "json";
      impState.report = null; impState.valid = null;
      render();
      break;
    }
    case "sample-csv": {
      const topicId = DB.topics[0] ? DB.topics[0].id : "present-perfect";
      const materialId = DB.materials[0] ? DB.materials[0].id : "";
      const csv =
`id,topic_id,material_id,level,type,question,options,words,answer,explanation
ex-001,${topicId},${materialId},B1,multiple_choice,"I _____ this movie three times.","saw|have seen|had seen|see",,have seen,"Use the Present Perfect for experience without a finished past time."
ex-002,${topicId},${materialId},B1,fill_blank,She _____ (live) in London since 2015.,,,has lived,"'Since' + a point in time signals a situation continuing to the present."`;
      impState.text = csv;
      impState.format = "csv";
      impState.report = null; impState.valid = null;
      render();
      break;
    }

    case "exp-ex-json": exportExercisesJSON(); break;
    case "exp-ex-csv":  exportExercisesCSV(); break;
    case "exp-mat-json": exportMaterialsJSON(); break;
    case "exp-mat-csv":  exportMaterialsCSV(); break;
    case "exp-top-json": exportTopicsJSON(); break;
    case "exp-top-csv":  exportTopicsCSV(); break;
    case "exp-roadmap-json": exportRoadmapJSON(); break;
    case "exp-prog-json": exportProgressJSON(); break;
    case "exp-prog-csv":  exportProgressCSV(); break;
    case "exp-all": exportAll(); break;

    case "reset":
      if(confirm("Delete ALL your data — topics, materials, exercises and progress? This cannot be undone.")){
        localStorage.removeItem(LS_KEY);
        DB = emptyDB();
        save();
        impState = { text:"", format:"auto", createMissing:true, report:null, valid:null };
        matImport = null; modal = null;
        exForm = { topicId:null, materialId:null, returnTo:null };
        hmYear = new Date().getFullYear(); hmSelectedDay = null;
        document.body.style.overflow = "";
        go("dashboard");
      }
      break;
  }
});

/* =========================================================
   14b. FILE INPUT HANDLERS  (PDF / PNG / TXT into explanation)
   ========================================================= */
async function handleExplanationPdf(file){
  if(!modal || modal.kind !== "topic") return;
  setExplProgress(0.02);
  setExplStatus("Loading PDF engine…", "info");
  try{
    const text = await extractPdfText(file, (msg, prog)=>{
      setExplStatus(msg, "info");
      if(typeof prog === "number") setExplProgress(prog);
    });
    if(!text){
      setExplStatus("No selectable text was found in this PDF. If it is a scan or a photo, use the PNG tab (OCR) instead.", "warn");
      setExplProgress(0);
      return;
    }
    appendExplanationText(text);
  }catch(err){
    console.error(err);
    setExplProgress(0);
    setExplStatus("PDF import failed: " + (err && err.message ? err.message : err), "err");
  }
}

async function handleExplanationPng(file){
  if(!modal || modal.kind !== "topic") return;
  setExplProgress(0.02);
  setExplStatus("Loading OCR engine…", "info");
  try{
    const text = await extractPngText(file, (msg, prog)=>{
      setExplStatus(msg, "info");
      if(typeof prog === "number") setExplProgress(prog);
    });
    if(!text){
      setExplStatus("No text could be recognised in this image. Try a sharper, higher-contrast scan or screenshot.", "warn");
      setExplProgress(0);
      return;
    }
    appendExplanationText(text);
  }catch(err){
    console.error(err);
    setExplProgress(0);
    setExplStatus("Image import failed: " + (err && err.message ? err.message : err), "err");
  }
}

document.addEventListener("change", (e)=>{
  const id = e.target.id;
  if(id === "f-topic" || id === "f-level" || id === "f-type"){
    exFilters[id.slice(2)] = e.target.value;
    render(); return;
  }
  if(id === "ex-type"){
    applyExTypeVisibility();
    return;
  }
  if(id === "ex-new-topic-toggle"){
    const box = document.getElementById("ex-new-topic-fields");
    if(box) box.style.display = e.target.checked ? "" : "none";
    const sel = document.getElementById("ex-topic-select");
    if(sel) sel.disabled = e.target.checked;
    return;
  }
  if(e.target.dataset && e.target.dataset.action === "match" && !ui.submitted){
    ui.matches[e.target.dataset.i] = e.target.value;
    return;
  }
  if(e.target.dataset && e.target.dataset.action === "link-topic"){
    const materialId = e.target.dataset.material;
    const topicId = e.target.dataset.topic;
    const m = findMaterial(materialId);
    if(!m) return;
    m.topics = m.topics || [];
    if(e.target.checked){
      if(!m.topics.includes(topicId)) m.topics.push(topicId);
    } else {
      m.topics = m.topics.filter(x=>x !== topicId);
    }
    save();
    document.querySelectorAll('[data-topic-count]').forEach(el=>{ el.textContent = m.topics.length; });
    return;
  }

  /* ---- Explanation import: TXT / PDF / PNG ---- */
  if(id === "expl-txt-file" && e.target.files && e.target.files[0]){
    const file = e.target.files[0];
    e.target.value = "";
    setExplProgress(0.3);
    const reader = new FileReader();
    reader.onload = () => {
      appendExplanationText(String(reader.result || ""));
    };
    reader.onerror = () => {
      setExplProgress(0);
      setExplStatus("Could not read that text file.", "err");
    };
    reader.readAsText(file);
    return;
  }
  if(id === "expl-pdf-file" && e.target.files && e.target.files[0]){
    const file = e.target.files[0];
    e.target.value = "";
    handleExplanationPdf(file);
    return;
  }
  if(id === "expl-png-file" && e.target.files && e.target.files[0]){
    const file = e.target.files[0];
    e.target.value = "";
    handleExplanationPng(file);
    return;
  }
});

document.addEventListener("input", (e)=>{
  if(e.target.id === "f-q"){
    exFilters.q = e.target.value;
    const val = e.target.value;
    render();
    const box = document.getElementById("f-q");
    if(box){ box.focus(); box.setSelectionRange(val.length, val.length); }
    return;
  }
  if(e.target.id === "modal-input-html"){
    if(modal && modal.drafts) modal.drafts.html = e.target.value;
    updateRichPreview("modal-input-html");
    return;
  }
  if(e.target.id === "modal-input"){
    if(modal && modal.drafts) modal.drafts.text = e.target.value;
    return;
  }
});

document.addEventListener("change", (e)=>{
  const id = e.target.id;
  if(id === "imp-file" && e.target.files && e.target.files[0]){
    const file = e.target.files[0];
    const reader = new FileReader();
    reader.onload = () => {
      impState.text = reader.result;
      impState.format = /\.csv$/i.test(file.name) ? "csv" : "json";
      impState.report = null; impState.valid = null;
      render();
    };
    reader.readAsText(file);
  }
  if(id === "mi-file" && e.target.files && e.target.files[0]){
    if(!matImport) return;
    const file = e.target.files[0];
    const reader = new FileReader();
    reader.onload = () => {
      matImport.text = reader.result;
      matImport.format = /\.csv$/i.test(file.name) ? "csv" : "json";
      matImport.report = null;
      matImport.newTopics = []; matImport.updates = []; matImport.linkIds = [];
      render();
    };
    reader.readAsText(file);
  }
});

document.addEventListener("keydown", (e)=>{
  if(e.key === "Escape" && modal){
    if(modal.kind !== "info" && modal.editing){ modal.editing = false; modal.drafts = null; paintModal(); }
    else closeModal();
    return;
  }
  /* 'F' toggles full screen while a modal is open (unless typing in a field) */
  if((e.key === "f" || e.key === "F") && modal){
    const t = e.target;
    const tag = t && t.tagName ? t.tagName.toLowerCase() : "";
    const isField = tag === "input" || tag === "textarea" || tag === "select" || (t && t.isContentEditable);
    if(!isField && !e.ctrlKey && !e.metaKey && !e.altKey){
      e.preventDefault();
      toggleModalFullscreen();
    }
  }
});

if(window.matchMedia){
  try{
    window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", (e)=>{
      let stored = null;
      try{ stored = localStorage.getItem(THEME_KEY); }catch(err){}
      if(stored !== "dark" && stored !== "light"){
        THEME = e.matches ? "dark" : "light";
        applyTheme();
      }
    });
  }catch(e){}
}

setInterval(()=>{
  if(document.visibilityState === "visible"){
    DB.studySeconds = (DB.studySeconds||0) + 15;
    save();
  }
}, 15000);

/* =========================================================
   15. BOOT
   ========================================================= */
applyTheme();
render();
</script>
