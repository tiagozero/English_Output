<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grammar Study</title>
<style>
:root{
  --bg:#ffffff; --panel:#ffffff; --panel-2:#fafafa; --panel-3:#f7f7f7; --border:#ededed;
  --topbar-bg:rgba(255,255,255,.96);
  --text:#141414; --text-2:#4a4a4a; --muted:#9a9a9a; --muted-2:#6b6b6b;
  --hover:#f5f5f5; --hover-2:#fafafa; --bar-bg:#eeeeee; --badge-bg:transparent;
  --accent:#141414; --accent-hover:#000000; --accent-soft:#f2f2f2; --accent-text:#141414;
  --green:#3a8a5c; --green-soft:transparent; --green-text:#3a8a5c;
  --red:#b8493f;   --red-soft:transparent;   --red-text:#b8493f;
  --amber:#a67a2e; --amber-soft:transparent; --amber-text:#a67a2e; --amber-border:#ededed;
  --blue:#3d6fa8;  --blue-soft:transparent;  --blue-text:#3d6fa8;  --blue-border:#ededed;
  --purple:#7a6fb0; --purple-soft:transparent;
  --hm-0:var(--bar-bg);
  --hm-1:#e5e5e5; --hm-2:#c2c2c2; --hm-3:#8a8a8a; --hm-4:#141414;
  --shadow:none;
  --shadow-lg:none;
  --modal-shadow:0 16px 40px rgba(0,0,0,.12);
  --backdrop:rgba(20,20,20,.35);
  --radius:2px; --content-max:1040px;
}
[data-theme="dark"]{
  --bg:#0f0f0f; --panel:#0f0f0f; --panel-2:#161616; --panel-3:#161616; --border:#262626;
  --topbar-bg:rgba(15,15,15,.96);
  --text:#f2f2f2; --text-2:#c2c2c2; --muted:#767676; --muted-2:#9c9c9c;
  --hover:#1c1c1c; --hover-2:#1c1c1c; --bar-bg:#262626; --badge-bg:transparent;
  --accent:#f2f2f2; --accent-hover:#ffffff; --accent-soft:#1c1c1c; --accent-text:#f2f2f2;
  --green:#6fbf94; --green-soft:transparent; --green-text:#6fbf94;
  --red:#d98b84;   --red-soft:transparent;   --red-text:#d98b84;
  --amber:#d9b26b; --amber-soft:transparent; --amber-text:#d9b26b; --amber-border:#262626;
  --blue:#8bb1d4;  --blue-soft:transparent;  --blue-text:#8bb1d4;  --blue-border:#262626;
  --purple:#b3a8d9; --purple-soft:transparent;
  --hm-0:var(--bar-bg);
  --hm-1:#262626; --hm-2:#454545; --hm-3:#767676; --hm-4:#f2f2f2;
  --shadow:none;
  --shadow-lg:none;
  --modal-shadow:0 16px 40px rgba(0,0,0,.5);
  --backdrop:rgba(0,0,0,.55);
}
html{transition:background .2s ease}
body,.card,.list-item,.stat,.btn,.input,select,textarea,.modal,.nav-item,
.badge,.bar,.cover,.topic-picker,.report,.modal-foot,.modal-head,th,.check-line,
.import-panel,.alert-card,.example,.issue,table,#topbar,.theme-toggle,
.seg,.seg-btn,.day-cell,.phase-badge,.hm-cell{
  transition:background-color .2s ease, border-color .2s ease, color .2s ease;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Helvetica Neue",Helvetica,Arial,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit}
#app{display:flex;flex-direction:column;min-height:100vh}
#topbar{position:sticky;top:0;z-index:50;width:100%;background:var(--topbar-bg);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-bottom:1px solid var(--border);padding:18px 32px;display:flex;align-items:center;gap:22px}
.brand{display:flex;align-items:center;gap:8px;font-weight:500;font-size:14px;letter-spacing:.4px;text-transform:uppercase;white-space:nowrap;padding-right:22px;color:var(--text)}
.home-link{display:flex;align-items:center;justify-content:center;width:28px;height:28px;border:1px solid var(--border);border-radius:var(--radius);color:var(--muted-2);text-decoration:none;font-size:14px;flex-shrink:0;transition:border-color .12s,color .12s}
.home-link:hover{border-color:var(--text);color:var(--text)}
.brand .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:none;flex-shrink:0}
.nav{display:flex;gap:26px;flex:1;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none}
.nav::-webkit-scrollbar{display:none}
.nav-item{display:flex;align-items:center;gap:6px;padding:2px 0;border-radius:0;cursor:pointer;color:var(--muted);font-size:13.5px;font-weight:400;white-space:nowrap;user-select:none;transition:color .12s;border-bottom:1px solid transparent}
.nav-item:hover{color:var(--text)}
.nav-item.active{color:var(--text);border-bottom-color:var(--text)}
.nav-item .ic{display:none}
.topbar-right{display:flex;align-items:center;gap:18px;margin-left:auto;flex-shrink:0}
.topbar-stats{font-size:11.5px;color:var(--muted);white-space:nowrap;line-height:1.3}
.theme-toggle{display:flex;align-items:center;gap:6px;padding:0;border-radius:0;cursor:pointer;background:transparent;border:none;font-size:12.5px;font-weight:400;color:var(--muted);white-space:nowrap;user-select:none;transition:color .12s}
.theme-toggle:hover{color:var(--text)}
.theme-toggle .ic{font-size:14px;line-height:1}
main{flex:1;width:100%;max-width:var(--content-max);margin:0 auto;padding:48px 32px 90px;min-width:0}
h1{font-size:26px;margin:0 0 6px;letter-spacing:-.3px;font-weight:500}
h2{font-size:16px;margin:44px 0 18px;letter-spacing:.2px;font-weight:500;text-transform:uppercase;color:var(--muted-2)}
h3{font-size:14.5px;margin:0 0 8px;font-weight:500}
.sub{color:var(--muted);font-size:13.5px;margin-bottom:36px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:20px 22px}
.grid{display:grid;gap:1px;background:var(--border);border:1px solid var(--border);grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.grid > *{background:var(--panel)}
.grid-2{display:grid;gap:28px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.stat-grid{display:grid;gap:0;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:8px;border-top:1px solid var(--border);border-left:1px solid var(--border)}
.stat{background:var(--panel);border-right:1px solid var(--border);border-bottom:1px solid var(--border);border-radius:0;padding:20px 22px}
.stat .n{font-size:28px;font-weight:500;letter-spacing:-.5px;color:var(--text)}
.stat .l{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:4px}
.clickable{cursor:pointer;transition:border-color .12s, box-shadow .12s}
.clickable:hover{border-color:var(--text);box-shadow:none}
.topic-card{display:flex;flex-direction:column;gap:8px}
.topic-card .t{font-weight:500;font-size:14.5px}
.row{display:flex;align-items:center;gap:8px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.wrap{flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:500;padding:0;border-radius:0;background:transparent;color:var(--muted-2);white-space:nowrap;text-transform:uppercase;letter-spacing:.4px}
.badge.lvl{color:var(--text)}
.badge.green{color:var(--green-text)}
.badge.red{color:var(--red-text)}
.badge.amber{color:var(--amber-text)}
.badge.blue{color:var(--blue-text)}
.badge.grey{color:var(--muted-2)}
button.badge{border:none;cursor:pointer;font-family:inherit}
button.badge:hover{color:var(--text)}
.bar{height:2px;border-radius:0;background:var(--bar-bg);overflow:hidden;width:100%}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:0;transition:width .3s}
.bar.green > i{background:var(--green)}
.bar.amber > i{background:var(--amber)}
.bar.red > i{background:var(--red)}
.btn{border:1px solid var(--border);background:transparent;color:var(--text);padding:9px 16px;border-radius:var(--radius);cursor:pointer;font-size:13px;font-weight:400;transition:.12s}
.btn:hover{background:var(--hover);border-color:var(--text)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.danger{color:var(--red);border-color:var(--border)}
.btn.danger:hover{background:var(--red-soft);border-color:var(--red)}
.btn.sm{padding:6px 11px;font-size:12px;border-radius:var(--radius)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.input,select,textarea{width:100%;border:none;border-bottom:1px solid var(--border);border-radius:0;padding:9px 2px;font-family:inherit;font-size:14px;background:transparent;color:var(--text);outline:none}
.input:focus,select:focus,textarea:focus{border-color:var(--text);box-shadow:none}
textarea{resize:vertical;line-height:1.5}
.filter-bar{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:20px;align-items:center}
.filter-bar > *{width:auto;min-width:150px}
.filter-bar .grow{flex:1;min-width:200px}
.check-line{display:flex;gap:8px;align-items:center;cursor:pointer;font-size:13.5px;padding:0;border:none;border-radius:0;background:transparent;width:auto;color:var(--text-2)}
.check-line input{width:auto;margin:0;accent-color:var(--accent)}
.form-grid{display:grid;gap:22px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.form-field{display:flex;flex-direction:column;gap:6px}
.form-field label{font-size:11.5px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.4px}
.form-field.full{grid-column:1/-1}
.list{display:flex;flex-direction:column;gap:0;border-top:1px solid var(--border)}
.list-item{background:var(--panel);border:none;border-bottom:1px solid var(--border);border-radius:0;padding:16px 4px;display:flex;gap:14px;align-items:center;justify-content:space-between}
.list-item.clickable:hover{border-color:var(--border);background:var(--hover-2)}
.empty{padding:50px 20px;text-align:center;color:var(--muted);background:transparent;border:1px dashed var(--border);border-radius:var(--radius);font-size:14px}
.cover{width:44px;height:60px;border-radius:0;overflow:hidden;flex:0 0 44px;background:var(--panel-2);border:1px solid var(--border)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover.ph{display:flex;align-items:center;justify-content:center;font-weight:500;color:var(--muted-2);font-size:14px;background:var(--panel-2)}
.cover.lg{width:64px;height:88px;flex-basis:64px;font-size:18px}
.practice-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;gap:12px;flex-wrap:wrap}
.question-text{font-size:18px;line-height:1.6;margin:6px 0 22px;white-space:pre-wrap;font-weight:400}
.options{display:flex;flex-direction:column;gap:0;border-top:1px solid var(--border)}
.opt{text-align:left;border:none;border-bottom:1px solid var(--border);background:transparent;color:var(--text);padding:13px 4px;border-radius:0;cursor:pointer;font-size:14.5px;transition:.12s}
.opt:hover:not(:disabled){background:var(--hover)}
.opt.sel{font-weight:500;background:var(--hover)}
.opt.ok{font-weight:500;color:var(--green-text)}
.opt.bad{color:var(--red-text)}
.chips{display:flex;gap:8px;flex-wrap:wrap;min-height:44px;padding:0;border:none;border-bottom:1px dashed var(--border);border-radius:0;margin-bottom:16px;align-items:center}
.chip{border:1px solid var(--border);background:transparent;color:var(--text);padding:6px 12px;border-radius:var(--radius);cursor:pointer;font-size:13.5px}
.chip:hover{border-color:var(--text)}
.chip.ans{background:var(--accent-soft);border-color:var(--text)}
.match-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:center;margin-bottom:9px;padding-bottom:9px;border-bottom:1px solid var(--border)}
.match-row .left{font-weight:500;font-size:14px}
.match-row select{padding:7px 2px;font-size:13.5px}
.feedback{margin-top:22px;padding:16px 4px;border-radius:0;border-top:1px solid var(--border);font-size:14px}
.feedback.ok{color:var(--green-text)}
.feedback.bad{color:var(--red-text)}
.feedback .head{font-weight:500;margin-bottom:6px;text-transform:uppercase;font-size:12.5px;letter-spacing:.4px}
.feedback .exp{color:var(--text-2);font-size:13.5px}
.level-head{display:flex;align-items:baseline;gap:10px;margin:36px 0 16px;font-size:14px}
.level-head .pill{background:transparent;color:var(--text);font-size:11.5px;font-weight:500;padding:0;border-radius:0;text-transform:uppercase;letter-spacing:.4px}
.level-head .cnt{font-size:12.5px;color:var(--muted);font-weight:400}
.report{background:transparent;border:1px solid var(--border);border-radius:var(--radius);padding:20px 22px;margin-top:20px}
.issue{font-size:13px;padding:9px 12px;border-radius:0;margin-bottom:1px;background:transparent;border-left:2px solid var(--border);color:var(--text-2)}
.issue.err{border-left-color:var(--red)}
.issue.warn{border-left-color:var(--amber)}
.issue.dup{border-left-color:var(--purple)}
.issue.note{border-left-color:var(--blue)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}
table{width:100%;border-collapse:collapse;font-size:13.5px;background:transparent;border:none;border-top:1px solid var(--border);border-radius:0;overflow:hidden}
th,td{text-align:left;padding:11px 8px;border-bottom:1px solid var(--border)}
th{background:transparent;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:500}
tr:last-child td{border-bottom:1px solid var(--border)}
.explain{font-size:14.5px;color:var(--text-2);line-height:1.75}
.example{background:transparent;border-left:2px solid var(--border);padding:9px 14px;border-radius:0;margin-bottom:8px;font-size:14px;color:var(--text-2)}
.divider{height:1px;background:var(--border);margin:24px 0}
.topic-picker{display:flex;flex-direction:column;gap:2px;max-height:280px;overflow:auto;padding:4px 0;border:none;border-top:1px solid var(--border);border-radius:0;background:transparent}
.topic-picker label{display:flex;gap:9px;align-items:center;padding:8px 4px;border-radius:0;cursor:pointer;font-size:13.5px;color:var(--text-2);border-bottom:1px solid var(--border)}
.topic-picker label:hover{background:var(--hover)}
.topic-picker input{width:auto;margin:0;accent-color:var(--accent)}
.topic-picker .tid{color:var(--muted);font-size:11px;font-family:ui-monospace,monospace}
.import-panel{border-color:var(--text);background:transparent}
.import-panel .head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.alert-card{background:transparent;border:1px solid var(--amber-border);border-left:2px solid var(--amber);border-radius:0;padding:16px 18px;margin-bottom:22px}
.alert-card .head{font-weight:500;color:var(--amber-text);margin-bottom:6px;text-transform:uppercase;font-size:12px;letter-spacing:.4px}
.alert-card .body{font-size:13.5px;color:var(--text-2)}
.alert-card.blue{background:transparent;border-color:var(--blue-border);border-left-color:var(--blue)}
.alert-card.blue .head{color:var(--blue-text)}
.alert-card.blue .body{color:var(--text-2)}
.step-num{display:inline-flex;width:20px;height:20px;border-radius:50%;background:transparent;border:1px solid var(--text);color:var(--text);font-size:11px;font-weight:500;align-items:center;justify-content:center;margin-right:8px}
.interactive-card{cursor:pointer;transition:border-color .12s,box-shadow .12s,background-color .2s}
.interactive-card:hover{border-color:var(--text);box-shadow:none;background:var(--hover-2)}
.interactive-card .open-hint{font-size:11px;font-weight:500;color:var(--muted);background:transparent;padding:0;border-radius:0;display:inline-flex;align-items:center;gap:4px;text-transform:uppercase;letter-spacing:.4px}
.modal-backdrop{position:fixed;inset:0;background:var(--backdrop);z-index:100;display:flex;align-items:center;justify-content:center;padding:24px;animation:fadeIn .15s ease}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:2px;max-width:760px;width:100%;max-height:88vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--modal-shadow);animation:slideUp .18s ease}
.modal-head{display:flex;align-items:flex-start;justify-content:space-between;padding:20px 24px;border-bottom:1px solid var(--border);gap:12px}
.modal-body{padding:24px;overflow:auto;flex:1}
.modal-foot{padding:16px 24px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;background:transparent;flex-wrap:wrap}
.modal-close{border:none;background:transparent;font-size:20px;line-height:1;cursor:pointer;color:var(--muted);padding:2px 10px;border-radius:0;font-family:inherit}
.modal-close:hover{color:var(--text)}
.modal-head-actions{display:flex;align-items:center;gap:2px;flex-shrink:0}

/* ---------- Fullscreen modal ---------- */
.modal-backdrop.is-fullscreen{padding:0;align-items:stretch;justify-content:stretch;animation:none}
.modal.is-fullscreen{
  max-width:none;
  width:100%;
  height:100%;
  max-height:100%;
  border-radius:0;
  border:none;
  animation:none;
  box-shadow:none;
}
.modal.is-fullscreen .modal-head{padding:18px 32px}
.modal.is-fullscreen .modal-body{padding:34px 48px}
.modal.is-fullscreen .modal-foot{padding:16px 32px}
.modal.is-fullscreen .modal-body .rich-content{
  max-width:1000px;
  margin:0 auto;
  font-size:15.5px;
}
.modal.is-fullscreen .modal-body > .explain,
.modal.is-fullscreen .modal-body > .empty{
  max-width:1000px;
  margin-left:auto;
  margin-right:auto;
}
.modal.is-fullscreen .rich-editor textarea{min-height:320px}
.modal.is-fullscreen .rich-preview{max-height:520px}
.modal.is-fullscreen .rich-editor,
.modal.is-fullscreen .rich-editor + .btn-row{max-width:1000px;margin-left:auto;margin-right:auto}
@media (max-width:700px){
  .modal.is-fullscreen .modal-head{padding:14px 16px}
  .modal.is-fullscreen .modal-body{padding:20px 16px}
  .modal.is-fullscreen .modal-foot{padding:14px 16px}
}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(6px);opacity:0}to{transform:translateY(0);opacity:1}}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bar-bg);border-radius:0;border:none}
::-webkit-scrollbar-thumb:hover{background:var(--muted)}
/* ---- Roadmap ---- */
.seg{display:inline-flex;background:transparent;border:1px solid var(--border);border-radius:var(--radius);padding:0;gap:0;flex-wrap:wrap}
.seg-btn{border:none;background:transparent;color:var(--muted-2);font-size:12px;font-weight:500;padding:7px 14px;border-radius:0;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:5px;transition:background .12s,color .12s;border-right:1px solid var(--border)}
.seg-btn:last-child{border-right:none}
.seg-btn:hover{color:var(--text);background:var(--hover)}
.seg-btn.active{background:var(--text);color:var(--bg)}
.phase-badge{width:32px;height:32px;border-radius:0;background:transparent;border:1px solid var(--text);color:var(--text);display:flex;align-items:center;justify-content:center;font-weight:500;font-size:13px;flex-shrink:0}
.day-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:1px;background:var(--border);border:1px solid var(--border)}
.day-cell{border:none;background:var(--panel);color:var(--muted-2);border-radius:0;height:40px;font-size:12px;font-weight:500;cursor:pointer;font-family:inherit;transition:background .12s,color .12s}
.day-cell:hover{color:var(--text);background:var(--hover)}
.day-cell.done{background:var(--panel);color:var(--green-text);font-weight:600}
.day-cell.today{box-shadow:inset 0 0 0 1px var(--text)}
.phase-desc{font-size:13.5px;color:var(--muted-2);line-height:1.6}
/* ---- Heatmap ---- */
.hm-wrap{display:flex;flex-direction:column;gap:6px}
.hm-months{
  display:grid;grid-auto-flow:column;grid-auto-columns:12px;gap:3px;
  margin-left:32px;font-size:11px;color:var(--muted);white-space:nowrap;
}
.hm-months span{grid-row:1;line-height:1;padding-bottom:2px}
.hm-body{display:flex;gap:8px;align-items:flex-start}
.hm-daylabels{
  display:grid;grid-template-rows:repeat(7,12px);gap:3px;
  width:26px;flex-shrink:0;font-size:10px;color:var(--muted);line-height:12px;padding-top:0;
}
.hm-daylabels span:nth-child(1){grid-row:2}
.hm-daylabels span:nth-child(2){grid-row:4}
.hm-daylabels span:nth-child(3){grid-row:6}
.hm-weeks{display:flex;gap:3px}
.hm-week{display:grid;grid-template-rows:repeat(7,12px);gap:3px}
.hm-cell{
  width:12px;height:12px;border-radius:0;border:none;padding:0;
  background:var(--hm-0);cursor:pointer;flex-shrink:0;display:block;
}
.hm-cell.l0{background:var(--hm-0)}
.hm-cell.l1{background:var(--hm-1)}
.hm-cell.l2{background:var(--hm-2)}
.hm-cell.l3{background:var(--hm-3)}

<script>
/* =========================================================
   0. THEME
   ========================================================= */
const THEME_KEY = "grammar-study-theme";
let THEME = (()=>{
  try{ const t = localStorage.getItem(THEME_KEY); if(t === "dark" || t === "light") return t; }catch(e){}
  return (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
})();
function applyTheme(){
  document.documentElement.setAttribute("data-theme", THEME);
  const btn = document.querySelector(".theme-toggle");
  if(btn){
    const ic  = btn.querySelector(".ic");
    const lbl = btn.querySelector(".lbl");
    if(ic)  ic.textContent  = THEME === "dark" ? "☀" : "☾";
    if(lbl) lbl.textContent = THEME === "dark" ? "Light" : "Dark";
  }
  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute("content", THEME === "dark" ? "#151619" : "#f5f6f8");
  else{
    const m = document.createElement("meta");
    m.name = "theme-color";
    m.content = THEME === "dark" ? "#151619" : "#f5f6f8";
    document.head.appendChild(m);
  }
}

/* =========================================================
   1. STORAGE
   ========================================================= */
const LS_KEY = "grammar-study-app-v6";
let DB = loadDB();
let view = {name:"dashboard", id:null};
let session = null;
let ui = {};
let impState = { text:"", format:"auto", createMissing:true, report:null, valid:null };
let matImport = null;
let modal = null;

let exForm = { topicId:null, materialId:null, returnTo:null };

let hmYear = new Date().getFullYear();
let hmSelectedDay = null;

function defaultRoadmap(){
  return {
    view: "grid",
    phases: [1,2,3].map(i=>({
      id: "phase-" + i,
      title: ["Foundations","Development","Consolidation"][i-1],
      description: "",
      days: 30,
      startDate: null,
      completedDays: [],
      materials: [],
      topics: [],
      notes: ""
    }))
  };
}
function emptyDB(){ return { topics: [], materials: [], exercises: [], attempts: [], studySeconds: 0, roadmap: defaultRoadmap() }; }
function loadDB(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){
      const d = JSON.parse(raw);
      d.topics = d.topics || [];
      d.materials = d.materials || [];
      d.exercises = d.exercises || [];
      d.attempts = d.attempts || [];
      d.studySeconds = d.studySeconds || 0;
      if(!d.roadmap || typeof d.roadmap !== "object") d.roadmap = defaultRoadmap();
      d.roadmap.phases = d.roadmap.phases || [];
      d.roadmap.view = d.roadmap.view || "grid";
      /* ensure rich-content fields exist on topics */
      d.topics.forEach(t=>{
        if(!t.explanationFormat) t.explanationFormat = "text";
        if(!t.examplesFormat) t.examplesFormat = "text";
      });
      return d;
    }
  }catch(e){ console.warn("Load failed", e); }
  return emptyDB();
}
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(DB)); }catch(e){} }
function libraryIsEmpty(){ return !DB.topics.length && !DB.materials.length && !DB.exercises.length; }

/* =========================================================
   2. HELPERS
   ========================================================= */
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function norm(s){ return String(s==null?"":s).toLowerCase().trim().replace(/[.,!?;:"'’]/g,"").replace(/\s+/g," "); }
function pct(n,d){ return d ? Math.round((n/d)*100) : 0; }
function uid(){ return Math.random().toString(36).slice(2,10); }
function shuffle(a){ const x=[...a]; for(let i=x.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [x[i],x[j]]=[x[j],x[i]]; } return x; }
function accepts(ans){ return Array.isArray(ans) ? ans : String(ans==null?"":ans).split("|"); }
function fmtTime(sec){
  sec = Math.round(sec||0);
  const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60);
  if(h) return h+"h "+m+"m";
  if(m) return m+"m";
  return sec+"s";
}
function fmtDate(ts){
  const d = new Date(ts);
  return d.toLocaleDateString(undefined,{month:"short",day:"numeric"}) + " " + d.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"});
}
function fmtDay(ts){
  if(!ts) return "—";
  const d = new Date(ts);
  return d.toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"});
}
function slugify(s){
  return String(s||"").toLowerCase().trim().replace(/[^a-z0-9\s-]/g,"").replace(/\s+/g,"-").replace(/-+/g,"-").replace(/^-|-$/g,"").slice(0,60);
}
function uniqueTopicId(base){
  let id = slugify(base) || "topic";
  if(!findTopic(id)) return id;
  let i = 2; while(findTopic(id+"-"+i)) i++;
  return id+"-"+i;
}
function uniqueMaterialId(base){
  let id = slugify(base) || "material";
  if(!findMaterial(id)) return id;
  let i = 2; while(findMaterial(id+"-"+i)) i++;
  return id+"-"+i;
}
function uniqueExerciseId(base){
  let id = slugify(base) || "exercise";
  if(!findEx(id)) return id;
  let i = 2; while(findEx(id+"-"+i)) i++;
  return id+"-"+i;
}
const findTopic = id => DB.topics.find(t=>t.id===id);
const findMaterial = id => DB.materials.find(m=>m.id===id);
const findEx = id => DB.exercises.find(e=>e.id===id);
const LEVELS = ["A1","A2","B1","B2","C1","C2"];
const MATERIAL_TYPES = ["book","pdf","course","website","notes","custom"];
const UNIT_LABELS = ["Unit","Lesson","Page","Chapter","Module","Section"];
const EXERCISE_TYPES = ["multiple_choice","fill_blank","error_correction","transformation","word_order","matching","completion","production"];

function materialFallbackLevel(m){
  if(!m || !m.level) return "";
  const first = String(m.level).split(/[^A-Za-z0-9]+/).filter(Boolean)[0];
  if(!first) return "";
  const up = first.toUpperCase();
  return LEVELS.includes(up) ? up : "";
}
function dominantExerciseLevel(topicId){
  const counts = {};
  DB.exercises.forEach(e=>{ if(e.topic_id !== topicId || !e.level) return; counts[e.level] = (counts[e.level]||0) + 1; });
  const entries = Object.entries(counts).sort((a,b)=> b[1]-a[1]);
  return entries.length ? entries[0][0] : "";
}
function titleFromId(id){
  return String(id||"").split(/[-_\s]+/).filter(Boolean).map(w=> w.charAt(0).toUpperCase() + w.slice(1)).join(" ") || "Untitled topic";
}
function typeLabel(t){
  return {
    multiple_choice:"Multiple choice", fill_blank:"Fill in the blank",
    error_correction:"Error correction", transformation:"Transformation",
    word_order:"Word order", matching:"Matching", completion:"Completion",
    production:"Production"
  }[t] || t;
}
function toDateInput(ts){
  if(!ts) return "";
  const d = new Date(ts);
  const pad = n => String(n).padStart(2,"0");
  return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate());
}
function fromDateInput(v){
  if(!v) return null;
  const parts = String(v).split("-").map(Number);
  if(parts.length !== 3 || parts.some(isNaN)) return null;
  return new Date(parts[0], parts[1]-1, parts[2]).getTime();
}

/* =========================================================
   2b. EXTERNAL LIBRARY LOADERS  (PDF.js / Tesseract.js)
   ========================================================= */
const PDFJS_VERSION     = "3.11.174";
const TESSERACT_VERSION = "5.0.4";

function loadExternalScript(src){
  return new Promise((resolve, reject) => {
    const existing = document.querySelector(`script[data-ext-src="${src}"]`);
    if(existing){
      if(existing.dataset.loaded === "1") return resolve();
      existing.addEventListener("load",  () => resolve());
      existing.addEventListener("error", () => reject(new Error("Failed to load " + src)));
      return;
    }
    const s = document.createElement("script");
    s.src = src;
    s.async = true;
    s.dataset.extSrc = src;
    s.addEventListener("load",  () => { s.dataset.loaded = "1"; resolve(); });
    s.addEventListener("error", () => reject(new Error("Failed to load " + src)));
    document.head.appendChild(s);
  });
}

async function ensurePdfJs(){
  if(window.pdfjsLib) return window.pdfjsLib;
  await loadExternalScript(`https://cdnjs.cloudflare.com/ajax/libs/pdf.js/${PDFJS_VERSION}/pdf.min.js`);
  if(!window.pdfjsLib) throw new Error("pdf.js failed to initialise.");
  try{
    window.pdfjsLib.GlobalWorkerOptions.workerSrc =
      `https://cdnjs.cloudflare.com/ajax/libs/pdf.js/${PDFJS_VERSION}/pdf.worker.min.js`;
  }catch(e){ /* ignore */ }
  return window.pdfjsLib;
}

async function ensureTesseract(){
  if(window.Tesseract) return window.Tesseract;
  await loadExternalScript(`https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/${TESSERACT_VERSION}/tesseract.min.js`);
  if(!window.Tesseract) throw new Error("Tesseract.js failed to initialise.");
  return window.Tesseract;
}

function pageTextFromItems(items){
  const rows = new Map();
  items.forEach(it => {
    if(!it || typeof it.str !== "string" || !it.str) return;
    if(!it.transform || it.transform.length < 6) return;
    const y = Math.round(it.transform[5]);
    const x = it.transform[4];
    if(!rows.has(y)) rows.set(y, []);
    rows.get(y).push({ x, str: it.str });
  });
  const ys = [...rows.keys()].sort((a,b)=> b - a);
  const lines = ys.map(y => {
    const cells = rows.get(y).sort((a,b)=> a.x - b.x);
    let out = "";
    let lastRight = null;
    cells.forEach(c => {
      if(lastRight !== null && c.x - lastRight > 1.5 && out && !/\s$/.test(out)) out += " ";
      out += c.str;
      lastRight = c.x + c.str.length * 4;
    });
    return out.replace(/\s+/g," ").trim();
  });
  return lines.filter(Boolean).join("\n");
}

async function extractPdfText(file, onProgress){
  const pdfjsLib = await ensurePdfJs();
  if(onProgress) onProgress("Reading PDF file…", 0.05);
  const buffer = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;
  const total = pdf.numPages || 1;
  const pages = [];
  for(let i = 1; i <= total; i++){
    if(onProgress) onProgress(`Extracting text — page ${i} of ${total}…`, 0.05 + (i-1)/total * 0.9);
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    const text = pageTextFromItems(content.items || []);
    if(text) pages.push(text);
  }
  if(onProgress) onProgress("Done.", 1);
  return pages.join("\n\n").replace(/\n{3,}/g,"\n\n").trim();
}

async function extractPngText(file, onProgress){
  const Tesseract = await ensureTesseract();
  const result = await Tesseract.recognize(file, "eng", {
    logger: m => {
      if(!onProgress || !m) return;
      switch(m.status){
        case "loading tesseract core":          onProgress("Loading OCR engine…", 0.05); break;
        case "loading language traineddata":    onProgress("Loading English model…", 0.25); break;
        case "initializing api":                onProgress("Initialising OCR…", 0.5); break;
        case "recognizing text":                onProgress(`Recognising text… ${Math.round((m.progress||0)*100)}%`, 0.5 + (m.progress||0)*0.5); break;
      }
    }
  });
  const text = (result && result.data && result.data.text) ? result.data.text : "";
  return String(text).replace(/[ \t]+\n/g,"\n").replace(/\n{3,}/g,"\n\n").trim();
}

/* =========================================================
   2c. RICH CONTENT (HTML / CSS / tables)
   ========================================================= */
function sanitizeHtml(html){
  if(!html) return "";
  let s = String(html);
  s = s.replace(/<script\b[^>]*>[\s\S]*?<\/script>/gi, "");
  s = s.replace(/<script\b[^>]*\/?>/gi, "");
  s = s.replace(/\son\w+\s*=\s*"[^"]*"/gi, "");
  s = s.replace(/\son\w+\s*=\s*'[^']*'/gi, "");
  s = s.replace(/\son\w+\s*=\s*[^\s>]+/gi, "");
  s = s.replace(/href\s*=\s*"javascript:[^"]*"/gi, 'href="#"');
  s = s.replace(/href\s*=\s*'javascript:[^']*'/gi, "href='#'");
  return s;
}
function renderRichContent(html){
  if(!html || !String(html).trim()) return "";
  return `<div class="rich-content">${sanitizeHtml(html)}</div>`;
}

function textToHtml(text){
  if(!text || !String(text).trim()) return "";
  const blocks = String(text).split(/\n{2,}/);
  return blocks.map(b=>{
    const lines = b.split("\n").map(l => esc(l));
    return "<p>" + lines.join("<br>") + "</p>";
  }).join("\n");
}
function htmlToText(html){
  if(!html || !String(html).trim()) return "";
  let s = String(html);
  s = s.replace(/<style\b[^>]*>[\s\S]*?<\/style>/gi, "");
  s = s.replace(/<script\b[^>]*>[\s\S]*?<\/script>/gi, "");
  s = s.replace(/<\/(p|div|h[1-6]|li|tr|blockquote|pre|section|article)>/gi, "\n\n");
  s = s.replace(/<br\s*\/?>/gi, "\n");
  s = s.replace(/<\/(td|th)>/gi, "\t");
  s = s.replace(/<[^>]+>/g, "");
  s = s.replace(/&nbsp;/g," ").replace(/&lt;/g,"<").replace(/&gt;/g,">")
       .replace(/&amp;/g,"&").replace(/&quot;/g,'"').replace(/&#39;/g,"'");
  return s.replace(/[ \t]+\n/g,"\n").replace(/\n{3,}/g,"\n\n").trim();
}

   3. STATS
   ========================================================= */
function attemptsFor(exId){ return DB.attempts.filter(a=>a.exerciseId===exId); }
function exStats(id){
  const a = attemptsFor(id);
  const correct = a.filter(x=>x.correct).length;
  const total = a.length;
  const last = total ? a[total-1] : null;
  return {correct, total, wrong: total-correct, mastery: total ? correct/total : 0, last};
}
function exStatus(id){
  const s = exStats(id);
  if(s.total === 0) return "new";
  if(s.mastery >= 0.85 && s.total >= 2 && s.last && s.last.correct) return "mastered";
  if(s.mastery >= 0.6 && s.last && s.last.correct) return "reviewing";
  return "learning";
}
function statusBadge(st){
  const map = { new:['grey','New'], learning:['red','Needs work'], reviewing:['amber','Reviewing'], mastered:['green','Mastered'] };
  const [c,l] = map[st] || map.new;
  return `<span class="badge ${c}">${l}</span>`;
}
function topicStats(topicId){
  const exs = DB.exercises.filter(e=>e.topic_id===topicId);
  const ids = new Set(exs.map(e=>e.id));
  const at = DB.attempts.filter(a=>ids.has(a.exerciseId));
  const correct = at.filter(a=>a.correct).length;
  const mastered = exs.filter(e=>exStatus(e.id)==="mastered").length;
  const attempted = exs.filter(e=>exStats(e.id).total>0).length;
  return { exercises: exs.length, attempted, mastered, attempts: at.length, correct,
    accuracy: pct(correct, at.length), progress: pct(mastered, exs.length), wrong: at.length - correct };
}
function materialStats(materialId){
  const m = findMaterial(materialId);
  if(!m) return {progress:0, exercises:0, topics:0, practiced:0, mastered:0};
  const exs = DB.exercises.filter(e=>e.material_id===materialId);
  const mastered = exs.filter(e=>exStatus(e.id)==="mastered").length;
  const practiced = exs.filter(e=>exStats(e.id).total>0).length;
  const progress = m.total ? pct(m.current, m.total) : 0;
  return { progress, exercises: exs.length, topics: (m.topics||[]).length, practiced, mastered };
}
function overallStats(){
  const totalEx = DB.exercises.length;
  const mastered = DB.exercises.filter(e=>exStatus(e.id)==="mastered").length;
  const attemptedEx = DB.exercises.filter(e=>exStats(e.id).total>0).length;
  const totalAt = DB.attempts.length;
  const correctAt = DB.attempts.filter(a=>a.correct).length;
  const topicsStudied = new Set(DB.attempts.map(a=>a.topicId)).size;
  const topicsTotal = DB.topics.length;
  return { totalEx, mastered, attemptedEx, totalAt, correctAt,
    accuracy: pct(correctAt, totalAt), topicsStudied, topicsTotal,
    progress: pct(mastered, totalEx), studySeconds: DB.studySeconds||0 };
}
function reviewQueue(includeNew){
  const scored = [];
  DB.exercises.forEach(ex=>{
    const s = exStats(ex.id);
    const st = exStatus(ex.id);
    if(!includeNew && s.total === 0) return;
    if(st === "mastered") return;
    const priority = s.wrong*3 + (s.last && !s.last.correct ? 4 : 0) + (s.total===0 ? 1 : 0) - s.mastery*2;
    scored.push({ex, s, st, priority});
  });
  scored.sort((a,b)=> b.priority - a.priority);
  return scored;
}
function mistakeList(){
  const byEx = {};
  DB.attempts.forEach(a=>{
    if(a.correct) { if(byEx[a.exerciseId]) byEx[a.exerciseId].resolved = true; return; }
    if(!byEx[a.exerciseId] || byEx[a.exerciseId].ts < a.ts){
      byEx[a.exerciseId] = {exerciseId:a.exerciseId, userAnswer:a.userAnswer, ts:a.ts, resolved:false};
    } else { byEx[a.exerciseId].resolved = false; }
  });
  return Object.values(byEx).filter(m=>!m.resolved)
    .map(m=>({...m, ex: findEx(m.exerciseId)})).filter(m=>m.ex).sort((a,b)=> b.ts - a.ts);
}
function topicsNeedingReview(){
  const map = {};
  DB.exercises.forEach(ex=>{
    const s = exStats(ex.id);
    const st = exStatus(ex.id);
    if(st === "mastered" || st === "new") return;
    if(!map[ex.topic_id]) map[ex.topic_id] = {wrong:0, total:0, exercises:0};
    map[ex.topic_id].wrong += s.wrong;
    map[ex.topic_id].total += s.total;
    map[ex.topic_id].exercises++;
  });
  return Object.entries(map).map(([id,v])=>({topic:findTopic(id), ...v}))
    .filter(x=>x.topic).sort((a,b)=> b.wrong - a.wrong);
}
function exercisesWithUnknownTopics(){
  const missing = new Map(); const list = [];
  DB.exercises.forEach(e=>{
    if(e.topic_id && !findTopic(e.topic_id)){
      list.push(e);
      missing.set(e.topic_id, (missing.get(e.topic_id)||0) + 1);
    }
  });
  return { list, missing: Array.from(missing.entries()).map(([id,count])=>({id,count})) };
}
function topicsWithMismatchedLevels(){
  const out = [];
  DB.topics.forEach(t=>{
    const exs = DB.exercises.filter(e=>e.topic_id===t.id && e.level);
    if(!exs.length) return;
    const counts = {};
    exs.forEach(e=>{ counts[e.level] = (counts[e.level]||0) + 1; });
    const entries = Object.entries(counts).sort((a,b)=> b[1]-a[1]);
    const [topLevel, topCount] = entries[0];
    if(topLevel && topLevel !== t.level && topCount >= Math.ceil(exs.length/2)){
      out.push({ topic: t, suggested: topLevel, exercises: exs.length, matching: topCount });
    }
  });
  return out;
}
function createStubTopic(id, materialId, levelOverride){
  id = String(id||"").trim();
  if(!id) return null;
  const existing = findTopic(id);
  if(existing) return existing;
  let level = levelOverride;
  if(!level) level = dominantExerciseLevel(id);
  if(!level) level = materialFallbackLevel(findMaterial(materialId));
  if(!level || !LEVELS.includes(level)) level = "A1";
  const t = { id, title: titleFromId(id), level, explanation: "", examples: [], explanationFormat:"text", examplesFormat:"text" };
  DB.topics.push(t);
  return t;
}

function findPhase(id){ return (DB.roadmap.phases||[]).find(p=>p.id===id); }
function uniquePhaseId(base){
  let id = slugify(base) || "phase";
  if(!findPhase(id)) return id;
  let i = 2; while(findPhase(id+"-"+i)) i++;
  return id+"-"+i;
}
function phaseProgress(p){
  const days = p.days || 30;
  const done = Math.min((p.completedDays||[]).length, days);
  return { done, days, pct: pct(done, days) };
}
function phaseCurrentDay(p){
  if(!p || !p.startDate) return null;
  const elapsed = Math.floor((Date.now() - p.startDate) / 86400000) + 1;
  return Math.max(1, elapsed);
}
function phaseStatus(p){
  const {done, days} = phaseProgress(p);
  if(days && done >= days) return {cls:"green", label:"Complete"};
  if(done > 0) return {cls:"amber", label:"In progress"};
  return {cls:"grey", label:"Not started"};
}
function phaseMaterials(p){ return (p.materials||[]).map(findMaterial).filter(Boolean); }
function phaseTopics(p){ return (p.topics||[]).map(findTopic).filter(Boolean); }
function barClsFor(p){ return p >= 80 ? "green" : p >= 40 ? "" : "amber"; }

/* =========================================================
   3c. HEATMAP HELPERS
   ========================================================= */
function dateKey(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const day = String(d.getDate()).padStart(2,"0");
  return y + "-" + m + "-" + day;
}
function parseDayKey(k){
  const parts = String(k||"").split("-").map(Number);
  if(parts.length !== 3 || parts.some(isNaN)) return new Date();
  return new Date(parts[0], parts[1]-1, parts[2]);
}
function activityByDay(){
  const map = {};
  const add = (ts) => {
    if(!ts) return;
    const key = dateKey(new Date(ts));
    map[key] = (map[key]||0) + 1;
  };
  DB.attempts.forEach(a => add(a.ts));
  (DB.roadmap.phases||[]).forEach(p => {
    if(!p.startDate) return;
    (p.completedDays||[]).forEach(dn => {
      add(p.startDate + (dn-1) * 86400000);
    });
  });
  return map;
}
function hmLevel(n){
  if(!n) return 0;
  if(n <= 2) return 1;
  if(n <= 5) return 2;
  if(n <= 9) return 3;
  return 4;
}
function computeStreak(activity){
  let streak = 0;
  const check = new Date();
  check.setHours(0,0,0,0);
  if(!activity[dateKey(check)]) check.setDate(check.getDate() - 1);
  while(activity[dateKey(check)]){
    streak++;
    check.setDate(check.getDate() - 1);
  }
  return streak;
}
function miniHeatmapHTML(weeks){
  weeks = weeks || 15;
  const activity = activityByDay();
  const today = new Date(); today.setHours(0,0,0,0);
  const start = new Date(today);
  start.setDate(start.getDate() - start.getDay() - (weeks - 1) * 7);
  let html = "";
  const cur = new Date(start);
  for(let w = 0; w < weeks; w++){
    html += `<div class="hm-week">`;
    for(let d = 0; d < 7; d++){
      const k = dateKey(cur);
      const count = activity[k] || 0;
      const isFuture = cur.getTime() > today.getTime();
      const level = isFuture ? 0 : hmLevel(count);
      const cls = "hm-cell" + (isFuture ? " out" : " l" + level) + (k === dateKey(today) ? " today" : "");
      html += `<span class="${cls}" title="${esc(cur.toDateString())} — ${count} activit${count===1?"y":"ies"}"></span>`;
      cur.setDate(cur.getDate() + 1);
    }
    html += `</div>`;
  }
  return `<div class="hm-weeks mini">${html}</div>`;
}

  <tr><td>Present perfect</td><td>I have finished.</td></tr>

    });
  }
  return `

function paintModal(){
  const root = document.getElementById("modal-root");
  if(!root) return;
  if(!modal){ root.innerHTML = ""; return; }

  const fs = !!modal.fullscreen;
  const backdropCls = "modal-backdrop" + (fs ? " is-fullscreen" : "");
  const modalCls    = "modal" + (fs ? " is-fullscreen" : "");
  const fsIcon      = fs ? "⤡" : "⤢";
  const fsTitle     = fs ? "Exit full screen (F)" : "Full screen (F)";

  /* ---- Info modal ---- */
  if(modal.kind === "info"){
    root.innerHTML = `
      <div class="${backdropCls}" data-action="modal-backdrop">
        <div class="${modalCls}">
          <div class="modal-head">
            <div>
              <div style="font-weight:700;font-size:15px">${esc(modal.title)}</div>
            </div>
            <div class="modal-head-actions">
              <button class="modal-close" data-action="modal-fullscreen" title="${fsTitle}" aria-label="${fsTitle}">${fsIcon}</button>
              <button class="modal-close" data-action="modal-close" title="Close (Esc)">×</button>
            </div>
          </div>
          <div class="modal-body">${modal.bodyHTML}</div>
          <div class="modal-foot"><button class="btn primary" data-action="modal-close">Got it</button></div>
        </div>
      </div>`;
    return;
  }

  /* ---- Topic modal ---- */
  const t = findTopic(modal.topicId);
  if(!t){ closeModal(); return; }
  const isExpl = modal.type === "explanation";
  const title = isExpl ? "Grammar Explanation" : "Examples";
  let bodyHTML = "";

  if(modal.editing){
    bodyHTML = isExpl ? explanationEditorHTML(t) : examplesEditorHTML(t);
  } else {
    if(isExpl){
      bodyHTML = renderExplanationHTML(t);
    } else {
      bodyHTML = renderExamplesHTML(t);
    }
  }

  const footerHTML = modal.editing
    ? `<button class="btn" data-action="modal-cancel">Cancel</button><button class="btn primary" data-action="modal-save">Save</button>`
    : `<button class="btn" data-action="modal-close">Close</button><button class="btn primary" data-action="modal-edit">Edit</button>`;

  root.innerHTML = `
    <div class="${backdropCls}" data-action="modal-backdrop">
      <div class="${modalCls}">
        <div class="modal-head">
          <div>
            <div style="font-weight:700;font-size:15px">${esc(title)}</div>
            <div class="small muted" style="margin-top:2px">${esc(t.title)}<span class="badge lvl" style="margin-left:6px">${esc(t.level)}</span></div>
          </div>
          <div class="modal-head-actions">
            <button class="modal-close" data-action="modal-fullscreen" title="${fsTitle}" aria-label="${fsTitle}">${fsIcon}</button>
            <button class="modal-close" data-action="modal-close" title="Close (Esc)">×</button>
          </div>
        </div>
        <div class="modal-body">${bodyHTML}</div>
        <div class="modal-foot">${footerHTML}</div>
      </div>
    </div>`;
}

function renderExplanationHTML(t){
  const fmt = t.explanationFormat || "text";
  if(fmt === "html"){
    const html = t.explanationHtml || "";
    if(!html.trim()){
      return `<div class="empty" style="padding:26px">No explanation yet.<br><br><span class="small">Click <strong>Edit</strong> below to write one — or to import it from a PDF, PNG or TXT file, or to add tables and styled boxes.</span></div>`;
    }
    return renderRichContent(html);
  }
  if(t.explanation && t.explanation.trim()){
    return `<div class="explain" style="white-space:pre-wrap">${esc(t.explanation)}</div>`;
  }
  return `<div class="empty" style="padding:26px">No explanation yet.<br><br><span class="small">Click <strong>Edit</strong> below to write one — or to import it from a PDF, PNG or TXT file, or to add tables and styled boxes.</span></div>`;
}
function renderExamplesHTML(t){
  const fmt = t.examplesFormat || "text";
  if(fmt === "html"){
    const html = t.examplesHtml || "";
    if(!html.trim()){
      return `<div class="empty" style="padding:26px">No examples yet.<br><br><span class="small">Click <strong>Edit</strong> below to add some.</span></div>`;
    }
    return renderRichContent(html);
  }
  const exs = t.examples || [];
  if(exs.length){
    return exs.map((ex,i)=>`<div class="example" style="display:flex;gap:8px"><span class="muted small" style="font-weight:700;min-width:18px">${i+1}.</span><span>${esc(ex)}</span></div>`).join("");
  }
  return `<div class="empty" style="padding:26px">No examples yet.<br><br><span class="small">Click <strong>Edit</strong> below to add some.</span></div>`;
}

   ========================================================= */
function go(name, id){
  if(name === "material"){ if(matImport && matImport.materialId !== id) matImport = null; } else { matImport = null; }
  if(modal) closeModal();
  if(name === "heatmap") hmSelectedDay = null;
  view = {name, id: id||null};
  if(name !== "practice"){ session = null; }
  render();
  window.scrollTo({top:0, behavior:"instant"});
}

function render(){
  const el = document.getElementById("main");
  let html = "";
  switch(view.name){
    case "dashboard":      html = viewDashboard(); break;
    case "roadmap":        html = viewRoadmap(); break;
    case "phase":          html = viewPhase(view.id); break;
    case "phase-form":     html = viewPhaseForm(view.id); break;
    case "heatmap":        html = viewHeatmap(); break;
    case "topics":         html = viewTopics(); break;
    case "topic-form":     html = viewTopicForm(view.id); break;
    case "topic":          html = viewTopicDetail(view.id); break;
    case "materials":      html = viewMaterials(); break;
    case "material-form":  html = viewMaterialForm(view.id); break;
    case "material":       html = viewMaterialDetail(view.id); break;
    case "import":         html = viewImport(); break;
    case "exercises":      html = viewExercises(); break;
    case "exercise-form":  html = viewExerciseForm(view.id); break;
    case "practice":       html = viewPractice(); break;
    case "review":         html = viewReview(); break;
    case "mistakes":       html = viewMistakes(); break;
    case "progress":       html = viewProgress(); break;
    case "export":         html = viewExport(); break;
    default: html = viewDashboard();
  }
  el.innerHTML = html;
  document.querySelectorAll(".nav-item").forEach(n=>{
    const route = n.dataset.route;
    let on = route === view.name;
    if(view.name === "topic" || view.name === "topic-form") on = route === "topics";
    if(view.name === "material" || view.name === "material-form") on = route === "materials";
    if(view.name === "phase" || view.name === "phase-form") on = route === "roadmap";
    if(view.name === "exercise-form") on = route === "exercises";
    n.classList.toggle("active", on);
  });
  const sf = document.getElementById("sideFoot");
  if(sf) sf.textContent = `${DB.topics.length} topics · ${DB.exercises.length} ex · ${DB.materials.length} materials`;
  if(modal) paintModal();
  if(view.name === "exercise-form") applyExTypeVisibility();
}

function viewTopicDetail(id){
  const t = findTopic(id);
  if(!t) return `<div class="empty">Topic not found.</div>`;
  const s = topicStats(t.id);
  const exs = DB.exercises.filter(e=>e.topic_id===t.id);
  const mats = DB.materials.filter(m=>(m.topics||[]).includes(t.id));
  const barCls = s.progress >= 80 ? "green" : s.progress >= 40 ? "" : "amber";
  const levels = {};
  exs.forEach(e=>{ if(e.level) levels[e.level] = (levels[e.level]||0)+1; });
  const entries = Object.entries(levels).sort((a,b)=> b[1]-a[1]);
  const dominant = entries.length ? entries[0][0] : "";
  const mismatch = dominant && dominant !== t.level && entries[0][1] >= Math.ceil(exs.length/2);
  const mismatchBanner = mismatch ? `
    <div class="alert-card blue">
      <div class="head">ℹ Topic level may be wrong</div>
      <div class="body" style="margin-bottom:10px">This topic is set to <strong>${esc(t.level)}</strong>, but ${entries[0][1]} of ${exs.length} exercises are <strong>${esc(dominant)}</strong>.</div>
      <div class="btn-row">
        <button class="btn primary sm" data-action="set-topic-level" data-id="${esc(t.id)}" data-level="${esc(dominant)}">Change level to ${esc(dominant)}</button>
        <button class="btn sm" data-action="edit-topic" data-id="${esc(t.id)}">Edit manually</button>
      </div>
    </div>` : "";
  const exHTML = exs.length ? exs.map(e=>{
    const st = exStatus(e.id);
    const es = exStats(e.id);
    return `<div class="list-item" style="padding:11px 15px">
      <div style="min-width:0;flex:1">
        <div style="font-size:14px;margin-bottom:3px">${esc(e.question.split("\n")[0]).slice(0,110)}</div>
        <div class="row wrap">
          <span class="badge">${esc(typeLabel(e.type))}</span>
          <span class="badge lvl">${esc(e.level)}</span>
          ${e.material_id && findMaterial(e.material_id) ? `<span class="badge grey">${esc(findMaterial(e.material_id).title)}</span>` : ""}
          ${es.total ? `<span class="small muted">${es.correct}/${es.total} correct</span>` : ""}
        </div>
      </div>
      <div class="row">${statusBadge(st)}
        <button class="btn sm" data-action="practice" data-ids="${esc(e.id)}" data-title="Practice">Practice</button>
        <button class="btn sm" data-action="edit-exercise" data-id="${esc(e.id)}" data-return-route="topic" data-return-id="${esc(t.id)}">Edit</button>
        <button class="btn sm danger" data-action="delete-exercise" data-id="${esc(e.id)}" title="Delete exercise">✕</button>
      </div>
    </div>`;
  }).join("") : `<div class="empty">No exercises for this topic yet.<br><br>
      <button class="btn primary" data-action="new-exercise" data-topic="${esc(t.id)}" data-return-route="topic" data-return-id="${esc(t.id)}">+ Add the first exercise</button>
    </div>`;
  const matHTML = mats.length ? mats.map(m=>{
    const st = materialStats(m.id);
    return `<div class="list-item clickable" data-action="material" data-id="${esc(m.id)}" style="padding:10px 14px">
      ${coverHTML(m)}
      <div style="flex:1;min-width:0">
        <div style="font-weight:600;font-size:13.5px">${esc(m.title)}</div>
        <div class="small muted">${esc(m.author||"")} · ${st.progress}% complete</div>
      </div>
    </div>`;
  }).join("") : `<div class="empty small">No linked materials. Open a material and tick this topic.</div>`;

  const hasExplanation = (t.explanationFormat === "html")
    ? !!(t.explanationHtml && t.explanationHtml.trim())
    : !!(t.explanation && t.explanation.trim());
  const exampleCount = (t.examplesFormat === "html")
    ? (t.examplesHtml && t.examplesHtml.trim() ? 1 : 0)
    : (t.examples || []).length;
  const explBadge = t.explanationFormat === "html" ? `<span class="badge blue" style="margin-left:6px">HTML</span>` : "";
  const exBadge    = t.examplesFormat === "html"    ? `<span class="badge blue" style="margin-left:6px">HTML</span>` : "";

  const explanationCard = `
    <div class="card interactive-card" data-action="open-topic-modal" data-id="${esc(t.id)}" data-type="explanation">
      <div class="between" style="margin-bottom:10px"><h3 style="margin:0">Explanation${explBadge}</h3><span class="open-hint">Open ↗</span></div>
      <div class="small muted" style="display:flex;align-items:center;gap:8px;padding:6px 0">
        <span style="font-size:18px">${hasExplanation ? "📘" : "＋"}</span>
        <span>${hasExplanation ? "Click to read the full explanation" : "No explanation yet — click to write or import one (PDF / PNG / TXT / HTML)"}</span>
      </div>
    </div>`;
  const examplesCard = `
    <div class="card interactive-card" data-action="open-topic-modal" data-id="${esc(t.id)}" data-type="examples">
      <div class="between" style="margin-bottom:10px"><h3 style="margin:0">Examples${exBadge}</h3><span class="open-hint">Open ↗</span></div>
      <div class="small muted" style="display:flex;align-items:center;gap:8px;padding:6px 0">
        <span style="font-size:18px">${exampleCount ? "💬" : "＋"}</span>
        <span>${exampleCount ? (t.examplesFormat === "html" ? "HTML content — click to view" : `${exampleCount} example${exampleCount === 1 ? "" : "s"} — click to view`) : "No examples yet — click to add some"}</span>
      </div>
    </div>`;

  return `
  <div class="btn-row" style="margin-bottom:14px"><button class="btn sm" data-action="go" data-route="topics">← All topics</button></div>
  <div class="between wrap" style="align-items:flex-start">
    <div>
      <h1>${esc(t.title)}</h1>
      <div class="sub" style="margin-bottom:10px"><span class="badge lvl">${esc(t.level)}</span><span class="mono muted small" style="margin-left:6px">${esc(t.id)}</span></div>
    </div>
    <div class="btn-row">
      <button class="btn sm" data-action="edit-topic" data-id="${esc(t.id)}">Edit</button>
      <button class="btn sm" data-action="new-exercise" data-topic="${esc(t.id)}" data-return-route="topic" data-return-id="${esc(t.id)}">+ Add exercise</button>
      <button class="btn sm primary" data-action="practice-topic" data-id="${esc(t.id)}" ${s.exercises?"":"disabled"}>Practice this topic</button>
    </div>
  </div>
  ${mismatchBanner}
  <div class="card" style="margin-bottom:16px">
    <div class="between small muted" style="margin-bottom:6px"><span>Topic progress · ${s.exercises} exercises · ${s.accuracy}% accuracy</span><span>${s.progress}%</span></div>
    <div class="bar ${barCls}"><i style="width:${s.progress}%"></i></div>
  </div>
  <div class="grid-2">${explanationCard}${examplesCard}</div>
  <div class="between wrap" style="margin:44px 0 18px">
    <h2 style="margin:0">Exercises (${exs.length})</h2>
    <div class="btn-row">
      <button class="btn sm" data-action="new-exercise" data-topic="${esc(t.id)}" data-return-route="topic" data-return-id="${esc(t.id)}">+ Add exercise</button>
      <button class="btn sm" data-action="go" data-route="import">↧ Import</button>
    </div>
  </div>
  <div class="list">${exHTML}</div>
  <h2>Related study materials</h2>
  <div class="list">${matHTML}</div>`;
}

/* =========================================================
   8c. HEATMAP VIEW
   ========================================================= */
function viewHeatmap(){
  const activity = activityByDay();
  const year = hmYear;
  const startOfYear = new Date(year, 0, 1);
  const endOfYear = new Date(year, 11, 31);

  const gridStart = new Date(startOfYear);
  gridStart.setDate(gridStart.getDate() - gridStart.getDay());

  const weeks = [];
  const cur = new Date(gridStart);
  while(cur <= endOfYear){
    const week = [];
    for(let d = 0; d < 7; d++){
      week.push(new Date(cur));
      cur.setDate(cur.getDate() + 1);
    }
    weeks.push(week);
  }

  const monthLabels = [];
  let lastMonth = -1;
  weeks.forEach((w, wi)=>{
    const inYearDays = w.filter(d => d.getFullYear() === year);
    if(!inYearDays.length) return;
    const m = inYearDays[0].getMonth();
    if(m !== lastMonth){
      monthLabels.push({ week: wi, label: inYearDays[0].toLocaleString(undefined, {month:"short"}) });
      lastMonth = m;
    }
  });

  let yrTotal = 0, yrActive = 0, yrCorrect = 0, yrAttempts = 0;
  Object.entries(activity).forEach(([k,v])=>{
    if(Number(k.slice(0,4)) !== year) return;
    yrTotal += v;
    if(v > 0) yrActive++;
  });
  DB.attempts.forEach(a=>{
    const y = new Date(a.ts).getFullYear();
    if(y !== year) return;
    yrAttempts++;
    if(a.correct) yrCorrect++;
  });
  const yrAccuracy = pct(yrCorrect, yrAttempts);
  const streak = computeStreak(activity);

  let bestCount = 0, bestKey = null;
  Object.entries(activity).forEach(([k,v])=>{
    if(Number(k.slice(0,4)) !== year) return;
    if(v > bestCount){ bestCount = v; bestKey = k; }
  });

  const todayKey = dateKey(new Date());
  const cellsHTML = weeks.map(week => {
    const daysHTML = week.map(d => {
      const k = dateKey(d);
      const inYear = d.getFullYear() === year;
      const count = inYear ? (activity[k] || 0) : 0;
      const level = inYear ? hmLevel(count) : 0;
      const isToday = k === todayKey;
      const isSel = hmSelectedDay === k;
      const cls = "hm-cell" + (inYear ? " l" + level : " out") + (isToday ? " today" : "") + (isSel ? " sel" : "");
      const title = inYear ? `${d.toDateString()} — ${count} activit${count===1?"y":"ies"}` : "";
      return `<button class="${cls}" data-action="hm-day" data-key="${k}" title="${esc(title)}" ${inYear ? "" : "disabled"}></button>`;
    }).join("");
    return `<div class="hm-week">${daysHTML}</div>`;
  }).join("");

  let detailsHTML = "";
  if(hmSelectedDay){
    const d = parseDayKey(hmSelectedDay);
    const attempts = DB.attempts.filter(a => dateKey(new Date(a.ts)) === hmSelectedDay);
    const correctCount = attempts.filter(a => a.correct).length;
    const roadmapDone = [];
    (DB.roadmap.phases||[]).forEach(p => {
      if(!p.startDate) return;
      (p.completedDays||[]).forEach(dn => {
        const ts = p.startDate + (dn-1) * 86400000;
        if(dateKey(new Date(ts)) === hmSelectedDay) roadmapDone.push({phase: p, day: dn});
      });
    });
    const dayTotal = attempts.length + roadmapDone.length;

    const attemptList = attempts.sort((a,b)=>b.ts-a.ts).map(a=>{
      const ex = findEx(a.exerciseId);
      if(!ex) return "";
      const t = findTopic(ex.topic_id);
      const time = new Date(a.ts).toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"});
      return `<div class="list-item" style="padding:9px 13px">
        <div style="min-width:0;flex:1">
          <div class="small" style="font-weight:500">${esc(ex.question.split("\n")[0]).slice(0,100)}</div>
          <div class="small muted">${esc(t?t.title:"—")} · ${esc(time)}</div>
        </div>
        <span class="badge ${a.correct?'green':'red'}">${a.correct?"Correct":"Wrong"}</span>
      </div>`;
    }).join("");

    const roadmapList = roadmapDone.map(r=>`
      <div class="list-item clickable" data-action="phase" data-id="${esc(r.phase.id)}" style="padding:9px 13px">
        <div style="min-width:0">
          <div class="small" style="font-weight:600">${esc(r.phase.title)}</div>
          <div class="small muted">Day ${r.day} of ${r.phase.days}</div>
        </div>
        <span class="badge green">Completed</span>
      </div>`).join("");

    detailsHTML = `<div class="card" style="margin-top:18px;border-color:var(--accent)">
      <div class="between wrap" style="margin-bottom:14px">
        <div>
          <h3 style="margin:0 0 4px">${esc(d.toLocaleDateString(undefined,{weekday:"long", year:"numeric", month:"long", day:"numeric"}))}</h3>
          <div class="small muted">
            ${dayTotal} activit${dayTotal===1?"y":"ies"}
            ${attempts.length ? `· ${correctCount}/${attempts.length} exercise${attempts.length===1?"":"s"} correct` : ""}
            ${roadmapDone.length ? `· ${roadmapDone.length} roadmap day${roadmapDone.length===1?"":"s"}` : ""}
          </div>
        </div>
        <button class="btn sm" data-action="hm-clear-selection">Close</button>
      </div>
      ${attempts.length ? `<h4 style="margin:0 0 8px;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)">Exercise attempts (${attempts.length})</h4>
        <div class="list" style="margin-bottom:16px">${attemptList}</div>` : ""}
      ${roadmapDone.length ? `<h4 style="margin:0 0 8px;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)">Roadmap days completed (${roadmapDone.length})</h4>
        <div class="list">${roadmapList}</div>` : ""}
      ${!attempts.length && !roadmapDone.length ? `<div class="empty small">No activity recorded for this day.</div>` : ""}
    </div>`;
  }

  const currentYear = new Date().getFullYear();
  const canGoNext = year < currentYear;

  return `
  <h1>Activity Heatmap<button class="title-info" data-action="heatmap-info" title="How it works" aria-label="How it works">i</button></h1>
  <div class="sub">Every completed activity, day by day. Each square is one day — darker means more done. Click a day to see exactly what you did.</div>

  <div class="stat-grid">
    <div class="stat"><div class="n">${yrTotal}</div><div class="l">Activities in ${year}</div></div>
    <div class="stat"><div class="n">${yrActive}</div><div class="l">Active days</div></div>
    <div class="stat"><div class="n">${streak}</div><div class="l">Current streak</div></div>
    <div class="stat"><div class="n">${bestCount}</div><div class="l">Best day</div></div>
    <div class="stat"><div class="n">${yrAccuracy}%</div><div class="l">Accuracy</div></div>
  </div>

  <div class="card" style="margin-top:18px;overflow-x:auto">
    <div class="between wrap" style="margin-bottom:16px;gap:12px">
      <div class="row" style="gap:8px">
        <button class="btn sm" data-action="hm-prev-year">← ${year-1}</button>
        <span style="font-weight:700;font-size:17px;min-width:60px;text-align:center">${year}</span>
        <button class="btn sm" data-action="hm-next-year" ${canGoNext ? "" : "disabled"}>${year+1} →</button>
      </div>
      <div class="hm-legend">

function detectObjectKind(o){
  if(!o || typeof o !== "object") return null;
  let exScore = 0, matScore = 0, topScore = 0;

  if(o.question !== undefined) exScore += 3;
  if(o.answer !== undefined)   exScore += 2;
  if(o.topic_id !== undefined) exScore += 2;
  if(o.type !== undefined && EXERCISE_TYPES.includes(o.type)) exScore += 4;
  if(o.options || o.words || o.pairs) exScore += 2;

  if(o.author !== undefined)    matScore += 3;
  if(o.total !== undefined)     matScore += 2;
  if(o.unitLabel !== undefined) matScore += 4;
  if(o.cover !== undefined)     matScore += 2;
  if(o.current !== undefined)   matScore += 2;
  if(o.type !== undefined && MATERIAL_TYPES.includes(o.type)) matScore += 3;
  if(o.title !== undefined && o.description !== undefined && exScore === 0) matScore += 2;

  if(o.explanation !== undefined && o.level !== undefined && o.title !== undefined && exScore === 0 && matScore === 0) topScore += 4;
  if(o.examples !== undefined && o.explanation !== undefined) topScore += 2;

  if(exScore === 0 && matScore === 0 && topScore === 0) return null;
  if(exScore >= matScore && exScore >= topScore) return "exercises";
  if(matScore >= topScore) return "materials";
  return "topics";
}

function coerceMaterial(o){
  return {
    id: String(o.id||"").trim(),
    title: String(o.title||"").trim(),
    author: String(o.author||"").trim(),
    type: String(o.type||"custom").trim(),
    level: String(o.level||"").trim(),
    cover: String(o.cover||"").trim(),
    description: String(o.description||"").trim(),
    topics: Array.isArray(o.topics)
      ? o.topics.map(x=>String(x).trim()).filter(Boolean)
      : (o.topics ? String(o.topics).split(/[;|]/).map(s=>s.trim()).filter(Boolean) : []),
    total: Number(o.total) || 0,
    current: Number(o.current) || 0,
    unitLabel: String(o.unitLabel||"Unit").trim()
  };
}

function runImportValidation(text, format){
  const report = {
    total:0, validCount:0,
    invalid:[], duplicates:[], warnings:[],
    counts: { materials:0, exercises:0, topics:0 }
  };
  const valid = { materials: [], exercises: [], topics: [], attempts: [], studySeconds: null, roadmap: null };

  let bucket = { materials: [], exercises: [], topics: [] };

  try {
    const t = text.trim();
    if(!t) throw new Error("Input is empty.");
    if(format === "auto") format = (t.startsWith("{") || t.startsWith("[")) ? "json" : "csv";

    if(format === "json"){
      const obj = JSON.parse(t);

      if(Array.isArray(obj)){
        if(!obj.length){ report.warnings.push("The array is empty."); }
        else {
          const kind = detectObjectKind(obj[0]);
          if(!kind){
            throw new Error("Could not detect the type of this JSON array. Add a 'question'/'answer' (exercises), 'author'/'total' (materials) or 'explanation'/'level' (topics).");
          }
          bucket[kind] = obj;
        }
      } else if(obj && typeof obj === "object"){
        if(Array.isArray(obj.materials) || Array.isArray(obj.exercises) || Array.isArray(obj.topics)){
          if(Array.isArray(obj.materials)) bucket.materials = obj.materials;
          if(Array.isArray(obj.exercises)) bucket.exercises = obj.exercises;
          if(Array.isArray(obj.topics))    bucket.topics    = obj.topics;
          if(Array.isArray(obj.attempts))  valid.attempts   = obj.attempts;
          if(typeof obj.studySeconds === "number") valid.studySeconds = obj.studySeconds;
          if(obj.roadmap && typeof obj.roadmap === "object") valid.roadmap = obj.roadmap;
        } else {
          const kind = detectObjectKind(obj);
          if(!kind){
            throw new Error("Could not detect the type of this JSON object. Add a 'question'/'answer' (exercise), 'author'/'total' (material) or 'explanation'/'level' (topic).");
          }
          bucket[kind] = [obj];
        }
      } else {
        throw new Error("Unsupported JSON structure.");
      }
    } else {
      const rows = csvToObjects(t);
      if(!rows.length) throw new Error("No data rows found in the CSV.");
      const kind = detectObjectKind(rows[0]);
      if(!kind){
        throw new Error("Could not detect the CSV type. Include a 'question' column (exercises), 'author'/'total' (materials), or 'explanation' (topics).");
      }
      bucket[kind] = rows;
    }
  } catch(err){
    report.invalid.push("Parse error: " + esc(err.message));
    return {report, valid};
  }

  report.counts.materials = bucket.materials.length;
  report.counts.exercises = bucket.exercises.length;
  report.counts.topics    = bucket.topics.length;
  report.total = report.counts.materials + report.counts.exercises + report.counts.topics;

  {
    const seen = new Set();
    const existing = new Set(DB.exercises.map(x=>x.id));
    bucket.exercises.forEach((item, i) => {
      const label = `exercise #${i+1}${item && item.id ? ` (${item.id})` : ""}`;
      const errors = [];
      ["id","topic_id","level","type","question","answer"].forEach(f=>{
        if(item[f] === undefined || item[f] === null || String(item[f]).trim() === "")
          errors.push(`missing required field '${f}'`);
      });
      if(item.type && !EXERCISE_TYPES.includes(item.type)) errors.push(`unknown exercise type '${item.type}'`);
      if(item.type === "multiple_choice" && !item.options) errors.push("multiple_choice requires 'options'");
      if(item.type === "matching" && !item.pairs) errors.push("matching requires 'pairs'");
      if(item.topic_id && !findTopic(item.topic_id) && !bucket.topics.some(t=>t.id===item.topic_id))
        report.warnings.push(`${esc(label)}: topic '${item.topic_id}' does not exist yet`);
      if(item.material_id && !findMaterial(item.material_id) && !bucket.materials.some(m=>m.id===item.material_id))
        report.warnings.push(`${esc(label)}: material '${item.material_id}' does not exist yet`);
      if(!item.explanation) report.warnings.push(`${esc(label)}: missing 'explanation'`);
      if(errors.length){ report.invalid.push(`${esc(label)}: ${errors.join(", ")}`); return; }
      if(seen.has(item.id)){ report.duplicates.push(`${esc(label)}: duplicated within the file`); return; }
      if(existing.has(item.id)){ report.duplicates.push(`${esc(label)}: already exists in your library`); return; }
      seen.add(item.id);
      valid.exercises.push(coerceExercise(item));
    });
  }

  {
    const seen = new Set();
    const existing = new Set(DB.materials.map(x=>x.id));
    bucket.materials.forEach((item, i) => {
      const label = `material #${i+1}${item && item.id ? ` (${item.id})` : ""}`;
      const errors = [];
      if(!item.id || !String(item.id).trim()) errors.push("missing required field 'id'");
      if(!item.title || !String(item.title).trim()) errors.push("missing required field 'title'");
      if(!item.author)      report.warnings.push(`${esc(label)}: missing 'author'`);
      if(!item.level)       report.warnings.push(`${esc(label)}: missing 'level'`);
      if(!item.description) report.warnings.push(`${esc(label)}: missing 'description'`);
      if(errors.length){ report.invalid.push(`${esc(label)}: ${errors.join(", ")}`); return; }
      if(seen.has(item.id)){ report.duplicates.push(`${esc(label)}: duplicated within the file`); return; }
      if(existing.has(item.id)){ report.duplicates.push(`${esc(label)}: already exists in your library`); return; }
      seen.add(item.id);
      valid.materials.push(coerceMaterial(item));
    });
  }

  {
    const seen = new Set();
    const existing = new Set(DB.topics.map(x=>x.id));
    bucket.topics.forEach((item, i) => {
      const label = `topic #${i+1}${item && item.id ? ` (${item.id})` : ""}`;
      const errors = [];
      if(!item.id || !String(item.id).trim()) errors.push("missing required field 'id'");
      if(!item.title || !String(item.title).trim()) errors.push("missing required field 'title'");
      if(!item.level || !String(item.level).trim()) errors.push("missing required field 'level'");
      if(!item.explanation) report.warnings.push(`${esc(label)}: missing 'explanation'`);
      if(errors.length){ report.invalid.push(`${esc(label)}: ${errors.join(", ")}`); return; }
      if(seen.has(item.id)){ report.duplicates.push(`${esc(label)}: duplicated within the file`); return; }
      if(existing.has(item.id)){ report.duplicates.push(`${esc(label)}: already exists in your library`); return; }
      seen.add(item.id);
      valid.topics.push(coerceTopic(item));
    });
  }

  report.validCount = valid.materials.length + valid.exercises.length + valid.topics.length;
  if(valid.roadmap) report.validCount += 1;
  return {report, valid};
}

function confirmImport(){
  if(!impState.report || !impState.valid) return;
  let addedM = 0, addedE = 0, addedT = 0, addedA = 0;
  let createdTopics = 0;

  impState.valid.topics.forEach(t=>{
    const i = DB.topics.findIndex(x=>x.id === t.id);
    if(i >= 0) DB.topics[i] = t; else DB.topics.push(t);
    addedT++;
  });

  impState.valid.materials.forEach(m=>{
    const i = DB.materials.findIndex(x=>x.id === m.id);
    if(i >= 0) DB.materials[i] = m; else DB.materials.push(m);
    addedM++;
  });

  impState.valid.exercises.forEach(item=>{
    if(impState.createMissing && item.topic_id && !findTopic(item.topic_id)){
      createStubTopic(item.topic_id, item.material_id, item.level);
      createdTopics++;
    }
    const i = DB.exercises.findIndex(x=>x.id === item.id);
    if(i >= 0) DB.exercises[i] = item; else DB.exercises.push(item);
    addedE++;
  });

  if(Array.isArray(impState.valid.attempts) && impState.valid.attempts.length){
    const ids = new Set(DB.attempts.map(a=>a.id));
    impState.valid.attempts.forEach(a=>{
      if(a && a.id && !ids.has(a.id)){ DB.attempts.push(a); addedA++; }
    });
  }
  if(typeof impState.valid.studySeconds === "number" && impState.valid.studySeconds > 0){
    DB.studySeconds = Math.max(DB.studySeconds || 0, impState.valid.studySeconds);
  }

  let restoredRoadmap = false;
  if(impState.valid.roadmap){
    const rm = impState.valid.roadmap;
    rm.phases = Array.isArray(rm.phases) ? rm.phases : [];
    rm.view = rm.view || "grid";
    rm.phases.forEach(p=>{
      p.id = p.id || uid();
      p.days = p.days || 30;
      p.completedDays = p.completedDays || [];
      p.materials = p.materials || [];
      p.topics = p.topics || [];
    });
    DB.roadmap = rm;
    restoredRoadmap = true;
  }

  save();
  impState = { text:"", format:"auto", createMissing: impState.createMissing, report:null, valid:null };

  const parts = [];
  if(addedT) parts.push(`${addedT} topic${addedT===1?"":"s"}`);
  if(addedM) parts.push(`${addedM} material${addedM===1?"":"s"}`);
  if(addedE) parts.push(`${addedE} exercise${addedE===1?"":"s"}`);
  if(addedA) parts.push(`${addedA} attempt${addedA===1?"":"s"}`);
  if(restoredRoadmap) parts.push("roadmap");

  let msg = `Imported: ${parts.join(", ") || "nothing"}.`;
  if(createdTopics) msg += `\nCreated ${createdTopics} missing topic${createdTopics===1?"":"s"}.`;
  alert(msg);

  if(addedE) go("exercises");
  else if(addedM) go("materials");
  else if(addedT) go("topics");
  else if(restoredRoadmap) go("roadmap");
  else go("dashboard");
}

  const items = list.length ? list.map(e=>{
    const st = exStatus(e.id);
    const s = exStats(e.id);
    const t = findTopic(e.topic_id);
    const m = findMaterial(e.material_id);
    const topicChip = t
      ? `<span class="badge grey">${esc(t.title)}</span>`
      : `<button class="badge red" data-action="fix-topic" data-id="${esc(e.id)}" title="Click to create the missing topic">unknown topic: ${esc(e.topic_id||"(none)")}</button>`;
    return `<div class="list-item">

          <span class="badge lvl">${esc(e.level)}</span>
          ${topicChip}
          ${m?`<span class="badge grey">${esc(m.title)}</span>`:""}
          ${s.total?`<span class="small muted">${s.correct}/${s.total}</span>`:""}
        </div>
      </div>
      <div class="row">${statusBadge(st)}
        <button class="btn sm" data-action="practice" data-ids="${esc(e.id)}">Practice</button>

  const ids = list.map(e=>e.id).join(",");
  return `<div class="between wrap" style="align-items:flex-start;margin-bottom:6px">
    <div>
      <h1>Exercises</h1>
      <div class="sub" style="margin-bottom:0">${DB.exercises.length} exercises in your library.</div>
    </div>
    <div class="btn-row">
      <button class="btn" data-action="go" data-route="import">↧ Import</button>
      <button class="btn primary" data-action="new-exercise">+ Add exercise</button>
    </div>
  </div>
  ${unknownCard}
  ${mismatchCard}
  <div class="filter-bar">
    <select id="f-topic">${topicOpts}</select>
    <select id="f-level">${levelOpts}</select>
    <select id="f-type">${typeOpts}</select>
    <input class="input grow" id="f-q" placeholder="Search questions…" value="${esc(exFilters.q)}">
  </div>
  <div class="btn-row" style="margin-bottom:16px">
    <button class="btn primary" data-action="practice" data-ids="${esc(ids)}" data-title="All exercises"
      ${list.length?"":"disabled"}>Practice all ${list.length} filtered</button>
    <button class="btn" data-action="practice-random" data-ids="${esc(ids)}" ${list.length?"":"disabled"}>Random 10</button>
    <button class="btn" data-action="new-exercise">+ Add exercise</button>
  </div>
  <div class="list">${items}</div>`;
}

const EX_ANSWER_HINTS = {
  multiple_choice:  "must match one of the options above, exactly",
  fill_blank:       "use | to separate several accepted variants",
  error_correction: "write the corrected sentence",
  transformation:   "write the transformed sentence",
  word_order:       "write the correctly ordered sentence",
  completion:       "model completion — self-assessed",
  production:       "model answer — self-assessed",
  matching:         ""
};

function applyExTypeVisibility(){
  const sel = document.getElementById("ex-type");
  if(!sel) return;
  const type = sel.value;
  document.querySelectorAll("[data-ex-type]").forEach(el=>{
    const t = el.dataset.exType;
    const show = (t === "answer") ? (type !== "matching") : (t === type);
    el.style.display = show ? "" : "none";
  });
  const hint = document.getElementById("ex-answer-hint");
  if(hint) hint.textContent = EX_ANSWER_HINTS[type] || "";
}
